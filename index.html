<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#343A40">
<link rel="apple-touch-icon" href="icono-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manifiestos · Carga de residuos peligrosos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta de la Secretaría de Salud de Chubut */
    --gris:#343A40; --az:#21708C; --pa:#5894A7; --nar:#FF682C; --nar2:#FF8540; --am:#FFB109; --am2:#FFC815;
    --cl:#EAF3F6; --tx:#343A40; --mu:#5F6B73; --bg:#FFFFFF; --card:#FFFFFF; --line:#D1D1D1;
    --ok:#1E6B42; --okbg:#E3F4EA; --wa:#8A5200; --wabg:#FFF3D6; --er:#B4361F; --erbg:#FDE8E2;
    color-scheme: light;
  }
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  *, *::before, *::after { box-sizing:inherit; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; font-size:16px; line-height:1.45; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px 120px; }
  header.top { background:var(--gris); color:#fff; padding:12px 16px 14px; border-bottom:5px solid var(--nar); position:sticky; top:env(safe-area-inset-top,0px); z-index:5; }
  header.top .in { max-width:560px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .marca { display:flex; align-items:center; gap:12px; min-width:0; } .marca img { width:46px; height:auto; flex:none; }
  .hosp { font-weight:800; font-size:17px; line-height:1.2; }
  .sub { font-size:12.5px; color:#D9DEE2; }
  .net { font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; white-space:nowrap; border:0; cursor:pointer; font-family:inherit; }
  .acc { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .salir { background:none; border:1px solid #8C969D; color:#fff; border-radius:16px; padding:3px 12px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .ficha { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .ficha div { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:15px; } .ficha div:last-child { border-bottom:0; }
  .ficha span { color:var(--mu); } .ficha b { text-align:right; }
  .net.on { background:#DDF1E5; color:#1E6B42; } .net.off { background:#FFF1D6; color:#8A5A00; }
  h1 { font-size:22px; margin:22px 0 4px; } h2 { font-size:17px; margin:22px 0 8px; }
  p.mu, .mu { color:var(--mu); font-size:14px; }
  .big { display:block; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:18px; margin:12px 0; cursor:pointer; color:var(--tx); font-family:inherit; }
  .big b { display:block; font-size:18px; } .big span { color:var(--mu); font-size:14px; }
  .big.main { background:var(--az); border-color:var(--az); color:#fff; } .big.main span { color:#D6EBF2; }
  .big:hover { border-color:var(--pa); } .big.main:hover { background:#1A5D75; }
  .big:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--nar); outline-offset:2px; }
  .item { background:var(--card); border-radius:12px; padding:12px 14px; margin:8px 0; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; border:1px solid var(--line); }
  .item b { font-size:15px; } .item small { display:block; color:var(--mu); font-size:13px; }
  .tag { font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .tag.ok { background:var(--okbg); color:var(--ok); } .tag.wa { background:var(--wabg); color:var(--wa); } .tag.er { background:var(--erbg); color:var(--er); }
  .steps { display:flex; gap:6px; margin:18px 0 6px; } .steps i { flex:1; height:6px; border-radius:3px; background:var(--line); } .steps i.on { background:var(--nar); }
  .steplbl { font-size:13px; color:var(--mu); }
  .field { margin:16px 0; }
  .lab { display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:700; font-size:15px; margin-bottom:6px; }
  .q { width:34px; height:34px; flex:none; border-radius:50%; border:2px solid var(--pa); background:var(--card); color:var(--pa); font-weight:800; font-size:17px; cursor:pointer; font-family:inherit; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; color:var(--tx); background:var(--card); border:2px solid var(--line); border-radius:10px; padding:12px; }
  input.bad, select.bad { border-color:var(--er); }
  .err { color:var(--er); font-size:13.5px; margin-top:4px; }
  .seg { display:flex; gap:8px; } .seg button { flex:1; padding:12px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--tx); font:inherit; font-weight:700; cursor:pointer; }
  .seg button.sel { border-color:var(--az); background:var(--az); color:#fff; }
  .res { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px; margin:12px 0; }
  .res .hd { display:flex; justify-content:space-between; align-items:center; font-weight:800; }
  .res.y1 { border-color:#D32F2F; background:#FDE4E4; } .res.y3 { border-color:#F2C200; background:#FFFBD1; }
  .res .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .link { background:none; border:0; color:var(--pa); font:inherit; font-weight:700; cursor:pointer; padding:8px 0; }
  .photo { border:2px dashed var(--pa); border-radius:12px; padding:18px; text-align:center; background:var(--card); cursor:pointer; display:block; }
  .photo img { max-width:100%; border-radius:8px; margin-top:8px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:10px; }
  .btn { flex:1; padding:15px; border-radius:12px; border:0; font:inherit; font-weight:800; font-size:16px; cursor:pointer; }
  .btn.pri { background:var(--az); color:#fff; } .btn.sec { background:var(--cl); color:var(--tx); }
  .btn.pri:hover { background:#1A5D75; }
  .rev { background:var(--card); border-radius:12px; padding:4px 14px; border:1px solid var(--line); }
  .rev div { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .revh { display:flex; justify-content:space-between; align-items:baseline; margin-top:18px; } .revh h2 { margin:0 0 6px; font-size:16px; } .revh .link { padding:4px 0; }
  .rev div:last-child { border-bottom:0; } .rev span { color:var(--mu); } .rev b { text-align:right; }
  .notice { background:var(--wabg); color:var(--wa); padding:12px 14px; border-radius:12px; font-size:14px; margin:12px 0; }
  .notice.ok { background:var(--okbg); color:var(--ok); }
  /* Ayuda */
  .ov { position:fixed; inset:0; background:rgba(52,58,64,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--card); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow:auto; }
  .sheet h3 { margin:0 0 6px; font-size:19px; } .sheet .k { font-weight:800; margin:14px 0 4px; font-size:14px; color:var(--az); }
  .sheet p { margin:0 0 6px; } .ej { background:var(--cl); border-radius:8px; padding:8px 10px; font-weight:700; display:inline-block; }
  .papel { width:100%; max-width:340px; height:auto; margin:6px auto 0; display:block; border-radius:6px; }
  .papel .s rect { fill:#F4F7F8; stroke:#9DB6BF; } .papel .s text { fill:#56707A; font:600 9px 'Plus Jakarta Sans',Arial; }
  .papel .s.hl rect { fill:#FFE3D6; stroke:var(--nar); stroke-width:2; } .papel .s.hl text { fill:#8A2E0A; font-weight:800; }
  .anio { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 4px; }
  .mes { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13px; text-align:left; color:var(--tx); font-family:inherit; }
  .mes b { display:block; font-size:14px; text-transform:capitalize; }
  .mes.ok { border-color:var(--ok); background:var(--okbg); } .mes.wa { border-color:#D9A441; background:var(--wabg); }
  .mes.vacio { cursor:pointer; border-style:dashed; }
  .prog { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; } .prog i { display:block; height:100%; background:var(--ok); }
  .fecha { display:flex; gap:8px; } .fecha input { flex:1; }
  .cal { flex:none; width:52px; border:2px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer; display:grid; place-items:center; color:var(--az); }
  .cal:hover { border-color:var(--pa); }
  .calhd { display:flex; align-items:center; gap:8px; margin:6px 0 10px; } .calhd select { padding:9px; }
  .calhd .nav { flex:none; width:42px; height:42px; border-radius:10px; border:2px solid var(--line); background:var(--card); font:inherit; font-size:20px; font-weight:800; color:var(--az); cursor:pointer; }
  .dias { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
  .dias .dn { font-size:12px; color:var(--mu); font-weight:700; padding:4px 0; }
  .dias button { padding:10px 0; border-radius:8px; border:0; background:var(--cl); color:var(--tx); font:inherit; font-weight:700; cursor:pointer; }
  .dias button:disabled { background:none; color:#B8BEC2; cursor:default; }
  .dias button.sel { background:var(--az); color:#fff; } .dias button.hoy { outline:2px solid var(--nar); }
  .grid2 { display:grid; grid-template-columns:1.4fr 1fr; gap:10px; }
  .menu { display:grid; gap:12px; margin:12px 0; } .menu .big { margin:0; }
  .lista { display:grid; gap:8px; } .lista .item { margin:0; }
  /* Tablet */
  @media (min-width: 720px) {
    body { font-size:17px; }
    .wrap, header.top .in, .bar .in { max-width:900px; }
    .wrap[data-v="form"], .bar[data-v="form"] .in { max-width:720px; }
    h1 { font-size:26px; margin-top:30px; }
    .menu { grid-template-columns:1fr 1fr; }
    .res .grid { grid-template-columns:repeat(4, 1fr); }
    .anio { grid-template-columns:repeat(4, 1fr); }
    .ov { align-items:center; } .sheet { border-radius:18px; max-width:520px; }
    .bar .in { justify-content:flex-end; } .bar .btn { flex:0 0 220px; }
    #f_anio { max-width:240px; } .wrap[data-v="wide"] .grid2 { max-width:520px; }
  }
  /* Computadora */
  @media (min-width: 1100px) {
    .wrap, header.top .in, .bar .in { max-width:1080px; }
    .menu { grid-template-columns:repeat(4, 1fr); } .menu .big { min-height:128px; }
    .anio { grid-template-columns:repeat(6, 1fr); }
    .lista { grid-template-columns:1fr 1fr; }
  }
  .proto { font-size:12px; color:var(--mu); text-align:center; margin-top:28px; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation:up .2s ease-out; } @keyframes up { from { transform:translateY(30px); opacity:.6; } } }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
// ------------------------------------------------------------------ Fechas: se pueden escribir (dd/mm/aaaa) o elegir en el calendario
const FMIN = '2025-01-01', hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const isoATxt = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
function txtAIso(t) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t || ''); if (!m) return '';
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  return d.getDate() === Number(m[1]) && d.getMonth() === Number(m[2]) - 1 ? m[3] + '-' + m[2] + '-' + m[1] : '';
}
const objFecha = o => o === 'C' ? C : M;
function campoFecha(k, o, bad) {
  const ob = objFecha(o), txt = ob['_' + k] != null ? ob['_' + k] : isoATxt(ob[k]);
  return '<div class="fecha"><input id="f_' + k + '" data-fecha="' + k + '" data-obj="' + o + '" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/aaaa" value="' + esc(txt) + '"' + (bad ? ' class="bad"' : '') + '>' +
    '<button type="button" class="cal" data-act="cal" data-arg="' + k + '" data-obj="' + o + '" aria-label="Elegir la fecha en el calendario"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></div>';
}
function escribirFecha(el) {   // agrega las barras solas mientras se escribe
  const d = el.value.replace(/\D/g, '').slice(0, 8);
  el.value = d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d;
  const ob = objFecha(el.dataset.obj), k = el.dataset.fecha;
  ob['_' + k] = el.value; ob[k] = txtAIso(el.value);
}
let CAL = null;
function calendario() {
  const { y, m } = CAL, ob = objFecha(CAL.o), sel = ob[CAL.k], max = hoyISO();
  const primero = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
  let dias = ['lu', 'ma', 'mi', 'ju', 'vi', 'sá', 'do'].map(d => '<div class="dn">' + d + '</div>').join('') + '<div></div>'.repeat(primero);
  for (let d = 1; d <= nd; d++) {
    const iso = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    dias += '<button type="button" data-act="calDia" data-arg="' + iso + '"' + (iso < FMIN || iso > max ? ' disabled' : '') + ' class="' + (iso === sel ? 'sel' : '') + (iso === max ? ' hoy' : '') + '">' + d + '</button>';
  }
  $('ov').innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Calendario"><h3>Elegí la fecha</h3><div class="calhd">' +
    '<button type="button" class="nav" data-act="calMes" data-arg="-1" aria-label="Mes anterior">‹</button>' +
    '<select data-calm aria-label="Mes">' + MESES.map((n, i) => '<option value="' + i + '"' + (i === m ? ' selected' : '') + '>' + n.charAt(0).toUpperCase() + n.slice(1) + '</option>').join('') + '</select>' +
    '<select data-caly aria-label="Año">' + ANIOS().map(a => '<option' + (Number(a) === y ? ' selected' : '') + '>' + a + '</option>').join('') + '</select>' +
    '<button type="button" class="nav" data-act="calMes" data-arg="1" aria-label="Mes siguiente">›</button></div>' +
    '<div class="dias">' + dias + '</div><button class="btn sec" style="width:100%;margin-top:16px" data-act="cerrarAyuda">Cerrar</button></div>';
  $('ov').hidden = false;
}

// Ayuda de cada campo: qué es, dónde está en el papel (sección resaltada) y ejemplo
const AYUDA = {
  hospital: { t: 'Hospital', que: 'El hospital donde trabajás y para el que vas a cargar los manifiestos.', donde: 'Buscalo en la lista, ordenada por área programática.', ej: 'Hospital Rural Gan Gan', s: null },
  clave: { t: 'Clave del hospital', que: 'La clave que te dio Higiene y Seguridad para tu hospital. Es la misma para todas las personas que cargan en ese hospital.', donde: 'Si no la tenés o no funciona, pedila a Higiene y Seguridad.', ej: '••••', s: null },

const API_URL = 'https://script.google.com/macros/s/AKfycbwEf6wxSyzMPh0vu2qoeMJnBwZHNu6IRJgCnAG1sykyuu5N4N4JEFUd_Ve_0Zlu5nME/exec';
const VERSION = 'piloto-4';

// ------------------------------------------------------------------ Almacenamiento local
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('mf_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem('mf_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del: k => { try { localStorage.removeItem('mf_' + k); } catch (e) {} },
};
let SES = LS.get('ses', null);            // { est, nombre, clave, persona }
let CFG = SES ? LS.get('cfg_' + SES.est, null) : null;
let COLA = LS.get('cola', []);            // cargas por enviar
const guardarCola = () => LS.set('cola', COLA);
const miCola = () => COLA.filter(c => SES && c.est === SES.est);
async function hashTxt(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(t).trim())); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }

// ------------------------------------------------------------------ Comunicación con el sistema
let ESPERA_MS = 25000;   // si el sistema no responde en este tiempo, se corta y se avisa
async function api(accion, datos, ses) {
  const s = ses || SES, ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ESPERA_MS);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: accion, est: s.est, clave: s.clave, datos: datos, version: VERSION }), signal: ctl.signal });
    if (!r.ok) throw new Error('red');
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error('respuesta'); }
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'tiempo' : (e.message || 'red')); }
  finally { clearTimeout(t); }
}
let ENVIANDO = false;
async function sincronizar() {
  if (ENVIANDO || !navigator.onLine || !COLA.some(c => c.estado === 'pendiente')) { pintarRed(); return; }
  ENVIANDO = true; pintarRed();
  for (const c of COLA.filter(x => x.estado === 'pendiente')) {
    try {
      const res = await api(c.tipo, c.datos, { est: c.est, clave: c.clave });
      if (res.ok) { COLA = COLA.filter(x => x.datos.idLocal !== c.datos.idLocal); }
      else if (res.error === 'interno') { /* se reintenta luego */ }
      else { c.estado = 'error'; c.mensaje = res.mensaje || res.error; }
      guardarCola();
    } catch (e) { break; }   // sin conexión: se reintenta más tarde
  }
  ENVIANDO = false; pintarRed();
  if (SES && navigator.onLine) actualizarConfig(true);
}
async function actualizarConfig(silencioso) {
  if (!SES || !navigator.onLine) return;
  try {
    const r = await api('config');
    if (r.ok) { CFG = r; LS.set('cfg_' + SES.est, r); if (!silencioso || ['inicio', 'consulta', 'avance'].indexOf(VISTA) >= 0) repintar(); }
    else if (r.error === 'clave') { salirSesion('La clave cambió. Volvé a ingresar.'); }
  } catch (e) {}
}
window.addEventListener('online', sincronizar);
window.addEventListener('offline', pintarRed);
setInterval(sincronizar, 60000);

function pintarRed() {
  const pend = miCola().filter(c => c.estado === 'pendiente').length, err = miCola().filter(c => c.estado === 'error').length;
  const on = navigator.onLine;
  $('net').className = 'net ' + (on && !err ? 'on' : 'off');
  $('net').textContent = !on ? 'Sin señal' + (pend ? ' · ' + pend + ' por enviar' : '') : ENVIANDO ? 'Enviando…' : err ? err + ' con error' : pend ? pend + ' por enviar' : 'En línea';
}

}

    bloqueFoto(C, 'cfoto', C.mesA && C.mesM ? C.mesA + '-' + C.mesM + '-01' : '', 'fotoC', 'cert');
  bar('<button class="btn sec" data-act="inicio">Cancelar</button><button class="btn pri" data-act="guardarCert">Guardar certificado</button>');
  window.scrollTo(0, 0);
}
function guardarCert() {
  ERR = {}; const ft = document.getElementById('f_ftrat'); if (ft && ft.value && ft.value !== C._ftrat) escribirFecha(ft);
  const nc = document.getElementById('f_ncert'); if (nc) C.ncert = nc.value; C.mes = C.mesM && C.mesA ? C.mesA + '-' + C.mesM : '';
  if (!C.empresa) ERR.empresa = 'Elegí la empresa.';
  if (!C.mes) ERR.mes = 'Elegí el mes y el año.'; else if (C.mes > hoyISO().slice(0, 7)) ERR.mes = 'El mes no puede ser posterior al actual.';
  if (!C.ncert.trim()) ERR.ncert = 'Falta el número de certificado.';
  else if ((CFG && CFG.certificados || []).some(x => x.ncert === C.ncert.trim())) ERR.ncert = 'Ese certificado ya está registrado.';
  if (!C.ftrat) ERR.ftrat = 'Falta la fecha de tratamiento.'; else if (C.ftrat > hoyISO()) ERR.ftrat = 'La fecha no puede ser posterior a hoy.';
  if (!C.foto && C.mes && C.mes + '-01' >= OBLIG()) ERR.foto = 'Desde 2027 la foto o el escaneo del certificado es obligatorio.';
  if (Object.keys(ERR).length) return pasoCert();
  encolar('certificado', { idLocal: C.idLocal, empresa: C.empresa, mes: C.mes, ncert: C.ncert.trim(), ftrat: C.ftrat, foto: C.foto, persona: SES.persona }, 'Certificado ' + C.ncert.trim());
}

// ------------------------------------------------------------------ Lote de escaneados
let L = null;
const MAX_LOTE = 20 * 1024 * 1024;
function lote() {
  VISTA = 'lote'; vista('form'); L = L || { tipo: 'manifiestos', dM: '', dA: '', hM: '', hA: '', nota: '', archivos: [] };
  const selMes = (k, v) => '<select data-lt="' + k + '"><option value="">Mes…</option>' + MESES.map((n, i) => { const x = String(i + 1).padStart(2, '0'); return '<option value="' + x + '"' + (v === x ? ' selected' : '') + '>' + n.charAt(0).toUpperCase() + n.slice(1) + '</option>'; }).join('') + '</select>';
  const selAnio = (k, v) => '<select data-lt="' + k + '"><option value="">Año…</option>' + ['2023', '2024'].concat(ANIOS()).map(y => '<option' + (v === y ? ' selected' : '') + '>' + y + '</option>').join('') + '</select>';
  const ya = (CFG && CFG.lotes || []);
  $('app').innerHTML = '<h1>Enviar escaneados</h1><p class="mu">Para manifiestos o certificados que ya están escaneados. Mandá una carpeta comprimida (.zip) o los PDF, e indicá el período. Conviene hacerlo desde una computadora y con buena conexión.</p>' +
    '<div class="field"><div class="lab"><label>Qué vas a enviar</label>' + q('ltipo') + '</div><select data-lt="tipo"><option value="manifiestos"' + (L.tipo === 'manifiestos' ? ' selected' : '') + '>Manifiestos</option><option value="certificados"' + (L.tipo === 'certificados' ? ' selected' : '') + '>Certificados de tratamiento</option></select></div>' +
    '<div class="field"><div class="lab"><label>Desde</label>' + q('lperiodo') + '</div><div class="grid2">' + selMes('dM', L.dM) + selAnio('dA', L.dA) + '</div></div>' +
    '<div class="field"><div class="lab"><label>Hasta</label></div><div class="grid2">' + selMes('hM', L.hM) + selAnio('hA', L.hA) + '</div>' + (ERR.periodo ? '<div class="err">' + esc(ERR.periodo) + '</div>' : '') + '</div>' +
    '<div class="field"><div class="lab"><label>Archivos</label>' + q('larch') + '</div><label class="btn sec" style="display:block;text-align:center;cursor:pointer" for="f_lote">' + (L.archivos.length ? 'Cambiar archivos' : 'Elegir .zip o PDF') + '</label><input id="f_lote" type="file" accept=".zip,application/zip,application/pdf,image/*" multiple hidden data-chg="lote">' +
    (L.archivos.length ? '<div class="lista" style="margin-top:8px">' + L.archivos.map(f => '<div class="item"><div><b>' + esc(f.name) + '</b><small>' + (f.size / 1048576).toFixed(1) + ' MB</small></div></div>').join('') + '</div>' : '') + (ERR.archivos ? '<div class="err">' + esc(ERR.archivos) + '</div>' : '') + '</div>' +
    '<div class="field"><div class="lab"><label for="f_lnota">Nota (opcional)</label></div><textarea id="f_lnota" data-lt="nota" rows="2" placeholder="Por ejemplo: faltan los de marzo">' + esc(L.nota) + '</textarea></div>' +
    (ya.length ? '<h2>Ya enviados</h2><div class="lista">' + ya.slice().reverse().map(l => '<div class="item"><div><b>' + (l.tipo === 'certificados' ? 'Certificados' : 'Manifiestos') + '</b><small>' + esc(txtLote(l)) + ' · ' + l.archivos + ' archivo(s)</small></div><span class="tag ok">Recibido</span></div>').join('') + '</div>' : '') +
    '<p class="mu" style="font-size:13px">Después cargá los datos de cada manifiesto en «Cargar un manifiesto» y marcá «Está en el lote escaneado enviado» en el paso de la foto.</p>';
  bar('<button class="btn sec" data-act="inicio">Cancelar</button><button class="btn pri" data-act="enviarLote">Enviar</button>'); window.scrollTo(0, 0);
}
async function enviarLote() {
  ERR = {}; const nota = document.getElementById('f_lnota'); if (nota) L.nota = nota.value;
  const desde = L.dA && L.dM ? L.dA + '-' + L.dM : '', hasta = L.hA && L.hM ? L.hA + '-' + L.hM : '';
  if (!desde || !hasta) ERR.periodo = 'Elegí el mes y el año de inicio y de fin.'; else if (desde > hasta) ERR.periodo = '«Desde» no puede ser posterior a «Hasta».'; else if (hasta > hoyISO().slice(0, 7)) ERR.periodo = 'El período no puede terminar en un mes futuro.';
  if (!L.archivos.length) ERR.archivos = 'Elegí al menos un archivo.'; else if (L.archivos.some(f => f.size > MAX_LOTE)) ERR.archivos = 'Cada archivo puede pesar hasta 20 MB. Dividí la carpeta en partes más chicas.';
  if (Object.keys(ERR).length) return lote();
  if (!navigator.onLine) { ERR.archivos = 'Para enviar escaneados se necesita conexión.'; return lote(); }
  const n = L.archivos.length, res = []; ESPERA_MS = 180000;
  for (let i = 0; i < n; i++) {
    const f = L.archivos[i];
    bar('<button class="btn pri" disabled>Enviando ' + (i + 1) + ' de ' + n + '… no cierres la aplicación</button>');
    try {
      const data = await new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(f); });
      const r = await api('lote', { idLocal: idNuevo(), tipo: L.tipo, desde: desde, hasta: hasta, nombre: f.name, archivo: data, nota: L.nota, parte: n > 1 ? 'parte ' + (i + 1) + ' de ' + n : '', persona: SES.persona });
      res.push(r.ok ? '✓ ' + f.name + ': ' + (r.archivos || 1) + ' archivo(s)' + (r.enlazados ? ', ' + r.enlazados + ' enlazado(s) a su manifiesto' : '') : '✗ ' + f.name + ': ' + (r.mensaje || 'no se pudo enviar'));
    } catch (e) { res.push('✗ ' + f.name + ': ' + (e.message === 'tiempo' ? 'tardó demasiado; probá con un archivo más chico' : 'falló la conexión')); }
  }
  ESPERA_MS = 25000; L = null; actualizarConfig(true);
  vista('form'); $('app').innerHTML = '<h1>Envío de escaneados</h1><div class="notice ok">' + res.map(esc).join('<br>') + '</div><div class="menu"><button class="big main" data-act="nuevoManifiesto"><b>Cargar los datos de un manifiesto</b><span>Marcá «Está en el lote escaneado enviado»</span></button><button class="big" data-act="inicio"><b>Volver al inicio</b></button></div>';
  bar(null);
}

// ------------------------------------------------------------------ Consultar
function consulta() {
  VISTA = 'consulta'; vista('wide');
  const loc = miCola().slice().reverse(), srv = (CFG && CFG.ultimas || []).slice().reverse(), cer = (CFG && CFG.certificados || []).slice().reverse();
  const res = r => r.map(x => esc(x.corriente) + ' ' + nf(x.vol) + ' ' + esc(x.uni || 'dm³')).join(' · ');
  const item = (t, s, tag, act) => '<div class="item"' + (act ? '' : '') + '><div><b>' + t + '</b><small>' + s + '</small></div>' + tag + '</div>';
  let h = '<h1>Mis cargas</h1>';
  if (loc.length) h += '<h2>En este equipo</h2><div class="lista">' + loc.map(c => {
    const d = c.datos, t = c.tipo === 'manifiesto' ? 'Manifiesto ' + esc(d.nro) : 'Certificado ' + esc(d.ncert);
    const s = c.tipo === 'manifiesto' ? fechaTxt(d.fecha) + ' · ' + esc(d.sitio) + ' · ' + res(d.res) : mesTxt(d.mes);
    return '<div class="item"><div><b>' + t + '</b><small>' + s + (c.estado === 'error' ? '<br><span style="color:var(--er)">' + esc(c.mensaje) + '</span>' : '') + '</small>' +
      (c.estado === 'error' ? '<div style="margin-top:6px"><button class="link" data-act="corregirLocal" data-arg="' + esc(d.idLocal) + '">Corregir</button> · <button class="link" data-act="descartar" data-arg="' + esc(d.idLocal) + '">Descartar</button></div>' : '') +
      '</div>' + (c.estado === 'error' ? '<span class="tag er">No registrada</span>' : '<span class="tag wa">Por enviar</span>') + '</div>';
  }).join('') + '</div>';
  h += '<h2>Registradas en el sistema</h2><div class="grid2"><div class="field"><select data-chg="filtro"><option value="todos"' + (FILTRO === 'todos' ? ' selected' : '') + '>Manifiestos y certificados</option><option value="man"' + (FILTRO === 'man' ? ' selected' : '') + '>Solo manifiestos</option><option value="cert"' + (FILTRO === 'cert' ? ' selected' : '') + '>Solo certificados</option></select></div></div>';
  const lst = [];
  if (FILTRO !== 'cert') srv.forEach(u => lst.push({ f: u.fecha, h: item('Manifiesto ' + esc(u.nro), fechaTxt(u.fecha) + ' · ' + esc(u.sitio) + ' · ' + res(u.res), '<span class="tag ok">' + (u.origen === 'App' ? 'Registrado' : 'Histórico') + '</span>') }));
  if (FILTRO !== 'man') cer.forEach(c => lst.push({ f: c.mes + '-28', h: item('Certificado ' + esc(c.ncert), mesTxt(c.mes) + ' · ' + esc(c.empresa), '<span class="tag ok">Registrado</span>') }));
  lst.sort((a, b) => b.f.localeCompare(a.f));
  h += lst.length ? '<div class="lista">' + lst.slice(0, 60).map(x => x.h).join('') + '</div><p class="mu" style="font-size:13px">Se muestran las últimas cargas registradas.</p>' : '<p class="mu">Todavía no hay cargas registradas' + (navigator.onLine ? '.' : ' (sin señal: se actualiza al volver la conexión).') + '</p>';
  $('app').innerHTML = h;
  bar('<button class="btn sec" data-act="inicio">Volver al inicio</button>'); window.scrollTo(0, 0);
}

// ------------------------------------------------------------------ Avance
function avance() {
  VISTA = 'avance'; vista('wide');
  const av = CFG && CFG.avance || {}, hoy = hoyISO().slice(0, 7);
  const loc = {}; miCola().forEach(c => { const k = c.tipo === 'manifiesto' ? c.datos.fecha.slice(0, 7) : c.datos.mes; loc[k] = (loc[k] || 0) + 1; });
  const celdas = Array.from({ length: 12 }, (_, i) => {
    const m = ANIO_AV + '-' + String(i + 1).padStart(2, '0'), nombre = MESES[i], a = av[m] || { retiros: 0, cert: 0 };
    if (m > hoy) return '<div class="mes" style="opacity:.45"><b>' + nombre + '</b>Todavía no</div>';
    if (!a.retiros && !loc[m]) return '<div class="mes vacio"><b>' + nombre + '</b>Sin cargas</div>';
    return '<div class="mes ' + (a.cert ? 'ok' : 'wa') + '"><b>' + nombre + '</b>' + a.retiros + ' retiro' + (a.retiros === 1 ? '' : 's') + (loc[m] ? ' + ' + loc[m] + ' por enviar' : '') + '<br>' + (a.cert ? 'Certificado cargado' : 'Falta certificado') + '</div>';
  }).join('');
  $('app').innerHTML = '<h1>Avance por mes</h1><div class="field"><div class="lab"><label for="f_anio">Año</label></div><select id="f_anio" data-chg="anio">' + ANIOS().map(y => '<option' + (y === ANIO_AV ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></div>' +
    '<div class="anio">' + celdas + '</div><p class="mu">Cuenta los retiros con Y1 de todos los sitios. Un mes está completo cuando tiene retiros y certificado.</p>';
  bar('<button class="btn sec" data-act="inicio">Volver al inicio</button>'); window.scrollTo(0, 0);
}

// ------------------------------------------------------------------ Acciones
const ACT = {
  ayuda: b => ayuda(b.dataset.arg), cerrarAyuda: () => cerrarAyuda(),
  preguntaSi: () => { cerrarAyuda(); const f = PREG; PREG = null; if (f) f(); }, preguntaNo: () => { cerrarAyuda(); PREG = null; },
  entrar: () => entrar(), salir: () => preguntar('¿Salir del sistema?', 'Sí, salir', () => salirSesion()),
  soy: b => { const ref = CFG.referente.nombre, ult = LS.get('personas_' + SES.est, []).filter(p => p.nombre !== ref); SES.persona = b.dataset.arg === 'ref' ? { nombre: ref, funcion: 'Referente de residuos' } : ult[Number(b.dataset.arg)]; LS.set('ses', SES); inicio(); },
  otraPersona: () => { ERR = {}; otraPersona(); }, confirmarOtra: () => confirmarOtra(), quienCarga: () => quienCarga(),
  inicio: () => inicio(), consulta: () => consulta(), avance: () => avance(), actualizar: () => { actualizarConfig(false); sincronizar(); },
  nuevoManifiesto: () => nuevoManifiesto(), nuevoCertificado: () => nuevoCertificado(),
  adelante: () => adelante(), atras: () => atras(), irPaso: b => { leer(); PASO = Number(b.dataset.arg); DESDE_REV = true; ERR = {}; pasoMan(); },
  sino: b => { leer(); M[b.dataset.k2] = b.dataset.arg; delete ERR[b.dataset.k2]; pasoMan(); },
  guardarCert: () => guardarCert(),
  lote: () => { ERR = {}; lote(); }, enviarLote: () => enviarLote(),
  quitarFoto: b => { const o = b.dataset.arg === 'M' ? M : C; if (o === M) leer(); o.foto = ''; o.fotoNombre = ''; o === M ? pasoMan() : pasoCert(); },
  cal: b => { if (b.dataset.obj === 'M' && M) leer(); const ob = b.dataset.obj === 'C' ? C : M, v = ob[b.dataset.arg] || hoyISO(); CAL = { k: b.dataset.arg, o: b.dataset.obj, y: Number(v.slice(0, 4)), m: Number(v.slice(5, 7)) - 1 }; calendario(); },
  calMes: b => { let m = CAL.m + Number(b.dataset.arg), y = CAL.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } if (y < 2025 || y > new Date().getFullYear()) return; CAL.m = m; CAL.y = y; calendario(); },
  calDia: b => { const ob = objFecha(CAL.o); ob[CAL.k] = b.dataset.arg; ob['_' + CAL.k] = isoATxt(b.dataset.arg); cerrarAyuda(); delete ERR[CAL.k]; CAL.o === 'M' ? pasoMan() : pasoCert(); },
  corregirLocal: b => { const c = COLA.find(x => x.datos.idLocal === b.dataset.arg); if (!c) return; COLA = COLA.filter(x => x !== c); guardarCola();
    if (c.tipo === 'manifiesto') { const d = c.datos; nuevoManifiesto({ tipo: 'manifiesto', idLocal: idNuevo(), sitio: d.sitio, nro: d.nro, fecha: d.fecha, firma: d.firma, original: d.original, foto: d.foto, obs: d.obs, res: corrCfg().map(x => Object.assign(nuevoRes(x.c, d.sitio), d.res.find(r => r.corriente === x.c) || {})) }); }
    else { const d = c.datos; nuevoCertificado({ tipo: 'certificado', idLocal: idNuevo(), empresa: d.empresa, mesM: d.mes.slice(5, 7), mesA: d.mes.slice(0, 4), ncert: d.ncert, ftrat: d.ftrat, foto: d.foto }); } },
  descartar: b => preguntar('¿Descartar esta carga? No se va a registrar.', 'Sí, descartar', () => { COLA = COLA.filter(x => x.datos.idLocal !== b.dataset.arg); guardarCola(); consulta(); pintarRed(); }),
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act] && !b.disabled) { e.preventDefault(); ACT[b.dataset.act](b); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg === 'foto') foto(t, M, pasoMan);
  else if (t.dataset.chg === 'fotoC') foto(t, C, pasoCert);
  else if (t.dataset.chg === 'marcarLote') { leer(); M.lote = t.checked ? txtLote(loteDe(M.fecha)) : ''; delete ERR.foto; }
  else if (t.dataset.chg === 'lote') { L.archivos = Array.from(t.files || []); delete ERR.archivos; lote(); }
  else if (t.dataset.lt && L) { L[t.dataset.lt] = t.value; }
  else if (t.dataset.chg === 'repMan') { leer(); pasoMan(); }
  else if (t.dataset.k && M && t.dataset.i == null) { M[t.dataset.k] = t.value; }
  else if (t.dataset.chg === 'repOtra') { OTRA.funcion = t.value; otraPersona(); }
  else if (t.dataset.chg === 'anio') { ANIO_AV = t.value; avance(); }
  else if (t.dataset.chg === 'filtro') { FILTRO = t.value; consulta(); }
  else if (t.dataset.cm && C) { C[t.dataset.cm === 'm' ? 'mesM' : 'mesA'] = t.value; }
  else if (t.dataset.c && C) C[t.dataset.c] = t.value;
  else if (t.dataset.l) LOG[t.dataset.l] = t.value;
  else if (t.hasAttribute('data-calm')) { CAL.m = Number(t.value); calendario(); }
  else if (t.hasAttribute('data-caly')) { CAL.y = Number(t.value); calendario(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.fecha) escribirFecha(t);
  if (t.dataset.c && C) C[t.dataset.c] = t.value;
  if (t.dataset.l) LOG[t.dataset.l] = t.value;
  if (t.dataset.o && OTRA) OTRA[t.dataset.o] = t.value;
  if (t.dataset.k && M && t.dataset.i == null && !t.dataset.recalc) M[t.dataset.k] = t.value;
  if (t.dataset.recalc && M) {   // recalcula la cantidad retirada sin perder el foco
    const i = Number(t.dataset.i); M.res[i][t.dataset.k] = t.value; calcVol(M.res[i]);
    const v = document.querySelector('[data-k="vol"][data-i="' + i + '"]'); if (v && M.res[i].uni === 'dm³') v.value = M.res[i].vol;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && VISTA === 'ingreso' && e.target.id === 'f_clave') { LOG.clave = e.target.value; entrar(); } });
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') cerrarAyuda(); });
$('net').onclick = () => sincronizar();

// ------------------------------------------------------------------ Arranque
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (SES && SES.persona) { inicio(); actualizarConfig(true); sincronizar(); } else if (SES) quienCarga(); else ingreso();

</script>
