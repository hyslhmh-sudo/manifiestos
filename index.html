<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#343A40">
<link rel="apple-touch-icon" href="icono-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi establecimiento · Higiene y Seguridad</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta de la Secretaría de Salud de Chubut */
    --gris:#343A40; --az:#21708C; --pa:#5894A7; --nar:#FF682C; --nar2:#FF8540; --am:#FFB109; --am2:#FFC815;
    --cl:#EAF3F6; --tx:#343A40; --mu:#5F6B73; --bg:#FFFFFF; --card:#FFFFFF; --line:#D1D1D1;
    --ok:#1E6B42; --okbg:#E3F4EA; --wa:#8A5200; --wabg:#FFF3D6; --er:#B4361F; --erbg:#FDE8E2;
    color-scheme: light;
  }
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  *, *::before, *::after { box-sizing:inherit; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; font-size:16px; line-height:1.45; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px 120px; }
  header.top { background:var(--gris); color:#fff; padding:12px 16px 14px; border-bottom:5px solid var(--nar); position:sticky; top:env(safe-area-inset-top,0px); z-index:5; }
  header.top .in { max-width:560px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .marca { display:flex; align-items:center; gap:12px; min-width:0; } .marca img { width:46px; height:auto; flex:none; }
  .hosp { font-weight:800; font-size:17px; line-height:1.2; }
  .sub { font-size:12.5px; color:#D9DEE2; }
  .net { font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; white-space:nowrap; border:0; cursor:pointer; font-family:inherit; }
  .acc { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .salir { background:none; border:1px solid #8C969D; color:#fff; border-radius:16px; padding:3px 12px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .ficha { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .ficha div { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:15px; } .ficha div:last-child { border-bottom:0; }
  .ficha span { color:var(--mu); } .ficha b { text-align:right; }
  .net.on { background:#DDF1E5; color:#1E6B42; } .net.off { background:#FFF1D6; color:#8A5A00; }
  h1 { font-size:22px; margin:22px 0 4px; } h2 { font-size:17px; margin:22px 0 8px; }
  p.mu, .mu { color:var(--mu); font-size:14px; }
  .big { display:block; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:18px; margin:12px 0; cursor:pointer; color:var(--tx); font-family:inherit; }
  .big b { display:block; font-size:18px; } .big span { color:var(--mu); font-size:14px; }
  .big.main { background:var(--az); border-color:var(--az); color:#fff; } .big.main span { color:#D6EBF2; }
  .big:hover { border-color:var(--pa); } .big.main:hover { background:#1A5D75; }
  .big:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--nar); outline-offset:2px; }
  .item { background:var(--card); border-radius:12px; padding:12px 14px; margin:8px 0; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; border:1px solid var(--line); }
  .item b { font-size:15px; } .item small { display:block; color:var(--mu); font-size:13px; }
  .tag { font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .tag.ok { background:var(--okbg); color:var(--ok); } .tag.wa { background:var(--wabg); color:var(--wa); } .tag.er { background:var(--erbg); color:var(--er); }
  .steps { display:flex; gap:6px; margin:18px 0 6px; } .steps i { flex:1; height:6px; border-radius:3px; background:var(--line); } .steps i.on { background:var(--nar); }
  .steplbl { font-size:13px; color:var(--mu); }
  .field { margin:16px 0; }
  .lab { display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:700; font-size:15px; margin-bottom:6px; }
  .q { width:34px; height:34px; flex:none; border-radius:50%; border:2px solid var(--pa); background:var(--card); color:var(--pa); font-weight:800; font-size:17px; cursor:pointer; font-family:inherit; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; color:var(--tx); background:var(--card); border:2px solid var(--line); border-radius:10px; padding:12px; }
  input.bad, select.bad { border-color:var(--er); }
  .err { color:var(--er); font-size:13.5px; margin-top:4px; }
  .seg { display:flex; gap:8px; } .seg button { flex:1; padding:12px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--tx); font:inherit; font-weight:700; cursor:pointer; }
  .seg button.sel { border-color:var(--az); background:var(--az); color:#fff; }
  .res { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px; margin:12px 0; }
  .res .hd { display:flex; justify-content:space-between; align-items:center; font-weight:800; }
  .res.y1 { border-color:#D32F2F; background:#FDE4E4; } .res.y3 { border-color:#F2C200; background:#FFFBD1; }
  .res .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .link { background:none; border:0; color:var(--pa); font:inherit; font-weight:700; cursor:pointer; padding:8px 0; }
  .photo { border:2px dashed var(--pa); border-radius:12px; padding:18px; text-align:center; background:var(--card); cursor:pointer; display:block; }
  .photo img { max-width:100%; border-radius:8px; margin-top:8px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:10px; }
  .btn { flex:1; padding:15px; border-radius:12px; border:0; font:inherit; font-weight:800; font-size:16px; cursor:pointer; }
  .btn.pri { background:var(--az); color:#fff; } .btn.sec { background:var(--cl); color:var(--tx); }
  .btn.pri:hover { background:#1A5D75; }
  .rev { background:var(--card); border-radius:12px; padding:4px 14px; border:1px solid var(--line); }
  .rev div { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .revh { display:flex; justify-content:space-between; align-items:baseline; margin-top:18px; } .revh h2 { margin:0 0 6px; font-size:16px; } .revh .link { padding:4px 0; }
  .rev div:last-child { border-bottom:0; } .rev span { color:var(--mu); } .rev b { text-align:right; }
  .notice { background:var(--wabg); color:var(--wa); padding:12px 14px; border-radius:12px; font-size:14px; margin:12px 0; }
  .notice.ok { background:var(--okbg); color:var(--ok); }
  /* Ayuda */
  .ov { position:fixed; inset:0; background:rgba(52,58,64,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--card); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow:auto; }
  .sheet h3 { margin:0 0 6px; font-size:19px; } .sheet .k { font-weight:800; margin:14px 0 4px; font-size:14px; color:var(--az); }
  .sheet p { margin:0 0 6px; } .ej { background:var(--cl); border-radius:8px; padding:8px 10px; font-weight:700; display:inline-block; }
  .papel { width:100%; max-width:340px; height:auto; margin:6px auto 0; display:block; border-radius:6px; }
  .papel .s rect { fill:#F4F7F8; stroke:#9DB6BF; } .papel .s text { fill:#56707A; font:600 9px 'Plus Jakarta Sans',Arial; }
  .papel .s.hl rect { fill:#FFE3D6; stroke:var(--nar); stroke-width:2; } .papel .s.hl text { fill:#8A2E0A; font-weight:800; }
  .anio { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 4px; }
  .mes { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13px; text-align:left; color:var(--tx); font-family:inherit; }
  .mes b { display:block; font-size:14px; text-transform:capitalize; }
  .mes.ok { border-color:var(--ok); background:var(--okbg); } .mes.wa { border-color:#D9A441; background:var(--wabg); }
  .mes.vacio { cursor:pointer; border-style:dashed; }
  .prog { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; } .prog i { display:block; height:100%; background:var(--ok); }
  .fecha { display:flex; gap:8px; } .fecha input { flex:1; }
  .cal { flex:none; width:52px; border:2px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer; display:grid; place-items:center; color:var(--az); }
  .cal:hover { border-color:var(--pa); }
  .calhd { display:flex; align-items:center; gap:8px; margin:6px 0 10px; } .calhd select { padding:9px; }
  .calhd .nav { flex:none; width:42px; height:42px; border-radius:10px; border:2px solid var(--line); background:var(--card); font:inherit; font-size:20px; font-weight:800; color:var(--az); cursor:pointer; }
  .dias { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
  .dias .dn { font-size:12px; color:var(--mu); font-weight:700; padding:4px 0; }
  .dias button { padding:10px 0; border-radius:8px; border:0; background:var(--cl); color:var(--tx); font:inherit; font-weight:700; cursor:pointer; }
  .dias button:disabled { background:none; color:#B8BEC2; cursor:default; }
  .dias button.sel { background:var(--az); color:#fff; } .dias button.hoy { outline:2px solid var(--nar); }
  .grid2 { display:grid; grid-template-columns:1.4fr 1fr; gap:10px; }
  .menu { display:grid; gap:12px; margin:12px 0; } .menu .big { margin:0; }
  .lista { display:grid; gap:8px; } .lista .item { margin:0; }
  /* Tablet */
  @media (min-width: 720px) {
    body { font-size:17px; }
    .wrap, header.top .in, .bar .in { max-width:900px; }
    .wrap[data-v="form"], .bar[data-v="form"] .in { max-width:720px; }
    h1 { font-size:26px; margin-top:30px; }
    .menu { grid-template-columns:1fr 1fr; }
    .res .grid { grid-template-columns:repeat(4, 1fr); }
    .anio { grid-template-columns:repeat(4, 1fr); }
    .ov { align-items:center; } .sheet { border-radius:18px; max-width:520px; }
    .bar .in { justify-content:flex-end; } .bar .btn { flex:0 0 220px; }
    #f_anio { max-width:240px; } .wrap[data-v="wide"] .grid2 { max-width:520px; }
  }
  /* Computadora */
  @media (min-width: 1100px) {
    .wrap, header.top .in, .bar .in { max-width:1080px; }
    .menu { grid-template-columns:repeat(4, 1fr); } .menu .big { min-height:128px; }
    .anio { grid-template-columns:repeat(6, 1fr); }
    .lista { grid-template-columns:1fr 1fr; }
  }
  .proto { font-size:12px; color:var(--mu); text-align:center; margin-top:28px; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation:up .2s ease-out; } @keyframes up { from { transform:translateY(30px); opacity:.6; } } }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
// ------------------------------------------------------------------ Fechas: se pueden escribir (dd/mm/aaaa) o elegir en el calendario
const FMIN = '2025-01-01', hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const isoATxt = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
function txtAIso(t) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t || ''); if (!m) return '';
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  return d.getDate() === Number(m[1]) && d.getMonth() === Number(m[2]) - 1 ? m[3] + '-' + m[2] + '-' + m[1] : '';
}
const objFecha = o => o === 'C' ? C : M;
function campoFecha(k, o, bad) {
  const ob = objFecha(o), txt = ob['_' + k] != null ? ob['_' + k] : isoATxt(ob[k]);
  return '<div class="fecha"><input id="f_' + k + '" data-fecha="' + k + '" data-obj="' + o + '" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/aaaa" value="' + esc(txt) + '"' + (bad ? ' class="bad"' : '') + '>' +
    '<button type="button" class="cal" data-act="cal" data-arg="' + k + '" data-obj="' + o + '" aria-label="Elegir la fecha en el calendario"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></div>';
}
function escribirFecha(el) {   // agrega las barras solas mientras se escribe
  const d = el.value.replace(/\D/g, '').slice(0, 8);
  el.value = d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d;
  const ob = objFecha(el.dataset.obj), k = el.dataset.fecha;
  ob['_' + k] = el.value; ob[k] = txtAIso(el.value);
}
let CAL = null;
function calendario() {
  const { y, m } = CAL, ob = objFecha(CAL.o), sel = ob[CAL.k], max = hoyISO();
  const primero = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
  let dias = ['lu', 'ma', 'mi', 'ju', 'vi', 'sá', 'do'].map(d => '<div class="dn">' + d + '</div>').join('') + '<div></div>'.repeat(primero);
  for (let d = 1; d <= nd; d++) {
    const iso = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    dias += '<button type="button" data-act="calDia" data-arg="' + iso + '"' + (iso < FMIN || iso > max ? ' disabled' : '') + ' class="' + (iso === sel ? 'sel' : '') + (iso === max ? ' hoy' : '') + '">' + d + '</button>';
  }
  $('ov').innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Calendario"><h3>Elegí la fecha</h3><div class="calhd">' +
    '<button type="button" class="nav" data-act="calMes" data-arg="-1" aria-label="Mes anterior">‹</button>' +
    '<select data-calm aria-label="Mes">' + MESES.map((n, i) => '<option value="' + i + '"' + (i === m ? ' selected' : '') + '>' + n.charAt(0).toUpperCase() + n.slice(1) + '</option>').join('') + '</select>' +
    '<select data-caly aria-label="Año">' + ANIOS().map(a => '<option' + (Number(a) === y ? ' selected' : '') + '>' + a + '</option>').join('') + '</select>' +
    '<button type="button" class="nav" data-act="calMes" data-arg="1" aria-label="Mes siguiente">›</button></div>' +
    '<div class="dias">' + dias + '</div><button class="btn sec" style="width:100%;margin-top:16px" data-act="cerrarAyuda">Cerrar</button></div>';
  $('ov').hidden = false;
}

// Ayuda de cada campo: qué es, dónde está en el papel (sección resaltada) y ejemplo
const AYUDA = {
  hospital: { t: 'Hospital', que: 'El hospital donde trabajás y para el que vas a cargar los manifiestos.', donde: 'Buscalo en la lista, ordenada por área programática.', ej: 'Hospital Rural Gan Gan', s: null },
  clave: { t: 'Clave del hospital', que: 'La clave que te dio Higiene y Seguridad para tu hospital. Es la misma para todas las personas que cargan en ese hospital.', donde: 'Si no la tenés o no funciona, pedila a Higiene y Seguridad.', ej: '••••', s: null },

async function hashTxt(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(t).trim())); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }

// ------------------------------------------------------------------ Comunicación con el sistema
let ESPERA_MS = 25000;   // si el sistema no responde en este tiempo, se corta y se avisa
async function api(accion, datos, ses) {
  const s = ses || SES, ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ESPERA_MS);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: accion, est: s.est, clave: s.clave, datos: datos, version: VERSION }), signal: ctl.signal });
    if (!r.ok) throw new Error('red');
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error('respuesta'); }
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'tiempo' : (e.message || 'red')); }
  finally { clearTimeout(t); }
}
let ENVIANDO = false;
async function sincronizar() {
  if (ENVIANDO || !navigator.onLine || !COLA.some(c => c.estado === 'pendiente')) { pintarRed(); return; }
  ENVIANDO = true; pintarRed();
  for (const c of COLA.filter(x => x.estado === 'pendiente')) {
    try {
      const res = await api(c.tipo, c.datos, { est: c.est, clave: c.clave });
      if (res.ok) { COLA = COLA.filter(x => x.datos.idLocal !== c.datos.idLocal); }
      else if (res.error === 'interno') { /* se reintenta luego */ }
      else { c.estado = 'error'; c.mensaje = res.mensaje || res.error; }
      guardarCola();
    } catch (e) { break; }   // sin conexión: se reintenta más tarde
  }
  ENVIANDO = false; pintarRed();
  if (SES && navigator.onLine) { actualizarConfig(true); miCargar(true); }
}
async function actualizarConfig(silencioso) {
  if (!SES || !navigator.onLine) return;
  try {
    const r = await api('config');
    if (r.ok) { CFG = r; LS.set('cfg_' + SES.est, r); if (!silencioso || ['inicio', 'consulta', 'avance'].indexOf(VISTA) >= 0) repintar(); }
    else if (r.error === 'clave') { salirSesion('La clave cambió. Volvé a ingresar.'); }
  } catch (e) {}
}
window.addEventListener('online', sincronizar);
window.addEventListener('offline', pintarRed);
setInterval(sincronizar, 60000);

function pintarRed() {
  const pend = miCola().filter(c => c.estado === 'pendiente').length, err = miCola().filter(c => c.estado === 'error').length;
  const on = navigator.onLine;
  $('net').className = 'net ' + (on && !err ? 'on' : 'off');
  $('net').textContent = !on ? 'Sin señal' + (pend ? ' · ' + pend + ' por enviar' : '') : ENVIANDO ? 'Enviando…' : err ? err + ' con error' : pend ? pend + ' por enviar' : 'En línea';
}

    const rd = new FileReader(); rd.onload = () => { if (obj === M) leer(); obj.foto = rd.result; obj.fotoNombre = f.name; obj.lote = ''; delete ERR.foto; repaint(); }; rd.readAsDataURL(f); return;
  }

// ------------------------------------------------------------------ Mis registros: ver, corregir y anular lo cargado (Registros.gs)
let REG = null, REGF = 'Todos', REGM = 1, REGL = '';
const regPeriodo = () => REGM === 1 ? 'el último mes' : 'los últimos ' + REGM + ' meses';
async function registros(fresco) {

  if (!navigator.onLine) { $('app').innerHTML = tit + '<p class="mu">Necesitás señal para ver lo registrado en el sistema.</p>'; return miVolver(); }
  if (fresco || !REG || REG._est !== SES.est || REG._m !== REGM) { $('app').innerHTML = tit + '<p class="mu">Leyendo…</p>'; bar(null);
    try { const r = await api('m_registros', { meses: REGM }); if (!r.ok) throw new Error(); REG = r; REG._est = SES.est; REG._m = REGM; } catch (e) { $('app').innerHTML = tit + '<p class="mu">No se pudo leer. Probá de nuevo en un rato.</p>'; return miVolver(); } }

  const lugares = {}; porTema.forEach(r => { if (r.lugar) lugares[r.lugar] = (lugares[r.lugar] || 0) + 1; });
  if (REGL && !lugares[REGL]) REGL = '';
  const L = porTema.filter(r => !REGL || r.lugar === REGL), sinFoto = L.filter(r => r.sinFoto && !r.anulado).length;
  const selPer = '<select data-chg="regM" style="max-width:220px">' + [[1, 'Último mes'], [3, 'Últimos 3 meses'], [6, 'Últimos 6 meses'], [12, 'Últimos 12 meses']].map(([v, t]) => '<option value="' + v + '"' + (v === REGM ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>';
  const selLug = Object.keys(lugares).length > 1 ? '<select data-chg="regL" style="max-width:320px"><option value="">Todos los lugares (' + porTema.filter(r => r.lugar).length + ')</option>' + Object.keys(lugares).sort((a, b) => a.localeCompare(b, 'es')).map(l => '<option value="' + esc(l) + '"' + (l === REGL ? ' selected' : '') + '>' + esc(l) + ' (' + lugares[l] + ')</option>').join('') + '</select>' : '';
  const chip = t => '<button class="btn ' + (REGF === t ? 'pri' : 'sec') + '" style="padding:8px 14px;font-size:14px" data-act="regF" data-arg="' + t + '">' + t + '</button>';
  $('app').innerHTML = miTit('Mis registros', 'Lo cargado en ' + regPeriodo() + '. ' + (REG.maestra ? 'Con la clave de Higiene y Seguridad se puede corregir o anular cualquier registro.' : 'Se puede corregir o anular hasta ' + REG.dias + ' días después de la carga; después lo corrige Higiene y Seguridad.') + ' Anular no borra: el registro queda guardado como anulado, con el motivo.') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px">' + ['Todos', 'Residuos', 'Agua', 'Plagas', 'Documentos'].map(chip).join('') + '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px">' + selPer + selLug + '</div>' +
    (sinFoto ? '<div class="notice"><b>' + sinFoto + ' manifiesto(s) sin foto.</b> Tocá «Subir foto» en cada uno, o enviá el lote .zip del mes. Hay tiempo hasta el día ' + ((CFG && CFG.diaLimite) || 10) + ' del mes siguiente.</div>' : '') +
    (L.length ? '<div class="lista">' + L.map(r => '<div class="item" style="flex-direction:column;align-items:stretch;gap:8px' + (r.anulado ? ';opacity:.6' : '') + '"><div><b>' + esc(r.titulo) + '</b><small>' + esc([fechaTxt(r.fecha), r.detalle, r.cargo ? 'cargó ' + r.cargo : ''].filter(Boolean).join(' · ')) + '</small>' +
      (r.anulado ? '<small style="color:var(--er)">' + esc(r.motivo || 'Anulado') + '</small>' : !r.editable ? '<small>Ya no se puede corregir desde acá (más de ' + REG.dias + ' días).</small>' : '') + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + (r.url ? '<a class="btn sec" style="padding:8px 12px;text-decoration:none" href="' + esc(r.url) + '" target="_blank" rel="noopener">Ver</a>' : '') +
      (r.sinFoto && !r.anulado ? '<label class="btn pri" style="padding:8px 12px;cursor:pointer;flex:0 0 auto">Subir foto<input type="file" accept="image/*,application/pdf" hidden data-chg="regFoto" data-i="' + r.i + '"></label>' : '') +
      (r.editable && !r.anulado ? '<button class="btn sec" style="padding:8px 12px" data-act="regCorregir" data-arg="' + r.i + '">Corregir</button><button class="btn sec" style="padding:8px 12px" data-act="regAnular" data-arg="' + r.i + '">Anular</button>' : '') + '</div></div>').join('') + '</div>'
      : '<p class="mu">No hay registros' + (REGF === 'Todos' ? '' : ' de ' + REGF.toLowerCase()) + ' en ' + regPeriodo() + (REGL ? ' en ' + esc(REGL) : '') + '.</p>') +
    ((REGF === 'Todos' || REGF === 'Residuos') && (REG.anuladosResiduos || []).length ? '<h2>Manifiestos y certificados anulados</h2><div class="lista">' + REG.anuladosResiduos.map(a => '<div class="item"><div><b>' + esc(a.texto) + '</b><small>' + esc('Anulado el ' + fechaTxt(a.fecha) + ' · ' + a.quien + ' · ' + a.motivo) + '</small></div></div>').join('') + '</div>' : '');
  miVolver(); window.scrollTo(0, 0);
}
function regAnular(i) {
  const r = REG.registros[i]; if (!r) return;
  $('ov').innerHTML = '<div class="sheet"><h3>Anular: ' + esc(r.titulo) + '</h3><p class="mu">El registro deja de contar, pero queda guardado como anulado, con el motivo.</p>' +
    '<div class="field"><label for="anMot">Motivo</label><select id="anMot"><option>Cargado dos veces</option><option>Era de otro establecimiento o sitio</option><option>Datos equivocados (lo vuelvo a cargar)</option><option>Otro</option></select></div>' +
    '<div class="field"><label for="anTxt">Detalle (opcional)</label><textarea id="anTxt" rows="2"></textarea></div><div class="notice" id="anErr" hidden style="background:var(--erbg);color:var(--er)"></div>' +

  $('ov').hidden = false;

async function regAnularOk(i) {
  const r = REG.registros[i], mot = $('anMot').value + ($('anTxt').value.trim() ? ': ' + $('anTxt').value.trim() : ''), e = $('anErr');

  } catch (err) { e.textContent = 'Sin conexión: probá de nuevo cuando tengas señal.'; e.hidden = false; }
}
// Corregir: abre el formulario de la carga con los datos puestos. Al guardar, reemplaza al anterior (que queda anulado).
function regCorregir(i) {
  const r = REG.registros[i]; if (!r) return; const d = r.datos || {}, toma = ks => { const o = {}; ks.forEach(k => { if (d[k] != null && d[k] !== '') o[k] = String(d[k]); }); return o; };
  if (r.tipo === 'manifiesto') {
    const res = corrCfg().map(x => { const e = (d.res || []).find(z => z.corriente === x.c), n = nuevoRes(x.c, d.sitio); if (e) Object.assign(n, { cant: String(e.cant == null ? '' : e.cant), tam: String(e.tam == null ? '' : e.tam), vol: String(e.vol == null ? '' : e.vol), uni: e.uni || 'dm³' }); return n; });
    return nuevoManifiesto({ tipo: 'manifiesto', idLocal: idNuevo(), sitio: d.sitio, nro: d.nro, fecha: d.fecha, _fecha: String(d.fecha).split('-').reverse().join('/'), res: res, firma: d.firma || '', original: d.original || '', foto: '', fotoUrl: r.url || '', obs: d.obs || '', reemplaza: r.id, _nroOrig: d.nro, _sitioOrig: d.sitio });
  }
  if (r.tipo === 'certificado') { const m = String(d.mes || '').split('-'); return nuevoCertificado({ tipo: 'certificado', idLocal: idNuevo(), empresa: d.empresa, mesM: m[1] || '', mesA: m[0] || '', mes: d.mes, ncert: d.ncert, ftrat: d.ftrat, _ftrat: d.ftrat ? d.ftrat.split('-').reverse().join('/') : '', foto: '', fotoUrl: r.url || '', reemplaza: r.id }); }
  const base = { _corr: true, fotoUrl: r.url || '', reemplaza: r.id };
  if (r.tipo === 'limpieza') { F = Object.assign({ _f: 'lim' }, toma(['CODIGO_TANQUE', 'FECHA', 'PROCEDIMIENTO', 'HORA_CORTE', 'HORA_REHABILITACION', 'HORAS_CERRADO', 'DESINFECTANTE', 'CONCENTRACION_GL', 'VOLUMEN_L', 'CLORO_PPM', 'TURBIDEZ_NTU', 'TAPA', 'MUESTRA_TOMADA', 'OBSERVACIONES']), base); return aguaLimpieza(); }
  if (r.tipo === 'analisis') { F = Object.assign({ _f: 'ana' }, toma(['CODIGO_PUNTO', 'FECHA_TOMA', 'TIPO', 'MOTIVO', 'LABORATORIO', 'CLORO_PPM', 'RESULTADO', 'FECHA_RESULTADO', 'OBSERVACIONES']), base); return aguaAnalisis(); }
  if (r.tipo === 'plaga') { F = Object.assign({ _f: d.TIPO }, toma(['TIPO', 'CASO', 'FECHA', 'ESTABLECIMIENTO', 'SITIO', 'SECTOR', 'ACCIONES', 'QUIMICO', 'PRODUCTO', 'RESULTADO', 'DECISION', 'PROXIMA_REVISION', 'OBSERVACIONES']), base); return plagaReg(d.TIPO); }
  if (r.tipo === 'caso') { F = Object.assign({ _f: 'avi' }, toma(['ESTABLECIMIENTO', 'SITIO', 'SECTOR', 'FECHA', 'PLAGA', 'EVIDENCIA', 'CANTIDAD', 'OBSERVACIONES']), { _corr: true, fotoUrl: r.url || '', CASO_EDITAR: r.id }); return plagaAviso(); }
  if (r.tipo === 'documento') { F = Object.assign({ _f: 'doc' }, toma(['TEMA', 'TIPO', 'CODIGO', 'TITULO', 'VERSION', 'FECHA_VIGENCIA', 'OBSERVACIONES']), { _corr: true, fotoUrl: r.url || '', ID_EDITAR: r.id }); return docNuevo(); }
}
// Subir la foto o el PDF de un manifiesto que se cargó sin ella
async function regFoto(input) {
  const f = input.files && input.files[0], r = REG && REG.registros[Number(input.dataset.i)]; if (!f || !r) return;
  if (!navigator.onLine) return alert('Para subir la foto hace falta señal.');
  const lab = input.closest('label'); if (lab) lab.firstChild.textContent = 'Subiendo…';
  try {
    let data;
    if (f.type === 'application/pdf') { if (f.size > 6 * 1024 * 1024) throw new Error('El PDF pesa más de 6 MB.'); data = await new Promise((ok, mal) => { const rd = new FileReader(); rd.onload = () => ok(rd.result); rd.onerror = mal; rd.readAsDataURL(f); }); }
    else data = await new Promise((ok, mal) => { const img = new Image(), u = URL.createObjectURL(f); img.onload = () => { const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.65)); }; img.onerror = mal; img.src = u; });
    ESPERA_MS = 120000;
    const x = await api('m_foto_man', { id: r.id, archivo: { base64: data, tipo: (data.match(/^data:([^;]+)/) || [])[1], nombre: f.name }, quien: SES.persona.nombre });
    ESPERA_MS = 25000;
    if (!x.ok) throw new Error(x.mensaje || 'No se pudo subir.');
    REG = null; actualizarConfig(true); miCargar(true); registros(true);
  } catch (e) { ESPERA_MS = 25000; if (lab) lab.firstChild.textContent = 'Subir foto'; alert(e.message === 'tiempo' ? 'Tardó demasiado. Probá de nuevo.' : (e.message || 'No se pudo subir.')); }
}
Object.assign(ACT, { registros: () => { F = null; registros(true); }, registrosRes: () => { F = null; REGF = 'Residuos'; registros(true); }, otroMismoLugar: () => nuevoManifiesto(null, ultimoMan().sitio), regF: b => { REGF = b.dataset.arg; registros(); }, regAnular: b => regAnular(Number(b.dataset.arg)), regAnularOk: b => regAnularOk(Number(b.dataset.arg)), regCorregir: b => regCorregir(Number(b.dataset.arg)) });

// ------------------------------------------------------------------ Acciones y campos
Object.assign(ACT, {
  actualizar: () => { actualizarConfig(false); sincronizar(); miCargar(false); },
  irDiag: () => irDiag(), aguaInv: () => { F = null; aguaInv(); }, aguaEditT: b => aguaEditT(b.dataset.arg), aguaEditP: b => aguaEditP(b.dataset.arg), guardarInv: b => guardarInv(b.dataset.arg),
  aguaLimpieza: () => { F = null; aguaLimpieza(); }, guardarLimpieza: () => guardarLimpieza(), aguaAnalisis: () => { F = null; aguaAnalisis(); }, guardarAnalisis: () => guardarAnalisis(),
  plagaAviso: () => { F = null; plagaAviso(); }, guardarAviso: () => guardarAviso(), plagaInter: () => { F = null; plagaReg('Intervención'); }, plagaSeg: () => { F = null; plagaReg('Seguimiento'); }, plagaRec: () => { F = null; plagaReg('Recorrida'); },
  guardarPlagaReg: () => guardarPlagaReg(), formularios: () => formularios(), docs: () => { F = null; docs(); }, docNuevo: () => { F = null; docNuevo(); }, guardarDoc: () => guardarDoc(),
  fset: b => { if (!F) return; F[b.dataset.k] = b.dataset.arg; MIV.f(); }, fquitar: b => { if (!F) return; F[b.dataset.k] = ''; F[b.dataset.k + 'Nombre'] = ''; MIV.f(); },
  soyRed: b => { const p = MI && MI.red[Number(b.dataset.arg)]; if (!p) return; SES.persona = { nombre: p.nombre, funcion: p.rol || 'Red HyS', ests: [SES.est], red: true }; LS.set('ses', SES); inicio(); }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.f && F) F[t.dataset.f] = t.value; });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && F) { F[t.dataset.f] = t.value; if (t.tagName === 'SELECT' && MIV && /CODIGO_|TIPO|PROCEDIMIENTO/.test(t.dataset.f)) MIV.f(); }
  else if (t.dataset.fchk && F) { F[t.dataset.fchk] = Array.from(document.querySelectorAll('[data-fchk="' + t.dataset.fchk + '"]:checked')).map(x => x.value).join(' · '); }
  else if (t.dataset.mfoto) mFoto(t, t.dataset.mfoto);
});

// ------------------------------------------------------------------ Arranque
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (SES && SES.persona && SES.persona.funcion !== 'Referente de residuos' && !SES.persona.red && !cargaEn(personas().find(x => (x.dni && x.dni === SES.persona.dni) || x.nombre === SES.persona.nombre) || { ests: [] }, SES.est)) { SES.persona = null; LS.set('ses', SES); }
if (SES && SES.persona) { inicio(); actualizarConfig(true); sincronizar(); miCargar(true); } else if (SES) quienCarga(); else ingreso();
