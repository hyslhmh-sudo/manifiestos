}

async function datLeerHoja() {
  const box = $('dtHoja'); if (!box) return;
  box.innerHTML = '<div class="cargando">Leyendo la hoja…</div>';
  const pedido = { id: DATS.id, hoja: DATS.hoja, q: DATS.q, desde: DATS.desde, orden: DATS.orden, enc: DATS.enc || undefined };
  let D; try { D = await api('p_dat_hoja', pedido, 120000); } catch (e) { box.innerHTML = '<div class="aviso error">No se pudo leer. <button class="link" id="dtRe">Reintentar</button></div>'; $('dtRe').onclick = datLeerHoja; return; }
  if (!$('dtHoja') || pedido.hoja !== DATS.hoja || pedido.id !== DATS.id) return;
  if (!D.ok) { box.innerHTML = '<div class="aviso error">' + esc(D.mensaje || D.error || 'No se pudo leer.') + '</div>'; return; }
  DATD = D; DATS.enc = D.enc;
  const vis = D.cab.map((c, j) => j).slice(0, 7), pag = D.porPagina || 100;
  const celda = (f, j) => { const v = String(f.v[j] == null ? '' : f.v[j]); return '<td' + (f.f && f.f.indexOf(j) >= 0 ? ' title="Fórmula: se calcula sola"' : '') + '>' + esc(v.length > 80 ? v.slice(0, 80) + '…' : v) + '</td>'; };
  box.innerHTML = '<div class="filtros" style="align-items:flex-end;margin-bottom:10px"><label class="f" style="flex:2;min-width:200px">Buscar en la hoja<input class="c" id="dtQ" type="search" value="' + esc(DATS.q) + '" placeholder="Palabras, código, DNI, fecha…"></label>' +
    '<label class="f">Orden<select class="c" id="dtOrd"><option value="nuevas"' + (DATS.orden === 'nuevas' ? ' selected' : '') + '>Últimas filas primero</option><option value="planilla"' + (DATS.orden !== 'nuevas' ? ' selected' : '') + '>Como en la planilla</option></select></label>' +
    '<label class="f" style="width:130px">Encabezados en la fila<input class="c" id="dtEnc" type="number" min="1" value="' + D.enc + '"></label><button class="btn pri" id="dtNueva">+ Agregar fila</button></div>' +
    '<div class="mu peq" style="margin-bottom:6px">' + D.total + ' fila(s)' + (DATS.q ? ' con «' + esc(DATS.q) + '»' : '') + '. Tocá una fila para ver y cambiar todas sus columnas (' + D.cab.length + ').' + (D.total > pag ? ' Se muestran de a ' + pag + '.' : '') + '</div>' +
    (D.filas.length ? '<div style="overflow-x:auto"><table><thead><tr><th>Fila</th>' + vis.map(j => '<th>' + esc(D.cab[j]) + '</th>').join('') + (D.cab.length > vis.length ? '<th>…</th>' : '') + '</tr></thead><tbody>' +
      D.filas.map((f, i) => '<tr class="cl" data-i="' + i + '" style="cursor:pointer"><td class="mu">' + f.fila + '</td>' + vis.map(j => celda(f, j)).join('') + (D.cab.length > vis.length ? '<td class="mu">+' + (D.cab.length - vis.length) + '</td>' : '') + '</tr>').join('') + '</tbody></table></div>' : '<div class="mu peq">Sin filas' + (DATS.q ? ' que coincidan' : '') + '.</div>') +
    (D.total > pag ? '<div class="filtros" style="margin-top:10px;justify-content:center"><button class="btn sec peq" id="dtAnt"' + (D.desde <= 0 ? ' disabled' : '') + '>← Anteriores</button><span class="mu peq">' + (D.desde + 1) + '–' + Math.min(D.desde + pag, D.total) + ' de ' + D.total + '</span><button class="btn sec peq" id="dtSig"' + (D.desde + pag >= D.total ? ' disabled' : '') + '>Siguientes →</button></div>' : '');
  let tq; $('dtQ').oninput = e => { clearTimeout(tq); tq = setTimeout(() => { DATS.q = e.target.value.trim(); DATS.desde = 0; datLeerHoja(); }, 450); };
  $('dtOrd').onchange = e => { DATS.orden = e.target.value; DATS.desde = 0; datLeerHoja(); };
  $('dtEnc').onchange = e => { DATS.enc = Number(e.target.value) || 0; DATS.desde = 0; datLeerHoja(); };
  $('dtNueva').onclick = () => datFila(null);
  if ($('dtAnt')) $('dtAnt').onclick = () => { DATS.desde = Math.max(0, D.desde - pag); datLeerHoja(); };
  if ($('dtSig')) $('dtSig').onclick = () => { DATS.desde = D.desde + pag; datLeerHoja(); };
  box.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => datFila(D.filas[Number(tr.dataset.i)]));
}

// Ver, cambiar, duplicar o eliminar una fila (o agregar una nueva)
function datFila(f) {
  const D = DATD, nueva = !f, fo = f && f.f || [];
  const campo = (c, j) => { const v = nueva ? '' : String(f.v[j] == null ? '' : f.v[j]), ro = fo.indexOf(j) >= 0, op = D.listas && D.listas[j];
    const ctl = ro ? '<input class="c" value="' + esc(v) + '" disabled title="Tiene fórmula: se calcula sola">'
      : op ? '<select class="c" data-j="' + j + '"><option value=""></option>' + op.concat(v && op.indexOf(v) < 0 ? [v] : []).map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
      : v.length > 60 || /\n/.test(v) ? '<textarea class="c" data-j="' + j + '">' + esc(v) + '</textarea>' : '<input class="c" data-j="' + j + '" value="' + esc(v) + '">';
    return '<label class="f' + (v.length > 60 ? ' ancho' : '') + '">' + esc(c) + (ro ? ' <span class="mu peq">(fórmula)</span>' : '') + ctl + '</label>'; };
  $('ov').innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="Fila"><h2>' + (nueva ? 'Agregar fila · ' : 'Fila ' + f.fila + ' · ') + esc(DATS.hoja) + '</h2><div class="aviso error" id="mErr" hidden></div>' +
    '<div class="mu peq" style="margin-bottom:8px">Fechas como dd/mm/aaaa. Lo que dejes igual no se toca. ' + (nueva ? 'Las columnas con fórmula se completan solas.' : 'Cada cambio queda en BASE COMÚN › HISTORIAL.') + '</div>' +
    '<div class="campos">' + D.cab.map(campo).join('') + '</div>' +
    '<div class="acciones"><div style="display:flex;gap:8px;flex-wrap:wrap">' + (nueva ? '' : '<button class="btn sec" id="mDup">Duplicar como fila nueva</button><button class="btn sec" id="mDel" style="color:var(--er)">Eliminar fila</button>') + '</div><div style="display:flex;gap:8px"><button class="btn sec" id="mCan">Cancelar</button><button class="btn pri" id="mOk">' + (nueva ? 'Agregar' : 'Guardar') + '</button></div></div></div>';
  $('ov').hidden = false;
  const cerrar = () => { $('ov').hidden = true; $('ov').innerHTML = ''; };
  const err = m => { $('mErr').textContent = m; $('mErr').hidden = false; };
  const leer = () => { const o = {}; document.querySelectorAll('#ov [data-j]').forEach(el => o[el.dataset.j] = el.value); return o; };
  const ocupado = (b, t) => { b.disabled = true; b.textContent = t; };
  $('mCan').onclick = cerrar;
  $('mOk').onclick = async () => {
    const o = leer(), b = $('mOk');
    if (nueva) { if (!Object.keys(o).some(k => String(o[k]).trim())) return err('Completá al menos un dato.'); ocupado(b, 'Agregando…');
      try { const r = await api('p_dat_agregar', { id: DATS.id, hoja: DATS.hoja, enc: D.enc, valores: o }, 90000); if (!r.ok) { b.disabled = false; b.textContent = 'Agregar'; return err(r.mensaje || 'No se pudo agregar.'); } toast('Agregada en la fila ' + r.fila + '.'); cerrar(); datLeerHoja(); } catch (e) { b.disabled = false; b.textContent = 'Agregar'; } return; }
    const cambios = {}, antes = {}; Object.keys(o).forEach(j => { const v0 = String(f.v[j] == null ? '' : f.v[j]); if (o[j] !== v0) { cambios[j] = o[j]; antes[j] = v0; } });
    if (!Object.keys(cambios).length) return cerrar();
    ocupado(b, 'Guardando…');
    try { const r = await api('p_dat_guardar', { id: DATS.id, hoja: DATS.hoja, enc: D.enc, fila: f.fila, cambios: cambios, antes: antes }, 90000);
      if (!r.ok) { b.disabled = false; b.textContent = 'Guardar'; return err(r.mensaje || 'No se pudo guardar.'); }
      toast('Guardado: ' + r.cambios + ' cambio(s).'); cerrar(); datLeerHoja(); } catch (e) { b.disabled = false; b.textContent = 'Guardar'; }
  };
  if (!nueva) {
    $('mDup').onclick = () => { const o = leer(); cerrar(); datFila(null); Object.keys(o).forEach(j => { const el = document.querySelector('#ov [data-j="' + j + '"]'); if (el) el.value = o[j]; }); };
    $('mDel').onclick = async () => { const b = $('mDel');
      if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = '¿Seguro? Tocá de nuevo para eliminar'; return; }
      ocupado(b, 'Eliminando…');
      try { const r = await api('p_dat_eliminar', { id: DATS.id, hoja: DATS.hoja, enc: D.enc, fila: f.fila, antes: f.v }, 90000);
        if (!r.ok) { b.disabled = false; b.textContent = 'Eliminar fila'; delete b.dataset.ok; return err(r.mensaje || 'No se pudo eliminar.'); }
        toast('Fila eliminada. Queda en la papelera por si hay que restaurarla.'); cerrar(); datLeerHoja(); } catch (e) { b.disabled = false; b.textContent = 'Eliminar fila'; } };
  }
}

async function datPapelera() {
  cargando('#datos', 'Leyendo la papelera…');
  let P; try { P = await api('p_dat_papelera', {}, 90000); } catch (e) { return; }
  marco('#datos', datCab('<button class="btn sec" id="dtVol">← Volver a los libros</button><button class="btn sec" id="dtHis">Historial de cambios</button>') +
    '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Papelera (' + (P.lista || []).length + ')</h2><span class="mu peq">Filas eliminadas desde esta pantalla. «Restaurar» la vuelve a poner al final de su hoja. También están en BASE COMÚN › PAPELERA.</span></div>' +
    ((P.lista || []).length ? '<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Libro › hoja</th><th>Fila</th><th>Datos</th><th>Estado</th><th></th></tr></thead><tbody>' + P.lista.map(r => '<tr><td>' + esc(r.fecha) + '</td><td><b>' + esc(r.libro) + '</b><div class="mu peq">' + esc(r.hoja) + '</div></td><td>' + esc(r.fila) + '</td><td class="peq">' + esc((r.valores || []).filter(v => v !== '' && v != null).slice(0, 6).join(' · ').slice(0, 200)) + '</td><td class="peq">' + esc(r.estado) + '</td><td>' + (r.estado === 'Eliminada' ? '<button class="btn sec peq" data-res="' + r.n + '">Restaurar</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="mu peq" style="padding:14px 18px">La papelera está vacía.</div>') + '</section>');
  $('dtVol').onclick = () => location.hash = '#datos' + (DATS.id ? '/' + encodeURIComponent(DATS.id) + (DATS.hoja ? '/' + encodeURIComponent(DATS.hoja) : '') : '');
  $('dtHis').onclick = () => location.hash = '#datos/historial';
  document.querySelectorAll('[data-res]').forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Restaurando…';
    try { const r = await api('p_dat_restaurar', { n: Number(b.dataset.res) }, 90000); if (!r.ok) { toast(r.mensaje || 'No se pudo restaurar.'); b.disabled = false; b.textContent = 'Restaurar'; return; } toast('Restaurada en ' + r.libro + ' › ' + r.hoja + ', fila ' + r.fila + '.'); datPapelera(); } catch (e) { b.disabled = false; b.textContent = 'Restaurar'; } });
}

async function datHistorial(q) {
  cargando('#datos', 'Leyendo el historial…');
  let H; try { H = await api('p_dat_historial', { q: q || '' }, 90000); } catch (e) { return; }
  marco('#datos', datCab('<button class="btn sec" id="dtVol">← Volver a los libros</button><button class="btn sec" id="dtPap">Papelera</button>') +
    '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Historial de cambios</h2><span class="mu peq">Los últimos cambios hechos desde el portal (esta pantalla y las de cada módulo). Completo en BASE COMÚN › HISTORIAL.</span>' +
    '<div class="filtros" style="margin-top:8px"><input class="c" id="dtHq" type="search" placeholder="Buscar (hoja, código, campo, valor…)" value="' + esc(q || '') + '"><button class="btn sec" id="dtHok">Buscar</button></div></div>' +
    ((H.lista || []).length ? '<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Hoja</th><th>Fila o código</th><th>Campo</th><th>Antes</th><th>Después</th><th>Origen</th></tr></thead><tbody>' + H.lista.map(r => '<tr>' + r.map((c, i) => '<td' + (i >= 4 && i <= 5 ? ' class="peq"' : '') + '>' + esc(String(c).slice(0, 160)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' : '<div class="mu peq" style="padding:14px 18px">Sin cambios registrados' + (q ? ' con esa búsqueda' : '') + '.</div>') + '</section>');
  $('dtVol').onclick = () => location.hash = '#datos' + (DATS.id ? '/' + encodeURIComponent(DATS.id) + (DATS.hoja ? '/' + encodeURIComponent(DATS.hoja) : '') : '');
  $('dtPap').onclick = () => location.hash = '#datos/papelera';
  $('dtHok').onclick = () => datHistorial($('dtHq').value.trim()); $('dtHq').onkeydown = e => { if (e.key === 'Enter') datHistorial($('dtHq').value.trim()); };
}

// Configuración del sistema: propiedades del script (IDs de libros y carpetas, PRECALENTAR_EST, DATOS_LIBROS_EXTRA…)
async function datConfig() {
  cargando('#datos', 'Leyendo la configuración…');
  let C; try { C = await api('p_dat_props', {}, 60000); } catch (e) { return; }
  if (!C.ok) return marco('#datos', datCab() + '<div class="aviso error">' + esc(C.mensaje || C.error || 'No se pudo leer.') + '</div>');
  marco('#datos', datCab('<button class="btn sec" id="dtVol">← Volver a los libros</button><button class="btn pri" id="cfNueva">+ Agregar valor</button>') +
    '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Configuración del sistema</h2><span class="mu peq">Propiedades del script «Sistema HyS» (también en el editor: Configuración del proyecto › Propiedades del script). Son los ID de los libros y carpetas de cada módulo y algunos ajustes, como PRECALENTAR_EST (establecimientos que se dejan calculados a las 7 y 13 h) o DATOS_LIBROS_EXTRA (planillas que aparecen en Datos). Cambiar un ID hace que el sistema use otro libro: hacelo solo si sabés cuál es el nuevo. Cada cambio queda en el historial.</span></div>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Nombre</th><th>Valor</th><th></th></tr></thead><tbody>' + C.props.map(p => '<tr><td><b>' + esc(p.k) + '</b></td><td class="peq" style="word-break:break-all">' + (p.oculta ? '<span class="mu">(oculto)</span>' : esc(p.v)) + '</td><td style="white-space:nowrap"><button class="btn sec peq" data-cf="' + esc(p.k) + '">Cambiar</button></td></tr>').join('') + '</tbody></table></div></section>');
  $('dtVol').onclick = () => location.hash = '#datos';
  const editar = p => { const m = modal(p ? 'Cambiar ' + p.k : 'Agregar valor', (p ? [] : [['K', 'Nombre (MAYÚSCULAS_Y_GUIONES)']]).concat([['V', 'Valor', null, 1]]), { K: '', V: p && !p.oculta ? p.v : '' }, async o => {
      const r = await api('p_dat_prop', { k: p ? p.k : o.K, v: o.V }, 60000); if (!r.ok) return r.mensaje || 'No se pudo guardar.'; toast('Guardado.'); datConfig(); return ''; });
    if (p) { const b = document.createElement('button'); b.className = 'btn sec'; b.style.color = 'var(--er)'; b.textContent = 'Borrar'; b.onclick = async () => { if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = '¿Seguro? Tocá de nuevo'; return; } const r = await api('p_dat_prop', { k: p.k, borrar: true }, 60000); if (!r.ok) return toast(r.mensaje || 'No se pudo borrar.'); m.cerrar(); toast('Borrado.'); datConfig(); }; m.extra.appendChild(b); } };
  $('cfNueva').onclick = () => editar(null);
  document.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => editar(C.props.find(p => p.k === b.dataset.cf)));
}
</script>
<script>
// Portal HyS · 11 · Gestión (fase 3 · 14.64 · 14/10/2026) · servidor: Gestion.gs (acciones p_ges_…)
// Plan de acción único, hallazgos, bandeja de sugeridos, necesidades de inversión y alcance (niveles A y B).
// Los datos viven en la BASE COMÚN (GES_ALCANCE, GES_EMPRESAS, GES_HALLAZGOS, GES_ACCIONES).
// Se carga desde portal.html (<script src>). Para el portal de respaldo, herramientas/armar_respaldo.py lo junta en un solo archivo.
let GESD = null, GESA = null;
const GESF = { cod: '', mod: '', estado: 'abiertas', resp: '', rec: '', q: '', por: 'modulo' };
const GESHF = { cod: '', mod: '', estado: '', origen: '', q: '' };
const gesNom = c => ((GESD && GESD.establecimientos.find(e => e.cod === c)) || {}).nombre || c;
const gesMod = m => String(m || '').replace(/^(\d+) · /, '$1 · ');
const gesCab = (t, s, extra) => '<div class="cab"><div><span class="mu peq">11 · Gestión</span><h1>' + t + '</h1><span class="mu peq">' + s + '</span></div><div class="filtros">' + (extra || '') + '</div></div>';
const gesTabs = act => '<div class="filtros" style="flex-wrap:wrap;gap:6px;margin:0 0 12px">' + [['plan', 'Plan de acción único'], ['hallazgos', 'Hallazgos'], ['bandeja', 'Bandeja de sugeridos'], ['inversion', 'Necesidades de inversión'], ['reglas', 'Reglas'], ['alcance', 'Alcance']]
  .map(([k, t]) => '<a class="btn ' + (k === act ? 'pri' : 'sec') + ' peq" href="#ges/' + k + '">' + t + (k === 'bandeja' && GESD ? ' · ' + GESD.hallazgos.filter(h => h.ESTADO === 'Sugerido').length : '') + '</a>').join('') + '</div>';
const gesKpi = (t, v, s, col) => '<div class="kpi2"><span>' + t + '</span><b' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</b><small>' + s + '</small></div>';
const gesOpt = (v, t, sel) => '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>';
function gesTag(a) {
  if (a.vencida) return '<span class="tag er">Vencida</span>';
  if (a.sinRespuesta) return '<span class="tag wa">Elevada sin respuesta</span>';
  const c = { 'Propuesta': 'gr', 'Elevada': 'av', 'Aprobada': 'av', 'No aprobada': 'wa', 'En curso': 'av', 'Hecha': 'wa', 'Eficaz': 'ok', 'No se realiza': 'gr', 'Pendiente de recursos': 'wa' }[a.ESTADO] || 'gr';
  return '<span class="tag ' + c + '">' + esc(a.ESTADO === 'Hecha' ? 'Hecha · a verificar' : a.ESTADO || 'Propuesta') + '</span>';
}

async function gestion(fresco) {
  const sub = (location.hash.split('/')[1] || 'plan');
  if (sub === 'alcance') return gesAlcance(fresco);
  if (sub === 'reglas') return gesReglas(fresco);
  if (!GESD || fresco) { cargando('#ges', 'Leyendo el plan de acción único…'); try { GESD = await api('p_ges_datos', {}, 180000); } catch (e) { return; } }
  if (!GESD.ok) return marco('#ges', gesCab('Gestión', '') + '<div class="aviso error">' + esc(GESD.mensaje || GESD.error || 'No se pudo leer.') + (/instalar|desconocida/i.test(GESD.mensaje || GESD.error || '') ? ' Falta instalar Gestion.gs en el Sistema HyS.' : '') + '</div>');
  if (sub === 'hallazgos') return gesHallazgos();
  if (sub === 'bandeja') return gesBandeja();
  if (sub === 'inversion') return gesInversion();
  return gesPlan();
}
async function gesTraer() {
  cargando('#ges', 'Trayendo de los módulos (plan de residuos, infraestructura, agua y plagas)…');
  let r; try { r = await api('p_ges_traer', { fresco: true }, 300000); } catch (e) { return; }
  if (!r.ok) { toast(r.mensaje || 'No se pudo traer.'); return gestion(true); }
  toast('Nuevos: ' + r.hallazgos + ' hallazgo(s) y ' + r.acciones + ' acción(es)' + (r.sugeridos ? ' · ' + r.sugeridos + ' a la bandeja' : '') + (r.cerradas ? ' · ' + r.cerradas + ' cerrada(s) en su módulo' : '') + (r.errores && r.errores.length ? ' · ⚠ ' + r.errores.join(' · ') : ''));
  gestion(true);
}

// ------------------------------------------------------------------ Plan de acción único
function gesPlan() {
  const F = GESF, A = GESD.acciones, q = F.q.toLowerCase(), H = {}; GESD.hallazgos.forEach(h => H[h.ID] = h);
  const pasa = a => (!F.cod || a.ESTABLECIMIENTO === F.cod) && (!F.mod || a.MODULO === F.mod) && (!F.resp || a.RESPONSABLE === F.resp) && (!F.rec || (a.TIPO_RECURSO || 'Sin definir') === F.rec) &&
    (F.estado === 'todas' || (F.estado === 'abiertas' && a.abierta) || (F.estado === 'vencidas' && a.vencida) || (F.estado === 'verificar' && a.verificar) || (F.estado === 'elevadas' && a.ESTADO === 'Elevada') ||
     (F.estado === 'recursos' && a.ESTADO === 'Pendiente de recursos') || (F.estado === 'cerradas' && !a.abierta) || F.estado === a.ESTADO) &&
    (!q || (a.ID + ' ' + a.ACCION + ' ' + a.SITIO + ' ' + a.RESPONSABLE + ' ' + ((H[a.HALLAZGO] || {}).DESCRIPCION || '')).toLowerCase().indexOf(q) >= 0);
  const vis = A.filter(pasa).sort((a, b) => (b.vencida - a.vencida) || String(a.FECHA_LIMITE || '9999').localeCompare(String(b.FECHA_LIMITE || '9999')));
  const ab = A.filter(a => a.abierta), venc = A.filter(a => a.vencida).length, sinR = A.filter(a => a.sinRespuesta).length, ver = A.filter(a => a.verificar).length, rec = A.filter(a => a.ESTADO === 'Pendiente de recursos').length;
  const ext = a => a.vencida ? '#B4361F' : '';
  const cods = Array.from(new Set(A.map(a => a.ESTABLECIMIENTO))).sort();
  const clave = a => F.por === 'establecimiento' ? gesNom(a.ESTABLECIMIENTO) : F.por === 'responsable' ? (a.RESPONSABLE || 'Sin responsable asignado') : F.por === 'modulo' ? a.MODULO : '';
  const grupos = {}; vis.forEach(a => (grupos[clave(a)] = grupos[clave(a)] || []).push(a));
  const orden = Object.keys(grupos).sort((a, b) => F.por === 'modulo' ? (parseInt(a) || 99) - (parseInt(b) || 99) : a.localeCompare(b));
  const fila = a => { const h = H[a.HALLAZGO] || {};
    return '<tr class="cl" data-ac="' + esc(a.ID) + '"><td>' + gesTag(a) + '<div class="mu peq">' + esc(a.ID) + '</div></td><td><b>' + esc(a.ESTABLECIMIENTO) + '</b></td><td class="peq">' + esc(a.MODULO) + '</td><td>' + esc(a.ACCION) +
      (h.DESCRIPCION && h.DESCRIPCION !== a.ACCION ? '<div class="mu peq">Hallazgo: ' + esc(h.DESCRIPCION) + '</div>' : '') + (a.SITIO ? '<div class="mu peq">' + esc(a.SITIO) + '</div>' : '') + '</td><td class="peq">' + esc(a.RESPONSABLE || '—') + '</td><td class="peq"' + (ext(a) ? ' style="color:' + ext(a) + ';font-weight:700"' : '') + '>' + fechaTxt(a.FECHA_LIMITE) + '</td><td class="peq">' + esc(a.TIPO_RECURSO || '—') + (a.REQUIERE_DIRECCION === 'Sí' ? '<div class="mu">Dirección</div>' : '') + '</td></tr>'; };
  const tabla = orden.length ? orden.map(g => (F.por !== 'ninguno' ? '<tr><td colspan="7" style="background:#EEF2F4;font-weight:800;color:var(--az)">' + esc(g) + ' · ' + grupos[g].length + '</td></tr>' : '') + grupos[g].map(fila).join('')).join('')
    : '<tr><td colspan="7" class="mu">No hay acciones con estos filtros.' + (A.length ? '' : ' Tocá «Traer de los módulos» para pasar los planes que ya existen.') + '</td></tr>';
  marco('#ges', gesCab('Plan de acción único', 'Todas las acciones de los 10 módulos, con responsable, plazo, si requiere Dirección, avance, evidencia y verificación de eficacia.', '<button class="btn sec" id="gTraer">Traer de los módulos</button><button class="btn sec" id="gElevar">Elevar a la Dirección</button><button class="btn pri" id="gNueva">+ Nueva acción</button>') + gesTabs('plan') +
    '<div class="tb5" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">' + gesKpi('Abiertas', ab.length, 'en curso o por empezar') + gesKpi('Vencidas', venc, 'gestión e insumos; sin inversión', venc ? '#B4361F' : '') +
      gesKpi('Elevadas sin respuesta', sinR, 'más de 60 días', sinR ? '#8A5200' : '') + gesKpi('A verificar', ver, 'hechas: falta ver si fueron eficaces') + gesKpi('Pendientes de recursos', rec, 'riesgo informado; no cuentan contra HyS') + '</div>' +
    '<div class="filtros" style="margin:12px 0;flex-wrap:wrap">' +
      '<label class="f">Establecimiento<select class="c" id="gE">' + gesOpt('', 'Todos', F.cod) + cods.map(c => gesOpt(c, gesNom(c), F.cod)).join('') + '</select></label>' +
      '<label class="f">Módulo<select class="c" id="gM">' + gesOpt('', 'Todos', F.mod) + GESD.listas.modulos.map(m => gesOpt(m, m, F.mod)).join('') + '</select></label>' +
      '<label class="f">Mostrar<select class="c" id="gS">' + [['abiertas', 'Abiertas'], ['vencidas', 'Vencidas'], ['verificar', 'A verificar eficacia'], ['elevadas', 'Elevadas a la Dirección'], ['recursos', 'Pendientes de recursos'], ['cerradas', 'Cerradas'], ['todas', 'Todas']].map(o => gesOpt(o[0], o[1], F.estado)).join('') + '</select></label>' +
      '<label class="f">Responsable<select class="c" id="gR">' + gesOpt('', 'Todos', F.resp) + GESD.responsables.map(r => gesOpt(r, r, F.resp)).join('') + '</select></label>' +
      '<label class="f">Recurso<select class="c" id="gT">' + gesOpt('', 'Todos', F.rec) + GESD.listas.recursos.concat(['Sin definir']).map(r => gesOpt(r, r, F.rec)).join('') + '</select></label>' +
      '<label class="f">Ver por<select class="c" id="gP">' + [['modulo', 'Módulo'], ['establecimiento', 'Establecimiento'], ['responsable', 'Responsable'], ['ninguno', 'Lista simple']].map(o => gesOpt(o[0], o[1], F.por)).join('') + '</select></label>' +
      '<label class="f">Buscar<input class="c" id="gQ" value="' + esc(F.q) + '" placeholder="Palabra, sector o código"></label></div>' +
    '<section class="card tabla"><table><thead><tr><th>Estado</th><th>Establ.</th><th>Módulo</th><th>Acción</th><th>Responsable</th><th>Fecha límite</th><th>Recurso</th></tr></thead><tbody>' + tabla + '</tbody></table></section>' +
    '<p class="mu peq">' + vis.length + ' de ' + A.length + ' acciones. Datos en BASE COMÚN › GES_ACCIONES (también se editan desde «Datos · editar todo»). Lo nuevo de los módulos entra solo cada mañana; al cerrar una acción, se marca también en su plan de origen.</p>');
  const re = () => gesPlan();
  $('gE').onchange = e => { F.cod = e.target.value; re(); }; $('gM').onchange = e => { F.mod = e.target.value; re(); }; $('gS').onchange = e => { F.estado = e.target.value; re(); };
  $('gR').onchange = e => { F.resp = e.target.value; re(); }; $('gT').onchange = e => { F.rec = e.target.value; re(); }; $('gP').onchange = e => { F.por = e.target.value; re(); }; $('gQ').onchange = e => { F.q = e.target.value.trim(); re(); };
  $('gTraer').onclick = gesTraer; $('gNueva').onclick = () => gesNuevaAccion(); $('gElevar').onclick = () => gesElevar();
  document.querySelectorAll('[data-ac]').forEach(tr => tr.onclick = () => gesAccion(tr.dataset.ac));
}

function gesAccion(id) {
  const a = GESD.acciones.find(x => x.ID === id); if (!a) return;

    '<p class="mu peq">Valor al precio del contrato: dm³ de Y1 + Y3 de los manifiestos cargados (Impeesa factura ambas corrientes) × precio por dm³ del grupo (cláusula TERCERA). «Meses sobre la referencia»: meses cerrados en que ese establecimiento solo superó la cantidad que la cláusula TERCERA asigna a todo su grupo. El cupo es el total del contrato (cláusula SEGUNDA) y el excedente se factura solo si la suma de todos los grupos lo supera en el mes (cláusula SÉPTIMA); no se reparte por establecimiento. La factura se controla con la Planilla de Control de Residuos (Anexo I). Los precios y cupos se cambian en el libro general, hoja CONTRATO_GRUPOS.</p>');

<script>

async function resInforme(fresco) {

    else { cargando('#resinf', 'Leyendo establecimientos y sitios…'); try { const r = await api('p_res_inf_opciones', {}, 120000); if (!r.ok) throw new Error(r.mensaje || 'No se pudo leer.'); RINFO = r; LS.set('rinfOp', r); } catch (e) { return marco('#resinf', '<div class="aviso error">' + esc(e.message) + '</div>'); } }
  }

  const anios = []; for (let y = d.getFullYear(); y >= d.getFullYear() - 3; y--) anios.push(String(y));

  const estHTML = e => { const n = e.sitios.filter(s => sel.has(clave(e, s))).length;
    return '<details class="rinfE"' + (n ? ' open' : '') + '><summary style="cursor:pointer;padding:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>' + esc(e.nombre) + '</b><span class="mu peq">' + esc(e.cod) + ' · ' + e.sitios.length + ' sitio(s)' + (n ? ' · <b style="color:var(--az)">' + n + ' elegido(s)</b>' : '') + '</span>' +
      '<span style="margin-left:auto;display:flex;gap:4px;flex-wrap:wrap">' + [['todos', 'Todos'], ['caps', 'Solo CAPS'], ['sincaps', 'Sin CAPS'], ['ninguno', 'Ninguno']].map(b => '<button class="btn sec peq rinfB" data-cod="' + esc(e.cod) + '" data-q="' + b[0] + '" style="padding:3px 8px">' + b[1] + '</button>').join('') + '</span></summary>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;padding:0 0 10px 6px">' + e.sitios.map(s => '<label style="display:flex;gap:6px;align-items:flex-start;font-size:13.5px"><input type="checkbox" class="rinfS" value="' + esc(clave(e, s)) + '"' + (sel.has(clave(e, s)) ? ' checked' : '') + '><span>' + esc(s.sitio) + '<span class="mu peq"> · ' + esc(s.tipo || 's/d') + (s.ultimo ? ' · último ' + fechaTxt(s.ultimo) : ' · sin manifiestos') + '</span></span></label>').join('') + '</div></details>'; };
  const per = rinfPeriodo();
  marco('#resinf', '<div class="cab"><div><span class="mu peq"><a class="link" href="#res">1 · Residuos</a></span><h1>Informe de retiros</h1><span class="mu peq">Informe de frecuencia de retiro para Jefatura de Área Externa / CAPS, STyC, Direcciones o la Secretaría de Salud: elegí el período, el destinatario y los establecimientos o sitios. Muestra, por sitio, la frecuencia pactada y la real, con las fechas exactas de cada retiro y los números de manifiesto.</span></div>' +
    '<div class="filtros"><button class="btn sec" id="riAct">Actualizar sitios</button></div></div>' +
    '<section class="card"><h2>1. Período</h2><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:end">' +

      '<label class="f">Destinatario<input class="c" id="riDe" list="riDeL" value="' + esc(F.dest) + '" placeholder="Elegí o escribí" style="min-width:260px"><datalist id="riDeL">' + O.destinos.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist></label>' +
      '<label class="f">Nombre y cargo (opcional)<input class="c" id="riCa" value="' + esc(F.cargo) + '" placeholder="Ej.: Sr. Fernando Funes, Jefe de Área Externa" style="min-width:300px"></label></div></section>' +
    '<section class="card"><h2>3. Establecimientos y sitios</h2><div style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px">' +
      '<button class="btn sec rinfG" data-g="tw">Red Trelew completa (HZT + HMH con todos sus sitios)</button><button class="btn sec rinfG" data-g="twcaps">Todos los CAPS de la red Trelew</button>' +
      '<button class="btn sec rinfG" data-g="caps">Todos los CAPS (todos los establecimientos)</button><button class="btn sec rinfG" data-g="nada">Limpiar</button>' +
      '<span class="mu peq" style="align-self:center">' + sel.size + ' sitio(s) elegido(s)</span></div>' +
      conD.map(estHTML).join('') +
      (sinD.length ? '<details style="margin-top:8px"><summary class="mu" style="cursor:pointer">Otros establecimientos con sitios cargados pero sin manifiestos (' + sinD.length + ')</summary>' + sinD.map(estHTML).join('') + '</details>' : '') + '</section>' +
    '<section class="card"><h2>4. Generar</h2><label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="riDet"' + (F.detalle ? ' checked' : '') + '> Incluir el anexo con el detalle de cada retiro (fecha, día, N.º de manifiesto, volumen y días desde el anterior)</label>' +

      '<p class="mu peq" style="margin:8px 0 0">El informe sale como borrador (versión 0), con número en el registro de documentos, en la carpeta «Informes» del establecimiento (o «Informes de la red» si elegís más de uno). Con HZT/HMH usa la paleta azul y el logo HZT/HMH; con otros establecimientos, los colores de la Secretaría de Salud.</p>' +

  const set = (k, v) => { RINFF[k] = v; rinfGuardar(); };

      if (r.generado) { const u = LS.get('rinfUlt', []); u.unshift({ codigo: r.codigo, doc: r.doc, pdf: r.pdf, carpeta: r.carpeta, fecha: new Date().toISOString(), periodo: fechaTxt(r.desde) + ' al ' + fechaTxt(r.hastaPedido || r.hasta), notas: r.notasAlPie }); LS.set('rinfUlt', u.slice(0, 10)); }

// Informes generados desde este navegador (los últimos 10), con botones para abrirlos; también están en el registro de documentos

function rinfVista(R) {
  const T = R.totales, varios = R.establecimientos.length > 1, nm = s => (varios && s.nombre !== s.sitio ? esc(s.nombre) + ' · ' : '') + '<b>' + esc(s.sitio) + '</b>';
  const kpi = (t, v, s, col) => '<div class="kpi2"><span>' + t + '</span><b' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</b><small>' + s + '</small></div>';
  const F = []; R.sitios.forEach(s => s.fuera.forEach(f => F.push({ s: s, f: f })));
  $('riPrev').innerHTML = '<section class="card"><h2>Vista previa · del ' + fechaTxt(R.desde) + ' al ' + fechaTxt(R.hasta) + '</h2><div class="tb5">' +
      kpi('Retiros', T.retiros, T.manifiestos + ' manifiestos · ' + T.conRetiros + ' de ' + T.sitios + ' sitios') + kpi('Esperados', T.esperados || 's/d', 'según la frecuencia pactada') +
      kpi('Cumplimiento', T.cumplimiento == null ? 's/d' : T.cumplimiento + ' %', 'sitios con frecuencia definida', T.cumplimiento != null && T.cumplimiento < 80 ? 'var(--er)' : '') +
      kpi('Intervalos fuera de término', T.intervalosFuera, 'más días entre retiros que lo admisible', T.intervalosFuera ? 'var(--er)' : '') + kpi('Sitios bajo el 80 %', T.sitiosBajo, 'o sin retiros', T.sitiosBajo ? 'var(--wa)' : '') + '</div></section>' +
    '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Retiros por sitio</h2></div><div style="overflow-x:auto"><table><thead><tr><th>Sitio</th><th>Frecuencia pactada</th><th>Esperados</th><th>Realizados</th><th>Cumplimiento</th><th>Intervalo prom. / máx.</th><th>Último retiro</th></tr></thead><tbody>' +
      R.sitios.map(s => '<tr><td>' + nm(s) + '<div class="mu peq">' + esc(s.tipo) + '</div></td><td>' + esc(s.frecuencia) + '<div class="mu peq">' + esc(s.origen) + ' · admisible ' + s.limite + ' días</div></td><td>' + (s.esperados == null ? 's/d' : rcNum(s.esperados)) + '</td><td>' + s.retiros + '<div class="mu peq">' + s.manifiestos + ' manifiesto(s)</div></td><td>' + rcChipPct(s.cumplimiento) + '</td><td>' + (s.intervaloProm == null ? '—' : rcNum(s.intervaloProm) + ' / ' + s.intervaloMax + ' días') + '</td><td>' + (s.ultimo ? fechaTxt(s.ultimo) : s.noAplica ? '<span class="chip gr mini">No corresponde</span>' : '<span class="chip er mini">Sin retiros</span>') + '</td></tr>').join('') +
      '</tbody></table></div></section>' +
    '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Intervalos mayores que el admisible</h2></div>' + (F.length ? '<div style="overflow-x:auto"><table><thead><tr><th>Sitio</th><th>Retiro anterior</th><th>Retiro siguiente</th><th>Días</th><th>Admisible</th></tr></thead><tbody>' +
      F.map(x => '<tr><td>' + nm(x.s) + '</td><td>' + fechaTxt(x.f.desde) + (x.f.nrosDesde.length ? '<div class="mu peq">N.º ' + esc(x.f.nrosDesde.join(', ')) + '</div>' : '') + '</td><td>' + (x.f.abierto ? 'Sin retiro hasta el ' + fechaTxt(R.hasta) : fechaTxt(x.f.hasta) + (x.f.nrosHasta.length ? '<div class="mu peq">N.º ' + esc(x.f.nrosHasta.join(', ')) + '</div>' : '')) + '</td><td><b style="color:var(--er)">' + x.f.dias + '</b></td><td>' + x.s.limite + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="mu" style="padding:12px 18px;margin:0">No hay intervalos mayores que el admisible.</p>') + '</section>' +
    '<section class="card"><h2>Detalle de retiros (fechas y N.º de manifiesto)</h2>' + R.sitios.map(s => '<details><summary style="cursor:pointer;padding:6px 0">' + nm(s) + ' <span class="mu peq">· ' + s.retiros + ' retiro(s)</span></summary>' +
      (s.detalle.length ? '<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>N.º de manifiesto</th><th>Y1 (dm³)</th><th>Y3 (dm³)</th><th>Días desde el anterior</th></tr></thead><tbody>' + s.detalle.map(d => '<tr' + (d.excede ? ' style="color:var(--er);font-weight:700"' : '') + '><td>' + fechaTxt(d.fecha) + '</td><td>' + esc(d.nros.join(', ') || 's/d') + '</td><td>' + (d.y1 ? rcNum(d.y1) : '—') + '</td><td>' + (d.y3 ? rcNum(d.y3) : '—') + '</td><td>' + (d.desdeAnt == null ? '—' : d.desdeAnt) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="mu peq">Sin retiros cargados en el período.</p>') + '</details>').join('') + '</section>';
}
</script>
<script>
// Cada cambio de pantalla deja anotada la anterior (ver NAV en marco)
function router() {
  NAV.dejadas.add(NAV.act || NAV.ruta);
  NAV.ruta = '#' + (location.hash.replace(/^#/, '').split('/')[0] || 'inicio'); NAV.dejadas.delete(NAV.ruta);
  NAV.act = null; NAV.sync = true;
  try { return routerPantalla(); } finally { NAV.sync = false; }
}
function routerPantalla() {
  if (!CLAVE) return ingreso();
  const [ruta, arg] = location.hash.replace(/^#/, '').split('/');
  const a = arg ? decodeURIComponent(arg) : '';
  if (ruta === 'est') return matriz();
  if (ruta === 'agua') return agua('agua');
  if (ruta === 'plagas') return agua('plagas');
  if (ruta === 'aguadiag') return dgmRuta('agua', a);
  if (ruta === 'plgdiag') return dgmRuta('plagas', a);
  if (ruta === 'sin') return sinPortal(a);
  if (ruta === 'inv') return invForm(a);
  if (ruta === 'sinest') return sinEst();
  if (ruta === 'buscar') return buscar(a);
  if (ruta === 'bib') return biblioteca();
  if (ruta === 'cap') return capTablero();
  if (ruta === 'capcat') return capCatalogo();
  if (ruta === 'capficha') return capFichaVer(a);
  if (ruta === 'capalta') return capAlta();
  if (ruta === 'capdic') return capDictados();
  if (ruta === 'capdicnuevo') return capDictadoNuevo(a);
  if (ruta === 'capins') return capInscriptos(a);
  if (ruta === 'capfir') return capFirmantes();
  if (ruta === 'capval') return capValidar(true);
  if (ruta === 'capag') return capAgenda(a);
  if (ruta === 'capcump') return capCumplimiento();
  if (ruta === 'capserv') return capServicio(a);
  if (ruta === 'capjef') return capJefaturas();
  if (ruta === 'capmat') return capMatriz();
  if (ruta === 'capper') return a ? capPersona(decodeURIComponent(a)) : capPersonas();
  if (ruta === 'capcont') return capContactos();
  if (ruta === 'capinf') return capInformes();
  if (ruta === 'capcorreo') return capCorreos();
  if (ruta === 'acciones') return acciones();
  if (ruta === 'accesos') return accesosPantalla();
  if (ruta === 'datos') return datos();
  if (ruta === 'ges') return gestion();
  if (ruta === 'm8') return m8Tablero();
  if (ruta === 'rgrl') return rgrlLista(a);
  if (ruta === 'medic') return medicionesPantalla();
  if (ruta === 'm8rel') return m8Relev(a);
  if (ruta === 'm8plan') return m8Plan();
  if (ruta === 'm8serv') return m8Servicios();
  if (ruta === 'm8libros') return m8Libros();
  if (ruta === 'inc') return incTablero();
  if (ruta === 'incest') return incEst(location.hash.replace(/^#incest\/?/, ''));
  if (ruta === 'incnov') return incNovPortal();
  if (ruta === 'rad') return radTablero();
  if (ruta === 'radest') return radEst(location.hash.replace(/^#radest\/?/, ''));
  if (ruta === 'ayuda') return ayuda();
  if (ruta === 'ficha') return ficha(a);
  if (ruta === 'trab') return trabajadores(a || TRAB.cod || '');
  if (ruta === 'importar') return importar();
  if (ruta === 'res') return a ? resEst(a) : resTablero();
  if (ruta === 'resfrec') return resFrec();
  if (ruta === 'resinf') return resInforme();
  if (ruta === 'rescosto') return resCostos();
  if (ruta === 'diag') { DCFG = DCFG_RES; return a ? diagForm(a) : diagLista(); }
  if (ruta === 'coc') return cocTablero();
  if (ruta === 'cocper') return cocPersonas(a);
  if (ruta === 'cocdiag') return a ? cocForm(a) : cocLista();
  if (ruta === 'tablero') return tablero(a);
  if (ruta === 'docs') return documentos(a);
  if (ruta === 'notas') return notas(a);
  if (ruta === 'docest') return docEst(a);
  if (ruta === 'modelos') return modelos();
  if (ruta === 'nte') return nte(a);
  if (ruta === 'bandeja') return bandeja();
  if (ruta === 'plan') return a ? planDetalle(decodeURIComponent(a)) : planLista();
  if (ruta === 'aud') return a === 'nueva' ? audNueva() : a ? audEjecutar(decodeURIComponent(a)) : audLista();
  if (ruta === 'audr') return audResultado(decodeURIComponent(a));
  return inicio();
}
window.addEventListener('hashchange', router);
// Siempre abre en el Tablero, con los módulos del menú cerrados (aunque la dirección guardada o el marcador apunte a otra pantalla)
try { sessionStorage.removeItem('navAb'); sessionStorage.removeItem('portalAbierto'); if (location.hash !== '#inicio') history.replaceState(null, '', '#inicio'); } catch (e) {}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) { $('ov').hidden = true; $('ov').innerHTML = ''; } });
router();
</script>
