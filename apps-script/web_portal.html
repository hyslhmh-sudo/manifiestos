    '<div style="display:flex;gap:12px;align-items:center"><span class="icoSel" id="' + id + 'P"><span class="ms" aria-hidden="true">' + esc(actual) + '</span></span><div><b id="' + id + 'N">' + esc(actual) + '</b><div class="mu peq">Tocá uno de la galería, buscá por tema (fuego, químico, residuos, ergonomía…) o escribí el nombre de cualquier ícono de Material Symbols.</div></div></div>' +
    '<input class="c" id="' + id + 'Q" placeholder="Buscar: fuego, químico, agua… o escribir un nombre"><div class="icoGrid" id="' + id + 'G"></div><input type="hidden" data-k="ICONO" id="' + id + '" value="' + esc(actual) + '"></div>';
}
function capPickerActivar(id, alCambiar) {
  const pintar = () => {
    const q = capNorm($(id + 'Q').value.trim()), act = $(id).value;
    let l = capIconos();
    if (q) { const t = Object.keys(CAP_ICO_TAGS).filter(k => q.indexOf(k) >= 0 || k.indexOf(q) >= 0).map(k => CAP_ICO_TAGS[k]).join(' ').split(' ').filter(Boolean); l = l.filter(n => n.indexOf(q.replace(/\s+/g, '_')) >= 0 || t.indexOf(n) >= 0); }
    const libre = q && !l.length && /^[a-z0-9_]+$/.test(q.replace(/\s+/g, '_')) ? q.replace(/\s+/g, '_') : '';   // nombre escrito a mano: se muestra para ver si existe
    $(id + 'G').innerHTML = (libre ? '<button type="button" class="icoT' + (libre === act ? ' on' : '') + '" data-n="' + esc(libre) + '"><span class="ms" aria-hidden="true">' + esc(libre) + '</span>usar «' + esc(libre) + '»</button>' : '') +
      l.map(n => '<button type="button" class="icoT' + (n === act ? ' on' : '') + '" data-n="' + esc(n) + '" title="' + esc(n) + '"><span class="ms" aria-hidden="true">' + esc(n) + '</span>' + esc(n) + '</button>').join('') || '<span class="mu peq">Nada con ese nombre.</span>';
    $(id + 'G').querySelectorAll('[data-n]').forEach(b => b.onclick = () => { $(id).value = b.dataset.n; $(id + 'P').innerHTML = '<span class="ms" aria-hidden="true">' + esc(b.dataset.n) + '</span>'; $(id + 'N').textContent = b.dataset.n; pintar(); if (alCambiar) alCambiar(b.dataset.n); });
  };
  $(id + 'Q').oninput = pintar; $(id + 'Q').onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); }; pintar();
}
function capMsg(e) {
  const m = e && e.message;
  return m === 'sinurl' ? 'Falta conectar el libro de capacitaciones (constante CAP_API).' : m === 'clave' ? 'El libro de capacitaciones no pudo confirmar tu clave. Salí del portal y volvé a entrar.'
    : (e && e.name === 'AbortError') ? 'El libro de capacitaciones tardó demasiado. Probá de nuevo en un rato.' : (m && m !== 'error' ? m : 'No se pudo completar.');
}
const capFalla = (ruta, t, e) => marco(ruta, capTit(t) + '<div class="aviso error">' + esc(capMsg(e)) + '</div><section class="card peq">Mientras tanto, todo se puede hacer en el <a href="' + CAP_LIBRO + '" target="_blank" rel="noopener">libro CAPACITACIONES ↗</a> (menú Capacitaciones HyS › Completar filas cargadas a mano).</section>');
async function capCopiar(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg || 'Copiado.'); } catch (e) { prompt('Copiá el texto:', t); } }
async function capCargar(fresco) { if (!CAPC || fresco) CAPC = await capApi('c_catalogo', {}); return CAPC; }
async function capHacer(accion, datos, boton, txt) {
  const t0 = boton ? boton.textContent : ''; if (boton) { boton.disabled = true; boton.textContent = txt || 'Guardando…'; }
  try { return await capApi(accion, datos); }
  catch (e) { toast(capMsg(e)); return null; }
  finally { if (boton) { boton.disabled = false; boton.textContent = t0; } }
}
function capModalMotivo(titulo, texto, ok) {
  const m = modal(titulo, [['motivo', 'Motivo (queda en el historial)', '', 1]], {}, async v => { if (!v.motivo.trim()) return 'Escribí el motivo.'; return await ok(v.motivo.trim()); }, texto ? '<p class="mu peq" style="margin:0">' + esc(texto) + '</p>' : '');
  return m;
}

  if (location.hash.split('/')[0] !== '#capcat') return;
  const q = capNorm(CAPF.q);
  const L = CAPC.lista.filter(c => (CAPF.filtro === 'todas' || !/inactiv|anulad/i.test(c.estado)) && (!q || capNorm(c.codigo + ' ' + c.nombre).indexOf(q) >= 0));
  const ev = c => c.evaluacion === null ? '<span class="mu">No lleva</span>' : c.evaluacion === 'falta' ? '<span class="chip er">Falta cargarla</span>'

    '<div class="filtros"><div class="cpn"><button class="fchip' + (CAPF.filtro === 'act' ? ' on' : '') + '" data-f="act">Activas y borradores</button><button class="fchip' + (CAPF.filtro === 'todas' ? ' on' : '') + '" data-f="todas">Todas</button></div>' +
    '<label class="f">Buscar<input class="c" id="ccQ" value="' + esc(CAPF.q) + '" placeholder="Nombre o código" style="min-width:240px"></label></div>' +
    (!L.length ? '<div class="card vacio">No hay capacitaciones con ese filtro.</div>' :
    '<section class="card tabla soloEsc"><table><thead><tr><th></th><th>Código</th><th>Capacitación</th><th>Registro</th><th>Evaluación</th><th>Dictado</th><th>Estado</th></tr></thead><tbody>' +
    L.map(c => '<tr class="cl" data-c="' + esc(c.codigo) + '"><td>' + capIco(c.icono) + '</td><td style="white-space:nowrap"><b>' + esc(c.codigo) + '</b></td><td><b>' + esc(c.nombre) + '</b><div class="mu peq">' + esc(sub(c)) + '</div></td><td>' + esc(c.registro) + '</td><td>' + ev(c) + '</td><td>' + dic(c) + '</td><td style="white-space:nowrap">' + capEst(c.estado) + falt(c) + '</td></tr>').join('') +
    '</tbody></table></section><div class="tarjetas">' + L.map(c => '<a class="tarj" href="#capficha/' + encodeURIComponent(c.codigo) + '"><div style="display:flex;gap:10px;align-items:center">' + capIco(c.icono) + '<b>' + esc(c.nombre) + '</b></div><span class="mu peq">' + esc(c.codigo) + ' · ' + esc(c.registro) + (sub(c) ? ' · ' + esc(sub(c)) : '') + '</span><span>' + capEst(c.estado) + falt(c) + ' ' + dic(c) + '</span></a>').join('') + '</div>'));

// ---------- Participantes de una capacitación (15/10/2026): todos los que la hicieron, una fila por persona

    if (!box()) return;
    if (!r || !r.ok) { box().innerHTML = '<div style="padding:14px 18px"><h2>Participantes</h2></div><div class="aviso" style="margin:0 18px 14px">' + esc((r && r.mensaje) || 'No se pudo leer la lista. Probá «Actualizar» o mirá el libro, hoja REGISTROS (columna CODIGO).') + '</div>'; return; }

  const L = r.lista || [], uni = f => L.map(f).flat().filter(v => v && !/^s\/d/i.test(v)).filter((v, i, a) => a.indexOf(v) === i).sort();
  const anios = uni(x => x.anios).sort().reverse(), ests = uni(x => x.est), servs = uni(x => x.servicio), pubs = uni(x => x.publico);
  const q = capNorm(CAPPA.q), F = L.filter(x => (!CAPPA.anio || x.anios.indexOf(CAPPA.anio) >= 0) && (!CAPPA.est || x.est === CAPPA.est) && (!CAPPA.serv || x.servicio === CAPPA.serv) && (!CAPPA.pub || x.publico === CAPPA.pub) &&
    (!q || capNorm(x.nombre + ' ' + x.dni + ' ' + x.correo).indexOf(q) >= 0));
  const sel = (id, t, ops, v) => '<label class="f">' + t + '<select class="c" id="' + id + '"><option value="">Todos</option>' + ops.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label>';
  const vig = F.filter(x => x.vigente).length, apr = F.filter(x => x.aprobo).length, varios = r.encuentros > 1;
  box().innerHTML = '<div style="padding:14px 18px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>Participantes</h2>' +
    '<span class="mu peq">' + F.length + (F.length !== L.length ? ' de ' + L.length : '') + ' persona(s) · ' + vig + ' vigente(s)' + (apr ? ' · ' + apr + ' con evaluación aprobada' : '') + '</span></div>' +
    '<div class="filtros">' + sel('cpA', 'Año', anios, CAPPA.anio) + sel('cpE', 'Establecimiento', ests, CAPPA.est) + sel('cpS', 'Servicio', servs, CAPPA.serv) + sel('cpP', 'Público', pubs, CAPPA.pub) +
    '<label class="f">Buscar<input class="c" id="cpQ" value="' + esc(CAPPA.q) + '" placeholder="Nombre, DNI o correo"></label></div>' +
    '<div class="cpn"><button class="btn sec" id="cpMail">Copiar correos (' + F.filter(x => x.correo).length + ')</button><button class="btn sec" id="cpCsv">Descargar planilla</button><button class="btn sec" id="cpAct">Actualizar</button></div></div>' +

async function capCerrarPrograma(D, desde) {

  const m = modal('Cerrar programa · ' + D.codigo, [['desde', 'Contar asistencias desde', 'date']], { desde: v.desdeIso },
    async o => { if (!v.aprobacion && !v.participacion) return 'No hay certificados nuevos para emitir.'; try { const x = await capApi('c_programa_cerrar', { id: D.id, desde: o.desde }); toast('Emitidos: ' + x.aprobacion + ' de aprobación y ' + x.participacion + ' de participación.'); capCertsDictado(D); } catch (e) { return capMsg(e); } },
    '<p class="peq" style="margin:0">Asistencia mínima: <b>' + v.minimo + ' de ' + v.total + '</b> encuentros' + (v.minimoEstimado ? ' (75 %, porque la ficha no la tiene cargada)' : '') + ' + evaluación final aprobada → <b>certificado de aprobación</b>. Si no llega → <b>constancia de participación</b>. Cuenta lo registrado del ' + esc(v.desde) + ' al ' + esc(v.hasta) + ', también en el sistema actual.</p>' +
    '<p class="peq" style="margin:0"><b>' + v.aprobacion + '</b> aprobación · <b>' + v.participacion + '</b> participación · ' + v.yaEmitidos + ' ya emitidos</p>' +
    '<div style="max-height:300px;overflow:auto;border:1px solid var(--ln);border-radius:8px"><table class="peq" style="width:100%"><thead><tr><th>Persona</th><th>Encuentros</th><th>Final</th><th></th></tr></thead><tbody>' +
    v.lista.map(x => '<tr><td>' + esc(x.nombre) + '<div class="mu">' + esc(x.dni) + '</div></td><td>' + x.asistidos + ' de ' + v.total + '</td><td>' + (x.nota === null ? '—' : esc(x.nota) + ' %') + '</td><td>' + res(x) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<button type="button" class="link" id="cpRecalc" style="align-self:flex-start">Recalcular con la fecha elegida</button>');
  $('mOk').textContent = 'Emitir ' + (v.aprobacion + v.participacion);
  $('cpRecalc').onclick = () => { const f = document.querySelector('#ov [data-k="desde"]').value; m.cerrar(); capCerrarPrograma(D, f); };
}

function capFirmanteModal(f) {
  const v = f ? { NOMBRE: f.nombre, TITULO: f.titulo, CARGO: f.cargo, ORGANISMO: f.organismo, MATRICULA: f.matricula, TIPO: f.tipo, CORREO: f.correo, TELEFONO: f.telefono, ACLARACION: f.aclaracion, VIGENTE: f.vigente ? 'Sí' : 'No' } : { VIGENTE: 'Sí', TIPO: 'Aval' };
  Object.keys(v).forEach(k => { if (capVacio(v[k])) v[k] = ''; });
  const archivo = id => new Promise(ok => { const x = $(id).files[0]; if (!x) return ok(null); if (x.size > 2 * 1024 * 1024) { toast('La imagen pesa más de 2 MB.'); return ok(null); } const fr = new FileReader(); fr.onload = () => ok({ tipo: x.type, b64: fr.result }); fr.readAsDataURL(x); });
  modal(f ? 'Editar firmante · ' + f.id : 'Nuevo firmante', [['NOMBRE', 'Nombre (como va en la firma)'], ['TITULO', 'Título'], ['CARGO', 'Cargo'], ['ORGANISMO', 'Organismo o institución'], ['MATRICULA', 'Matrícula'], ['TIPO', 'Tipo', capOps(['HyS', 'Aval', 'Disertante', 'Institución educativa'], v.TIPO)],
    ['CORREO', 'Correo'], ['TELEFONO', 'Teléfono'], ['VIGENTE', 'Vigente', ['Sí', 'No']], ['ACLARACION', 'Aclaración del sello (hasta 3 renglones)', '', 1]], v, async out => {
    const lineas = out.ACLARACION.split(/\n/).length; if (lineas > 3 || out.ACLARACION.length > 150) return 'La aclaración tiene que entrar en 3 renglones (hasta 150 letras).';
    const d = Object.assign({}, out, { vigente: out.VIGENTE !== 'No' }); delete d.VIGENTE; if (f) d.ID_FIRMANTE = f.id;
    const fi = await archivo('fiF'), se = await archivo('fiS'); if (fi) d.firma = fi; if (se) d.sello = se;
    try { await capApi('c_firmante_guardar', d, 180000); toast('Firmante guardado.'); CAPC = null; capFirmantes(); } catch (e) { return capMsg(e); }
  }, '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><label class="f">Imagen de la firma (PNG con fondo transparente, o JPG)<input class="c" type="file" id="fiF" accept="image/png,image/jpeg"></label><label class="f">Imagen del sello (optativa)<input class="c" type="file" id="fiS" accept="image/png,image/jpeg"></label></div>' +

const capChip = (t, c) => '<span class="chip mini ' + c + '">' + esc(t) + '</span>';
const capKp = (t, v, s, col) => '<div class="kpi2"><span>' + t + '</span><b' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</b><small>' + s + '</small></div>';
const capLnk = (u, t) => u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t) + ' ↗</a>' : '';
const capSinInstalar = (ruta, t, r) => marco(ruta, capTit(t) + '<div class="aviso error">' + esc((r && (r.mensaje || r.error)) || 'No se pudo leer.') + (/desconocida|instalar/i.test((r && (r.mensaje || r.error)) || '') ? ' Falta instalar CapGestion.gs en el Sistema HyS.' : '') + '</div>');

// ---------- Personas y certificados
async function capPersonas() {
  marco('#capper', capTit('Personas y certificados', 'Buscá por DNI, apellido, nombre o correo. Desde la ficha ves sus registros, certificados y lo que le falta, y corregís cualquier dato (queda en el historial).', '<a class="btn sec" href="' + CAP_LIBRO + '" target="_blank" rel="noopener">Libro ↗</a>') +
    '<section class="card"><div class="filtros"><label class="f" style="flex:1;min-width:240px">Buscar<input class="c" id="ppQ" placeholder="DNI, apellido, nombre o correo" value="' + esc(CAPP.q) + '" autocomplete="off"></label></div><div id="ppRes" style="margin-top:10px"></div></section>' +
    '<p class="mu peq">Si el portal falla: libro CAPACITACIONES, hojas PERSONAS, REGISTROS y CERTIFICADOS.</p>');
  const pintar = r => {
    if (!$('ppRes')) return;
    if (!r) return $('ppRes').innerHTML = '<div class="mu peq">Escribí al menos 3 letras o números.</div>';
    if (!r.ok) return $('ppRes').innerHTML = '<div class="aviso error">' + esc(r.mensaje || r.error || 'No se pudo buscar.') + '</div>';
    $('ppRes').innerHTML = !r.lista.length ? '<div class="vacio">Sin resultados.</div>' : '<div class="mu peq" style="margin-bottom:6px">' + r.total + ' persona(s)' + (r.total > r.lista.length ? ' · se muestran ' + r.lista.length + ': afiná la búsqueda' : '') + '</div><div class="tabla"><table><thead><tr><th>Persona</th><th>Dónde trabaja</th><th>Contacto</th><th>Registros</th></tr></thead><tbody>' +
      r.lista.map(p => '<tr class="cl" data-p="' + esc(p.dni) + '"><td><b>' + esc(p.nombre) + '</b>' + (p.revisar ? ' ' + capChip('Revisar', 'wa') : '') + '<div class="mu peq">DNI ' + esc(p.dni) + ' · ' + esc(p.publico) + '</div></td><td class="peq">' + esc([p.est, p.servicio, p.funcion].filter(x => !capVacio(x)).join(' · ') || '—') + '</td>' +
        '<td class="peq">' + (capVacio(p.correo) ? '<span style="color:var(--er)">Sin correo</span>' : esc(p.correo)) + '<div class="mu">' + (capVacio(p.tel) ? 'Sin teléfono' : esc(p.tel)) + '</div></td><td>' + p.registros + '</td></tr>').join('') + '</tbody></table></div>';
    document.querySelectorAll('tr.cl[data-p]').forEach(tr => tr.onclick = () => location.hash = '#capper/' + tr.dataset.p);
  };
  const buscar = async () => { const q = $('ppQ').value.trim(); CAPP.q = q; const n = q.replace(/[.\s]/g, ''); if ((/^\d+$/.test(n) ? n.length : capNorm(q).length) < 3) { CAPP.r = null; return pintar(null); }
    $('ppRes').innerHTML = '<div class="mu peq">Buscando…</div>'; let r; try { r = await api('p_cg_buscar', { q: q }, 90000); } catch (e) { return; } if ($('ppQ') && $('ppQ').value.trim() === q) { CAPP.r = r; pintar(r); } };
  $('ppQ').oninput = () => { clearTimeout(capPersonas.t); capPersonas.t = setTimeout(buscar, 450); };
  $('ppQ').focus(); if (CAPP.q && CAPP.r) pintar(CAPP.r); else pintar(null);
}
async function capPersona(dni, fresco) {
  cargando('#capper', 'Leyendo la ficha…');
  let r; try { r = await api('p_cg_persona', { dni: dni, fresco: !!fresco }, 120000); } catch (e) { return; }
  if (location.hash.split('/')[0] !== '#capper') return;
  if (!r.ok) return capSinInstalar('#capper', 'Persona', r);
  const D = r.datos, C = r.cumplimiento, nom = D.APELLIDOS + ', ' + D.NOMBRES, vig = r.certificados.filter(c => !/anul|reempl/i.test(c.estado));
  const fila = (k, v) => '<dt>' + esc(k) + '</dt><dd>' + (capVacio(v) ? '<span class="mu">s/d</span>' : esc(v)) + '</dd>';
  marco('#capper', '<div><a href="#capper" class="peq">← Personas</a></div>' + capTit(nom, esc('DNI ' + D.DNI + ' · ' + [D.ESTABLECIMIENTO, D.SERVICIO, D.FUNCION].filter(x => !capVacio(x)).join(' · ')),
      '<button class="btn pri" id="pfEd">Corregir datos</button><a class="btn sec" href="' + esc(r.pagina) + '" target="_blank" rel="noopener">Página de certificados ↗</a>') +
    '<div class="tb5">' + capKp('Registros', r.registros.length, 'asistencias y evaluaciones') + capKp('Certificados', vig.length, 'vigentes en el sistema') +
      (C ? capKp('Obligatorias', C.cumplidas + ' / ' + C.obligatorias, C.pct + ' al día', C.obligatorias && C.cumplidas >= C.obligatorias ? 'var(--ok)' : C.cumplidas ? 'var(--wa)' : 'var(--er)') : capKp('Obligatorias', '—', 'no está en la base de trabajadores de HZT y HMH')) +
      capKp('Revisar', /^s[ií]/i.test(D.REVISAR) ? 'Sí' : 'No', /^s[ií]/i.test(D.REVISAR) ? 'datos a controlar' : 'datos controlados', /^s[ií]/i.test(D.REVISAR) ? 'var(--wa)' : '') + '</div>' +
    '<div class="grid g2"><section class="card"><h2>Datos</h2><dl class="dl" style="margin-top:8px">' + fila('Correo', D.CORREO) + fila('Teléfono', D.TELEFONO) + fila('Público', D.PUBLICO) + fila('Institución', D.INSTITUCION) + fila('Servicio', D.SERVICIO) + fila('Función', D.PROFESION || D.FUNCION) +
      fila('Vínculo', D.VINCULO) + (capVacio(D.EMPRESA) ? '' : fila('Empresa', D.EMPRESA)) + (capVacio(D.CARRERA) ? '' : fila('Carrera', D.CARRERA)) + fila('Origen del dato', D.ORIGEN_DE_DATOS) + fila('Última actualización', D.ULTIMA_ACTUALIZACION) + '</dl></section>' +
    '<section class="card"><h2>Lo que le falta</h2>' + (C ? '<p class="mu peq" style="margin:4px 0 8px">Según la matriz para su función y servicio (' + esc(C.jefatura) + ').</p>' + (capVacio(C.falta) ? '<div style="color:var(--ok);font-weight:700">Tiene todas sus obligatorias.</div>' : C.falta.split(' · ').map(f => '<div class="item"><span>' + esc(f) + '</span></div>').join(''))
      : '<p class="mu peq">No figura en la base de trabajadores de HZT y HMH (externos, tercerizados, estudiantes u otros establecimientos): no tiene obligatorias calculadas.</p>') + '</section></div>' +
    '<section class="card tabla"><div style="padding:14px 18px"><h2>Certificados</h2></div>' + (r.certificados.length ? '<table><thead><tr><th>Fecha</th><th>Capacitación</th><th>Tipo</th><th>Horas</th><th>Documento</th><th>Estado</th></tr></thead><tbody>' +
      r.certificados.map(c => '<tr><td>' + esc(c.fecha) + '</td><td><b>' + esc(c.nombre) + '</b><div class="mu peq">' + esc(c.codigo) + (c.encuentro && c.encuentro !== 's/d' ? ' · encuentro ' + esc(c.encuentro) : '') + ' · ' + esc(c.id) + '</div></td><td class="peq">' + esc(c.tipo) + '</td><td>' + esc(c.horas) + '</td><td>' + (capLnk(c.link, 'PDF') || '<span class="mu">Sin PDF</span>') + '</td><td>' + capChip(c.estado || 's/d', /v[aá]lido/i.test(c.estado) ? 'ok' : /anul/i.test(c.estado) ? 'er' : 'gr') + '</td></tr>').join('') + '</tbody></table>' : '<div class="vacio">Sin certificados.</div>') + '</section>' +
    '<section class="card tabla"><div style="padding:14px 18px"><h2>Registros</h2></div>' + (r.registros.length ? '<table><thead><tr><th>Fecha</th><th>Capacitación</th><th>Tipo</th><th>Nota</th><th>Vence</th><th>Origen</th></tr></thead><tbody>' +
      r.registros.map(x => '<tr><td>' + esc(x.fecha) + '</td><td><b>' + esc(x.nombre) + '</b><div class="mu peq">' + esc(x.codigo) + (x.encuentro ? ' · encuentro ' + esc(x.encuentro) : '') + (/anul/i.test(x.estado) ? ' · <b style="color:var(--er)">anulado</b>' : '') + '</div></td><td class="peq">' + esc(x.tipo) + '</td><td>' + esc(x.nota ? x.nota + (x.aprobado ? ' (' + x.aprobado + ')' : '') : '—') + '</td><td class="peq">' + esc(x.vence || '—') + '</td><td class="peq">' + esc(x.origen) + '</td></tr>').join('') + '</tbody></table>' : '<div class="vacio">Sin registros.</div>') + '</section>' +
    (r.historial.length ? '<details class="card peq"><summary style="cursor:pointer;font-weight:700">Historial de cambios (' + r.historial.length + ')</summary>' + r.historial.map(h => '<div class="item"><span><b>' + esc(h.campo) + '</b>: «' + esc(h.antes || 'vacío') + '» → «' + esc(h.despues) + '»<div class="mu">' + esc(h.fecha + ' · ' + h.quien + (h.motivo ? ' · ' + h.motivo : '')) + '</div></span></div>').join('') + '</details>' : ''));
  $('pfEd').onclick = () => {
    const L = r.listas, op = (arr, v) => (v && arr.indexOf(v) < 0 ? [v] : []).concat(arr);
    const NOM = { APELLIDOS: 'Apellidos', NOMBRES: 'Nombres', CORREO: 'Correo', TELEFONO: 'Teléfono', PUBLICO: ['Público', L.publicos], CIUDAD: 'Ciudad', PROVINCIA: 'Provincia', PAIS: 'País', PROFESION: 'Función y detalle (como se ve en la ficha)',
      INSTITUCION: ['Institución (dónde trabaja: hospital, empresa privada, universidad…)', L.instituciones, 1], ESTABLECIMIENTO: ['Establecimiento (sigla)', L.establecimientos], SERVICIO: ['Servicio', L.servicios, 1], FUNCION: ['Función', L.funciones, 1],
      VINCULO: ['Vínculo', ['Planta', 'Contrato', 'Residente', 'Tercerizado', 'Empresa privada', 'Cooperativa', 'Otro'].concat(L.vinculos || []).filter((x, i, a) => a.indexOf(x) === i), 1], EMPRESA: ['Empresa (si es tercerizado o de una empresa privada: escribila si no está)', ['MAREM', 'SOMI', 'Star Union', 'SI-AL'].concat(L.empresas || []).filter((x, i, a) => a.findIndex(y => String(y).toLowerCase() === String(x).toLowerCase()) === i), 1], CARRERA: 'Carrera (estudiantes)', REVISAR: ['Revisar', ['No', 'Sí']] };
    // 18/10/2026: institución, servicio, función, vínculo y empresa se escriben libres con sugerencias (antes eran listas cerradas y no se podía poner una empresa nueva)
    const campos = r.editables.map(k => { const n = NOM[k] || k; return Array.isArray(n) ? [k, n[0], n[2] ? { lista: op(n[1], D[k]) } : op(n[1], D[k])] : [k, n]; }).concat([['motivo', 'Motivo del cambio (queda en el historial)', '', 1]]);
    modal('Corregir datos · ' + nom, campos, D, async o => {
      const motivo = o.motivo; delete o.motivo;
      const res = await api('p_cg_persona_guardar', { dni: D.DNI, datos: o, motivo: motivo }, 90000); if (!res.ok) return res.mensaje || 'No se pudo guardar.';
      toast(res.cambios ? res.cambios + ' dato(s) corregido(s).' : 'No había cambios.'); capPersona(D.DNI, true); return '';
    }, '<p class="mu peq" style="margin:8px 0 0">Servicio, función e institución del personal de HZT y HMH vienen de la base de trabajadores: si los cambiás acá, corregilos también allá para que el cumplimiento los tome.</p>');
  };
}

// ---------- Contactos y carga de mails
async function capContactos(fresco) {
  if (!CAPCT || fresco) { cargando('#capcont', 'Leyendo jefaturas y contactos…'); try { CAPCT = await api('p_cg_contactos', { fresco: !!fresco }, 120000); } catch (e) { return; } }
  if (location.hash.split('/')[0] !== '#capcont') return;
  if (!CAPCT.ok) return capSinInstalar('#capcont', 'Contactos', CAPCT);
  const T = CAPCT;
  marco('#capcont', capTit('Contactos y mails', 'Correos y teléfonos del personal y de cada jefatura. Pegá una lista de mails: el sistema la cruza por DNI o por nombre, te muestra qué cambia y aplica solo lo que confirmás.', '<a class="btn sec" href="#capjef">Editar jefaturas</a><button class="btn sec" id="ctAct">Actualizar</button>') +
    '<div class="tb5">' + capKp('Personas', T.personas, 'en el libro') + capKp('Sin correo', T.sinCorreo, 'personas', T.sinCorreo ? 'var(--wa)' : '') + capKp('Sin teléfono', T.sinTel, 'personas') + capKp('Jefaturas sin correo', T.jefSinCorreo, 'de ' + T.jefaturas.length, T.jefSinCorreo ? 'var(--er)' : '') + '</div>' +
    '<section class="card"><h2>Cargar lista de mails</h2><p class="mu peq" style="margin:4px 0 8px">Una persona por línea, con su correo y su DNI (o apellido y nombre). Sirve lo que copies de una planilla o de un correo. Si la persona ya tenía otro correo, gana el de la lista (el más nuevo).</p>' +
      '<textarea class="c" id="mlTxt" rows="6" style="width:100%" placeholder="30123456  perez.juan@gmail.com&#10;Gómez, Ana; ana.gomez@hotmail.com"></textarea><div class="cpn" style="margin-top:8px"><button class="btn pri" id="mlPrev">Revisar la lista</button></div><div id="mlRes" style="margin-top:10px"></div></section>' +
    '<section class="card tabla"><div style="padding:14px 18px"><h2>Jefaturas</h2><span class="mu peq">De mayor a menor personal. Los avisos e informes van al correo del servicio o, si no hay, al del responsable.</span></div><table><thead><tr><th>Jefatura</th><th>Responsable</th><th>Correo</th><th>Personal</th><th>Cumplimiento</th><th>Último informe</th></tr></thead><tbody>' +
      T.jefaturas.map(j => '<tr><td><b>' + esc(j.jefatura) + '</b>' + (j.prioritaria ? ' ' + capChip('Prioritaria', 'pa') : '') + '<div class="mu peq">' + esc([j.est, j.tel ? 'int. ' + j.tel : ''].filter(Boolean).join(' · ')) + '</div></td><td class="peq">' + esc(j.responsable || '—') + '</td>' +
        '<td class="peq">' + (j.correo ? esc(j.correo) : capChip('Falta', 'er')) + '</td><td>' + (j.personal || '—') + '</td><td>' + esc(j.pct || '—') + '</td><td class="peq">' + (j.ultimo ? (j.link ? capLnk(j.link, j.ultimo) : esc(j.ultimo)) : '—') + '</td></tr>').join('') + '</tbody></table></section>' +
    '<p class="mu peq">Si el portal falla: libro CAPACITACIONES, hojas PERSONAS (columna CORREO) y JEFATURAS.</p>');
  $('ctAct').onclick = () => capContactos(true);
  $('mlPrev').onclick = async () => {
    const txt = $('mlTxt').value.trim(); if (!txt) return toast('Pegá la lista primero.');
    $('mlPrev').disabled = true; $('mlRes').innerHTML = '<div class="mu peq">Cruzando con el libro…</div>';
    let r; try { r = await api('p_cg_mails_previa', { texto: txt }, 120000); } catch (e) { $('mlPrev').disabled = false; return; } $('mlPrev').disabled = false;
    if (!r.ok) return $('mlRes').innerHTML = '<div class="aviso error">' + esc(r.mensaje || 'No se pudo leer la lista.') + '</div>';
    CAPML = r.lista; const cambia = CAPML.filter(x => x.estado === 'Nuevo' || x.estado === 'Reemplaza');
    const col = e => e === 'Nuevo' ? 'ok' : e === 'Reemplaza' ? 'wa' : e === 'Igual' ? 'gr' : 'er';
    $('mlRes').innerHTML = '<div class="mu peq" style="margin-bottom:6px">' + CAPML.length + ' línea(s): ' + cambia.length + ' para cargar · ' + CAPML.filter(x => x.estado === 'Igual').length + ' ya estaban · ' + CAPML.filter(x => !x.dni).length + ' sin persona.</div>' +
      '<div class="tabla"><table><thead><tr><th></th><th>Línea</th><th>Persona</th><th>Correo actual → nuevo</th><th>Estado</th></tr></thead><tbody>' + CAPML.map((x, i) => '<tr><td>' + (x.estado === 'Nuevo' || x.estado === 'Reemplaza' ? '<input type="checkbox" data-ml="' + i + '"' + (x.aviso ? '' : ' checked') + '>' : '') + '</td><td class="peq">' + esc(x.linea) + '</td>' +
        '<td class="peq">' + (x.dni ? '<b>' + esc(x.persona) + '</b><div class="mu">DNI ' + esc(x.dni) + ' · por ' + esc(x.via) + '</div>' : '—') + '</td><td class="peq">' + (x.dni ? esc(x.actual || 'vacío') + ' → <b>' + esc(x.correo) + '</b>' : esc(x.correo || '')) + (x.aviso ? '<div style="color:var(--er)">' + esc(x.aviso) + '</div>' : '') + '</td><td>' + capChip(x.estado, col(x.estado)) + '</td></tr>').join('') + '</tbody></table></div>' +
      (cambia.length ? '<div class="cpn" style="margin-top:8px"><button class="btn pri" id="mlAp">Cargar los marcados</button></div>' : '');
    if ($('mlAp')) $('mlAp').onclick = async () => {
      const items = Array.from(document.querySelectorAll('[data-ml]:checked')).map(c => CAPML[c.dataset.ml]).map(x => ({ dni: x.dni, correo: x.correo })); if (!items.length) return toast('No hay nada marcado.');
      $('mlAp').disabled = true; let a; try { a = await api('p_cg_mails_aplicar', { items: items }, 120000); } catch (e) { $('mlAp').disabled = false; return; }
      if (!a.ok) { $('mlAp').disabled = false; return toast(a.mensaje || 'No se pudo cargar.'); }
      toast(a.n + ' correo(s) cargado(s).'); $('mlTxt').value = ''; capContactos(true);
    };
  };
}

// ---------- Informes (mensual o a pedido · por jefatura)

  if (location.hash.split('/')[0] !== '#capinf') return;

// ------------------------------------------------------------------ Reglas del diagnóstico (las mismas que en el sistema: hoja ITEMS › CONDICION y PREVIO)
function diagAplica(it, sitio) {
  const cond = String(it && it.CONDICION || '').trim(); if (!cond) return true;
  const porId = DG.porId || (DG.porId = Object.fromEntries(DG.D.items.map(i => [i.ID, i])));

    // «LUGAR ~ Tanque|Cisterna»: solo en los lugares con alguna palabra que empiece así («LUGAR !~ …»: en los demás)
    const L = /^\s*LUGAR\s*(!~|~)\s*(.+?)\s*$/i.exec(c);

// Se carga desde portal.html (<script src>). Para el portal de respaldo de Google, herramientas/armar_respaldo.py lo junta en un solo archivo.
// Lista de establecimientos con su último relevamiento y el mismo formulario del diagnóstico de residuos (diagForm), con su configuración.
const DGMP = {
  agua: { ruta: '#aguadiag', tab: '#agua', mod: '2 · Agua', h1: 'Diagnóstico de agua', ico: 'water_drop', pal: 'diagnóstico',
    sub: 'Documentación y registros, tanques y cisternas (cada reservorio del inventario es un lugar), seguridad de quien limpia o toma muestras, y puntos de consumo y agua caliente. Los CAPS se relevan dentro del hospital del que dependen.',
    txtLugares: 'Estas preguntas se responden en cada tanque, cisterna o lugar que se recorre. Si un lugar no existe o no se revisó, dejalo sin completar.' },
  plagas: { ruta: '#plgdiag', tab: '#plagas', mod: '3 · Plagas', h1: 'Diagnóstico de plagas', ico: 'pest_control', pal: 'diagnóstico',
    sub: 'Manejo integrado de plagas (MIP) en toda la red: programa y registros, productos y seguridad de quien aplica, condiciones del edificio, residuos y exterior, y situación actual. El registro de intervenciones (MIPyV) sigue solo en Trelew.',
    txtLugares: 'Estas preguntas se responden en cada lugar que se recorre. Si un lugar no existe o no se revisó, dejalo sin completar.' }
};
const DGMT = {};   // tablero de cada módulo (caché de la sesión)
async function dgmDatos(m, fresco) {
  if (!RES) { const g = LS.get('res', null); if (g) { RES = g; refrescarRes(); } }
  if (!DGMT[m] || fresco) { try { DGMT[m] = await api('p_dgm_tablero', { m: m, fresco: !!fresco }, 180000); } catch (e) { return false; } }
  return true;
}
async function dgmLista(m, fresco) {
  const P = DGMP[m];
  if (!DGMT[m] || fresco) cargando(P.ruta, 'Leyendo los diagnósticos…');
  if (!(await dgmDatos(m, fresco))) return;
  const T = DGMT[m], cab = '<div class="cab"><div><span class="mu peq">' + P.mod + '</span><h1>' + P.h1 + '</h1><span class="mu peq">' + esc(P.sub) + '</span></div>' +
    '<div class="filtros"><a class="btn sec" href="' + P.tab + '">Tablero del módulo</a><button class="btn sec" id="dmAct">Actualizar</button>' + (T && T.libro ? '<a class="btn sec" href="' + esc(T.libro) + '" target="_blank" rel="noopener">Planilla del diagnóstico ↗</a>' : '') + '</div></div>';
  if (!T.ok) { marco(P.ruta, cab + '<div class="aviso error">' + esc(T.mensaje || T.error || 'No se pudo leer el diagnóstico.') + '</div>' +
    (/desconocida/i.test(T.error || T.mensaje || '') ? '<section class="card peq">Falta publicar la versión del sistema que trae este diagnóstico.</section>' : '')); $('dmAct').onclick = () => dgmLista(m, true); return; }
  if (!T.instalado) { marco(P.ruta, cab + '<section class="card"><h2>Falta instalar el diagnóstico</h2><p class="peq">El cuestionario ya está revisado. Para empezar a usarlo, en el Apps Script «Sistema HyS» hay que ejecutar una vez <code>construirModulo' + (m === 'agua' ? 'Agua' : 'Plagas') + '</code>: arma la planilla del diagnóstico con las preguntas y los lugares.</p></section>'); $('dmAct').onclick = () => dgmLista(m, true); return; }
  const A = FILTRO.area, areas = Array.from(new Set(T.establecimientos.map(e => e.area))).filter(Boolean).sort(), S = T.totales;
  const E = T.establecimientos.filter(e => !A || e.area === A).sort((a, b) => (a.area + a.nombre).localeCompare(b.area + b.nombre));
  const kpi = (t, v, s, col) => '<div class="kpi2"><span>' + t + '</span><b' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</b><small>' + s + '</small></div>';
  marco(P.ruta, cab +
    '<div class="tb5">' + kpi('Relevados', S.relevados + ' de ' + S.establecimientos, 'con diagnóstico cerrado') + kpi('Cumplimiento promedio', S.promedio == null ? '—' : String(S.promedio).replace('.', ',') + ' %', 'de los relevados') +
      kpi('Con puntos críticos', S.criticos, 'algún punto crítico en 0', S.criticos ? 'var(--er)' : '') + kpi('En curso', S.borradores + S.enviados, (S.enviados ? S.enviados + ' enviado(s) para revisar · ' : '') + S.borradores + ' borrador(es)') + '</div>' +
    '<div class="filtros" style="margin:12px 0"><label class="f">Área<select class="c" id="dmA"><option value="">Toda la provincia</option>' + areas.map(a => '<option' + (a === A ? ' selected' : '') + '>' + esc(a) + '</option>').join('') + '</select></label></div>' +
    '<section class="card tabla"><table><thead><tr><th>Establecimiento</th><th>Área</th><th>Último diagnóstico</th><th>Resultado</th></tr></thead><tbody>' +
      (E.length ? E.map(e => '<tr class="cl" data-cod="' + esc(e.cod) + '"><td><b>' + esc(e.nombre) + '</b><div class="mu peq">' + esc(e.cod) + (e.tipo ? ' · ' + esc(e.tipo) : '') + '</div></td><td class="peq">' + esc(String(e.area || '').replace('Área Programática ', '')) + '</td>' +
        '<td>' + (e.diag ? fechaTxt(e.diag.fecha) : '—') + '</td><td>' + chipDiag(e.diag) + '</td></tr>').join('') : '<tr><td colspan="4" class="mu">No hay establecimientos en esta área.</td></tr>') +
    '</tbody></table></section><p class="mu peq">Tocá un establecimiento para abrir su diagnóstico o empezar uno. Después del diagnóstico vienen el informe a la Dirección y el plan de acción con propuestas de mejora.</p>');
  $('dmAct').onclick = () => dgmLista(m, true);
  $('dmA').onchange = e => { FILTRO.area = e.target.value; dgmLista(m); };
  document.querySelectorAll('tr.cl[data-cod]').forEach(tr => tr.onclick = () => location.hash = P.ruta + '/' + encodeURIComponent(tr.dataset.cod));
}
const dgmConfig = m => { const P = DGMP[m]; return {
  modo: 'hys', pal: P.pal,
  abrir: (cod, id) => api('p_dgm_abrir', { m: m, cod: cod, id: id }, 120000),
  guardar: p => api('p_dgm_guardar', Object.assign({ m: m }, p), 120000),
  foto: p => api('p_dgm_foto', Object.assign({ m: m }, p)),
  pantalla: html => marco(P.ruta, html),
  volver: '<a href="' + P.ruta + '" class="peq" style="font-weight:700;text-decoration:none">‹ Todos los diagnósticos de ' + (m === 'agua' ? 'agua' : 'plagas') + '</a>',
  titulo: () => P.h1,
  txtLugares: P.txtLugares, txtFaltaLugar: 'Falta relevar al menos un lugar.',
  extra: () => { const I = (DG.D.informes || [])[0]; return informesDiag() + '<section class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><h2>Plan de acción</h2><span class="mu peq">' +
    (I ? 'Las mejoras del informe ' + esc(I.codigo) + ' están en el plan de acción: ahí se carga el envío a la Dirección, la respuesta, el avance y la evidencia.' : 'Al generar el informe, sus mejoras (punto 6) pasan solas al plan de acción.') + '</span></div>' +
    (I ? '<a class="btn sec" href="#plan/' + encodeURIComponent(I.codigo) + '">Ver el plan de acción</a>' : '') + '</section>'; },
  alPintar: () => activarInformes(), accInforme: 'p_dgm_informe_' + m, accCorreo: 'p_dgm_correo_' + m,
  nombre: cod => ((DGMT[m] && DGMT[m].establecimientos && DGMT[m].establecimientos.find(e => e.cod === cod)) || (RES && RES.filas.find(f => f.cod === cod)) || { nombre: cod }).nombre,
  alGuardar: () => { DGMT[m] = null; }
}; };
const DCFG_AGU = dgmConfig('agua'), DCFG_PLG = dgmConfig('plagas');
function dgmRuta(m, cod) { if (!cod) return dgmLista(m); DCFG = m === 'agua' ? DCFG_AGU : DCFG_PLG; return diagForm(cod, ''); }
</script>
<script>
// Portal HyS · Accesos por persona (DNI y clave personal)
// Se carga desde portal.html (<script src>). Para el portal de respaldo de Google, herramientas/armar_respaldo.py lo junta en un solo archivo.
// Lee y escribe BASE COMÚN › ACCESOS (Accesos.gs › accPortal_). Todo se puede seguir haciendo a mano en la hoja.
let ACCPD = null;
const ACCPF = { q: '', estado: '' };
const accpDni = v => String(v || '').replace(/\D/g, '');
const accpLista = v => String(v || '').split(/[,;·]+/).map(s => s.trim()).filter(Boolean);
const accpMensaje = p => 'Hola. Ya tenés tu acceso personal al Sistema HyS.\n' +
  'Entrá a «Mi establecimiento»: ' + APP_URL + '\n' +
  'DNI: ' + accpDni(p.DNI) + '\nClave: ' + p.CLAVE + '\n' +
  'Con el mismo DNI y la misma clave entrás también a la página de diagnóstico. Ves solo lo que te corresponde: ' + (p.MODULOS || '') + ' (' + (p.ESTABLECIMIENTOS || '') + ').\n' +
  'La clave es personal: no la compartas. Cualquier consulta, a Higiene y Seguridad Laboral.';

async function accesosPantalla(fresco) {
  if (!ACCPD || fresco) {
    cargando('#accesos', 'Leyendo los accesos…');
    try { ACCPD = await api('p_acc_listar', {}, 120000); } catch (e) { return; }
  }
  if (!ACCPD.ok) return marco('#accesos', '<div class="cab"><div><span class="mu peq">Gestión</span><h1>Accesos por persona</h1></div></div><div class="aviso error">' +
    esc(ACCPD.mensaje || ACCPD.error || 'No se pudieron leer los accesos.') + '</div>' +
    (/desconocida/i.test(ACCPD.error || ACCPD.mensaje || '') ? '<section class="card peq">Falta publicar la versión del sistema que trae esta pantalla. Mientras tanto, los accesos se manejan en BASE COMÚN › ACCESOS.</section>' : ''));
  const D = ACCPD, F = ACCPF, todas = D.filas;
  const est = p => /^activ/i.test(p.ESTADO) ? 'Activo' : /^baja/i.test(p.ESTADO) ? 'Baja' : 'Pendiente';
  const listo = p => est(p) === 'Activo' && !!p.CLAVE && !!accpDni(p.DNI);
  const chip = p => listo(p) ? '<span class="chip ok">Activo</span>' : est(p) === 'Activo' ? '<span class="chip wa">Activo sin clave</span>' : est(p) === 'Baja' ? '<span class="chip gr">Baja</span>' : '<span class="chip pa">Pendiente</span>';
  const vis = todas.filter(p => (!F.estado || est(p) === F.estado) && (!F.q || (p.APELLIDO_Y_NOMBRE + ' ' + p.DNI + ' ' + p.ROL + ' ' + p.ESTABLECIMIENTOS + ' ' + p.MODULOS).toLowerCase().indexOf(F.q.toLowerCase()) >= 0));
  const kpi = (t, v, s, col) => '<div class="kpi2"><span>' + t + '</span><b' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</b><small>' + s + '</small></div>';
  const nAct = todas.filter(listo).length, nSinClave = todas.filter(p => est(p) === 'Activo' && !listo(p)).length,
    nPend = todas.filter(p => est(p) === 'Pendiente').length, nSinDni = todas.filter(p => est(p) !== 'Baja' && !accpDni(p.DNI)).length;
  // Módulos que en cada establecimiento ya pasaron a clave personal (la clave común deja de verlos: regla de Accesos.gs)
  const porEst = {};
  todas.filter(listo).forEach(p => { if (/toda/i.test(p.ESTABLECIMIENTOS)) return;
    const mods = /(^|,)\s*todos\s*(,|$)/i.test(p.MODULOS) ? D.modulos : accpLista(p.MODULOS);
    accpLista(p.ESTABLECIMIENTOS).forEach(c => { porEst[c] = porEst[c] || {}; mods.forEach(m => porEst[c][m] = true); }); });
  const hab = D.habilitados || null, comunes = D.modulos.filter(m => (D.soloPersonal || []).indexOf(m) < 0 && (!hab || hab[m]));   // solo los habilitados hoy (HABILITACION)
  const filaClave = p => p.CLAVE === '(clave maestra)' ? '<span class="mu peq">Clave maestra</span>'
    : p.CLAVE ? '<span class="accpK" data-f="' + p.fila + '"><code>••••••••</code></span> <button class="btn sec peq" data-ver="' + p.fila + '">Ver</button> <button class="btn sec peq" data-msj="' + p.fila + '">Copiar mensaje</button> <button class="btn sec peq" data-gen="' + p.fila + '">Nueva</button>'
    : (est(p) === 'Activo' && accpDni(p.DNI) ? '<button class="btn pri peq" data-gen="' + p.fila + '">Generar clave</button>' : '<span class="mu peq">' + (accpDni(p.DNI) ? 'Al activarla' : 'Falta el DNI') + '</span>');
  marco('#accesos', '<div class="cab"><div><span class="mu peq">Gestión</span><h1>Accesos por persona</h1><span class="mu peq">Cada persona entra a «Mi establecimiento» y a la página de diagnóstico con su DNI y su clave, y ve solo sus establecimientos y módulos. Los datos están en BASE COMÚN › ACCESOS.</span></div>' +
    '<div class="filtros"><button class="btn pri" id="apNueva">Nueva persona</button><button class="btn sec" id="apAct">Actualizar</button><a class="btn sec" href="' + esc(D.hoja || '#') + '" target="_blank" rel="noopener">Abrir la hoja ↗</a></div></div>' +
    '<div class="tb5" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">' +
      kpi('Con acceso personal', nAct, 'activas, con DNI y clave', nAct ? '#0D4A63' : '') + kpi('Activas sin clave', nSinClave, 'tocá «Generar clave»', nSinClave ? '#8A5200' : '') +
      kpi('Pendientes', nPend, 'todavía no entran') + kpi('Sin DNI', nSinDni, 'completar para activar', nSinDni ? '#B4361F' : '') + '</div>' +
    '<div class="filtros" style="margin:12px 0"><label class="f">Buscar<input class="c" id="apQ" value="' + esc(F.q) + '" placeholder="Nombre, DNI, establecimiento o módulo"></label>' +
      '<label class="f">Estado<select class="c" id="apE"><option value="">Todos</option>' + ['Activo', 'Pendiente', 'Baja'].map(e => '<option' + (F.estado === e ? ' selected' : '') + '>' + e + '</option>').join('') + '</select></label></div>' +
    '<section class="card tabla"><table><thead><tr><th>Persona</th><th>DNI</th><th>Establecimientos</th><th>Módulos</th><th>Estado</th><th>Clave</th></tr></thead><tbody>' +
      (vis.length ? vis.map(p => '<tr class="cl" data-fila="' + p.fila + '"><td><b>' + esc(p.APELLIDO_Y_NOMBRE || 's/d') + '</b><div class="mu peq">' + esc(p.ROL || '') + '</div></td><td>' + (accpDni(p.DNI) ? esc(accpDni(p.DNI)) : '<span class="mu">s/d (revisar)</span>') + '</td>' +
        '<td class="peq">' + esc(p.ESTABLECIMIENTOS || 's/d') + '</td><td class="peq">' + esc(p.MODULOS || 's/d') + '</td><td>' + chip(p) + '</td><td class="peq" style="white-space:nowrap">' + filaClave(p) + '</td></tr>').join('')
        : '<tr><td colspan="6" class="mu">No hay personas con estos filtros.</td></tr>') + '</tbody></table></section>' +
    '<section class="card" style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0;font-size:16px">Clave común de cada establecimiento</h2>' +
      '<span class="mu peq">Cuando en un establecimiento hay alguien activo con clave propia para un módulo, la clave común de ese establecimiento deja de ver ese módulo. Las personas con «Toda la red» no cuentan.</span>' +
      (Object.keys(porEst).length ? '<table><thead><tr><th>Establecimiento</th><th>Con clave personal</th><th>Siguen con la clave común</th></tr></thead><tbody>' +
        Object.keys(porEst).sort().map(c => { const pers = Object.keys(porEst[c]).filter(m => comunes.indexOf(m) >= 0), resto = comunes.filter(m => !porEst[c][m]);
          return '<tr><td><b>' + esc(c) + '</b></td><td class="peq">' + esc(pers.join(', ') || '—') + '</td><td class="peq">' + (resto.length ? esc(resto.join(', ')) : '<span class="chip ok">Ninguno: solo claves personales</span>') + '</td></tr>'; }).join('') + '</tbody></table>'
        : '<span class="peq">Todavía ningún establecimiento tiene módulos con clave personal: todos entran con su clave común.</span>') + '</section>' + accpCalendario(D));
  $('apAct').onclick = () => accesosPantalla(true);
  $('apNueva').onclick = () => accpEditar(null);
  $('apQ').onchange = e => { ACCPF.q = e.target.value.trim(); accesosPantalla(); };
  $('apE').onchange = e => { ACCPF.estado = e.target.value; accesosPantalla(); };
  const deFila = f => todas.find(p => String(p.fila) === String(f));
  document.querySelectorAll('tr.cl[data-fila]').forEach(tr => tr.onclick = e => { if (e.target.closest('button')) return; accpEditar(deFila(tr.dataset.fila)); });
  document.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => { const k = document.querySelector('.accpK[data-f="' + b.dataset.ver + '"] code'), p = deFila(b.dataset.ver);
    const oculta = k.textContent.indexOf('•') === 0; k.textContent = oculta ? p.CLAVE : '••••••••'; b.textContent = oculta ? 'Ocultar' : 'Ver'; });
  document.querySelectorAll('[data-msj]').forEach(b => b.onclick = async () => { const t = accpMensaje(deFila(b.dataset.msj));
    try { await navigator.clipboard.writeText(t); toast('Mensaje copiado: pegalo en el chat o el correo de esa persona.'); } catch (e) { prompt('Copiá el mensaje:', t); } });
  document.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => accpClave(deFila(b.dataset.gen)));
}

function accpClave(p) {
  const tiene = !!p.CLAVE;
  const m = modal(tiene ? 'Clave nueva para ' + p.APELLIDO_Y_NOMBRE : 'Generar clave para ' + p.APELLIDO_Y_NOMBRE, [], {}, async () => {
    try { const r = await api('p_acc_clave', { fila: p.fila }, 60000); if (!r.ok) return r.mensaje || 'No se pudo generar la clave.';
      p.CLAVE = r.clave; toast('Clave generada. Usá «Copiar mensaje» para pasársela.'); setTimeout(() => accesosPantalla(), 0); }
    catch (e) { return 'No se pudo conectar con el sistema.'; }
  }, '<p class="peq">' + (tiene ? 'La clave actual deja de funcionar enseguida (en hasta 5 minutos en «Mi establecimiento»). Avisale a la persona la nueva.' : 'El sistema arma una clave al azar (tres letras y cuatro números) y la guarda en ACCESOS › CLAVE.') + '</p>');
  $('mOk').textContent = tiene ? 'Cambiar la clave' : 'Generar';
  return m;
}

function accpEditar(p) {
  const D = ACCPD, v = p ? Object.assign({}, p) : { ESTADO: 'Pendiente' };
  if (v.DNI && !accpDni(v.DNI)) v.DNI = '';
  const ests = Array.from(new Set((D.listas.ESTABLECIMIENTOS || []).concat(RES && RES.filas ? RES.filas.map(f => f.cod) : []))).filter(c => !/toda/i.test(c));
  const selE = accpLista(v.ESTABLECIMIENTOS), toda = /toda/i.test(v.ESTABLECIMIENTOS || ''), selM = /(^|,)\s*todos\s*(,|$)/i.test(v.MODULOS || '') ? ['Todos'] : accpLista(v.MODULOS);
  const caja = (grupo, val, on) => '<label style="display:inline-flex;gap:4px;align-items:center;margin:2px 10px 2px 0"><input type="checkbox" data-g="' + grupo + '" value="' + esc(val) + '"' + (on ? ' checked' : '') + '>' + esc(val) + '</label>';
  const extra = '<div class="f ancho" style="margin-top:8px"><b class="peq">Establecimientos</b><div>' + caja('E', 'Toda la red', toda) + ests.map(c => caja('E', c, !toda && selE.indexOf(c) >= 0)).join('') + '</div></div>' +
    '<div class="f ancho" style="margin-top:8px"><b class="peq">Módulos que puede cargar</b><div>' + caja('M', 'Todos', selM[0] === 'Todos') + D.modulos.map(m => caja('M', m, selM[0] !== 'Todos' && selM.some(s => s.toLowerCase().slice(0, 5) === m.toLowerCase().slice(0, 5)))).join('') + '</div>' +
    '<span class="mu peq">' + (D.soloPersonal || []).join(', ') + ': solo con clave personal (nunca con la clave común).</span></div>';
  const campos = [['APELLIDO_Y_NOMBRE', 'Apellido y nombre'], ['DNI', 'DNI (solo números)'], ['CORREO', 'Correo'], ['ROL', 'Rol', D.listas.ROL && D.listas.ROL.length ? D.listas.ROL : null],
    ['ESTADO', 'Estado', D.listas.ESTADO && D.listas.ESTADO.length ? D.listas.ESTADO : ['Activo', 'Pendiente', 'Baja']], ['OBSERVACIONES', 'Observaciones', null, 1]];
  modal(p ? 'Editar acceso · ' + (p.APELLIDO_Y_NOMBRE || '') : 'Nueva persona', campos, v, async out => {
    const marc = g => Array.from(document.querySelectorAll('#ov input[data-g="' + g + '"]:checked')).map(i => i.value);
    const E = marc('E'), M = marc('M');
    out.ESTABLECIMIENTOS = E.indexOf('Toda la red') >= 0 ? 'Toda la red' : E.join(', ');
    out.MODULOS = M.indexOf('Todos') >= 0 ? 'Todos' : M.join(', ');
    if (!out.APELLIDO_Y_NOMBRE.trim()) return 'Falta el apellido y nombre.';
    if (out.DNI && !/^\d{7,9}$/.test(accpDni(out.DNI))) return 'El DNI tiene que tener entre 7 y 9 números.';
    if (/^activ/i.test(out.ESTADO) && (!E.length || !M.length)) return 'Para dejarla Activa marcá al menos un establecimiento y un módulo.';
    try { const r = await api('p_acc_guardar', { fila: p ? p.fila : 0, datos: out }, 60000); if (!r.ok) return r.mensaje || 'No se pudo guardar.';
      toast(p ? 'Cambios guardados en ACCESOS.' : 'Persona agregada en ACCESOS (fila ' + r.fila + ').'); setTimeout(() => accesosPantalla(true), 0); }
    catch (e) { return 'No se pudo conectar con el sistema.'; }
  }, extra);
}
// Habilitación progresiva (12/10/2026): desde qué fecha la clave común ve cada módulo (BASE COMÚN › HABILITACION)
function accpCalendario(D) {
  const L = D.habilitacion, hab = D.habilitados || {}, fF = s => s ? s.split('-').reverse().join('/') : '';
  const cab = '<section class="card" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:16px">Habilitación progresiva para referentes</h2>' +
    (D.hojaHab ? '<a class="btn sec peq" href="' + esc(D.hojaHab) + '" target="_blank" rel="noopener">Cambiar fechas en la hoja ↗</a>' : '') + '</div>' +

      '<section class="card" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">' + (nuevo ? '' : '<button class="btn sec" id="m8h">Generar hallazgos (P y NC)</button>' + (cab0 && cab0.informe ? '<a class="btn sec" href="' + esc(cab0.informe) + '" target="_blank" rel="noopener">Abrir informe ↗</a>' : '') + '<button class="btn sec" id="m8inf">' + (cab0 && cab0.informe ? 'Generar otro borrador' : 'Generar informe a la Dirección') + '</button>') + '<a class="btn sec" href="' + M8_LINKS.modelo + '" target="_blank" rel="noopener">Modelo de informe ↗</a><button class="btn pri" id="m8save"' + (items.length ? '' : ' disabled') + '>Guardar</button></section>');

// Plan de acción del módulo

    async v => { if (!s && S.some(x => x.id === v.id.trim())) return 'Ya existe ese ID.'; const r = await m8api('m8_servicio_guardar', Object.assign(v, { id: s ? s.id : v.id.trim() })); if (!r.ok) return r.mensaje; toast('Guardado.'); await m8cargar('#m8serv', true); m8Servicios(); return ''; });

  $('lE').onchange = e => { const L = S.filter(s => s.est === e.target.value); if (nom[e.target.value]) $('lN').value = nom[e.target.value];

<script>
// Portal HyS · Estado del establecimiento (ficha): matriz urgencia × gravedad y vistas por tema
// Se carga desde portal.html (<script src>). Para el portal de respaldo de Google, herramientas/armar_respaldo.py lo junta en un solo archivo.
// No pide nada nuevo al servidor: usa los datos del tablero de control (p_tablero), del resumen (p_resumen), de siniestros (p_sin_lista) y del módulo 6 (m8_datos), filtrados por establecimiento.
// Cuadrantes (mismo vocabulario que los plazos técnicos de los informes): Actuar ya (urgente y grave), Resolver rápido (urgente y leve),
// Planificar (no urgente y grave), Vigilar (no urgente y leve). Las reglas están en eeItems().
let EE = { vista: 'matriz' };
const EE_CUAD = [
  { k: 'AY', t: 'Actuar ya', s: 'Urgente y grave', col: '#B4361F', fondo: '#FBEDEA' },
  { k: 'RR', t: 'Resolver rápido', s: 'Urgente y leve', col: '#B7791F', fondo: '#FDF5E6' },
  { k: 'PL', t: 'Planificar', s: 'No urgente y grave', col: '#0D313F', fondo: '#EAF1F4' },
  { k: 'VI', t: 'Vigilar', s: 'No urgente y leve', col: '#5894A7', fondo: '#F2F6F8' }
];
const EE_TEMAS = ['Residuos', 'Agua', 'Plagas', 'Cocina', 'Documentos', 'Personal y RAR', 'Infraestructura'];
// Estilos propios: matriz 2 × 2 (una columna en el celular) y vista por tema con panel lateral
function eeEstilos() { if (document.getElementById('eeCss')) return; const st = document.createElement('style'); st.id = 'eeCss';
  st.textContent = '.ee-m{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ee-v{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:start}@media (max-width:760px){.ee-m{grid-template-columns:1fr}}@media (max-width:1000px){.ee-v{grid-template-columns:1fr}}';
  document.head.appendChild(st); }
const eeCuad = (urg, grave) => urg ? (grave ? 'AY' : 'RR') : (grave ? 'PL' : 'VI');

// Arma la lista de temas a atender de un establecimiento: { tema, cuad, texto, detalle, ir }
// Texto de una observación de remisión semanal: quién la indicó, recordatorio del protocolo y repeticiones del último mes
function remObsTxt(o, rec) {
  const quien = String(o.quien || '').split(/ \(| · /)[0], r = (rec || 'Recordar al CAPS el protocolo de trabajo: remisión semanal de manifiestos a Higiene y Seguridad (PROT-RES-003).');
  return (quien && quien !== 's/d' ? 'Lo indicó ' + quien + ' el ' + fechaTxt(o.fecha).slice(0, 5) + '. ' : '') + (/caps|centro/i.test(o.sitio) ? r : r.replace('al CAPS', 'al sitio')) + (o.veces > 1 ? ' ' + o.veces + '.ª vez en el último mes.' : '');
}
function eeItems(cod, f) {
  const T = TB || {}, hoy = new Date().toISOString().slice(0, 10), sem = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  const L = [], add = (tema, urg, grave, texto, detalle, ir) => L.push({ tema: tema, cuad: eeCuad(urg, grave), texto: texto, detalle: detalle || '', ir: ir || '' });
  const de = l => (l || []).filter(x => x.cod === cod), fc = '#ficha/' + encodeURIComponent(cod);
  // Residuos
  const activo = /^activ/i.test(f.estado || '');
  if (f.diasSinRetiro != null && f.diasSinRetiro > 30) add('Residuos', true, true, f.diasSinRetiro + ' días sin retiro de residuos', 'Último manifiesto ' + fechaTxt(f.ultimoRetiro), fc);
  else if (f.diasSinRetiro != null && f.diasSinRetiro > 10) add('Residuos', true, false, f.diasSinRetiro + ' días sin retiro de residuos', 'Último manifiesto ' + fechaTxt(f.ultimoRetiro), fc);
  else if (activo && f.diasSinRetiro == null) add('Residuos', false, false, 'Sin retiros registrados', 'Habilitado en la aplicación, todavía sin manifiestos', fc);
  const dg = f.diag;
  if (!dg || dg.pct === '' || dg.pct == null) add('Residuos', false, true, 'Sin diagnóstico de residuos', 'Falta la línea de base', '#diag/' + encodeURIComponent(cod));
  else {
    if (dg.estado === 'Enviado') add('Residuos', true, false, 'Diagnóstico enviado por el referente', 'Revisar y cerrar', '#diag/' + encodeURIComponent(cod));
    if (Number(dg.criticos) > 0) add('Residuos', false, true, dg.criticos + ' punto(s) crítico(s) en el diagnóstico', 'Cumplimiento ' + Math.round(dg.pct) + ' %', '#diag/' + encodeURIComponent(cod));
    else if (Number(dg.pct) < 50) add('Residuos', false, true, 'Diagnóstico de residuos con ' + Math.round(dg.pct) + ' % de cumplimiento', 'Menos de la mitad de los requisitos', '#diag/' + encodeURIComponent(cod));
  }
  de((T.auditorias || {}).paraVerificar).forEach(a => add('Residuos', true, false, 'Auditoría interna para verificar', a.id, '#audr/' + encodeURIComponent(a.id)));
  // Remisión semanal de manifiestos (PROT-RES-003 · ResiduosRemision.gs): sitios sin manifiestos de 2 semanas y «no se recibieron»
  const RM = T.remision || {};
  if (RM.activa) { const av = de(RM.avisos).filter(a => !a.silenciado);
    if (av.length) add('Residuos', true, false, av.length + (av.length > 1 ? ' sitios' : ' sitio') + ' sin manifiestos cargados de las últimas 2 semanas',
      av.slice(0, 3).map(a => a.sitio + ' (último ' + fechaTxt(a.ultimo) + (a.nro ? ', N.º ' + a.nro : '') + ')').join(' · ') + (av.length > 3 ? ' · …' : '') + '. Remisión semanal a HyS (PROT-RES-003).', fc); }

    } catch (e) { msg.textContent = 'No se pudo conectar. Probá de nuevo.'; document.querySelectorAll('#rgGuardar,#rgCompleto').forEach(b => b.disabled = false); } };

<script>
// Portal HyS · Datos (editor general) · versión 14.53 (14/10/2026) · servidor: Datos.gs (acciones p_dat_…)
// Regla del sistema: Higiene y Seguridad agrega, cambia y elimina cualquier dato de cualquier libro desde el portal.
// Cada cambio queda en BASE COMÚN › HISTORIAL; cada fila eliminada, en BASE COMÚN › PAPELERA (se puede restaurar).
// Se carga desde portal.html (<script src>). Para el portal de respaldo, herramientas/armar_respaldo.py lo junta en un solo archivo.
let DATL = null, DATH = null, DATD = null;
const DATS = { id: '', hoja: '', q: '', desde: 0, orden: 'nuevas', enc: 0, vista: 'hoja' };
const datCab = (extra) => '<div class="cab"><div><span class="mu peq">Gestión</span><h1>Datos · editar todo</h1><span class="mu peq">Cualquier dato de cualquier libro del sistema: buscar, cambiar, agregar o eliminar filas. Cada cambio queda en el historial y lo eliminado va a la papelera.</span></div><div class="filtros">' + (extra || '') + '</div></div>';
function datRuta() {
  const p = location.hash.replace(/^#datos\/?/, '').split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  if (p[0] === 'papelera' || p[0] === 'historial' || p[0] === 'config') { DATS.vista = p[0]; return; }
  DATS.vista = 'hoja'; if (p[0] && p[0] !== DATS.id) { DATS.id = p[0]; DATS.hoja = ''; DATH = null; DATS.desde = 0; DATS.q = ''; DATS.enc = 0; }
  if (p[1] !== undefined && p[1] !== DATS.hoja) { DATS.hoja = p[1]; DATS.desde = 0; DATS.q = ''; DATS.enc = 0; }
}
const datIr = () => { const h = '#datos/' + encodeURIComponent(DATS.id) + (DATS.hoja ? '/' + encodeURIComponent(DATS.hoja) : ''); if (location.hash !== h) location.hash = h; else datos(); };

async function datos(fresco) {
  datRuta();
  if (!DATL || fresco === 'libros') { cargando('#datos', 'Buscando los libros del sistema…'); try { DATL = await api('p_dat_libros', { fresco: fresco === 'libros' }, 180000); } catch (e) { return; } }
  if (!DATL.ok) return marco('#datos', datCab() + '<div class="aviso error">' + esc(DATL.mensaje || DATL.error || 'No se pudo leer.') + (/instalar|desconocida/i.test(DATL.mensaje || DATL.error || '') ? ' Falta instalar Datos.gs en el Sistema HyS.' : '') + '</div>');
  if (DATS.vista === 'papelera') return datPapelera();
  if (DATS.vista === 'historial') return datHistorial();
  if (DATS.vista === 'config') return datConfig();
  const grupos = {}; DATL.libros.forEach(l => (grupos[l.grupo] = grupos[l.grupo] || []).push(l));
  const otro = DATS.id && !DATL.libros.some(l => l.id === DATS.id);
  const selLibro = '<select class="c" id="dtLib"><option value="">Elegí un libro…</option>' + Object.keys(grupos).map(g => '<optgroup label="' + esc(g) + '">' + grupos[g].map(l => '<option value="' + esc(l.id) + '"' + (l.id === DATS.id ? ' selected' : '') + '>' + esc(l.nombre) + '</option>').join('') + '</optgroup>').join('') + (otro ? '<option value="' + esc(DATS.id) + '" selected>Planilla por enlace</option>' : '') + '</select>';
  let cuerpo = '';
  if (DATS.id) {
    if (!DATH || DATH.id !== DATS.id || fresco === 'hojas') { cargando('#datos', 'Abriendo el libro…'); try { DATH = await api('p_dat_hojas', { id: DATS.id }, 120000); } catch (e) { return; } if (!DATH.ok) { const m = DATH.mensaje || DATH.error; DATH = null; return marco('#datos', datCab() + '<div class="aviso error">' + esc(m || 'No se pudo abrir el libro.') + '</div>'); } }
    if (!DATS.hoja) { const v = DATH.hojas.find(h => !h.oculta && h.filas > 1) || DATH.hojas[0]; DATS.hoja = v ? v.nombre : ''; }
    const hojas = '<div class="filtros" style="flex-wrap:wrap;gap:6px;margin:10px 0">' + DATH.hojas.map(h => '<button class="btn ' + (h.nombre === DATS.hoja ? 'pri' : 'sec') + ' peq" data-hoja="' + esc(h.nombre) + '">' + esc(h.nombre) + (h.oculta ? ' (oculta)' : '') + ' <span class="mu">' + Math.max(0, h.filas) + '</span></button>').join('') + '</div>';
    cuerpo = '<section class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2>' + esc(DATH.nombre) + '</h2><a class="btn sec peq" href="' + esc(DATH.url) + '" target="_blank" rel="noopener">Abrir la planilla ↗</a></div>' + hojas + '<div id="dtHoja"><div class="cargando">Leyendo la hoja…</div></div></section>';
  } else cuerpo = '<section class="card peq">Elegí un libro de la lista o pegá el enlace de cualquier otra planilla de Google. Los libros salen de la configuración del sistema: si falta alguno, sumalo con la propiedad del script DATOS_LIBROS_EXTRA o pegá su enlace.</section>';
  marco('#datos', datCab('<button class="btn sec" id="dtPap">Papelera</button><button class="btn sec" id="dtHis">Historial de cambios</button><button class="btn sec" id="dtCfg">Configuración</button><button class="btn sec" id="dtAct">Actualizar lista</button>') +
    '<section class="card"><div class="filtros" style="align-items:flex-end"><label class="f" style="flex:2;min-width:240px">Libro' + selLibro + '</label><label class="f" style="flex:2;min-width:240px">…o enlace de otra planilla<input class="c" id="dtUrl" placeholder="https://docs.google.com/spreadsheets/d/…"></label><button class="btn sec" id="dtUrlOk">Abrir</button></div></section>' + cuerpo);
  $('dtLib').onchange = e => { DATS.id = e.target.value; DATS.hoja = ''; DATH = null; DATS.desde = 0; DATS.q = ''; DATS.enc = 0; if (DATS.id) datIr(); else location.hash = '#datos'; };
  $('dtUrlOk').onclick = () => { const m = ($('dtUrl').value.match(/[-\w]{25,}/) || [])[0]; if (!m) return toast('Pegá el enlace completo de la planilla.'); DATS.id = m; DATS.hoja = ''; DATH = null; datIr(); };
  $('dtAct').onclick = () => datos('libros'); $('dtPap').onclick = () => location.hash = '#datos/papelera'; $('dtHis').onclick = () => location.hash = '#datos/historial'; $('dtCfg').onclick = () => location.hash = '#datos/config';
  document.querySelectorAll('[data-hoja]').forEach(b => b.onclick = () => { DATS.hoja = b.dataset.hoja; DATS.desde = 0; DATS.q = ''; DATS.enc = 0; datIr(); });
