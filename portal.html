<style>

/* ---- Fase 1: menú por tareas, tablero, ayuda y celular ---- */

.tb2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }

.at { display: flex; gap: 10px; align-items: flex-start; text-decoration: none; padding: 9px 0; border-top: 1px solid #EEF2F4; color: inherit; }

.atg-l { display: flex; flex-direction: column; margin: 6px 0 0 62px; } .atg-l a { font-size: 13px; padding: 5px 0; border-top: 1px dashed #EEF2F4; text-decoration: none; color: inherit; }

.tag { font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.tag.er { background: #FBE6E1; color: #B4361F; } .tag.ok { background: #E2F2E8; color: #1E6B42; } .tag.gr { background: #EEF2F4; color: #5B6B73; } .tag.wa { background: #FFF1D6; color: #8A5200; } .tag.av { background: #E7F0F3; color: #2E5E70; }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--mu); } .leyenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; z-index: 60; box-shadow: -8px 0 30px rgba(13,49,63,.18); padding: 22px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; } .panel p, .panel li { font-size: 14.5px; line-height: 1.5; }
.fchip { font: inherit; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--ln); background: #fff; color: var(--tx); cursor: pointer; min-height: 36px; }
.fchip.on { background: var(--az); border-color: var(--az); color: #fff; }
.tarjetas { display: none; flex-direction: column; gap: 10px; }
.tarj { background: #fff; border: 1px solid var(--ln); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }

nav.lat .grp { color: #fff; padding: 10px 10px 4px; font-size: 14px; font-weight: 700; }
nav.lat a.sub.on { color: var(--az); font-weight: 700; }
nav.lat .busca input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 9px 10px; border-radius: 8px; border: 0; font: inherit; font-size: 13.5px; }
nav.lat .titu.mod { color: #A9C6D1; font-size: 11.5px; letter-spacing: .8px; padding: 14px 10px 2px; }
.sinTab td, .sinTab th { padding: 8px 10px; text-align: left; vertical-align: top; border-top: 1px solid #EEF2F4; font-size: 13px; }
.sinTab tr.cl { cursor: pointer; } .sinTab tr.cl:hover { background: #F4F8FA; }

/* ---- Fase 5: selector de íconos del certificado ---- */
.icoGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; max-height: 270px; overflow-y: auto; padding: 2px; }

.icoT .ms { font-size: 30px; color: var(--az); } .icoT.on { border-color: var(--az); background: #E7F0F3; box-shadow: inset 0 0 0 1px var(--az); color: var(--az); font-weight: 700; }

  .frF { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.6fr auto; gap: 8px; align-items: center; } @media (max-width: 640px) { .frF { grid-template-columns: 1fr 1fr; } }
/* ---- Diseño (oct 2026): misma paleta institucional (Azul Humphreys y Azul Patagonia), más jerarquía y menos ruido ---- */
:root { --tx: #22343C; --mu: #5A6D76; --ln: #DDE6E9; --bg: #F3F6F7; --pa1: #EEF4F6; --pa2: #D6E6EC; --sombra: 0 1px 2px rgba(13,49,63,.05); }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:focus-visible { outline: 3px solid var(--pa); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
/* Barra lateral: queda fija mientras se recorre el contenido */
nav.lat { position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; padding: 22px 12px 18px; scrollbar-width: thin; scrollbar-color: #2A5466 transparent; }
nav.lat .marca b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
nav.lat a, nav.lat button.it { transition: background .15s, color .15s; }
nav.lat a.on, nav.lat a.sub.on { background: rgba(255,255,255,.10); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--pa); }
nav.lat a.sub { color: #C9DCE3; } nav.lat a.sub:hover { color: #fff; }
nav.lat .grp { padding: 16px 10px 4px; }
nav.lat .busca input { background: rgba(255,255,255,.95); }
/* Encabezado de cada pantalla */
main { padding: 30px 40px 72px; gap: 22px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
h2 { font-size: 16.5px; font-weight: 700; letter-spacing: -.005em; }
.cab { padding-bottom: 18px; border-bottom: 1px solid var(--ln); }
/* Tarjetas: un solo nivel de borde, sin sombras decorativas */
.card { border-color: var(--ln); border-radius: 14px; padding: 20px 22px; box-shadow: var(--sombra); }
/* Indicadores: una sola franja dividida con líneas finas, en lugar de cajas sueltas */
.tb5 { gap: 1px !important; background: var(--ln); border: 1px solid var(--ln); border-radius: 14px; overflow: hidden; box-shadow: var(--sombra); }
.tb5 > .kpi2 { border: 0; border-radius: 0; padding: 16px 18px; }
a.kpi2 { transition: background .15s; } a.kpi2:hover { background: var(--pa1); }
.kpi2 span { font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--mu); }
.kpi2 b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.kpi b { font-weight: 800; letter-spacing: -.02em; }
/* Tablas */
th { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--mu); border-bottom: 1px solid var(--ln); }
td { border-bottom-color: #EDF2F4; }
tr.cl:hover td, .sinTab tr.cl:hover { background: var(--pa1); }
/* Estados: píldoras redondeadas, mismo alto */
.chip { border-radius: 999px; padding: 3px 10px; } .chip.mini { padding: 2px 8px; }
.tag { border-radius: 999px; padding: 3px 10px; font-weight: 700; }
/* Botones y campos */

<body>

<script>
// ==================================================================
// PORTAL DE GESTIÓN HyS · uso personal con la clave de Higiene y Seguridad.
// Lee y escribe en las planillas del Sistema HyS a través de Apps Script.
// ==================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwEf6wxSyzMPh0vu2qoeMJnBwZHNu6IRJgCnAG1sykyuu5N4N4JEFUd_Ve_0Zlu5nME/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fechaTxt = f => f ? String(f).slice(0, 10).split('-').reverse().join('/') : '—';
const LS = { get: (k, d) => { try { const v = localStorage.getItem('portal_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem('portal_' + k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem('portal_' + k); } catch (e) {} } };
let FICHAS = {};
const RESPALDO = /googleusercontent\.com$/.test(location.hostname);   // portal servido por Google (sin GitHub)
const DIAG_URL = RESPALDO ? API_URL + '?p=diagnostico' : 'https://hyslhmh-sudo.github.io/manifiestos/diagnostico.html';
const APP_URL = RESPALDO ? API_URL + '?p=app' : 'https://hyslhmh-sudo.github.io/manifiestos/';
const CAP_URL = 'https://docs.google.com/spreadsheets/d/1rrYVwT83jGfPTYvgIxH9eSaVl1apqmwcoExCvyEDHSw/edit';   // módulo 9 · Capacitaciones (su planilla; tiene su propio panel)
let BUS = { q: '', r: null };
const diagMensaje = nombre => 'Hola' + (nombre ? ', equipo del ' + nombre : '') + '. Para completar el diagnóstico de gestión de residuos de su establecimiento, entren a «Mi establecimiento» (' + APP_URL + ') y, en «1 · Residuos», toquen «Diagnóstico de residuos». Se ingresa con el DNI y la clave personal que les dio Higiene y Seguridad (o, mientras tanto, con la clave del establecimiento). Se puede completar de a partes (Guardar y seguir después) y agregar fotos desde el celular. Al terminar, tocar «Enviar a Higiene y Seguridad». Ante cualquier duda, consultame. Belén Pellegrini · Higiene y Seguridad';
// Informes del diagnóstico (Google Doc editable + PDF)
function informesDiag() {
  const L = DG.D.informes || [], cerrado = DG.estado === 'Cerrado';
  return '<section class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><div><h2>Informe a la Dirección</h2><div class="mu peq">' +
    (cerrado ? 'Genera el informe (Google Doc editable y PDF) con su número HYSL, en la carpeta del establecimiento › Informes.' : 'El informe se genera cuando el ' + (DCFG.pal || 'diagnóstico') + ' está cerrado.') + '</div></div>' +
    '<button class="btn pri" id="dgInforme"' + (cerrado ? '' : ' disabled') + '>' + (L.length ? 'Generar nueva revisión' : 'Generar informe') + '</button></div>' +
    (L.length ? '<div class="peq">' + L.map(i => '<div style="border-top:1px solid #EEF2F4;padding:8px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><span><b>' + esc(i.codigo) + '</b>' + (i.obs ? ' · ' + esc(i.obs) : '') + '</span><span><a href="' + esc(i.doc) + '" target="_blank" rel="noopener">Documento</a> · <a href="' + esc(i.pdf) + '" target="_blank" rel="noopener">PDF</a> · <button class="link" id="dgCorreo">Copiar correo de envío</button></span></div>').join('') + '</div>' : '') + '</section>';
}
async function copiarCorreo(c) {
  const t = 'Asunto: ' + c.asunto + '\n' + (c.copia ? c.copia + '\n' : '') + '\n' + c.cuerpo;
  try { await navigator.clipboard.writeText(t); toast('Correo copiado: pegalo en tu correo y adjuntá el PDF.'); } catch (e) { prompt('Copiá el texto del correo:', t); }
}
function activarInformes() {
  const c = $('dgCorreo'); if (c) c.onclick = async () => { try { const r = await api(DCFG.accCorreo || 'p_informe_correo', { cod: DG.cod, id: DG.id }); if (!r.ok) return toast(r.mensaje); copiarCorreo(r.correo); } catch (e) {} };
  const b = $('dgInforme'); if (!b) return;
  b.onclick = async () => {
    if (DG.sucio) return toast('Guardá los cambios antes de generar el informe.');
    b.disabled = true; b.textContent = 'Generando… (puede tardar uno o dos minutos)';
    let r; try { r = await api(DCFG.accInforme || 'p_informe_diag', { cod: DG.cod, id: DG.id }, 330000); } catch (e) { b.disabled = false; b.textContent = 'Generar informe'; return; }
    if (!r.ok) { toast(r.mensaje || 'No se pudo generar el informe.'); b.disabled = false; b.textContent = 'Generar informe'; return; }
    DG.D.informes = [{ codigo: r.codigo, doc: r.doc, pdf: r.pdf, obs: r.revision ? 'Revisión ' + r.revision : '' }];
    toast('Informe ' + r.codigo + ' listo' + (r.notasAlPie ? '' : ' (referencias al final: falta activar el servicio Google Docs API)') + '.');
    const y = window.scrollY; diagPintar(); window.scrollTo(0, y);
    window.open(r.doc, '_blank');
  };
}
function compartirDiag(nombre) {
  return '<section class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><h2>Enlace para los referentes</h2><div class="peq" style="margin-top:4px"><a href="' + APP_URL + '" target="_blank" rel="noopener">' + APP_URL + '</a> › 1 · Residuos › Diagnóstico de residuos</div><div class="mu peq">Cada referente entra con su DNI y su clave personal (Más › «Accesos»); mientras no la tenga, con la clave de su establecimiento.</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-copiar="enlace">Copiar enlace</button><button class="btn sec" data-copiar="mensaje">Copiar mensaje</button><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(diagMensaje(nombre)) + '">Enviar por WhatsApp</a></div></section>';
}
function activarCompartir(nombre) {
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = async () => {
    const t = b.dataset.copiar === 'enlace' ? APP_URL : diagMensaje(nombre);
    try { await navigator.clipboard.writeText(t); toast(b.dataset.copiar === 'enlace' ? 'Enlace copiado.' : 'Mensaje copiado: pegalo en el correo o el chat.'); }
    catch (e) { prompt('Copiá el texto:', t); }
  });
}
let CLAVE = LS.get('clave', ''), RES = null, FICHA = null, TRAB = { cod: '', q: '', datos: null };
const TIPOS_CON = ['Dirección', 'Servicio', 'Jefatura', 'Comité', 'Área administrativa', 'Guardia / urgencias', 'Otro'];
const CODS_EXTRA = [['NC', 'Nivel central (Secretaría de Salud y organismos)'], ['SIN_ASIGNAR', 'Sin establecimiento reconocido']];
const TRAB_COLS = ['CUIL', 'DNI', 'APELLIDOS', 'NOMBRES', 'SITIO', 'FUNCION', 'FUNCION_DETALLE', 'SERVICIO', 'VINCULO', 'EMPRESA', 'CARGO_CONDUCCION', 'EMAIL', 'EMAIL_FECHA', 'TELEFONO', 'EN_NTEAR', 'FUENTES', 'ULTIMA_CONFIRMACION', 'REVISAR', 'MOTIVO_REVISION', 'ESTADO', 'FECHA_ALTA', 'ESTABLECIMIENTO'];

// ------------------------------------------------------------------ Respuesta rápida (14.50): las pantallas de lectura se muestran al instante con lo último
// guardado en este equipo y se actualizan solas por detrás; si llegó algo distinto, la pantalla se vuelve a dibujar. Cualquier carga o cambio borra lo guardado.
const SWR_LEER = {   // acción de lectura → cómo olvidar la copia en memoria de la pantalla
  p_ficha: d => { delete FICHAS[d.cod]; }, p_mi: () => {}, p_rad_tablero: () => { RADT = null; }, p_rad_detalle: d => { delete RADD[d.cod]; },
  p_inc_tablero: () => { INCT = null; }, p_inc_detalle: d => { delete INCD[d.cod]; }, p_inc_novedades: () => { INCNP = null; }, p_resnov_listar: () => { RNP = null; }, p_desv_listar: () => { DAC = null; }, p_rgrl_datos: () => { RG = null; },
  p_coc_tablero: () => { COCT = null; }, p_coc_personas: () => { COCP.cargado = ''; }, p_mipyv: () => { MIPYV = null; }, p_acc_listar: () => { ACCPD = null; },
  p_docest_lista: () => { DE.L = null; }, p_notas: () => { NT.R = null; }, p_sin_lista: () => { SINP = null; }, p_dgm_tablero: d => { delete DGMT[d.m]; },
  p_bib_listar: () => { BIB = null; }, p_registro: () => {}, p_bj_listar: () => {}, p_sin_est: () => {}, p_diag_tablero: () => { TAB = null; }, p_trab: () => {}, p_nte_revisar: () => {}
};
const SWR_SIN_BORRAR = /^p_(ping|resumen|tablero|buscar|plan_listar|aud_listar|aud_opciones|res_|informe_trim_op|rgrl_lugares|rgrl_detalle|imp_(opciones|hoja)|plan_abrir|aud_abrir|aud_resultado|inv_abrir|caps|sin_persona|sin_expo|cv_(datos|cuenta|comparar)|cg_(buscar|persona$|participantes|contactos|mails_previa|informe_op|correos$|correo_ver)|.*_dni)/;
const swrK = (a, d) => 'swr_' + a + '|' + JSON.stringify(d || {});
function swrBorrar() { try { Object.keys(localStorage).filter(k => k.indexOf('portal_swr_') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
function swrGuardar(k, v) { try { localStorage.setItem('portal_' + k, JSON.stringify({ t: Date.now(), v: v })); } catch (e) { swrBorrar(); } }
async function api(accion, datos, ms) {
  const d = datos || {}, leer = SWR_LEER[accion];
  if (!leer) { const r = await apiRed(accion, d, ms); if (!SWR_SIN_BORRAR.test(accion) && r && r.ok !== false) swrBorrar(); return r; }
  const k = swrK(accion, Object.assign({}, d, { fresco: undefined })), g = LS.get(k, null), edad = g ? Date.now() - g.t : Infinity;
  if (d.fresco || !g || edad > 7 * 864e5) { const r = await apiRed(accion, d, ms); if (r && r.ok) swrGuardar(k, r); return r; }
  if (edad < 60000) return g.v;   // recién actualizado: no se vuelve a pedir
  const hash = location.hash;
  apiRed(accion, d, ms).then(r => {
    if (!r || !r.ok) return; const cambio = JSON.stringify(r) !== JSON.stringify(g.v); swrGuardar(k, r);
    if (!cambio || location.hash !== hash || !$('ov').hidden || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))) return;
    try { leer(d); } catch (e) {}
    if (accion === 'p_mi') { if ($('fMi')) fichaMi(d.cod); } else router();
  }).catch(() => {});
  return g.v;
}
async function apiRed(accion, datos, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 90000);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: accion, clave: CLAVE, est: '', datos: datos || {} }), signal: ctl.signal });
    const j = JSON.parse(await r.text());
    if (j.error === 'clave') { salir('La clave no es correcta.'); throw new Error('clave'); }
    return j;
  } catch (e) { if (e.message !== 'clave') toast(e.name === 'AbortError' ? 'El sistema tardó demasiado. Probá de nuevo.' : 'No se pudo conectar con el sistema.'); throw e; }
  finally { clearTimeout(t); }
}
function toast(m) { if (m === NAV_VIEJA.message) return; const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }

// ------------------------------------------------------------------ Ingreso
function ingreso(msg) {
  $('raiz').innerHTML = '<div class="login card"><h1>Portal HyS</h1><p class="mu" style="margin:0">Gestión de la red provincial de Higiene y Seguridad. Ingresá con la clave de Higiene y Seguridad.</p>' +
    (msg ? '<div class="aviso error">' + esc(msg) + '</div>' : '') +
    '<label class="f">Clave<input class="c" id="clave" type="password" autocomplete="current-password"></label>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="recordar" checked> Recordar en este equipo (solo equipos personales)</label>' +
    '<button class="btn pri" id="entrar">Ingresar</button></div>';
  const ir = async () => {
    const c = $('clave').value.trim(); if (!c) return;
    $('entrar').disabled = true; $('entrar').textContent = 'Verificando…'; CLAVE = c;
    try { const r = await api('p_ping', {}, 30000); if (!r.ok) throw new Error(); LS.set('verSrv', r.version || 'anterior a la 9'); if ($('recordar').checked) LS.set('clave', c); const g = LS.get('res', null); if (g) { RES = g; refrescarRes(); } if (!location.hash || location.hash === '#') location.hash = '#inicio'; else router(); }
    catch (e) { if (e.message !== 'clave') ingreso('No se pudo ingresar. Revisá la clave y la conexión.'); }
  };
  $('entrar').onclick = ir; $('clave').onkeydown = e => { if (e.key === 'Enter') ir(); }; $('clave').focus();
}
function salir(msg) { swrBorrar(); CLAVE = ''; LS.del('clave'); LS.del('res'); LS.del('tab'); RES = null; FICHAS = {}; ingreso(msg); }

// ------------------------------------------------------------------ Estructura
// Pantallas que se dejaron atrás: si terminan de cargar tarde (respuesta lenta del servidor), no se dibujan encima de la actual
const NAV = { act: null, ruta: null, sync: false, dejadas: new Set() };
const NAV_VIEJA = new Error('pantalla-anterior');
window.addEventListener('unhandledrejection', e => { if (e.reason === NAV_VIEJA) e.preventDefault(); });
window.addEventListener('error', e => { if (e.error === NAV_VIEJA) e.preventDefault(); });
function marco(activo, contenido) {
  const base = String(activo).split('/')[0];
  if (NAV.sync) { NAV.act = base; NAV.dejadas.delete(base); }
  else if (!NAV.act) { NAV.act = base; NAV.dejadas.delete(base); }
  else if (base !== NAV.act && NAV.dejadas.has(base)) throw NAV_VIEJA;
  // Pantallas que no están en el menú se marcan en el ítem del que dependen
  const ALIAS = { '#ficha': '#est', '#inv': '#sin', '#buscar': '#trab', '#audr': '#aud', '#capficha': '#capcat', '#capalta': '#capcat', '#capdicnuevo': '#capdic', '#capins': '#capdic', '#capserv': '#capcump', '#capjef': '#capcump', '#m8plan': '#m8' };
  const ruta0 = activo.split('/')[0], ruta = ALIAS[ruta0] || ruta0;
  const it = (h, ico, t, sub) => '<a href="' + h + '" class="' + (ruta === h ? 'on' : '') + (sub ? ' sub' : '') + '"' + (ruta === h ? ' aria-current="page"' : '') + '>' + (ico ? '<span class="ms" aria-hidden="true">' + ico + '</span>' : '') + t + '</a>';
  // Módulos desplegables: se abre solo el de la pantalla actual y los que se abran a mano en esta sesión
  let navAb = []; try { navAb = JSON.parse(sessionStorage.getItem('navAb') || '[]'); } catch (e) {}
  const grp = (id, ico, t, items) => '<details class="mod" data-m="' + id + '"' + (items.indexOf('class="on') >= 0 || navAb.indexOf(id) >= 0 ? ' open' : '') + '><summary><span class="ms" aria-hidden="true">' + ico + '</span><span class="t">' + t + '</span><span class="ms flecha" aria-hidden="true">expand_more</span></summary>' + items + '</details>';
  const pes = t => '<div class="pes">' + t + '</div>';   // pestaña del módulo (Estado · Datos · Evaluación · Documentos)
  const ext = (h, t) => '<a href="' + esc(h || '#') + '" target="_blank" rel="noopener" class="sub">' + t + ' ↗</a>';
  const en = RES && RES.enlaces || {};
  const inf = (h, ico, t) => '<a href="' + h + '" class="' + (ruta === h ? 'on' : '') + '"><span class="ms" aria-hidden="true">' + ico + '</span>' + t + '</a>';
  $('raiz').innerHTML = '<div class="app"><nav class="lat" id="lat" aria-label="Menú principal"><div class="marca"><b>Portal HyS</b><span>Red provincial · Chubut</span></div>' +
    '<form class="busca" id="fBusca" role="search"><input id="qBusca" type="search" placeholder="Buscar DNI, apellido o N.º CH" aria-label="Buscar personas y siniestros" value="' + esc(BUS.q || '') + '"></form>' +
    it('#inicio', 'dashboard', 'Tablero') +
    // 18/10/2026 (Belén): «Para validar» arriba, junto al Tablero (antes estaba dentro de 9 · Capacitaciones), con cuántas personas esperan
    it('#capval', 'fact_check', 'Para validar' + (typeof CAPV !== 'undefined' && CAPV && CAPV.grupos && CAPV.grupos.length ? ' <span class="chip mini er" style="margin-left:6px">' + CAPV.grupos.length + '</span>' : '')) +
    it('#est', 'apartment', 'Establecimientos') +
    '<div class="titu mod">Módulos</div>' +
    // 14.54 · fase 1 del sistema de gestión: 10 módulos técnicos con las mismas pestañas (Estado · Datos · Evaluación · Documentos) y 11 · Gestión

  '#m8rel': ['Relevamiento', ['Elegí el edificio (capa A, requisitos del RGRL) o el servicio (capa B, requisitos de su directriz): la lista de verificación se arma sola.', 'Tocá C, P, NC o NA en cada punto; tocá de nuevo para borrar la respuesta. ★ = crítico: si no cumple, pegá el enlace de la foto.', '«Guardar» escribe en la planilla. Después, «Generar hallazgos» pasa los P y NC al plan de acción con su prioridad y plazo.', '«Generar informe a la Dirección» arma un borrador en Google Docs (carpeta del módulo › INFORMES) con portada, índice, métodos, notas al pie, plan de acción y anexos. Lo que hay que revisar queda en celeste e itálica.', 'Para auditorías, elegí el tipo «Auditoría» y usá un ID nuevo (por ejemplo, con la fecha).']],
  '#m8plan': ['Plan de acción del módulo 6', ['Hallazgos ordenados por prioridad: Actuar ya (30 días), Resolver rápido (90) y Planificar (180).', 'Tocá una fila para cargar la respuesta de la Dirección, cambiar el estado, ajustar la propuesta o cerrar el hallazgo.']],
  '#inc': ['7 · Protección contra incendios · Extintores', ['Inventario de extintores de la red Trelew (HZT y sus sitios, HMH) y del HSST con sus CAPS, en el libro «PROTECCIÓN CONTRA INCENDIOS · Sistema HyS» (Drive › SISTEMA HyS › MÓDULO 10). La carga inicial salió de la planilla «Inventario de Extintores».', 'Por lugar: cuántos extintores hay, cuántos tienen la carga vencida o por vencer (aviso 30 días antes, también para la prueba hidráulica, en este tablero y en «Requiere atención»), cuántos tienen observación (sobrecarga, recargar, fuera de servicio) y el último control.', 'Control: mensual, con 3 fotos obligatorias por extintor (panorámica con el entorno, marbete y N.º de inventario). La alarma por falta de control aparece a los 3 meses; los nunca controlados avisan desde el 14/01/2027.', 'Controlan: HMH, Belén, Melani, SOMI y MAREM; red Trelew (HZT, sede ex ADOS, CAPS, dispositivos y ambulancias), Belén, Melani y Javier Tramaleo; HSST, a definir. Desde «Mi establecimiento» lo cargan las personas con el módulo Incendio en Accesos; Javier Tramaleo, desde MIPyV.', 'Agregar extintores: HyS desde acá, Melani, SOMI y MAREM desde «Mi establecimiento» y Javier Tramaleo desde MIPyV. Al agregar uno, todos los datos y las 3 fotos son obligatorios; en Observaciones queda quién y cuándo lo agregó.', 'Normativa: Ley 19.587; Dto. 351/79, cap. 18 y Anexo VII.']],
  '#desvacc': ['1 · Desvíos: acciones y seguimiento', ['Lo que registran los operarios de Star Union en el recorrido de retiro del HMH. Cada desvío lleva una acción tuya y se cierra cuando se verifica en el lugar que se corrigió.', 'Arriba, las vistas: «Para actuar» (sin acción, primero los vencidos), «En seguimiento» (verificar en el lugar), «A confirmar» (los operarios dicen que se corrigió), «Evaluar escalar» (el lugar acumula desvíos o uno persiste) y «Cerrados».', 'Marcá uno o varios desvíos y tocá «Tomar acción»: nota al servicio, a Servicios Generales, a tu jefe, a Star Union, pedido de contenedores, capacitación al servicio, seguimiento en recorrida, solo registro u otra. Con varios desvíos se arma una sola nota (la nota al servicio, una por servicio).', 'Las notas se generan como BORRADOR con el modelo de nota interna (hechos con cada desvío y su foto, fundamento normativo y lo que se solicita) y quedan en «Notas enviadas y recibidas» como Borrador. Revisalas y envialas vos; nunca se envía nada solo.', '«Verificar»: Corregido cierra el desvío; Persiste lo deja en seguimiento con plazo nuevo y sugiere escalar. Melani verifica desde «Mi establecimiento» y los operarios en el próximo recorrido.', 'Los plazos dependen de la gravedad (hoja PLAZOS de la planilla de desvíos). Los tipos de acción, el destinatario sugerido y los textos de la nota se cambian en la hoja TIPOS_ACCION. Todo queda también en las hojas ACCIONES y SEGUIMIENTOS.']],
  '#resnov': ['1 · Novedades de residuos', ['Lo que se vio mal en las recorridas de residuos y se informó desde «Mi establecimiento» › 1 · Residuos › «Informar una novedad» (Melani en la red Trelew y el referente de residuos del HSST, con el módulo Residuos).', 'Primero aparecen las de residuos peligrosos (biopatogénicos, cortopunzantes, medicamentos, ampollas y químicos). Las abiertas entran en «Requiere atención» del Tablero general: en rojo si hay alguna de residuos peligrosos.', '«Resuelta» la marca con lo que se hizo. También la pueden marcar quienes tienen el módulo Residuos en ese establecimiento.', 'Los desvíos que registran los operarios de Star Union en el recorrido del HMH (DR-…) no aparecen acá: se gestionan solo en «Desvíos: acciones y seguimiento», para no tenerlos dos veces.', 'Cada novedad queda en el libro de manifiestos del establecimiento, hoja NOVEDADES_RES. Si falla la aplicación, se carga a mano desde la fila 6. No se envían correos.']],
  '#incnov': ['7 · Novedades y recorridas de seguridad', ['Lo que informan Seguridad (MAREM), SOMI y Melani desde «Mi establecimiento»: recorridas de seguridad contra incendios (12 puntos por sector; cada «No» con foto) y novedades (principio de incendio, alarma activada, olor a quemado, uso de un extintor, salida obstruida, instalación dañada u otra).', 'Cada recorrida con problemas y cada novedad se avisa por correo solo a Higiene y Seguridad (SITIOS_INC › CORREOS_NOVEDADES) y queda en «Requiere atención» hasta que se marca «Resuelta» (SOMI, Melani o HyS).', 'Si se usó un extintor, además queda con el problema «Se usó» y va en el correo de extintores a SOMI y Mantenimiento.', 'Empresas (SOMI, MAREM): entran con la clave de la empresa, sin DNI (BASE COMÚN › ACCESOS, ROL = Servicio). Cada registro pide DNI, nombre y correo de quien lo hace, cruzados con la base de personal; las altas y cambios de datos van a la Bandeja (NÓMINA DE PERSONAL) y quedan en la hoja PERSONAL_SERVICIOS (ACTIVO = No bloquea a una persona).', 'Hojas: RECORRIDAS, NOVEDADES_INC y PERSONAL_SERVICIOS del libro de incendio. Normativa: Ley 19.587; Dto. 351/79, cap. 18.']],
  '#incest': ['7 · Extintores de un lugar', ['Lista de extintores con su ubicación, tipo, N.º de inventario, vencimiento de la carga y de la prueba hidráulica, estado y último control con sus fotos.', '«Control»: fecha, 5 verificaciones (en su lugar, acceso libre, manómetro, precinto y señalización) y las 3 fotos obligatorias. También pide el vencimiento de la carga (obligatorio, de la tarjeta) y el de la prueba hidráulica (si figura): si cambian, se actualiza el extintor y queda en CAMBIOS; si la carga está vencida o la tarjeta no se lee, queda como problema.', 'Verificar: Javier (MIPyV), Melani, SOMI y MAREM (aplicación) pueden agregar extintores y corregir el nombre o N.º y la ubicación (lugar, planta, sector, dónde está). Eso queda «Para verificar» (también en «Requiere atención»), con el cambio anotado en «Último cambio» y en la columna CAMBIOS de la planilla. «Verificar» lo da por bueno; «Editar» lo corrige y, al guardar desde acá, queda verificado. «Verificar los N pendientes» verifica todos los de la lista.', 'Aviso por correo (HMH): si en el control se marca un problema (no está, se usó, poca o demasiada presión, precinto roto, dañado, obstruido, etc.), alguna verificación da «No» o el estado pasa a Sobrecarga, Recargar o Fuera de servicio, queda como problema abierto y va en un solo correo por día con todos los extintores con problemas a SOMI (Ing. Erick Velázquez) y a Mantenimiento del HMH (Ing. Ezequiel Nieto): a las 6 h del día siguiente y, mientras no se marque resuelto, cada 3 días. El correo separa nuevos, los que siguen sin resolver (con los días) y los resueltos. El extintor muestra «Problema abierto» con el botón «Marcar resuelto» (también en la aplicación). En el tablero, «Mandar el correo ahora» lo manda en el momento. Filtro «Con problema abierto». Los problemas quedan en la hoja FALLAS. Los destinatarios se cambian en la planilla, hoja SITIOS_INC › CORREOS_FALLA; en CONTROLES › AVISO_CORREO queda si se envió.', '«Editar» corrige cualquier dato del extintor; para sacarlo, Estado = Baja (no se borra). «Agregar extintor» suma uno nuevo: todos los datos y las 3 fotos son obligatorios (si no tiene N.º de inventario, «s/d»; la prueba hidráulica, si no se sabe, queda «s/d (revisar)»). No deja cargar dos veces el mismo N.º de inventario en un establecimiento.', 'Lo que había que revisar de la planilla de origen (números de inventario incompletos o repetidos, fechas corregidas, datos faltantes) está en Observaciones.']],
  '#rad': ['5 · Radiaciones ionizantes', ['Rayos X de toda la red: radiología, tomografía, arco en C (quirófano) y odontológicos. No incluye medicina nuclear ni radioterapia.', 'Tablero: sitios con rayos X (y cuántos de la provincia faltan confirmar), dosímetros activos, extraviados, eventos abiertos, equipos y habilitaciones, y establecimientos a los que les falta alguno de los dos últimos informes bimestrales de dosimetría (MKS informa por bimestre: ene–feb, mar–abr, may–jun, jul–ago, sep–oct, nov–dic; se espera el informe desde el segundo mes siguiente). «Requiere atención» lleva directo a la pestaña que hay que completar.', 'Tocá un establecimiento (o elegilo en «Abrir un establecimiento») para cargar sus datos. «Mostrar también los que no tienen datos» lista toda la red.', 'Todo queda en la planilla RADIACIONES IONIZANTES · Sistema HyS (se puede corregir ahí, desde la fila 6) y los archivos en SISTEMA HyS › MÓDULO 9 · RADIACIONES IONIZANTES › Establecimientos.', 'Normativa: Ley 17.557 y Dto. 6320/68; Ley 19.587 y Dto. 351/79; Res. SRT 37/10, 81/19 y 905/15. El sistema no envía correos.']],
  '#radest': ['5 · Radiaciones de un establecimiento', ['Formularios del dosímetro (pestaña «Formularios (F-RAD)», o menú 5 · Radiaciones › «Formularios del dosímetro»): elegí el F-RAD-01, 02 o 03 y el trabajador; los datos se completan solos y se pueden corregir antes de «Imprimir con estos datos». «Imprimir en blanco» lo saca vacío. Los datos personales salen de la BASE DE TRABAJADORES (base única); «Guardar estos datos en la base de personal» los corrige ahí, con historial.', 'Formularios del dosímetro (25/10/2026): en el alta, la baja y los eventos de extravío o daño, el botón «Imprimir F-RAD-01 / 02 / 03» arma el formulario con los datos del cuadro, en dos copias (Personal y Higiene y Seguridad); el alta lleva el anexo «Compromiso de uso del dosímetro personal». Firmado, se adjunta en el mismo cuadro y queda en PERSONAL_EXPUESTO › FORM_ALTA / FORM_BAJA o en EVENTOS › FORM_NOVEDAD. En blanco: Más › Hojas para imprimir › 5 · Radiaciones.', 'Sitios: los edificios, CAPS, sede ex ADOS y dispositivos del establecimiento (salen de BASE COMÚN › SITIOS). Para cada uno se marca si tiene rayos X (Sí, No o A confirmar) y qué equipos. En la red Trelew, HZT Central, sede ex ADOS, CAPS y HMH ya figuran con Sí; el resto de la provincia está A confirmar. «Ver» o el selector «Sitio» de arriba filtran todas las pestañas por ese sitio; lo que se carga con un sitio elegido queda en ese sitio.', 'Personal y dosímetros: una fila por persona expuesta. Al escribir el DNI se completan los datos de la base de trabajadores; «En la base de trabajadores» sugiere personas de imágenes, rayos, tomografía, odontología o hemodinamia. «Dar de baja» (a pedido del trabajador o por fin de exposición) no borra a nadie; «Reactivar» vuelve a dar de alta el dosímetro en la misma fila. Cada cambio queda en «Movimientos».', 'Controles bimestrales: «Cargar informe de dosis (PDF)» lee la tabla del informe del servicio de dosimetría (formato MKS) y te la muestra para revisar y corregir; al guardar, el PDF queda en la carpeta del establecimiento › Dosimetría › año y los valores de cada persona en «Dosis por persona». Si alguien no está en Personal, se agrega (opcional). «Subir solo el PDF del bimestre» guarda el archivo sin valores. «Carpeta de dosimetría» (arriba) abre la carpeta de Drive.', 'Dosis por persona: dosis del período, observación (<LIMx debajo del límite de medición; «llegó tarde»: se informa en el próximo informe), acumulado del año calendario y de los últimos 12 meses, y el PDF de origen. En rojo, lo que supera 30 mSv por período o 50 mSv por año (Res. SS 273/86): el sistema carga el evento «Registro anormal». Respaldo: planilla del módulo, hoja DOSIS.', 'Investigaciones: casos de dosis que el servicio de dosimetría marca para investigar aunque no superen el límite legal (observación B: dosímetro irradiado en condición estática o por radiación primaria; C: posibilidad de superar 6 mSv/año, ICRP). Se abren solos al cargar el informe de dosis; «Revisar dosis cargadas» abre los que falten y «Abrir caso a mano» sirve para otros motivos. En cada caso: entrevista, causa probable, medidas, comunicación y conclusión (obligatoria para cerrar). Respaldo: planilla del módulo, hoja INVESTIGACIONES.', 'Eventos: registro anormal, extravío, dosímetro dañado o no devuelto, exposición accidental. Un extravío deja el dosímetro de la persona como «Extraviado». La exposición accidental superior a la norma se notifica de inmediato a la autoridad sanitaria (Dto. 6320/68, art. 20).', 'Salas y equipos: habilitación, responsables (instalación y uso), plano de plomado y memoria de blindaje, levantamiento radiométrico, control de calidad, señalización, luz de advertencia y elementos plomados.', 'Documentos: habilitaciones, autorizaciones individuales, designaciones, comunicaciones a la autoridad y demás. Nada se borra: se marca Reemplazado o Anulado.', 'Requisitos legales: lo que pide la norma, con su artículo, y si el establecimiento ya tiene el documento que lo acredita. «Falta · cargar» abre la carga con el tipo elegido. Los requisitos se editan en la hoja REQUISITOS.']],
  '#res': ['1 · Residuos · Tablero', ['Estado de los residuos peligrosos de la red con lo que cargan los establecimientos: manifiestos (retiros) y certificados de tratamiento del libro general.', 'Indicadores: establecimientos con cargas, retiros del mes, días sin retiro (verde hasta 10, amarillo de 11 a 30, rojo más de 30), certificados faltantes (meses con retiros y sin certificado; el del mes pasado figura pendiente), manifiestos sin foto y diagnósticos.', '«Requiere atención» ordena lo urgente primero; tocá un aviso o un establecimiento para ver el detalle mes por mes y por sitio, con la frecuencia de retiro pactada (BASE COMÚN › SITIOS › FRECUENCIA_PACTADA).', 'Los datos se guardan 10 minutos y se muestran al instante; «Actualizar» los trae en el momento. También actualiza el último retiro en el tablero de inicio y en la matriz.', 'Normativa: Ley 24.051 y Dto. 831/93 (manifiesto y certificado de tratamiento); Ley XI N.º 35 (Código Ambiental del Chubut).']],
  '#resinf': ['1 · Residuos · Informe de retiros', ['Informe mensual, semestral, anual o de otro período sobre la frecuencia de retiro de residuos peligrosos, para Jefatura de Área Externa / CAPS, STyC, Direcciones o la Secretaría de Salud.', 'Elegís el período, el destinatario (o lo escribís) y los establecimientos o sitios: botones rápidos para la red Trelew completa, todos sus CAPS o todos los CAPS, y en cada establecimiento «Todos», «Solo CAPS», «Sin CAPS» o «Ninguno»; también podés marcar sitios sueltos (un CAPS, la sede ex ADOS, etc.). La selección queda guardada.', '«Vista previa» muestra, por sitio, la frecuencia pactada (contrato o BASE COMÚN › SITIOS), los retiros esperados y realizados, el cumplimiento, los intervalos entre retiros que superan lo admisible (con fechas y N.º de manifiesto) y el detalle de cada retiro.', '«Generar informe» arma el borrador en Google Docs (el PDF solo si tildás la casilla, recién con el visto bueno) con portada, índice, método, protocolo de manifiestos y criterio para el reclamo (2.2), comparativo de los últimos 3 años (retiros y dm³), residuos Y3, costo desde la vigencia del contrato, análisis, conclusión y recomendaciones, y el anexo con fecha, día y N.º de manifiesto de cada retiro. En los informes de CAPS de Rawson agrega el contexto de la bolsa amarilla para Y3, el manual de los CAPS y la designación de un referente. Queda numerado en el registro de documentos y guardado en la carpeta «Informes» del establecimiento (o «Informes de la red»).', 'Los retiros esperados salen del calendario real del período: se descuentan los domingos y los feriados nacionales (la empresa no retira), pero no los feriados ni días no laborables provinciales de Chubut (la empresa retira). Los feriados se cargan en BASE COMÚN › FERIADOS (IMPEESA_NO_RETIRA = Sí). En la frecuencia diaria se cuentan aparte los sábados pactados, y los feriados nacionales entre dos retiros no cuentan para el intervalo admisible.', 'Los datos son solo los manifiestos cargados: un retiro sin manifiesto cargado no aparece. Con muchos sitios conviene generar sin el anexo de detalle: el documento sale más rápido.']],
  '#resfrec': ['1 · Residuos · Frecuencias de retiro', ['Retiros (manifiestos cargados) de cada sitio y establecimiento de la provincia: por mes, por año, promedio mensual, por semana y días entre retiros.', 'Se compara con la frecuencia que fija el contrato (Pactado / mes): diaria salvo domingos = 26; 3 días por semana = 13; semanal = 4,3; quincenal = 2,2; mensual = 1. Cumplimiento: verde 90 % o más, amarillo 70 a 89 %, rojo menos de 70 %.', '«Ver»: por sitio, por establecimiento o «Comparar contratos» (resumen por contrato y grupo). Filtros de área, contrato, período (desde y hasta) y buscador.', 'Los contratos, sus grupos y la frecuencia de cada establecimiento o tipo de sitio se cargan en el libro general, hojas CONTRATOS, CONTRATO_GRUPOS y CONTRATO_ALCANCE (botón «Contratos (planilla)»). Hoy está cargado el contrato de Impeesa 2026; el anterior se suma como otra fila con ESTADO = Anterior.', 'Si los manifiestos se cargan con atraso, la frecuencia real aparece más baja: revisá la fecha del último retiro.']],
  '#rescosto': ['1 · Residuos · Contrato y costos', ['Datos del contrato elegido (empresa, expediente, resolución, vigencia, grupos de precio y cupos) y, por grupo, la lista de sus establecimientos con el volumen facturable de cada mes (Y1 + Y3 en dm³: Impeesa factura ambas corrientes) desde el inicio del contrato y su valor al precio por dm³ del grupo.', 'Cupo total: el excedente se factura solo si la suma de todos los grupos supera el cupo total del contrato en el mes (cláusulas SEGUNDA y SÉPTIMA). El recuadro «Cupo total del contrato» compara mes a mes el cupo con lo cargado por todos los establecimientos; como no todos cargan, lo cargado es un mínimo.', 'Referencia del grupo: ▲ marca el mes en que un establecimiento, por sí solo, superó la cantidad que la cláusula TERCERA asigna a todo su grupo; la columna «Meses sobre la referencia» cuenta los meses cerrados en que pasó. En la vista de cada hospital está el % de la referencia mes por mes.', 'No se suman totales de la red: que un establecimiento no cargue sus manifiestos no significa que no genere residuos. Los que no cargan figuran «Sin manifiestos cargados en el sistema».', 'El excedente no se reparte por establecimiento ni por grupo.', 'Tocá un establecimiento para abrir su vista (1 · Residuos › Tablero › establecimiento): ahí está su cuadro «Contrato y costo» mes por mes.', 'Precios y cupos: libro general, hoja CONTRATO_GRUPOS (si cambia el precio, otra fila con la fecha DESDE nueva).']],
  '#m8serv': ['Edificios y servicios', ['Cada fila es un edificio o un servicio de un establecimiento. El tipo decide qué ítems del catálogo se aplican; la criticidad (1 a 3) pesa en la prioridad.', 'Para sumar un establecimiento de la red, agregá primero su edificio (tipo Edificio) y después sus servicios.']],
  '#datos': ['Datos · editar todo', ['Llave general del sistema: cualquier dato de cualquier libro (libro general, BASE COMÚN, BASE DE TRABAJADORES, claves, libros de cada establecimiento y de cada módulo) se puede buscar, cambiar, agregar o eliminar desde acá. Las pantallas de cada módulo siguen siendo la forma cómoda de cargar.', 'Elegí el libro y la hoja; tocá una fila para ver todas sus columnas. «Duplicar como fila nueva» sirve para cargar una parecida. Las columnas con fórmula se calculan solas y no se pisan.', 'Si la fila cambió en la planilla mientras la editabas, avisa y no guarda: volvé a abrirla.', 'Cada cambio queda en BASE COMÚN › HISTORIAL (antes y después) y se ve en «Historial de cambios». Cada fila eliminada queda en BASE COMÚN › PAPELERA y se puede restaurar.', 'Otra planilla que no esté en la lista: pegá su enlace. Para que quede en la lista: propiedad del script DATOS_LIBROS_EXTRA («ID|Nombre», separados por coma).', 'Algunos tableros (tablero de control, residuos) se recalculan de madrugada; para ver un cambio enseguida, usá «Actualizar» en esa pantalla.', '«Configuración»: los ajustes del sistema (propiedades del script: ID de libros y carpetas, PRECALENTAR_EST, DATOS_LIBROS_EXTRA). Cambiar un ID hace que el sistema use otro libro.', 'Sin GitHub: la misma pantalla está en el portal de respaldo (Herramientas › Portal de respaldo), y todo se puede hacer también en las planillas. Herramientas tiene también los respaldos de Mi establecimiento, la página para referentes y MIPyV.']],
  '#rgrl': ['RGRL · Relevamiento General de Riesgos Laborales', ['Es el formulario del Anexo I de la Res. SRT 463/09 (formulario A general, Dto. 351/79), con el mismo texto y numeración: datos generales, 161 condiciones a cumplir, planillas A (cancerígenos), B (PCB) y C (sustancias a declarar), gremios, contratistas y responsable.', 'Uno por establecimiento o sitio (red Trelew y HSST). Elegí el establecimiento y el lugar y tocá «Empezar». Se actualiza una vez al año: abrí el anterior y «Copiar para este año».', 'Cada condición: Sí, No o No aplica (tocá de nuevo para borrar). Con «No», la fecha de regularización es obligatoria para guardarlo como completo.', 'Vencido (más de 12 meses) = aviso en el tablero. Todo queda en la planilla «M8 · RGRL y mediciones» (hojas RGRL, RGRL_RESPUESTAS y RGRL_PLANILLAS) y se puede completar a mano.']],
  '#medic': ['Mediciones con vencimiento', ['Puesta a tierra y continuidad de masas (Res. SRT 900/15), iluminación (Res. SRT 84/12), ruido (Res. SRT 85/12), pararrayos y otras.', '«Cargar medición»: establecimiento, lugar, tipo, fecha y protocolo (PDF o foto). Si no cargás el vencimiento, es la fecha + 12 meses. La nueva reemplaza a la anterior del mismo tipo y lugar.', 'Vencidas o que vencen en 30 días: urgentes en el tablero de control y en esta pantalla.', 'Recordatorio por correo los jueves a las 7 h a los correos de «Recordatorio a», mientras siga vencida o por vencer. «Ver el recordatorio» muestra el texto sin enviarlo.']],
  '#m8libros': ['Libros para la red', ['Generar: elegí el establecimiento y sus servicios; el libro queda en la carpeta del módulo › LIBROS DE LA RED. Compartilo vos con el referente como editor.', 'El referente completa solo las columnas amarillas (respuesta, observación y foto) y te avisa.', 'Importar: pegá el enlace del libro completo. Se crea un relevamiento por servicio y, si lo marcás, sus hallazgos.']],
  '#inicio': ['Tablero de control', ['Panorama de la gestión de toda la red, de arriba hacia abajo: 1) los totales de Urgente, Pronto y Avisos (tocá uno para ver solo esos); 2) «Lo que requiere atención ahora», con filtro por módulo; 3) «Estado de la gestión por módulo», una tarjeta por módulo con su semáforo (rojo: hay algo urgente; amarillo: hay algo pronto; verde: al día; gris: sin datos); 4) el semáforo por establecimiento; 5) los gráficos de residuos, agua y acciones. Cada número, tarjeta y aviso se toca y lleva al detalle.', '«Lo que requiere atención ahora»: primero lo urgente (rojo), después lo que vence pronto (amarillo) y los avisos. Incluye residuos, agua, plagas, cocinas (carnets y libretas), radiaciones (registros anormales, extravíos, investigaciones, controles), infraestructura (RGRL y mediciones), extintores, documentos, acciones y auditorías.', 'Remisión semanal de manifiestos (PROT-RES-003, rige desde el 14/10/2026): avisa por establecimiento los sitios sin manifiestos cargados de las últimas 2 semanas (quincenal: 20 días; mensual: 40; los «no corresponde» no cuentan) y, durante 7 días, cada vez que el establecimiento indicó en la aplicación «No se recibieron manifiestos esta semana». Esas indicaciones quedan en el libro general › REMISION_OBS.', 'El filtro de área de la matriz también se aplica acá.', 'Los datos se guardan 15 minutos; «Actualizar» los trae en el momento.']],
  '#est': ['Establecimientos', ['La matriz de los 45 establecimientos, con estado en la aplicación, último retiro y días sin retiro (verde hasta 10, amarillo hasta 30, rojo más).', 'Tocá un establecimiento para abrir su ficha: datos, red HyS, comités, contactos, residuos, agua, plagas y documentos.', 'En el celular se ve en tarjetas.']],
  '#ficha': ['Ficha del establecimiento', ['«Estado del establecimiento» (arriba): matriz de urgencia × gravedad con los temas a atender. Actuar ya = urgente y grave; Resolver rápido = urgente y leve; Planificar = no urgente y grave; Vigilar = no urgente y leve. Usa los datos del tablero de control.', 'Los botones de temas (Residuos, Agua, Plagas, Cocina, Documentos, Personal y RAR, Infraestructura) muestran la matriz solo de ese tema, sus datos principales y accesos a sus pantallas. «Otro establecimiento» cambia de ficha sin volver a la lista.', 'Qué cuenta como urgente: agua NO APTA, limpiezas y análisis vencidos, más de 10 días sin retiro (grave si pasa de 30), acciones vencidas o que vencen en 7 días, revisiones de plagas atrasadas, carnets de cocina vencidos y documentos vencidos. Qué cuenta como grave sin ser urgente: sin diagnóstico de residuos, puntos críticos o menos de 50 % de cumplimiento, sin inventario de agua y tanques o canillas sin registro.', 'Personal y RAR (siniestros): investigación pendiente = grave, y además urgente si pasaron más de 15 días del siniestro; siniestro con avisos = urgente; persona en ILT = vigilar. Infraestructura: los hallazgos abiertos del módulo 6 siguen la misma regla que las acciones de los demás módulos (vencidos, prioridad «Actuar ya» o que vencen en 7 días = urgente). Siniestros y módulo 6 se leen después de abrir la ficha: aparecen unos segundos más tarde.', 'Datos, red HyS, comités y contactos se editan desde acá y quedan en la BASE COMÚN con historial.', '«Agua, plagas y documentos» muestra lo que carga el establecimiento en «Mi establecimiento». Los tanques, cisternas y canillas también se agregan o corrigen desde acá: «+ Agregar tanque o cisterna», «+ Agregar canilla» y «Cambiar datos» en cada fila (queda en la BASE COMÚN con historial).', '«Libro de residuos ↗» y «Carpeta y documentos ↗» abren sus archivos en Drive.', 'Remisión semanal de manifiestos (PROT-RES-003): en «Resolver rápido» aparecen los sitios sin manifiestos cargados de las últimas 2 semanas y cada «No se recibieron manifiestos esta semana» que indicó el establecimiento en el último mes, con el recordatorio del protocolo de trabajo y cuántas veces pasó.']],
  '#trab': ['Personas', ['Búsqueda, edición, altas, bajas y traslados de la base de trabajadores. Cada cambio queda en el HISTORIAL.', 'La importación de una base de Personal está en «Importar base de Personal».']],
  '#diag': ['Diagnóstico de residuos', ['Primero la pestaña Establecimiento, después cada lugar. Se cierra con la pestaña Establecimiento completa (y al menos un lugar, solo si hay puntos por lugar activos en ITEMS).', '«Generar informe» arma la línea de base a la Dirección (Google Doc y PDF con número HYSL): portada, índice, resumen ejecutivo, presentación, método, hechos, análisis, conclusión, 6. Recomendaciones (ordenadas por prioridad y plazo), firma y anexo de fotos. Las recomendaciones salen de la columna ACCION de la planilla DIAGNÓSTICO DE RESIDUOS (hoja ITEMS) y pasan solas al plan de acción y a «Acciones».']],
  '#aud': ['Auditorías', ['Programa, planificación, lista de verificación con evidencia, resultado por eje y hallazgos.', 'Las internas de los referentes llegan «Para verificar».']],
  '#aguadiag': ['Diagnóstico de agua', ['Tocá un establecimiento para abrir su diagnóstico o empezar uno. Pestaña «Establecimiento»: documentación, registros y seguridad; una pestaña por cada tanque, cisterna o lugar.', 'Cada tanque o cisterna cargado en BASE COMÚN › RESERVORIOS es una pestaña propia; los CAPS se relevan dentro del hospital del que dependen. Si todavía no hay reservorios cargados, aparecen «Tanque elevado» y «Cisterna».', 'Frecuencias: limpieza anual, bacteriológico cada 6 meses, fisicoquímico anual (o la norma local más exigente). La sección de agua caliente (Legionella) aparece solo si hay termotanques o calderas.', 'Con el diagnóstico cerrado, «Generar informe» arma el informe a la Dirección (Google Doc y PDF con número HYSL) y sus mejoras pasan al Plan de acción.', 'Las preguntas se editan en la planilla del diagnóstico (hoja ITEMS): para dejar de usar una, ACTIVO = No; la mejora que se recomienda está en PROPUESTA, y «LUGAR ~ Tanque|Cisterna» en CONDICION la muestra solo en esos lugares.']],
  '#plghs': ['Control de horas', ['Horas de Javier y Paulo según la hora de inicio y de fin que cargan en la app MIP (plagas, saneamiento y otros trabajos de HyS). Si dos registros del mismo día se superponen, esas horas se cuentan una sola vez.', 'Javier: contrato de 30 h semanales + 140 h de guardia por mes. Cada semana (lunes a domingo) las primeras 30 h son de contrato y el resto es guardia. La guardia se computa al 100 %: 1 h reloj = 2 h de guardia, así que las 140 h de guardia son 70 h reloj. La barra muestra cuánto lleva del mes.', 'Paulo: cumple su contrato en otro lugar; con HyS solo hace guardias. Se cuentan solo las horas que trabaja con HyS (las que carga en la app MIP), todas como guardia al 100 %, sin tope: «Guardia a pasar» es lo que hay que pasarle en el mes.', 'Elegí el mes arriba. «Por semana» marca «faltan» cuando una semana cerrada no llegó a las 30 h de contrato. «Día por día» muestra el horario contado, dónde estuvieron y qué hicieron.', 'Los registros sin horario o con horario incompleto no se cuentan y aparecen en un aviso para que se corrijan en el libro MIP.', '«Imprimir» abre la impresión con el detalle día por día desplegado.']],
  '#plgdiag': ['Diagnóstico de plagas', ['Tocá un establecimiento para abrir su diagnóstico o empezar uno. Pestaña «Establecimiento»: programa, registros, productos y seguridad; una pestaña por cada lugar (cocina, depósitos, residuos, internación, sótanos, exterior).', 'Se habilita para toda la red: es la línea de base. El registro de intervenciones (app MIPyV) sigue solo en Trelew.', 'Con el diagnóstico cerrado, «Generar informe» arma el informe a la Dirección (Google Doc y PDF con número HYSL) y sus mejoras pasan al Plan de acción.', 'Las preguntas se editan en la planilla del diagnóstico (hoja ITEMS): para dejar de usar una, ACTIVO = No; la mejora que se recomienda está en PROPUESTA, y CONDICION decide en qué lugares aparece cada pregunta.']],
  '#accesos': ['Accesos por persona', ['Una fila por persona: con su DNI y su clave entra a «Mi establecimiento» y a la página de diagnóstico, y ve solo los establecimientos y módulos marcados.', '«Nueva persona» o tocá una fila para editarla. Para que entre: Estado Activo, DNI, al menos un establecimiento y un módulo, y su clave («Generar clave»).', '«Copiar mensaje» arma el texto con el enlace, el DNI y la clave para pasárselo por chat o correo (el sistema no envía nada solo).', 'Para quitar un acceso: Estado = Baja. La clave común del establecimiento deja de ver un módulo cuando alguien activo de ese establecimiento lo tiene con clave propia (cuadro de abajo).', 'Todo se puede hacer también en BASE COMÚN › ACCESOS («Abrir la hoja»); los cambios tardan hasta 5 minutos en verse en «Mi establecimiento».', 'Habilitación progresiva: la clave común ve cada módulo recién desde la fecha de BASE COMÚN › HABILITACION (hoy: Residuos desde el 1/10/2026, Agua desde el 1/01/2027, Plagas desde el 1/04/2027; el resto sin fecha). Lo marcado para cada persona se respeta siempre. Las fechas se cambian en la hoja.']],
  '#ges': ['11 · Gestión · Plan de acción único', ['Todas las acciones de los 10 módulos en un solo plan. Cada acción tiene su hallazgo (qué incumple y por qué norma), responsable, plazo de 30, 90 o 180 días, si requiere Dirección, tipo de recurso, avance, evidencia y verificación de eficacia.', 'Estados: Propuesta → (Elevada → Aprobada o No aprobada) → En curso → Hecha → Eficaz. «No eficaz» la devuelve a En curso; «No se realiza» y «Pendiente de recursos» piden motivo. Las de inversión no vencen para Higiene y Seguridad: van a «Necesidades de inversión».', '«Elevar a la Dirección»: elegís el establecimiento y las acciones, quedan «Elevada» con la fecha (también en su informe de origen) y se copia el correo para que lo revises y lo mandes vos. Las acciones de una empresa se le asignan solas según GES_EMPRESAS (módulo y palabras clave), citando el contrato; MAREM no, porque no hay contrato cargado.', 'Cada tablero de módulo y la ficha de cada establecimiento muestran abajo sus acciones abiertas del plan único.', '«Reglas» (fase 3): la tabla de reglas automáticas con su fuente. Cada regla dice qué condición de un módulo es un hallazgo (acopio de residuos por encima del tiempo de su categoría, agua NO APTA, análisis o limpieza vencidos, extintores vencidos o inaccesibles, mediciones vencidas, respuestas «No» del RGRL…), si entra directo o a la bandeja, la prioridad, el plazo y la acción. Un hallazgo por objeto: si sigue, se actualiza; si se resuelve en el módulo, la acción pasa a «Hecha»; si vuelve a aparecer, entra uno nuevo. Las «Por programar» figuran con su fuente y todavía no las aplica el sistema.', 'Ver por módulo, establecimiento o responsable. «Traer de los módulos» pasa lo nuevo del plan de los informes, del plan de infraestructura, del agua NO APTA y de los casos de plagas (también se hace solo cada mañana). Al cerrar una acción se marca también en su plan de origen.', 'Hallazgos: registro único. Bandeja: lo sugerido por el sistema, para confirmar o descartar con motivo. Alcance: la matriz establecimiento × módulo con nivel A, B o sin habilitar.']],
  '#acciones': ['Acciones de todos los módulos', ['Junta en una sola lista lo abierto de Residuos (diagnóstico y auditorías), Agua (NO APTA y mejoras del diagnóstico), Plagas (casos y mejoras del diagnóstico) y Servicios e infraestructura. Filtrá por establecimiento o módulo; tocá una fila para ir a editarla en su módulo. Primero aparecen las vencidas.', 'Cada acción se edita en su módulo: las mejoras de los diagnósticos, en el Plan de acción.']],
  '#plan': ['Plan de acción', ['Una lista por informe o auditoría, con estado, plazos, respuesta de la Dirección y evidencia.', 'Incluye los informes de residuos (diagnóstico y auditorías) los de los diagnósticos de agua y de plagas y los relevamientos de cocina: al generar el informe, cada mejora del punto 6 se carga sola acá.', '«Marcar como enviado» fija los plazos (actuar ya 30 días, resolver rápido 90, planificar 180). «Cumplida» pide evidencia; «Descartada», el motivo.']],
  '#agua': ['2 · Agua', ['Muestreos de laboratorio: qué pedir y cuándo (arriba de todo). Por establecimiento y separado por red (Trelew y Rawson): el muestreo PARCIAL cada 6 meses es solo bacteriológico, en las mismas canillas; el COMPLETO cada 12 meses es bacteriológico + físico-químico y antes hay que limpiar y desinfectar tanques y cisternas (sin limpieza el DPSB no toma la muestra). Si una muestra sale NO APTA: limpieza y muestreo completo en 15 días hábiles. Aviso «Pedir ahora» 30 días antes del parcial y 45 antes del completo; «Vencido · pedir ya» si ya pasó la fecha. Los avisos también aparecen en Acciones abiertas. Las reglas y los días de aviso se cambian en el tablero de Sheets (pestañas Tablero, celdas B2, D3, F3 y H3). Abajo, «Cómo pedir cada muestreo» explica los pasos y qué depende de HyS y qué del establecimiento.', 'Agua NO APTA abierta, tanques y canillas (puntos de muestreo) de toda la red, con enlace a la ficha de cada establecimiento. Por canilla: análisis bacteriológico al día, por vencer (30 días), vencido (más de 6 meses) o sin análisis. Los resultados e informes del laboratorio están en la ficha › Agua.', 'Los datos los carga cada establecimiento desde «Mi establecimiento»; Higiene y Seguridad también puede agregar o corregir tanques y canillas desde la ficha › Agua.', 'El diagnóstico de agua (línea de base, informe y plan de acción) está en 2 · Agua › Diagnóstico.', 'Informes de laboratorio y remitos (arriba, y en el menú › 2 · Agua › Datos): el tablero en Sheets con una pestaña por red (Trelew y Rawson, nunca juntas), el registro de cada muestra con el enlace a su PDF y la lista de remitos; y las carpetas de Drive por red y establecimiento. Los PDF nuevos se suben a «Subir informes nuevos» y después se pasan a la carpeta del establecimiento y al registro de su red (la pestaña Ayuda del tablero explica cómo). Si falla GitHub, todo se maneja desde el tablero y las carpetas.']],
  '#plagas': ['3 · Plagas', ['Arriba, los números que piden atención: casos vencidos y pedidos sin responder se marcan en rojo. Tocá un número para bajar a esa parte (en «Visitas sin revisar» se filtran solo esas).', '«Qué hicieron y dónde»: elegí Hoy, Ayer, Esta semana, Semana pasada, Últimos 30 días, Todo el historial o un mes en particular (desde que se usa la app) y ves, día por día, todo lo que cargan en la app MIP (plagas, limpieza y saneamiento, y otros trabajos de HyS), con lugar, horario, tareas y operarios. Tocá una fila para ver el detalle completo y las fotos.', 'Gráficos: visitas por semana (resueltas / piden otra visita), plagas atendidas y lugares con más visitas en los últimos 90 días.', 'Casos abiertos (los mismos que ven Javier y Paulo en la app): una intervención cuya última visita pidió otra visita. «Cerrar caso» queda a tu nombre; «N.º de protocolo» une las visitas de un mismo caso. Desde 3 días antes de vencer, la app les pide a los operarios indicar el cierre.', 'Solicitudes de los operarios: biocidas, EPP, herramientas (con la justificación), avisos y novedades con fotos; «Responder» registra el estado y tu nota (los operarios no la ven).', 'Visitas de los últimos 90 días: fecha con el día de la semana, horario y horas de cada visita; filtros por lugar, plaga y «solo sin revisar». Tocá una para ver el detalle y las fotos y marcarla como revisada.', 'Todas las fechas están en hora de Argentina. En el libro MIPyV, las hojas «VISITAS (para leer)», «SANEAMIENTO (para leer)» y «HORAS (para leer)» muestran lo mismo con fechas dd/mm/aaaa, horarios y horas por persona (para las horas extras).', 'El diagnóstico de plagas de toda la red (línea de base, informe y plan de acción) está en 3 · Plagas › Diagnóstico.']],
  '#cap': ['9 · Capacitaciones', ['Resumen del ciclo de capacitación (1 de febrero al 31 de enero): personas, registros, aprobación, cobertura del personal y cumplimiento de la matriz.', 'Semáforo por servicio con los prioritarios primero; los prioritarios se eligen en el libro CAPACITACIONES, hoja _LISTAS.', '«Requiere atención» avisa solo sobre lo cargado desde octubre de 2026: capacitaciones abiertas sin evaluación o sin carga horaria, dictados próximos sin abrir y vencimientos. Lo anterior queda como histórico.', 'Los dictados nuevos (por ejemplo, jornadas en el CET) se agregan en el libro, hoja DICTADOS.', 'Los datos se guardan 15 minutos; «Actualizar» los trae en el momento. Si el portal falla, el libro tiene la hoja TABLERO con lo mismo.']],
  '#capcat': ['9 · Catálogo de capacitaciones', ['Todas las capacitaciones, programas y jornadas con su registro, su evaluación (preguntas por intento, nota y si sortea) y el dictado abierto o próximo.', '«Faltan N» dice qué le falta para poder activarse; tocá la fila para abrir la ficha y completarlo.', 'En la ficha: editar datos (o crear una versión nueva diciendo qué cambió), activar, pasar a borrador o inactivar con motivo, cambiar los parámetros de la evaluación, agregar preguntas o reemplazar la evaluación, y ver sus dictados.', '«+ Nueva capacitación»: alta en 4 pasos (datos, cómo se registra, evaluación y publicación). Las preguntas se eligen del banco, se suben en planilla o Excel, o se cargan de a una; «Controlar» avisa si falta la correcta, si hay repetidas o si no alcanzan.', 'Participantes (abajo, en la ficha): todos los que la hicieron, por link permanente, dictados o historial, con fecha, nota, vigencia y certificado. Se filtra por año, establecimiento, servicio y público; «Copiar correos» y «Descargar planilla» toman lo filtrado.', 'El ícono del certificado se elige de la lista ICONOS (libro, hoja _LISTAS).', 'Si el portal falla: libro CAPACITACIONES, hojas CATALOGO, EVALUACIONES y PREGUNTAS, y el menú Capacitaciones HyS › Completar filas cargadas a mano.']],
  '#capdic': ['9 · Dictados e inscriptos', ['Cada clase o encuentro tiene el link y el QR del certificado (registro de asistencia): abren a la hora de la clase y cierran solos a las 48 h. Si lleva inscripción previa, tiene además su propio link y QR de inscripción.', 'La lista muestra solo las clases que todavía no pasaron (las de hoy incluidas). Los cancelados, los suspendidos y los encuentros que ya se dictaron salen de la lista enseguida, aunque su registro siga abierto: no se borran, quedan en «Ver anteriores» (últimos 60 días), con sus asistentes y certificados.', 'Los links y QR que se comparten pasan por hyslhmh-sudo.github.io/capacitaciones (sin el aviso de Google). En «Compartir» cada link tiene su nombre: «Inscripción: Link · QR» (solo si lleva inscripción) y «Certificado: Link · QR». Antes de la clase se comparte la inscripción; el día de la clase, el certificado (con él se registra la asistencia). El texto de WhatsApp elige solo el que corresponde. Si alguien abre el link del certificado antes de la clase, la página le avisa cuándo abre y, si la inscripción está abierta, le muestra el botón «Ir a la inscripción». El texto de WhatsApp avisa que la página puede tardar entre 10 y 30 segundos en abrir.', '«+ Nuevo dictado»: fecha, modalidad, lugar (el cupo sale del lugar), servicios destinatarios, institución educativa, hasta 3 disertantes invitados y hasta 4 firmas (la tuya siempre a la derecha). Al crearlo te da el link y el QR del certificado y el texto para WhatsApp.', 'Si lleva inscripción previa, también da el link y el QR de inscripción: cierra al empezar la clase o al llenarse el cupo.', 'Tocá un dictado para ver inscriptos, consultas previas, quién vino, quién avisó que no y quién vino sin inscribirse. Anular una inscripción pide motivo y no borra la fila; la persona también puede anularla sola desde el link.', '«Agregar asistente»: para sumar a alguien fuera de las 48 h. «Copiar correos»: para escribirles desde tu correo; el sistema no envía correos.', 'Certificados (abajo, en cada dictado): lista de constancias y certificados con su código CHYS; PDF, Rehacer (toma los datos corregidos) y Anular (con motivo). «PDF con todos» junta los del dictado en un solo archivo para imprimir.', 'Programas: en el dictado del último encuentro, «Cerrar programa» muestra quién llega a la asistencia mínima con la evaluación final aprobada (aprobación) y quién no (participación), incluyendo lo registrado en el sistema actual. Revisás y emitís.', 'Disertantes invitados: con su DNI se emite la constancia de disertante (sin vencimiento).']],
  '#capag': ['9 · Agenda', ['Horarios para servicios y clases abiertas, por semana. La agenda pública (hyslhmh-sudo.github.io/capacitaciones/agenda.html) es la misma para todo el personal: cada persona se anota a una clase abierta con DNI y correo; las jefaturas, coordinaciones y A/C reservan un horario para su servicio con su DNI.', '«+ Abrir horarios»: crea horarios libres dentro de tus franjas (botón «Franjas»), sin superponerse; podés saltear feriados.', '«+ Clase abierta»: en un horario libre (tocalo y «Hacer clase abierta») o en otro día y hora. Crea el dictado con su QR, la publica en el portal público y te da el texto para WhatsApp.', 'Pedidos para confirmar: reservas con menos de 48 h o de alguien que no está en JEFATURAS. Al confirmar podés habilitar a esa persona para su servicio.', '¿Se dieron?: horarios pasados sin asistencias; marcá Se dio, No se presentó o Suspendido (va al informe).', 'Suspender pide motivo y avisa por correo. Nunca se borra nada.', 'Correos: solo los de la agenda salen solos (confirmación, recordatorios 7, 2 y 1 día antes, suspensión), desde belenpellegrini.hys@gmail.com; quedan en «Correos enviados». Si el portal falla: libro CAPACITACIONES, hoja AGENDA.']],
  '#capcump': ['9 · Cumplimiento', ['Obligatorias por servicio de HZT y HMH: personal de la base de trabajadores, capacitaciones de la MATRIZ y registros vigentes (asistencia o evaluación aprobada; los programas, con su aprobación).', 'Incendio: extintores, seguridad humana y evacuación. Se ofrecen en ese orden y en días distintos; para el cumplimiento alcanza con tener las tres.', 'Tocá un servicio para ver qué conviene dictar primero, qué le falta a cada persona y los datos de su jefatura.', '«Jefaturas»: quién reserva por cada servicio (DNI del responsable y de coordinación o A/C) y a qué correo van los avisos.', 'Otros hospitales (HSST y el resto de la provincia) se suman en el libro, hoja ALCANCE_CUMPLIMIENTO, con su propia meta.', 'Si el portal falla: hojas CUMPLIMIENTO y CUMPLIMIENTO_PERSONAS (menú «Cumplimiento: recalcular ahora»).']],
  '#capmat': ['9 · Matriz', ['Qué capacitación corresponde a quién, por función, servicio (o empresa) o ambas. O = obligatoria; R = recomendada.', 'Al editar una regla se ve a cuántas personas afecta antes de guardar. Cada cambio pide motivo y queda en el historial; para dejar de usar una regla, se desactiva.', 'Solo cuentan las capacitaciones activas del catálogo: una regla de una capacitación en borrador empieza a contar al activarla.', 'Si el portal falla: libro CAPACITACIONES, hoja MATRIZ.']],
  '#capval': ['9 · Para validar', ['Todo lo que carga la secretaría desde Mi establecimiento (módulo «Capacitaciones») y espera tu revisión, en el libro CAPACITACIONES. La misma lista está arriba del Tablero principal.', 'Una persona por fila con todo lo que tiene pendiente: alta nueva, cambios propuestos, cambios directos (correo, teléfono…) y avisos.', 'ANTES: el valor anterior del cambio o lo que dice la base de trabajadores (pasá el mouse para ver de dónde sale). DESPUÉS: lo que quedó en el libro; se corrige ahí mismo. En amarillo, lo que cambia.', 'Tildá el cuadrito (o «Elegir todos los que se ven») y tocá «Aceptar los elegidos» (guarda y cierra todo lo pendiente de esas personas), «Requiere revisión» (quedan al final con una nota, sin cambiar nada) o «Volver a lo anterior» (solo cambios directos).', 'Buscá por apellido o DNI y filtrá por tipo con «Mostrar».', 'Cada cambio queda en la hoja _HISTORIAL del libro; las marcas de «Requiere revisión», en _REVISION_HYS.']],
  '#capfir': ['9 · Firmantes', ['Quienes firman o avalan certificados, con su título, cargo, matrícula y la aclaración del sello (hasta 3 renglones).', 'La imagen de la firma (PNG con fondo transparente o JPG, hasta 2 MB) se sube acá y queda en Drive › FIRMAS. Mientras no haya imagen, el certificado lleva la línea y la aclaración.', 'En cada dictado se eligen las firmas: hasta 4, la tuya siempre a la derecha.']],
  '#capper': ['9 · Personas y certificados', ['Buscá a cualquier persona del libro de capacitaciones por DNI, apellido, nombre o correo.', 'La ficha muestra sus datos, los certificados (con el PDF), todos sus registros, lo que le falta según la matriz y el historial de cambios.', 'Con «Corregir datos» cambiás cualquier campo; cada cambio queda en la hoja _HISTORIAL con el motivo. Servicio y función del personal de HZT y HMH vienen de la base de trabajadores: corregilos también allá.', 'Si el portal falla: libro CAPACITACIONES, hojas PERSONAS, REGISTROS y CERTIFICADOS.']],
  '#capinv': ['9 · Invitar a capacitaciones', ['Correos de todo el personal (base de trabajadores, sin bajas) y de las personas registradas en capacitaciones (externos y estudiantes). Si alguien tiene dos correos, va el más nuevo.', 'Filtros: establecimiento, servicio, función y público (se pueden marcar varios; sin marcar = todos), buscador por nombre, DNI o correo, y por capacitación: «No la hizo o venció», «Vencida o vence en 60 días» o «La hizo (vigente)».', '«Copiar los N correos» copia todos, separados por coma, para pegar en CCO. Si son más de 90, también aparecen tandas de 90 (un mail por tanda: Gmail limita los destinatarios por mensaje).', 'Si elegiste la capacitación, cada copia queda anotada (libro, hoja _INVITACIONES) y abajo, en «Invitaciones anteriores», ves cuántos invitados se registraron después.', '«Descargar planilla»: la lista filtrada en CSV, con el vencimiento de la capacitación elegida.', 'Sin GitHub: libro CAPACITACIONES, hoja CORREOS (filtros con listas y tandas de 90 correos listos para copiar). Se actualiza sola cada vez que abrís esta pantalla, o desde el menú Capacitaciones HyS › Correos: actualizar la hoja CORREOS.']],
  '#capcont': ['9 · Contactos y mails', ['Cuántas personas no tienen correo o teléfono y qué jefaturas no tienen correo.', 'Cargar lista de mails: pegá una lista (una persona por línea, con correo y DNI o apellido y nombre). El sistema la cruza, te muestra qué carga, qué reemplaza y qué no encontró, y aplica solo lo que dejás marcado. Si la persona ya tenía otro correo, gana el de la lista (el más nuevo).', 'Para editar responsables, DNI y correos de cada jefatura: botón «Editar jefaturas».']],
  '#capinf': ['9 · Informes de capacitación', ['Informe mensual o a pedido (INF-CAP): Google Doc en versión 0 y PDF con el formato de informe técnico de HySL (portada, índice, resumen ejecutivo, presentación, método, hechos, análisis, conclusión y recomendaciones, notas al pie con la normativa). Toma número del registro de documentos (bloque Capacitación, tipo IT). Con «Prueba» se genera sin número, para revisar el formato.', 'Informe por jefatura: PDF y Doc con el personal de la jefatura, el porcentaje al día, lo que le falta a cada persona y los próximos dictados que le sirven. Si tildás «Preparar el correo», queda un borrador en Gmail que revisás y enviás desde la Bandeja de correos. Nunca se envía solo.', 'Los archivos quedan en Drive, carpeta INFORMES junto al libro de capacitaciones.']],
  '#capcorreo': ['9 · Bandeja de correos', ['Todos los mensajes del sistema de capacitaciones (hoja _MENSAJES del libro).', 'Solo salen solos los de la agenda: confirmación, recordatorios 7, 2 y 1 día antes y avisos de suspensión, desde belenpellegrini.hys@gmail.com.', 'Lo demás queda como «Borrador»: tocá «Ver y enviar» para leerlo tal cual va a salir (destinatarios, asunto, adjuntos y texto) y recién ahí «Enviar» o «Descartar». Si querés cambiar el texto, editalo en Gmail › Borradores y volvé a abrirlo acá.']],
  '#sinest': ['8 · Estadísticas de siniestros', ['Totales, índices y distribuciones del período elegido (este año, trimestre actual o anterior, año anterior u otras fechas), para HZT y HMH juntos o por separado.', 'Índice de incidencia: casos de accidentes y enfermedades profesionales cada 1.000 trabajadores. Frecuencia: casos con baja por millón de horas trabajadas (estimadas con la jornada del CCT, que se carga en LISTAS_INVESTIGACION). Pérdida: días de baja cada 1.000 trabajadores. Duración media: días por caso con baja.', 'In itinere se informa aparte. Rechazados e inculpables no cuentan como casos. Los trabajadores son los activos de la base de trabajadores al día de hoy.', 'Forma, agente, zona y naturaleza salen de las investigaciones: lo que todavía no se investigó figura como «Sin investigar».', 'Base: Res. SRT 905/15, Anexo I pto. 13.']],
  '#inv': ['8 · Investigación de un siniestro', ['El sistema sugiere el método: árbol de causas cuando la baja supera 15 días, la persona o el servicio repiten, o hay riesgo biológico; investigación breve en el resto y en los in itinere. Podés cambiarlo (motivo «Decisión de HyS»).', 'Árbol de causas: H1 es la lesión. Para cada hecho preguntá «¿qué fue necesario para que pasara?» y cargá las respuestas como hechos nuevos, eligiendo de cuál son antecedente. Ocasional: algo distinto de lo habitual. Permanente: así es siempre.', 'Medidas: con la jerarquía de controles (eliminar, sustituir, ingeniería, administrativas, EPP), responsable y plazo.', 'Causa primaria: si se elimina, el siniestro no ocurre. Medidas en orden de prioridad, con el servicio responsable. El plazo lo informa cada servicio; al cargarlo, la medida pasa a «En curso» y se propone la fecha de verificación.', '«Guardar y armar la nota» crea un borrador en Google Docs, sin número (el N.º de nota interna lo da Mesa de Entradas): nota a la Dirección (empleador) que, por su intermedio, propone las acciones a los servicios y les pide los plazos; como anexo, el informe de investigación con la estructura del modelo de la SRT. Sin nombre, DNI ni diagnóstico. La firmás y la ingresás por Mesa de Entradas; al cargar esa fecha, las medidas pasan a «Comunicada».', 'Al cerrar la investigación, el siniestro queda «Analizado». Todo queda en las hojas INVESTIGACIONES, HECHOS y MEDIDAS del libro de siniestros, y se puede corregir ahí.', 'Base: Res. SRT 905/15, Anexo II, ítems 12 y 17 (comunicación fehaciente al empleador); Ley 24.557, art. 4; modelo de informe de investigación de la SRT (Circular GPyC 001/04).']],
  '#sin': ['8 · Siniestros', ['Todos los siniestros de la red, con filtros por establecimiento, estado y tipo. Tocá uno para ver datos, diagnóstico, novedades, archivos y la exposición de la persona según la NTE.', 'Los cargan Personal y la secretaría de HyS desde «Mi establecimiento», y desde ahí se corrigen o anulan. El libro de siniestros guarda todo y no se borra nada.', 'ESTADO y días de baja los calcula el sistema con las novedades (al guardar y cada noche).', 'Base: Ley 24.557, arts. 6 y 31; Res. SRT 525/15; Res. SRT 905/15, Anexo I pto. 13 y Anexo II pto. 12.']],

  '#docs': ['Registro de informes', ['Los informes que genera el sistema (diagnósticos, relevamientos de cocina, NTE) toman solos su número HYSL y quedan acá, con su documento y su PDF.', 'Un número no se borra: si un informe no va, se anula con motivo.', 'Las notas no se numeran acá: las numera el hospital (Mesa de Entradas). Los informes del módulo 6 llevan su propia numeración (EST-M8-001/año).']],
  '#docest': ['10 · Documentos de los establecimientos', ['Los manuales, guías, POE, protocolos y PTS propios de cada establecimiento, de toda la red. Los referentes los cargan desde «Mi establecimiento» › Documentos; vos podés cargarlos y corregirlos desde acá para cualquier establecimiento.', 'Datos de cada documento: tema, tipo (manual, guía, POE, protocolo, PTS, plan, instructivo u otro), código o número si tiene, nombre completo, versión, vigente desde y vence (si tiene vencimiento), y el archivo (PDF o foto).', 'Cuadro por establecimiento y tema: cantidad de documentos vigentes. Verde, al día; amarillo, alguno vence en 60 días; rojo, alguno vencido. Tocá un número para ver esos documentos abajo.', 'Si se carga uno con el mismo código o el mismo nombre que otro vigente del establecimiento, el anterior queda «Reemplazado». Anular pide motivo y no borra nada.', 'Dónde queda: planilla BASE COMÚN › hoja DOCUMENTOS_EST (una fila por documento, columna FECHA_VENCIMIENTO incluida) y archivo en Drive › SISTEMA HyS › MÓDULO 2 · DOCUMENTOS › Establecimientos › carpeta del establecimiento › Documentos propios.', 'Los vencidos y por vencer aparecen en el Tablero, en «Requiere atención», y en los pendientes de «Mi establecimiento» de ese establecimiento.']],
