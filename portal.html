<script>
// ==================================================================
// PORTAL DE GESTIÓN HyS · uso personal con la clave de Higiene y Seguridad.
// Lee y escribe en las planillas del Sistema HyS a través de Apps Script.
// ==================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwEf6wxSyzMPh0vu2qoeMJnBwZHNu6IRJgCnAG1sykyuu5N4N4JEFUd_Ve_0Zlu5nME/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fechaTxt = f => f ? String(f).slice(0, 10).split('-').reverse().join('/') : '—';
const LS = { get: (k, d) => { try { const v = localStorage.getItem('portal_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem('portal_' + k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem('portal_' + k); } catch (e) {} } };
let FICHAS = {};
const RESPALDO = /googleusercontent\.com$/.test(location.hostname);   // portal servido por Google (sin GitHub)
const DIAG_URL = RESPALDO ? API_URL + '?p=diagnostico' : 'https://hyslhmh-sudo.github.io/manifiestos/diagnostico.html';
const APP_URL = RESPALDO ? API_URL + '?p=app' : 'https://hyslhmh-sudo.github.io/manifiestos/';
const diagMensaje = nombre => 'Hola' + (nombre ? ', equipo del ' + nombre : '') + '. Les comparto el enlace para completar el diagnóstico de gestión de residuos de su establecimiento: ' + DIAG_URL +
  ' . Se ingresa con la misma clave que usan para cargar los manifiestos. Se puede completar de a partes (Guardar y seguir después) y agregar fotos desde el celular. Al terminar, tocar «Enviar a Higiene y Seguridad». Ante cualquier duda, consultame. Belén Pellegrini · Higiene y Seguridad';
// Informes del diagnóstico (Google Doc editable + PDF)
function informesDiag() {
  const L = DG.D.informes || [], cerrado = DG.estado === 'Cerrado';
  return '<section class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><div><h2>Informe a la Dirección</h2><div class="mu peq">' +
    (cerrado ? 'Genera el informe (Google Doc editable y PDF) con su número HYSL, en la carpeta del establecimiento › Informes.' : 'El informe se genera cuando el diagnóstico está cerrado.') + '</div></div>' +
    '<button class="btn pri" id="dgInforme"' + (cerrado ? '' : ' disabled') + '>' + (L.length ? 'Generar nueva revisión' : 'Generar informe') + '</button></div>' +
    (L.length ? '<div class="peq">' + L.map(i => '<div style="border-top:1px solid #EEF2F4;padding:8px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><span><b>' + esc(i.codigo) + '</b>' + (i.obs ? ' · ' + esc(i.obs) : '') + '</span><span><a href="' + esc(i.doc) + '" target="_blank" rel="noopener">Documento</a> · <a href="' + esc(i.pdf) + '" target="_blank" rel="noopener">PDF</a> · <button class="link" id="dgCorreo">Copiar correo de envío</button></span></div>').join('') + '</div>' : '') + '</section>';
}
async function copiarCorreo(c) {
  const t = 'Asunto: ' + c.asunto + '\n' + (c.copia ? c.copia + '\n' : '') + '\n' + c.cuerpo;
  try { await navigator.clipboard.writeText(t); toast('Correo copiado: pegalo en tu correo y adjuntá el PDF.'); } catch (e) { prompt('Copiá el texto del correo:', t); }
}
function activarInformes() {
  const c = $('dgCorreo'); if (c) c.onclick = async () => { try { const r = await api('p_informe_correo', { cod: DG.cod, id: DG.id }); if (!r.ok) return toast(r.mensaje); copiarCorreo(r.correo); } catch (e) {} };
  const b = $('dgInforme'); if (!b) return;
  b.onclick = async () => {
    if (DG.sucio) return toast('Guardá los cambios antes de generar el informe.');
    b.disabled = true; b.textContent = 'Generando… (puede tardar uno o dos minutos)';
    let r; try { r = await api('p_informe_diag', { cod: DG.cod, id: DG.id }, 330000); } catch (e) { b.disabled = false; b.textContent = 'Generar informe'; return; }
    if (!r.ok) { toast(r.mensaje || 'No se pudo generar el informe.'); b.disabled = false; b.textContent = 'Generar informe'; return; }
    DG.D.informes = [{ codigo: r.codigo, doc: r.doc, pdf: r.pdf, obs: r.revision ? 'Revisión ' + r.revision : '' }];
    toast('Informe ' + r.codigo + ' listo' + (r.notasAlPie ? '' : ' (referencias al final: falta activar el servicio Google Docs API)') + '.');
    const y = window.scrollY; diagPintar(); window.scrollTo(0, y);
    window.open(r.doc, '_blank');
  };
}
function compartirDiag(nombre) {
  return '<section class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><h2>Enlace para los referentes</h2><div class="peq" style="margin-top:4px"><a href="' + DIAG_URL + '" target="_blank" rel="noopener">' + DIAG_URL + '</a></div><div class="mu peq">Cada referente entra con la clave de su establecimiento (la misma de los manifiestos).</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-copiar="enlace">Copiar enlace</button><button class="btn sec" data-copiar="mensaje">Copiar mensaje</button><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(diagMensaje(nombre)) + '">Enviar por WhatsApp</a></div></section>';
}
function activarCompartir(nombre) {
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = async () => {
    const t = b.dataset.copiar === 'enlace' ? DIAG_URL : diagMensaje(nombre);
    try { await navigator.clipboard.writeText(t); toast(b.dataset.copiar === 'enlace' ? 'Enlace copiado.' : 'Mensaje copiado: pegalo en el correo o el chat.'); }
    catch (e) { prompt('Copiá el texto:', t); }
  });
}
let CLAVE = LS.get('clave', ''), RES = null, FICHA = null, TRAB = { cod: '', q: '', datos: null };
const TIPOS_CON = ['Dirección', 'Servicio', 'Jefatura', 'Comité', 'Área administrativa', 'Guardia / urgencias', 'Otro'];
const CODS_EXTRA = [['NC', 'Nivel central (Secretaría de Salud y organismos)'], ['SIN_ASIGNAR', 'Sin establecimiento reconocido']];
const TRAB_COLS = ['CUIL', 'DNI', 'APELLIDOS', 'NOMBRES', 'SITIO', 'FUNCION', 'FUNCION_DETALLE', 'SERVICIO', 'VINCULO', 'EMPRESA', 'CARGO_CONDUCCION', 'EMAIL', 'EMAIL_FECHA', 'TELEFONO', 'EN_NTEAR', 'FUENTES', 'ULTIMA_CONFIRMACION', 'REVISAR', 'MOTIVO_REVISION', 'ESTADO', 'FECHA_ALTA', 'ESTABLECIMIENTO'];

async function api(accion, datos, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 90000);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: accion, clave: CLAVE, est: '', datos: datos || {} }), signal: ctl.signal });
    const j = JSON.parse(await r.text());

  } catch (e) { if (e.message !== 'clave') toast(e.name === 'AbortError' ? 'El sistema tardó demasiado. Probá de nuevo.' : 'No se pudo conectar con el sistema.'); throw e; }
  finally { clearTimeout(t); }
}

function grBarrasMes(meses, serie) {
  const W = 640, H = 220, x0 = 36, b = 188, max = Math.max(4, ...meses.map(m => (serie[m] || {}).Y1 + (serie[m] || {}).Y3 || 0)), k = 160 / max, bw = Math.min(34, (W - x0 - 20) / meses.length - 14);
  let s = ''; [0, .5, 1].forEach(f => { const v = Math.round(max * f), y = b - v * k; s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#D6DEE2"/><text x="' + (x0 - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#5B6B73" text-anchor="end">' + v + '</text>'; });
  const nom = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  meses.forEach((m, i) => { const d = serie[m] || { Y1: 0, Y3: 0 }, x = x0 + 12 + i * ((W - x0 - 12) / meses.length);
    s += '<g><title>' + nom[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4) + ': Y1 ' + d.Y1 + ' · Y3 ' + d.Y3 + '</title><rect x="' + x + '" y="' + (b - d.Y1 * k) + '" width="' + bw + '" height="' + d.Y1 * k + '" rx="3" fill="#0D313F"/><rect x="' + x + '" y="' + (b - (d.Y1 + d.Y3) * k) + '" width="' + bw + '" height="' + d.Y3 * k + '" rx="2" fill="#5894A7"/></g><text x="' + (x + bw / 2) + '" y="' + (b + 16) + '" font-size="11" fill="#5B6B73" text-anchor="middle">' + nom[Number(m.slice(5, 7)) - 1] + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Retiros por mes, Y1 e Y3">' + s + '</svg>';
}
function grHoriz(items, max, apilado) {   // items: [texto, valor, color] o [texto, [[v,color],[v,color]]]
  const W = 420; let s = '', y = 4; max = Math.max(max, 1);
  items.forEach(it => { const partes = Array.isArray(it[1]) ? it[1] : [[it[1], it[2]]], tot = partes.reduce((a, p) => a + p[0], 0); let x = 160;
    s += '<text x="0" y="' + (y + 14) + '" font-size="12.5" fill="#33424A">' + esc(it[0]) + '</text>';
    partes.forEach(p => { const w = (W - 200) * p[0] / max; if (w > 0) s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="20" rx="3" fill="' + p[1] + '"/>'; x += w; });
    s += '<text x="' + (x + 6) + '" y="' + (y + 15) + '" font-size="12.5" font-weight="700" fill="#33424A">' + (it[3] != null ? it[3] : tot) + '</text>'; y += 30; });
  return '<svg viewBox="0 0 ' + W + ' ' + y + '" width="100%" role="img">' + s + '</svg>';
}

// ------------------------------------------------------------------ Reglas del diagnóstico (las mismas que en el sistema: hoja ITEMS › CONDICION y PREVIO)
function diagAplica(it, sitio) {
  const cond = String(it && it.CONDICION || '').trim(); if (!cond) return true;

  return cond.split(';').every(c => {
    const m = /^\s*([A-Z]{3}\d{2})\s*(~|!=|=)\s*(.+?)\s*$/.exec(c); if (!m) return true;
    const ref = porId[m[1]], s = ref && ref.NIVEL === 'S' ? (sitio || '') : '', r = DG.R[s + '|' + m[1]] || {}, v = String(r.valor || r.resp || '');

    if (m[2] === '=') return v === m[3];
    return v !== m[3];

function achicar(file) {
  return new Promise((ok, mal) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1600, f = Math.min(1, m / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * f); cv.height = Math.round(img.height * f);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.75)); };
    img.onerror = () => mal(new Error('No se pudo leer la imagen.')); img.src = url; });
}

const DOC_BLOQUES = { RES: 'Residuos', RIE: 'Riesgos', DOC: 'Documental', CAP: 'Capacitación', GEN: 'General' };

let DOCS = { est: '', anio: new Date().getFullYear() };
async function documentos(est) {
  if (est != null) DOCS.est = est;

    '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between"><h2>Registro</h2><div class="filtros"><label class="f">Establecimiento<select class="c" id="fEst">' + opEst(DOCS.est, true) + '</select></label><label class="f">Año<select class="c" id="fAn">' + [0, 1, 2].map(i => { const y = new Date().getFullYear() - i; return '<option' + (y === DOCS.anio ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select></label></div></div>' +

    if (falt && !confirm('Quedan ' + falt + ' puntos sin responder. ¿Terminar igual? Los que falten no cuentan en el resultado.')) return;
    $('auCerrar').disabled = true; $('auCerrar').textContent = 'Calculando…';
    try { if (!(await guardar())) { $('auCerrar').disabled = false; $('auCerrar').textContent = 'Terminar y ver resultado'; return; }
      const r = await api('p_aud_cerrar', { id: AU.A.auditoria.ID_AUD }, 120000); if (!r.ok) { toast(r.mensaje); $('auCerrar').disabled = false; return; }
      location.hash = '#audr/' + encodeURIComponent(AU.A.auditoria.ID_AUD); } catch (e) { $('auCerrar').disabled = false; }
  };
}
async function audResultado(id) {
  cargando('#aud', 'Calculando el resultado…');
  let R; try { R = await api('p_aud_resultado', { id: id }); } catch (e) { return; }
  if (!R.ok) return toast(R.mensaje);
  const A = R.auditoria, H = R.hallazgos, clases = ['No conformidad mayor', 'No conformidad menor', 'Observación', 'Oportunidad de mejora'];
  const colorClase = c => /mayor/.test(c) ? 'er' : /menor/.test(c) ? 'wa' : /bservaci/.test(c) ? 'pa' : 'gr';
  marco('#aud', '<div class="cab"><div><a class="link peq" href="#aud">‹ Auditorías</a><h1>Resultado · ' + esc(A.TIPO) + ' · ' + esc(A.ESTABLECIMIENTO) + '</h1><span class="mu">' + esc(A.ID_AUD) + ' · ' + fechaTxt(A.FECHA) + ' · ' + esc(A.ORIGEN) + (R.anterior ? ' · comparada con ' + esc(R.anterior) : '') + '</span></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sec" href="#aud/' + encodeURIComponent(A.ID_AUD) + '">Ver respuestas</a>' + (A.ESTADO === 'Para verificar' ? '<button class="btn pri" id="arVerif">Verificar (HyS)</button>' : '') + '<button class="btn pri" id="arPlan">Pasar al plan de acción</button></div></div>' +
    '<div class="grid g4"><div class="card kpi"><span>RESULTADO</span><b style="font-size:20px">' + esc(A.RESULTADO || '—') + '</b><small class="mu">' + audChip(A.ESTADO) + '</small></div><div class="card kpi"><span>CUMPLIMIENTO</span><b>' + esc(A.CUMPLIMIENTO || '—') + '</b><small class="mu">' + (A.CRITICOS_OK ? 'críticos cumplidos: ' + esc(A.CRITICOS_OK) : 'conformes sobre los que aplican') + (A.CATEGORIA ? ' · cat. ' + esc(String(A.CATEGORIA).split(' ')[0]) : '') + '</small></div>' +
      '<div class="card kpi"><span>NO CONFORMIDADES</span><b' + (+A.NC_MAYOR ? ' style="color:#9B2C22"' : '') + '>' + ((+A.NC_MAYOR || 0) + (+A.NC_MENOR || 0)) + '</b><small class="mu">' + (A.NC_MAYOR || 0) + ' mayores · ' + (A.NC_MENOR || 0) + ' menores</small></div><div class="card kpi"><span>OBSERVACIONES</span><b>' + (A.OBSERVACIONES_N || 0) + '</b><small class="mu">' + (A.MEJORAS_N || 0) + ' oportunidades de mejora</small></div></div>' +
    '<section class="card" style="display:flex;flex-direction:column;gap:8px"><h2>Cumplimiento por eje</h2>' + R.ejes.map(e => '<div style="display:grid;grid-template-columns:minmax(160px,240px) minmax(0,1fr) 60px;gap:12px;align-items:center" class="peq"><span>' + esc(e.eje) + '</span>' +
      '<div style="position:relative;height:12px;background:var(--gr);border-radius:999px"><div style="position:absolute;left:0;top:0;height:12px;width:' + e.pct + '%;background:' + (e.pct < 70 ? '#B45309' : 'var(--az)') + ';border-radius:999px"></div>' + (e.anterior != null ? '<div title="Anterior: ' + e.anterior + ' %" style="position:absolute;top:-3px;left:calc(' + e.anterior + '% - 1px);width:2px;height:18px;background:var(--pa)"></div>' : '') + '</div><b style="text-align:right">' + e.pct + ' %</b></div>').join('') +
      '<span class="mu peq">' + (R.anterior ? 'La marca celeste es la auditoría anterior del mismo tipo.' : 'Es la primera auditoría de este tipo: no hay comparación.') + '</span></section>' +
    '<section class="card" style="padding:0"><div style="padding:14px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2>Hallazgos</h2><button class="btn sec" id="arNuevo">+ Oportunidad de mejora</button></div>' +
      (H.length ? H.map((h, i) => '<div class="ar-h" data-i="' + i + '" style="border-top:1px solid #EEF2F4;padding:14px 18px;display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(220px,1fr) minmax(200px,1fr);gap:12px">' +
        '<div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b>' + esc(h.ID_HALLAZGO) + '</b><span class="chip ' + colorClase(h.CLASIFICACION) + '">' + esc(h.CLASIFICACION) + '</span><span class="chip gr">' + esc(h.ESTADO) + '</span></div>' +
          '<div style="margin-top:6px">' + esc(h.DESCRIPCION) + '</div><div class="mu peq">' + esc(h.LUGAR) + (h.CRITERIO ? ' · ' + esc(h.CRITERIO) : '') + (/^https?:/.test(h.EVIDENCIA) ? ' · <a href="' + esc(h.EVIDENCIA) + '" target="_blank" rel="noopener">evidencia</a>' : '') + '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:6px"><label class="f">Clasificación<select class="c ar-cl">' + clases.map(c => '<option' + (c === h.CLASIFICACION ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></label><label class="f">Acción propuesta<textarea class="c ar-ac">' + esc(h.ACCION) + '</textarea></label></div>' +
        '<div style="display:flex;flex-direction:column;gap:6px"><label class="f">Responsable<input class="c ar-re" value="' + esc(h.RESPONSABLE) + '"></label><label class="f">Plazo<input class="c ar-pl" value="' + esc(h.PLAZO) + '"></label>' + (h.EN_PLAN === 'Sí' ? '<span class="mu peq">Ya está en el plan de acción.</span>' : '') + '</div></div>').join('')
        : '<div class="vacio">Sin hallazgos: todos los puntos que aplican resultaron conformes.</div>') + '</section>' +
    (H.length ? '<div style="position:sticky;bottom:0;background:rgba(244,247,248,.96);border-top:1px solid var(--ln);padding:10px 0;display:flex;justify-content:flex-end"><button class="btn pri" id="arGuardar">Guardar hallazgos</button></div>' : '') +
    '<section class="card peq mu">Un «No conforme» en un punto crítico es no conformidad mayor (acción en 30 días); en un punto no crítico, menor (90 días). Solo pasan al plan los hallazgos con acción definida; los de auditorías internas, después de la verificación de HyS.</section>');
  const guardarH = async () => { for (const el of document.querySelectorAll('.ar-h')) { const h = H[+el.dataset.i];
      const d = { ID_HALLAZGO: h.ID_HALLAZGO, CLASIFICACION: el.querySelector('.ar-cl').value, ACCION: el.querySelector('.ar-ac').value, RESPONSABLE: el.querySelector('.ar-re').value, PLAZO: el.querySelector('.ar-pl').value };
      if (d.CLASIFICACION !== h.CLASIFICACION || d.ACCION !== h.ACCION || d.RESPONSABLE !== h.RESPONSABLE || d.PLAZO !== h.PLAZO) { const r = await api('p_aud_hallazgo_guardar', { datos: d }); if (!r.ok) { toast(r.mensaje); return false; } } } return true; };
  if ($('arGuardar')) $('arGuardar').onclick = async () => { $('arGuardar').disabled = true; try { if (await guardarH()) { toast('Hallazgos guardados.'); audResultado(id); } } catch (e) {} $('arGuardar').disabled = false; };
  $('arNuevo').onclick = () => modal('Oportunidad de mejora', [['DESCRIPCION', 'Qué se puede mejorar', null, 1], ['LUGAR', 'Lugar'], ['ACCION', 'Acción propuesta', null, 1], ['RESPONSABLE', 'Responsable'], ['PLAZO', 'Plazo']], {}, async v => {
    const r = await api('p_aud_hallazgo_guardar', { id: id, datos: Object.assign({ CLASIFICACION: 'Oportunidad de mejora' }, v) }); if (!r.ok) return r.mensaje || 'No se pudo guardar.'; toast('Agregada.'); audResultado(id); return ''; });
  $('arPlan').onclick = async () => { try { if (H.length && !(await guardarH())) return; const r = await api('p_aud_al_plan', { id: id }); if (!r.ok) return toast(r.mensaje); toast(r.pasados ? r.pasados + ' hallazgo(s) pasados al plan de acción.' : (r.mensaje || 'Nada para pasar.')); if (r.pasados) location.hash = '#plan/' + encodeURIComponent(id); } catch (e) {} };
  if ($('arVerif')) $('arVerif').onclick = async () => { if (!confirm('¿Revisaste las respuestas y la evidencia del referente? Sus hallazgos pasan a «Propuesto».')) return; try { const r = await api('p_aud_verificar', { id: id }); if (!r.ok) return toast(r.mensaje); toast('Auditoría verificada.'); audResultado(id); } catch (e) {} };
}

// ------------------------------------------------------------------ Ficha › Agua, plagas y documentos (lo que ve el establecimiento en «Mi establecimiento»)
async function fichaMi(cod) {
  const box = $('fMi'); if (!box) return;
  box.innerHTML = '<h2>Agua, plagas y documentos</h2><div class="mu">Leyendo…</div>';
  let R; try { R = await api('p_mi', { cod: cod }, 120000); } catch (e) { box.innerHTML = '<h2>Agua, plagas y documentos</h2><div class="mu">No se pudo leer. <button class="link" id="fMiBtn">Reintentar</button></div>'; $('fMiBtn').onclick = () => fichaMi(cod); return; }
  if (!R.ok) { box.innerHTML = '<h2>Agua, plagas y documentos</h2><div class="aviso error">' + esc(R.mensaje || R.error || 'Error') + '</div>'; return; }
  const chip = e => '<span class="chip ' + ({ vencida: 'er', porvencer: 'wa', sin: 'wa', aldia: 'ok' }[e] || 'gr') + '">' + ({ vencida: 'Vencida', porvencer: 'Por vencer', sin: 'Sin registro', aldia: 'Al día' }[e] || e) + '</span>';
  const tabla = (cab, filas) => filas.length ? '<div style="overflow-x:auto"><table><thead><tr>' + cab.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + filas.join('') + '</tbody></table></div>' : '<div class="mu peq">Sin datos cargados.</div>';
  box.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2>Agua, plagas y documentos</h2><button class="link" id="fMiBtn">Actualizar</button></div>' +
    '<div class="mu peq">' + esc(R.grupo.length > 1 ? 'Incluye ' + R.grupo.join(' y ') + ' (mismo hospital). ' : '') + 'Limpieza de tanques: ' + esc(R.poe.limpieza) + ' · Toma de muestras: ' + esc(R.poe.muestra) + '</div>' +
    '<h3 style="margin:14px 0 6px">Pendientes</h3>' + (R.pendientes.length ? '<div style="display:flex;flex-direction:column;gap:6px">' + R.pendientes.map(p => '<div style="display:flex;gap:8px;align-items:flex-start"><span class="chip ' + (p.nivel === 'er' ? 'er' : p.nivel === 'wa' ? 'wa' : 'gr') + '">' + (p.nivel === 'er' ? 'Urgente' : p.nivel === 'wa' ? 'Pronto' : 'Aviso') + '</span><div><b>' + esc(p.texto) + '</b><div class="mu peq">' + esc(p.detalle) + '</div></div></div>').join('') + '</div>' : '<div class="mu peq">Sin pendientes.</div>') +
    '<h3 style="margin:16px 0 6px">Tanques y cisternas</h3>' + tabla(['Código', 'Tipo', 'Ubicación', 'Litros', 'Acceso', 'Última limpieza', 'Próxima', 'Estado'], R.tanques.map(t => '<tr><td><b>' + esc(t.codigo) + '</b></td><td>' + esc(t.tipo) + '</td><td>' + esc(t.ubicacion) + '</td><td>' + esc(t.capacidad) + '</td><td>' + esc(t.acceso) + '</td><td>' + fechaTxt(t.ultima) + '</td><td>' + fechaTxt(t.proxima) + '</td><td>' + chip(t.estado) + '</td></tr>')) +
    '<h3 style="margin:16px 0 6px">Canillas (puntos de muestreo)</h3>' + tabla(['Código', 'Ubicación', 'Bacteriológico', 'Vence', 'Físico-químico', 'Último resultado', 'Estado'], R.puntos.map(p => '<tr><td><b>' + esc(p.codigo) + '</b></td><td>' + esc(p.ubicacion) + '</td><td>' + fechaTxt(p.bact) + '</td><td>' + fechaTxt(p.venceBact) + '</td><td>' + fechaTxt(p.fq) + '</td><td>' + esc(p.ultimo) + '</td><td>' + (p.noApta ? '<span class="chip er">No apta</span>' : chip(p.estado)) + '</td></tr>')) +
    '<h3 style="margin:16px 0 6px">Plagas: casos abiertos</h3>' + tabla(['Caso', 'Fecha', 'Plaga', 'Sector', 'Estado', 'Próxima revisión'], R.casos.map(c => '<tr><td><b>' + esc(c.caso) + '</b></td><td>' + fechaTxt(c.fecha) + '</td><td>' + esc(c.plaga) + '</td><td>' + esc(c.sector) + '</td><td>' + esc(c.estado) + '</td><td>' + fechaTxt(c.proxima) + '</td></tr>')) +
    '<h3 style="margin:16px 0 6px">Documentos propios</h3>' + tabla(['Tema', 'Tipo', 'Documento', 'Versión', 'Cargado', ''], R.documentos.map(d => '<tr><td>' + esc(d.tema) + '</td><td>' + esc(d.tipo) + '</td><td>' + esc((d.codigo ? d.codigo + ' · ' : '') + d.titulo) + '</td><td>' + esc(d.version) + '</td><td>' + fechaTxt(d.cargado) + '</td><td><a href="' + esc(d.url) + '" target="_blank" rel="noopener">Abrir</a></td></tr>')) +
    '<div class="mu peq" style="margin-top:10px">Las fotos de cada carga están en la carpeta del establecimiento (Agua, Plagas, Documentos propios). Los registros completos, en la BASE COMÚN: AGUA_LIMPIEZAS, AGUA_ANALISIS, PLAGAS_CASOS, PLAGAS_REGISTROS y DOCUMENTOS_EST.</div>';
  $('fMiBtn').onclick = () => fichaMi(cod);
}

// ------------------------------------------------------------------ Navegación
function router() {
  if (!CLAVE) return ingreso();
  const [ruta, arg] = location.hash.replace(/^#/, '').split('/');
  const a = arg ? decodeURIComponent(arg) : '';
  if (ruta === 'est') return matriz();
  if (ruta === 'agua') return agua();
  if (ruta === 'bib') return biblioteca();
  if (ruta === 'ayuda') return ayuda();
  if (ruta === 'ficha') return ficha(a);
  if (ruta === 'trab') return trabajadores(a || TRAB.cod || '');
  if (ruta === 'importar') return importar();
  if (ruta === 'diag') return a ? diagForm(a) : diagLista();
  if (ruta === 'tablero') return tablero(a);
  if (ruta === 'docs') return documentos(a);
  if (ruta === 'modelos') return modelos();
  if (ruta === 'nte') return nte(a);
  if (ruta === 'bandeja') return bandeja();
  if (ruta === 'plan') return a ? planDetalle(decodeURIComponent(a)) : planLista();
  if (ruta === 'aud') return a === 'nueva' ? audNueva() : a ? audEjecutar(decodeURIComponent(a)) : audLista();
  if (ruta === 'audr') return audResultado(decodeURIComponent(a));
  return inicio();
}
window.addEventListener('hashchange', router);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) { $('ov').hidden = true; $('ov').innerHTML = ''; } });
router();
</script>
</body>
