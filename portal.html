// Buscador de ayuda: busca en todas las pantallas, sin importar tildes ni mayúsculas
const ayNorm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function ayBuscar(q) {
  const pal = ayNorm(q).split(/\s+/).filter(p => p.length > 1); if (!pal.length) return [];
  const res = [];
  Object.keys(AYUDA).forEach(k => {
    const tit = AYUDA[k][0], tt = ayNorm(tit);
    AYUDA[k][1].forEach(t => { const n = tt + ' ' + ayNorm(t); if (pal.every(p => n.indexOf(p) >= 0)) res.push({ k: k, tit: tit, t: t, peso: pal.filter(p => tt.indexOf(p) >= 0).length }); });
  });
  return res.sort((x, y) => y.peso - x.peso);
}
function ayMarcar(t, q) {
  let h = esc(t); const pal = ayNorm(q).split(/\s+/).filter(p => p.length > 1);
  if (!pal.length) return h;
  // Resalta coincidencias respetando tildes del texto original
  const n = ayNorm(t), marcas = [];
  pal.forEach(p => { let i = n.indexOf(p); while (i >= 0) { marcas.push([i, i + p.length]); i = n.indexOf(p, i + p.length); } });
  if (!marcas.length) return h;
  marcas.sort((x, y) => x[0] - y[0]); let out = '', u = 0;
  marcas.forEach(m => { if (m[0] < u) return; out += esc(t.slice(u, m[0])) + '<mark>' + esc(t.slice(m[0], m[1])) + '</mark>'; u = m[1]; });
  return out + esc(t.slice(u));
}
function ayResultados(q, cont) {
  const r = ayBuscar(q);
  cont.innerHTML = !q.trim() ? '' : !r.length ? '<p class="mu peq" style="margin:0">No encontré «' + esc(q) + '» en la ayuda. Probá con otra palabra o abrí el manual del sistema.</p>' :
    '<p class="mu peq" style="margin:0">' + r.length + (r.length === 1 ? ' resultado' : ' resultados') + '</p>' +
    r.slice(0, 30).map(x => '<a class="ayRes" href="' + x.k + '"><b>' + esc(x.tit) + '</b><span>' + ayMarcar(x.t, q) + '</span></a>').join('');
}
function abrirAyuda(ruta, enfocarBusqueda) {
  const a = AYUDA[ruta] || ['Ayuda', ['Esta pantalla todavía no tiene ayuda propia. Usá el buscador o el manual del sistema.']];
  const cerrar = () => { $('ov').hidden = true; $('ov').innerHTML = ''; };
  $('ov').innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-label="Ayuda"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Ayuda</h2><button class="btn sec" id="ayCer">Cerrar</button></div>' +
    '<form role="search" id="ayF" style="margin:0"><input class="c" id="ayQ" type="search" placeholder="¿Qué necesitás hacer? Ej.: firma, NTE, retiro" aria-label="Buscar en la ayuda" style="width:100%;box-sizing:border-box"></form>' +
    '<div id="ayRes" class="ayLista" aria-live="polite"></div>' +
    '<div id="ayEsta"><h3 style="margin:4px 0 8px;font-size:15px">En esta pantalla: ' + esc(a[0]) + '</h3><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px">' + a[1].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px"><a class="btn sec" href="#ayuda">Ver toda la ayuda</a><a class="btn pri" href="' + MANUAL_URL + '" target="_blank" rel="noopener">Manual del portal ↗</a><a class="btn sec" href="' + MANUAL_RESP_URL + '" target="_blank" rel="noopener">Manual de respaldo ↗</a></div></div>';
  $('ov').hidden = false; $('ayCer').onclick = cerrar;
  $('ayF').onsubmit = e => e.preventDefault();
  $('ayQ').oninput = () => { const q = $('ayQ').value; ayResultados(q, $('ayRes')); $('ayEsta').hidden = !!q.trim(); };
  $('ov').addEventListener('click', e => { if (e.target.closest('a')) cerrar(); });
  if (enfocarBusqueda) $('ayQ').focus();
}
function ayuda() {
  const tarjetas = Object.keys(AYUDA).map(k => '<section class="card" style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0"><a href="' + k + '" style="text-decoration:none">' + esc(AYUDA[k][0]) + '</a></h2><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">' + AYUDA[k][1].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></section>').join('');
  marco('#ayuda', '<div class="cab"><div><span class="mu peq">Ayuda</span><h1>Cómo se usa el portal</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn pri" href="' + MANUAL_URL + '" target="_blank" rel="noopener">Manual del portal ↗</a><a class="btn sec" href="' + MANUAL_RESP_URL + '" target="_blank" rel="noopener">Manual de respaldo ↗</a></div></div>' +
    '<section class="card"><form role="search" id="ayF2" style="margin:0"><label class="f">Buscar en la ayuda<input class="c" id="ayQ2" type="search" placeholder="Ej.: firma, NTE, retiro, cupo"></label></form><div id="ayRes2" class="ayLista" aria-live="polite" style="margin-top:10px"></div></section>' +
    '<div class="tb3" id="ayTodas">' + tarjetas + '</div>' +

  $('ayF2').onsubmit = e => e.preventDefault();

// ------------------------------------------------------------------ Gráficos (SVG simples, sin bibliotecas)
function grBarrasMes(meses, serie) {
  const W = 640, H = 220, x0 = 36, b = 188, max = Math.max(4, ...meses.map(m => (serie[m] || {}).Y1 + (serie[m] || {}).Y3 || 0)), k = 160 / max, bw = Math.min(34, (W - x0 - 20) / meses.length - 14);
  let s = ''; [0, .5, 1].forEach(f => { const v = Math.round(max * f), y = b - v * k; s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#D6DEE2"/><text x="' + (x0 - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#5B6B73" text-anchor="end">' + v + '</text>'; });
  const nom = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  meses.forEach((m, i) => { const d = serie[m] || { Y1: 0, Y3: 0 }, x = x0 + 12 + i * ((W - x0 - 12) / meses.length);
    s += '<g><title>' + nom[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4) + ': Y1 ' + d.Y1 + ' · Y3 ' + d.Y3 + '</title><rect x="' + x + '" y="' + (b - d.Y1 * k) + '" width="' + bw + '" height="' + d.Y1 * k + '" rx="3" fill="#0D313F"/><rect x="' + x + '" y="' + (b - (d.Y1 + d.Y3) * k) + '" width="' + bw + '" height="' + d.Y3 * k + '" rx="2" fill="#5894A7"/></g><text x="' + (x + bw / 2) + '" y="' + (b + 16) + '" font-size="11" fill="#5B6B73" text-anchor="middle">' + nom[Number(m.slice(5, 7)) - 1] + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Retiros por mes, Y1 e Y3">' + s + '</svg>';
}

// ------------------------------------------------------------------ Modal genérico
// campos: [clave, etiqueta, opciones|'date'|null, ancho]
function modal(titulo, campos, valores, guardar, extra) {
  const v = valores || {};
  const campo = c => { const [k, l, op, an] = c, val = v[k] == null ? '' : v[k];
    // 18/10/2026: { lista: [...] } = se escribe libre con sugerencias (para valores nuevos, p. ej. una empresa privada que no está en la lista)
    const ctl = op && op.lista ? '<input class="c" data-k="' + k + '" value="' + esc(val) + '" list="mdl_' + k + '" autocomplete="off"><datalist id="mdl_' + k + '">' + op.lista.filter(Boolean).map(o => '<option value="' + esc(o) + '">').join('') + '</datalist>'
      : Array.isArray(op) ? '<select class="c" data-k="' + k + '"><option value=""></option>' + op.map(o => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
      : op === 'date' ? '<input class="c" type="date" data-k="' + k + '" value="' + esc(String(val).slice(0, 10)) + '">'
      : an ? '<textarea class="c" data-k="' + k + '">' + esc(val) + '</textarea>' : '<input class="c" data-k="' + k + '" value="' + esc(val) + '">';
    return '<label class="f' + (an ? ' ancho' : '') + '">' + esc(l) + ctl + '</label>'; };
  $('ov').innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><h2>' + esc(titulo) + '</h2><div class="aviso error" id="mErr" hidden></div><div class="campos">' + campos.map(campo).join('') + '</div>' + (extra || '') +
    '<div class="acciones"><div style="display:flex;gap:8px;flex-wrap:wrap" id="mExtra"></div><div style="display:flex;gap:8px"><button class="btn sec" id="mCan">Cancelar</button><button class="btn pri" id="mOk">Guardar</button></div></div></div>';
  $('ov').hidden = false;
  const cerrar = () => { $('ov').hidden = true; $('ov').innerHTML = ''; };
  $('mCan').onclick = cerrar;
  $('mOk').onclick = async () => {
    const out = {}; document.querySelectorAll('#ov [data-k]').forEach(el => out[el.dataset.k] = el.value);
    $('mOk').disabled = true; $('mOk').textContent = 'Guardando…';
    try { const err = await guardar(out); if (err) { $('mErr').textContent = err; $('mErr').hidden = false; $('mOk').disabled = false; $('mOk').textContent = 'Guardar'; } else cerrar(); }
    catch (e) { $('mOk').disabled = false; $('mOk').textContent = 'Guardar'; }
  };
  return { cerrar: cerrar, extra: $('mExtra') };
}

const QDEF = { Q1: ['Actuar ya', 'Urgente e importante'], Q2: ['Planificar', 'Importante, no urgente'], Q3: ['Resolver rápido', 'Urgente, no importante'], Q4: ['Monitorear', 'Ni urgente ni importante'] };
let TAB = null;
async function tablero(cod, fresco) {
  if (!TAB || fresco) { cargando('#tablero', 'Armando el tablero…'); try { TAB = await api('p_diag_tablero', { fresco: !!fresco }); } catch (e) { return; } }
  if (!TAB.ok) return marco('#tablero', '<div class="aviso error">' + esc(TAB.mensaje || 'No se pudo armar el tablero.') + '</div>');
  const E = TAB.establecimientos.slice(), H = cod ? TAB.hallazgos.filter(h => h.cod === cod) : TAB.hallazgos, est = cod ? E.find(e => e.cod === cod) : null;
  const sel = '<label class="f">Ver<select class="c" id="tbSel"><option value="">Toda la red (general)</option>' + E.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre))).map(e => '<option value="' + esc(e.cod) + '"' + (e.cod === cod ? ' selected' : '') + '>' + esc(e.nombre) + '</option>').join('') + '</select></label>';
  const kpi = (n, t, s) => '<div class="kpi2"><span>' + t + '</span><b>' + n + '</b><small>' + s + '</small></div>';
  const prom = (f) => { const v = E.map(f).filter(x => x !== '' && x != null).map(Number); return v.length ? Math.round(10 * v.reduce((a, b) => a + b, 0) / v.length) / 10 : '—'; };
  const cuenta = q => H.filter(h => h.q === q).length;
  let k = cod ? kpi(est.pct === '' ? '—' : est.pct + ' %', 'Resultado', fechaTxt(est.fecha) + ' · ' + esc(est.estado)) + kpi(est.msn === '' ? '—' : est.msn + ' / 6', 'Matriz nacional', 'Rojo hasta 2: gestión deficiente') + kpi(cuenta('Q1'), 'Actuar ya', 'Problemas urgentes e importantes') + kpi(H.length, 'Problemas', 'En total')
    : kpi(E.length + ' de ' + TAB.totalEstablecimientos, 'Establecimientos evaluados', 'Último diagnóstico de cada uno') + kpi(prom(e => e.pct) + (prom(e => e.pct) === '—' ? '' : ' %'), 'Cumplimiento promedio', 'Matriz nacional promedio: ' + prom(e => e.msn) + ' / 6') + kpi(cuenta('Q1'), 'Para actuar ya', 'En ' + E.filter(e => e.q.Q1).length + ' establecimiento(s)') + kpi(H.filter(h => h.critico).length, 'Puntos críticos', 'No cumplidos en la red');
  // Cuadrantes
  const caja = q => {
    const L = H.filter(h => h.q === q);
    let cuerpo;
    if (cod) cuerpo = L.sort((a, b) => b.grav - a.grav).map(h => '<div class="h"><b>' + esc(h.item) + '</b>' + (h.critico ? ' <span class="chip er mini">Crítico</span>' : '') + '<div class="mu">' + esc((h.sitio ? h.sitio + ' · ' : '') + h.resp) + (h.obs ? ' · ' + esc(h.obs) : '') + '</div>' + (h.fotos.length ? '<div>' + h.fotos.map((u, i) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">Foto ' + (i + 1) + '</a>').join(' · ') + '</div>' : '') + '</div>').join('');
    else { const g = {}; L.forEach(h => { const x = g[h.id] = g[h.id] || { item: h.item, critico: h.critico, cods: new Set() }; x.cods.add(h.cod); });
      cuerpo = Object.keys(g).sort((a, b) => g[b].cods.size - g[a].cods.size).slice(0, 12).map(id => '<div class="h"><b>' + esc(g[id].item) + '</b>' + (g[id].critico ? ' <span class="chip er mini">Crítico</span>' : '') + ' <span class="mu">· ' + g[id].cods.size + ' establecimiento(s)</span><div class="cods">' + [...g[id].cods].map(c => '<button data-tb="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div></div>').join('') + (Object.keys(g).length > 12 ? '<div class="mu peq">… y ' + (Object.keys(g).length - 12) + ' problema(s) más.</div>' : ''); }
    return '<div class="q ' + q + '"><h3>' + QDEF[q][0] + ' <small>' + QDEF[q][1] + ' · ' + L.length + '</small></h3>' + (cuerpo || '<div class="mu peq">Sin problemas en este cuadrante.</div>') + '</div>';
  };
  const ejes = '<div class="ejes"><span></span><span style="display:flex;justify-content:space-between"><span>← más urgente</span><span>menos urgente →</span></span></div>';
  const l8 = TAB.l8, fr = (a, b) => b ? a + ' de ' + b + ' (' + Math.round(100 * a / b) + ' %)' : '—';
  const linea8 = cod ? '' : '<section class="card"><h2>Línea 8 · indicadores de base</h2><div class="tb5" style="margin-top:10px">' +
    kpi(fr(l8.poeTodos, l8.poeResp), 'POE marco de bioseguridad', 'Con todos los POE adoptados (meta 4)') + kpi(fr(l8.vacunaCompleta, l8.vacunaResp), 'Vacunación del personal', 'Cobertura completa en servicios de riesgo (meta 5)') +
    kpi(l8.registro && l8.registro.limpieza ? fr(l8.registro.limpiezaCap, l8.registro.limpieza) : fr(l8.capacitados, l8.capacResp), 'Personal de residuos capacitado', 'Limpieza, maestranza y servicios generales, último año, según el registro (meta 6)' + (l8.registro ? ' · Todo el personal: ' + fr(l8.registro.capacitados, l8.registro.activos) : '')) + kpi(Object.keys(l8.formacion).length, 'Necesidades de formación', Object.keys(l8.formacion).sort((a, b) => l8.formacion[b] - l8.formacion[a]).slice(0, 3).map(x => x + ' (' + l8.formacion[x] + ')').join(' · ') || 'Sin datos (meta 7)') + '</div></section>';
  const top = (id, tit) => { const m = (TAB.cierre || {})[id] || {}, L = Object.keys(m).sort((a, b) => m[b] - m[a]).slice(0, 6);
    return '<div><h3 style="margin:0 0 6px;font-size:14px;color:var(--az)">' + tit + '</h3>' + (L.length ? L.map(x => '<div class="peq" style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid #EEF2F4;padding:5px 0"><span>' + esc(x) + '</span><b>' + m[x] + '</b></div>').join('') : '<div class="mu peq">Sin datos.</div>') + '</div>'; };
  const cierre = cod ? '' : '<section class="card"><h2>Lo que más se señala en el cierre</h2><div class="grid g3" style="margin-top:10px">' + top('CIE01', 'Problemas') + top('CIE02', 'Propuestas de mejora') + top('CIE03', 'Necesidades') + '</div></section>';
  const ranking = cod ? '' : '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Establecimientos por prioridad</h2></div><table><thead><tr><th>Establecimiento</th><th>Área</th><th>Fecha</th><th>Resultado</th><th>Matriz</th><th>Capacitación residuos</th><th>Actuar ya</th><th>Planificar</th><th>Resolver rápido</th><th>Monitorear</th></tr></thead><tbody>' +
    TAB.establecimientos.slice().sort((a, b) => b.q.Q1 - a.q.Q1 || (a.pct || 0) - (b.pct || 0)).map(e => '<tr class="cl" data-tb="' + esc(e.cod) + '"><td><b>' + esc(e.nombre) + '</b><div class="mu peq">' + esc(e.estado) + '</div></td><td class="peq">' + esc(String(e.area).replace('Área Programática ', '')) + '</td><td>' + fechaTxt(e.fecha) + '</td><td>' + chipDiag({ pct: e.pct, fecha: e.fecha, estado: e.estado, criticos: e.criticos }) + '</td><td>' + (e.msn === '' ? '—' : e.msn) + '</td><td class="peq">' + (e.cap && e.cap.activos ? e.cap.pct + ' %' + (e.cap.limpieza ? ' · limpieza ' + e.cap.pctLimpieza + ' %' : '') : '—') + '</td><td><b style="color:#B42318">' + e.q.Q1 + '</b></td><td>' + e.q.Q2 + '</td><td>' + e.q.Q3 + '</td><td>' + e.q.Q4 + '</td></tr>').join('') + '</tbody></table>' + (TAB.establecimientos.length ? '' : '<div class="vacio">Todavía no hay diagnósticos.</div>') + '</section>';
  marco('#tablero', '<div class="cab"><div><span class="mu peq">1 · Residuos</span><h1>' + (cod ? esc(est ? est.nombre : cod) : 'Tablero de problemáticas') + '</h1><span class="mu">Matriz de 4 cuadrantes según urgencia e importancia de cada problema detectado en el diagnóstico.</span></div><div class="filtros">' + sel + '<button class="btn sec" id="tbAct">Actualizar</button>' + (cod ? '<a class="btn pri" href="#diag/' + encodeURIComponent(cod) + '">Abrir el diagnóstico</a>' : '') + '</div></div>' +
    '<div class="tb5">' + k + '</div>' + ejes + '<div class="cuad">' + caja('Q1') + caja('Q2') + caja('Q3') + caja('Q4') + '</div>' + linea8 + cierre + ranking +
    '<p class="mu peq">Datos al ' + new Date(TAB.actualizado).toLocaleString('es-AR') + '. Urgencia e importancia de cada punto: columnas URGENCIA e IMPORTANCIA de la hoja ITEMS (editables).</p>');
  $('tbSel').onchange = e => location.hash = '#tablero' + (e.target.value ? '/' + encodeURIComponent(e.target.value) : '');
  $('tbAct').onclick = () => tablero(cod, true);
  document.querySelectorAll('[data-tb]').forEach(b => b.onclick = () => location.hash = '#tablero/' + encodeURIComponent(b.dataset.tb));
}


// ------------------------------------------------------------------ Ficha › Agua, plagas y documentos (lo que ve el establecimiento en «Mi establecimiento»)
async function fichaMi(cod) {
  const box = $('fMi'); if (!box) return;
  box.innerHTML = '<h2>Agua, plagas y documentos</h2><div class="mu">Leyendo…</div>';
  let R; try { R = await api('p_mi', { cod: cod }, 120000); } catch (e) { box.innerHTML = '<h2>Agua, plagas y documentos</h2><div class="mu">No se pudo leer. <button class="link" id="fMiBtn">Reintentar</button></div>'; $('fMiBtn').onclick = () => fichaMi(cod); return; }
  if (!R.ok) { box.innerHTML = '<h2>Agua, plagas y documentos</h2><div class="aviso error">' + esc(R.mensaje || R.error || 'Error') + '</div>'; return; }
  const chip = e => '<span class="chip ' + ({ vencida: 'er', porvencer: 'wa', sin: 'wa', aldia: 'ok' }[e] || 'gr') + '">' + ({ vencida: 'Vencida', porvencer: 'Por vencer', sin: 'Sin registro', aldia: 'Al día', unica: 'Muestra única', riego: 'Riego (no lleva limpieza obligatoria)' }[e] || e) + '</span>';
  const tabla = (cab, filas) => filas.length ? '<div style="overflow-x:auto"><table><thead><tr>' + cab.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + filas.join('') + '</tbody></table></div>' : '<div class="mu peq">Sin datos cargados.</div>';
  box.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2>Agua, plagas y documentos</h2><button class="link" id="fMiBtn">Actualizar</button></div>' +
    '<div class="mu peq">' + esc(R.grupo.length > 1 ? 'Incluye ' + R.grupo.join(' y ') + ' (mismo hospital). ' : '') + 'Limpieza de tanques: ' + esc(R.poe.limpieza) + ' · Toma de muestras: ' + esc(R.poe.muestra) + '</div>' +
    '<h3 style="margin:14px 0 6px">Pendientes</h3>' + (R.pendientes.length ? '<div style="display:flex;flex-direction:column;gap:6px">' + R.pendientes.map(p => '<div style="display:flex;gap:8px;align-items:flex-start"><span class="chip ' + (p.nivel === 'er' ? 'er' : p.nivel === 'wa' ? 'wa' : 'gr') + '">' + (p.nivel === 'er' ? 'Urgente' : p.nivel === 'wa' ? 'Pronto' : 'Aviso') + '</span><div><b>' + esc(p.texto) + '</b><div class="mu peq">' + esc(p.detalle) + '</div></div></div>').join('') + '</div>' : '<div class="mu peq">Sin pendientes.</div>') +
    '<h3 style="margin:16px 0 6px">Tanques y cisternas <button class="btn sec peq" id="fMiAddT" style="margin-left:8px">+ Agregar tanque o cisterna</button></h3>' + tabla(['Código', 'Tipo', 'Uso', 'Ubicación', 'Litros', 'Acceso', 'Última limpieza', 'Próxima', 'Estado'], R.tanques.map(t => '<tr><td><b>' + esc(t.codigo) + '</b><div><button class="link peq" data-edt="' + esc(t.codigo) + '">Cambiar datos</button></div></td><td>' + esc(t.tipo) + '</td><td>' + esc(t.uso) + '</td><td>' + esc(t.ubicacion) + (t.obs ? '<div class="mu peq">' + esc(t.obs) + '</div>' : '') + '</td><td>' + esc(Number(t.capacidad) ? Number(t.capacidad).toLocaleString('es-AR') : t.capacidad) + '</td><td>' + esc(t.acceso) + '</td><td>' + fechaTxt(t.ultima) + '</td><td>' + fechaTxt(t.proxima) + '</td><td>' + chip(t.estado) + '</td></tr>')) +
    '<h3 style="margin:16px 0 6px">Canillas (puntos de muestreo) <button class="btn sec peq" id="fMiAddP" style="margin-left:8px">+ Agregar canilla</button></h3>' + tabla(['Código', 'Ubicación', 'Bacteriológico', 'Vence', 'Físico-químico', 'Último resultado', 'Estado'], R.puntos.map(p => '<tr><td><b>' + esc(p.codigo) + '</b><div><button class="link peq" data-edp="' + esc(p.codigo) + '">Cambiar datos</button></div></td><td>' + esc(p.ubicacion) + (p.unica ? '<div class="mu peq">Muestra única: no se repite ni vence.</div>' : p.equipo ? '<div class="mu peq">Equipo: solo físico-químico cada 12 meses.</div>' : '') + '</td><td>' + fechaTxt(p.bact) + '</td><td>' + fechaTxt(p.venceBact) + '</td><td>' + fechaTxt(p.fq) + '</td><td>' + esc(p.ultimo) + '</td><td>' + (p.noApta ? '<span class="chip er">No apta</span>' : chip(p.estado)) + '</td></tr>')) +
    '<h3 style="margin:16px 0 6px">Plagas: casos abiertos</h3>' + tabla(['Caso', 'Fecha', 'Plaga', 'Sector', 'Estado', 'Próxima revisión'], R.casos.map(c => '<tr><td><b>' + esc(c.caso) + '</b></td><td>' + fechaTxt(c.fecha) + '</td><td>' + esc(c.plaga) + '</td><td>' + esc(c.sector) + '</td><td>' + esc(c.estado) + '</td><td>' + fechaTxt(c.proxima) + '</td></tr>')) +
    '<h3 style="margin:16px 0 6px">Documentos propios <a class="peq" href="#docest/' + encodeURIComponent(cod) + '" style="font-weight:700;margin-left:8px">Cargar o corregir</a></h3>' + tabla(['Tema', 'Tipo', 'Documento', 'Versión', 'Vence', 'Cargado', ''], R.documentos.map(d => '<tr><td>' + esc(d.tema) + '</td><td>' + esc(d.tipo) + '</td><td>' + esc((d.codigo ? d.codigo + ' · ' : '') + d.titulo) + '</td><td>' + esc(d.version || 's/d') + '</td><td>' + (d.vence ? fechaTxt(d.vence) : '—') + '</td><td>' + fechaTxt(d.cargado) + '</td><td><a href="' + esc(d.url) + '" target="_blank" rel="noopener">Abrir</a></td></tr>')) +
    '<div class="mu peq" style="margin-top:10px">Las fotos de cada carga están en la carpeta del establecimiento (Agua, Plagas, Documentos propios). Los registros completos, en la BASE COMÚN: AGUA_LIMPIEZAS, AGUA_ANALISIS, PLAGAS_CASOS, PLAGAS_REGISTROS y DOCUMENTOS_EST.</div>';
  $('fMiBtn').onclick = () => fichaMi(cod);
  $('fMiAddT').onclick = () => fichaTanque(cod, R, null); $('fMiAddP').onclick = () => fichaPunto(cod, R, null);
  box.querySelectorAll('[data-edt]').forEach(b => b.onclick = () => fichaTanque(cod, R, R.tanques.find(t => t.codigo === b.dataset.edt)));
  box.querySelectorAll('[data-edp]').forEach(b => b.onclick = () => fichaPunto(cod, R, R.puntos.find(p => p.codigo === b.dataset.edp)));
}
// Tanques y canillas desde el portal (14.52): mismo guardado que «Mi establecimiento» › Mis tanques y canillas, con historial en la BASE COMÚN
const opsCon = (l, v) => v && l.indexOf(v) < 0 ? l.concat([v]) : l;
function fichaTanque(cod, R, t) {
  const v = t ? { CODIGO_TANQUE: t.codigo, ESTABLECIMIENTO: t.est, SITIO: t.sitio, UBICACION: t.ubicacion, TIPO: t.tipo, USO: t.uso, CAPACIDAD_L: t.capacidad, MATERIAL: t.material || '', TAPA: t.tapa, ACCESO: t.acceso, QUIEN_LIMPIA: t.quienLimpia, FRECUENCIA_LIMPIEZA_MESES: String(t.frecuencia || 12), ESTADO: t.inv || 'Activo', OBSERVACIONES: t.obs }
    : { ESTABLECIMIENTO: cod, SITIO: (R.sitios || [])[0] || '', TIPO: 'Tanque elevado', USO: 'Consumo humano', TAPA: 'Sí, en condiciones', ACCESO: 'Escalera fija', QUIEN_LIMPIA: 'Personal propio', FRECUENCIA_LIMPIEZA_MESES: '12', ESTADO: 'Activo' };
  const c = [['SITIO', 'Sitio', opsCon((R.sitios || []).length ? R.sitios : ['s/d (revisar)'], v.SITIO)], ['UBICACION', 'Ubicación (ej.: azotea, sala de bombas)'],
    ['TIPO', 'Tipo', opsCon(['Tanque elevado', 'Cisterna', 'Tanque de bombeo', 'Otro'], v.TIPO)], ['CAPACIDAD_L', 'Capacidad (litros)'],
    ['USO', 'Uso', opsCon(['Consumo humano', 'Consumo y reserva de incendio', 'Reserva de incendio', 'Riego', 'Mixto'], v.USO)], ['MATERIAL', 'Material (ej.: acero inoxidable, hormigón)'],
    ['TAPA', 'Tapa', opsCon(['Sí, en condiciones', 'Deficiente', 'No tiene', 's/d (revisar)'], v.TAPA)], ['ACCESO', 'Acceso', opsCon(['Escalera fija', 'Escalera móvil', 'Espacio confinado', 'A nivel', 'Otro', 's/d (revisar)'], v.ACCESO)],
    ['QUIEN_LIMPIA', 'Quién lo limpia', opsCon(['Personal propio', 'Personal propio y empresa (trabajo en altura)', 'Empresa de mantenimiento', 'Empresa contratada', 's/d (revisar)'], v.QUIEN_LIMPIA)],
    ['FRECUENCIA_LIMPIEZA_MESES', 'Limpieza cada (meses)', opsCon(['12', '6'], v.FRECUENCIA_LIMPIEZA_MESES)], ['ESTADO', 'Estado', opsCon(['Activo', 'Fuera de uso'], v.ESTADO)], ['OBSERVACIONES', 'Observaciones', null, 1]];
  if (!t && (R.grupo || []).length > 1) c.unshift(['ESTABLECIMIENTO', 'Edificio', R.grupo]);
  modal(t ? 'Cambiar datos de ' + t.codigo : 'Agregar tanque o cisterna · ' + cod, c, v, async o => {
    if (!String(o.UBICACION || '').trim()) return 'Falta la ubicación.';
    const r = await api('p_reservorio', Object.assign({ cod: cod, CODIGO_TANQUE: v.CODIGO_TANQUE || '', ESTABLECIMIENTO: v.ESTABLECIMIENTO }, o), 90000);
    if (!r.ok) return r.mensaje || 'No se pudo guardar.'; toast('Guardado: ' + r.codigo + '.'); fichaMi(cod); return '';
  });
}
function fichaPunto(cod, R, p) {
  const v = p ? { CODIGO_PUNTO: p.codigo, ESTABLECIMIENTO: p.est, SITIO: p.sitio, UBICACION: p.ubicacion, TANQUE_ASOCIADO: p.tanque || '', FUENTE: p.fuente, USO: p.uso, ESTADO: p.inv || 'Activo' }
    : { ESTABLECIMIENTO: cod, SITIO: (R.sitios || [])[0] || '', FUENTE: 'Red pública', USO: 'Bebida', ESTADO: 'Activo', TANQUE_ASOCIADO: (R.tanques[0] || {}).codigo || '' };
  const c = [['SITIO', 'Sitio', opsCon((R.sitios || []).length ? R.sitios : ['s/d (revisar)'], v.SITIO)], ['UBICACION', 'Ubicación de la canilla'],
    ['TANQUE_ASOCIADO', 'Tanque del que sale el agua (vacío = directo de red)', opsCon(R.tanques.map(t => t.codigo), v.TANQUE_ASOCIADO)],
    ['FUENTE', 'Fuente', opsCon(['Red pública', 'Pozo', 'Camión cisterna', 'Otra'], v.FUENTE)], ['USO', 'Uso', opsCon(['Bebida', 'Cocina', 'Higiene', 'Mixto'], v.USO)],
    ['ESTADO', 'Estado', opsCon(['Activo', 'Equipo (solo físico-químico)', 'Muestra única', 'Fuera de uso'], v.ESTADO)]];
  if (!p && (R.grupo || []).length > 1) c.unshift(['ESTABLECIMIENTO', 'Edificio', R.grupo]);
  modal(p ? 'Cambiar datos de ' + p.codigo : 'Agregar canilla · ' + cod, c, v, async o => {
    if (!String(o.UBICACION || '').trim()) return 'Falta la ubicación.';
    const r = await api('p_punto', Object.assign({ cod: cod, CODIGO_PUNTO: v.CODIGO_PUNTO || '', ESTABLECIMIENTO: v.ESTABLECIMIENTO }, o), 90000);
    if (!r.ok) return r.mensaje || 'No se pudo guardar.'; toast('Guardado: ' + r.codigo + '.'); fichaMi(cod); return '';
  });
}

// Cada cambio de pantalla deja anotada la anterior (ver NAV en marco)
function router() {
  NAV.dejadas.add(NAV.act || NAV.ruta);
  NAV.ruta = '#' + (location.hash.replace(/^#/, '').split('/')[0] || 'inicio'); NAV.dejadas.delete(NAV.ruta);
  NAV.act = null; NAV.sync = true;
  try { return routerPantalla(); } finally { NAV.sync = false; }
}
function routerPantalla() {
  if (!CLAVE) return ingreso();
  const [ruta, arg] = location.hash.replace(/^#/, '').split('/');
  const a = arg ? decodeURIComponent(arg) : '';
  if (ruta === 'est') return matriz();
  if (ruta === 'agua') return agua('agua');
  if (ruta === 'plagas') return agua('plagas');
  if (ruta === 'plghs') return pantallaHoras();
  if (ruta === 'aguadiag') return dgmRuta('agua', a);
  if (ruta === 'plgdiag') return dgmRuta('plagas', a);
  if (ruta === 'sin') return sinPortal(a);
  if (ruta === 'inv') return invForm(a);
  if (ruta === 'sinest') return sinEst();
  if (ruta === 'buscar') return buscar(a);
  if (ruta === 'bib') return biblioteca();
  if (ruta === 'cap') return capTablero();
  if (ruta === 'capcat') return capCatalogo();
  if (ruta === 'capficha') return capFichaVer(a);
  if (ruta === 'capalta') return capAlta();
  if (ruta === 'capdic') return capDictados();
  if (ruta === 'capdicnuevo') return capDictadoNuevo(a);
  if (ruta === 'capins') return capInscriptos(a);
  if (ruta === 'capfir') return capFirmantes();
  if (ruta === 'capval') return capValidar(true);
  if (ruta === 'capag') return capAgenda(a);
  if (ruta === 'capcump') return capCumplimiento();
  if (ruta === 'capserv') return capServicio(a);
  if (ruta === 'capjef') return capJefaturas();
  if (ruta === 'capmat') return capMatriz();
  if (ruta === 'capper') return a ? capPersona(decodeURIComponent(a)) : capPersonas();
  if (ruta === 'capcont') return capContactos();
  if (ruta === 'capinv') return capInvitar();
  if (ruta === 'capinf') return capInformes();
  if (ruta === 'capcorreo') return capCorreos();
  if (ruta === 'acciones') return acciones();
  if (ruta === 'accesos') return accesosPantalla();
  if (ruta === 'datos') return datos();
  if (ruta === 'ges') return gestion();
  if (ruta === 'm8') return m8Tablero();
  if (ruta === 'rgrl') return rgrlLista(a);
  if (ruta === 'medic') return medicionesPantalla();
  if (ruta === 'm8rel') return m8Relev(a);
  if (ruta === 'm8plan') return m8Plan();
  if (ruta === 'm8serv') return m8Servicios();
  if (ruta === 'm8libros') return m8Libros();
  if (ruta === 'inc') return incTablero();
  if (ruta === 'incest') return incEst(location.hash.replace(/^#incest\/?/, ''));
  if (ruta === 'incnov') return incNovPortal();
  if (ruta === 'desvacc') return desvAcc();   // 1 · Residuos › desvíos: acciones y seguimiento (modulos/desvios-acciones.js)
  if (ruta === 'resnov') return resNovPortal();   // 1 · Residuos › novedades de residuos (modulos/residuos-novedades.js)
  if (ruta === 'rad') return radTablero();
  if (ruta === 'radform') { location.hash = '#radest/' + encodeURIComponent(RADF.cod || 'HZT') + '/form'; return; }   // formularios F-RAD-01 a 03 (modulos/radiaciones.js, 25/10/2026)
  if (ruta === 'radest') return radEst(location.hash.replace(/^#radest\/?/, ''));
  if (ruta === 'imprimir') return impPortalPantalla(a);   // hojas para imprimir: en blanco y completadas (modulos/imprimir.js, 23/10/2026)
  if (ruta === 'ayuda') return ayuda();
  if (ruta === 'ficha') return ficha(a);
  if (ruta === 'trab') return trabajadores(a || TRAB.cod || '');
  if (ruta === 'importar') return importar();
  if (ruta === 'res') return a ? resEst(a) : resTablero();
  if (ruta === 'resfrec') return resFrec();
  if (ruta === 'resinf') return resInforme();
  if (ruta === 'rescosto') return resCostos();
  if (ruta === 'diag') { DCFG = DCFG_RES; return a ? diagForm(a) : diagLista(); }
  if (ruta === 'coc') return cocTablero();
  if (ruta === 'cocper') return cocPersonas(a);
  if (ruta === 'cocdiag') return a ? cocForm(a) : cocLista();
  if (ruta === 'tablero') return tablero(a);
  if (ruta === 'docs') return documentos(a);
  if (ruta === 'notas') return notas(a);
  if (ruta === 'docest') return docEst(a);
  if (ruta === 'modelos') return modelos();
  if (ruta === 'nte') return nte(a);
  if (ruta === 'bandeja') return bandeja();
  if (ruta === 'plan') return a ? planDetalle(decodeURIComponent(a)) : planLista();
  if (ruta === 'aud') return a === 'nueva' ? audNueva() : a ? audEjecutar(decodeURIComponent(a)) : audLista();
  if (ruta === 'audr') return audResultado(decodeURIComponent(a));
  return inicio();
}
window.addEventListener('hashchange', router);
// Siempre abre en el Tablero, con los módulos del menú cerrados (aunque la dirección guardada o el marcador apunte a otra pantalla)
try { sessionStorage.removeItem('navAb'); sessionStorage.removeItem('portalAbierto'); if (location.hash !== '#inicio') history.replaceState(null, '', '#inicio'); } catch (e) {}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) { $('ov').hidden = true; $('ov').innerHTML = ''; } });
router();
</script>
</body>
</html>
