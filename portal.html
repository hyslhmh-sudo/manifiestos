<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal HyS · Gestión</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --az:#0D313F; --pa:#5894A7; --tx:#1B2A31; --mu:#4F616B; --ln:#D5DEE2; --bg:#F4F7F8; --gr:#E4EAED;
    --ok:#0D313F; --okt:#FFFFFF; --pa2:#BFD6DE; --er:#8A2B1F; --erbg:#F6DCD8; --wa:#7A5300; --wabg:#FBE9C6; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; color: var(--tx); background: var(--bg); font-size: 15px; line-height: 1.45; }
  a { color: var(--az); } a:hover { color: var(--pa); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav.lat { flex: 1 1 240px; max-width: 270px; background: var(--az); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 2px; }
  nav.lat .marca { padding: 0 8px 18px; border-bottom: 1px solid #2A5466; margin-bottom: 10px; }
  nav.lat .marca b { display: block; font-size: 18px; } nav.lat .marca span { font-size: 13px; color: #C9DCE3; }
  nav.lat .sec { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #A9C6D1; padding: 14px 8px 4px; }
  nav.lat a, nav.lat button.it { display: block; width: 100%; text-align: left; color: #fff; text-decoration: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; background: none; border: 0; cursor: pointer; }
  nav.lat a.on { background: #fff; color: var(--az); font-weight: 700; }
  nav.lat a:hover:not(.on), nav.lat button.it:hover { background: #1E4A5C; }
  nav.lat .pr { color: #9FB7C1; font-size: 13px; padding: 6px 10px; }
  nav.lat .pie { margin-top: auto; border-top: 1px solid #2A5466; padding: 14px 8px 0; font-size: 13px; color: #C9DCE3; }
  main { flex: 999 1 560px; min-width: 0; padding: 28px 36px 60px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 28px; color: var(--az); } h2 { margin: 0; font-size: 17px; color: var(--az); }
  .mu { color: var(--mu); } .peq { font-size: 13px; }
  .cab { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-end; }
  .card { background: #fff; border: 1px solid var(--ln); border-radius: 12px; padding: 18px 22px; }
  .grid { display: grid; gap: 16px; } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3, .g2 { grid-template-columns: minmax(0, 1fr); } }
  .kpi span { font-size: 13px; color: var(--mu); font-weight: 600; display: block; } .kpi b { font-size: 30px; color: var(--az); display: block; } .kpi small { font-size: 13px; color: var(--mu); }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mu); font-weight: 600; }
  input.c, select.c, textarea.c { border: 1px solid var(--ln); border-radius: 8px; padding: 9px 11px; background: #fff; min-height: 42px; font-size: 14px; }
  textarea.c { min-height: 70px; }
  .btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 42px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .pri { background: var(--az); color: #fff; } .sec { background: #fff; color: var(--az); border: 1px solid var(--az); } .peligro { background: #fff; color: var(--er); border: 1px solid var(--er); }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; padding: 0; color: var(--az); font-weight: 700; cursor: pointer; text-decoration: underline; font-size: 13px; }
  .tabla { overflow-x: auto; padding: 0; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 12px; color: var(--mu); padding: 10px 12px; border-bottom: 1px solid var(--ln); white-space: nowrap; background: #fff; position: sticky; top: 0; }
  td { padding: 9px 12px; border-bottom: 1px solid #EEF2F4; font-size: 14px; vertical-align: top; }
  tr.cl { cursor: pointer; } tr.cl:hover td { background: #F7FAFB; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
  .ok { background: var(--ok); color: var(--okt); } .pa { background: var(--pa2); color: var(--az); } .er { background: var(--erbg); color: var(--er); } .wa { background: var(--wabg); color: var(--wa); } .gr { background: #EEF2F4; color: var(--mu); }
  dl.datos { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14px; } dl.datos dt { color: var(--mu); font-weight: 600; font-size: 13px; } dl.datos dd { margin: 0; }
  .item { border-top: 1px solid #EEF2F4; padding: 10px 0; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .item:first-of-type { border-top: 0; }
  .aviso { background: #FFFFFF; border: 1px solid var(--pa); border-radius: 10px; padding: 12px 16px; font-size: 14px; }
  .error { border-color: var(--er); background: var(--erbg); color: var(--er); }
  .vacio { padding: 40px; text-align: center; color: var(--mu); }
  .ov { position: fixed; inset: 0; background: rgba(13,49,63,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 20; }
  .modal { background: #fff; border-radius: 14px; width: min(760px, 100%); padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
  .modal .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } @media (max-width: 640px) { .modal .campos { grid-template-columns: minmax(0, 1fr); } }
  .modal .ancho { grid-column: 1 / -1; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; border-top: 1px solid #EEF2F4; padding-top: 14px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--az); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600; z-index: 30; }
  .cargando { padding: 50px; text-align: center; color: var(--mu); }
  .login { max-width: 420px; margin: 10vh auto; display: flex; flex-direction: column; gap: 14px; }
  .cpn { display: flex; gap: 6px; flex-wrap: wrap; } .cpn .btn { min-height: 38px; padding: 6px 14px; } .cpn .sel { border: 0; }
  .multi { display: flex; flex-wrap: wrap; gap: 6px 14px; } .multi label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .punto { padding: 12px 18px; border-top: 1px solid #EEF2F4; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: start; }
  .punto.ancho .ctl, .punto .obs, .punto .fotos { grid-column: 1 / -1; } .punto .obs { min-height: 34px; font-size: 13px; }
  .punto b { font-weight: 600; } .c.ancho { max-width: 520px; width: 100%; }
  .seccion { padding: 0; } .sec-tit { padding: 12px 18px; border-bottom: 1px solid var(--ln); }
  .chip.mini { font-size: 11px; } .ref { font-size: 11px; }
  .fotos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; } .fotos .quitar { text-decoration: none; font-size: 16px; color: var(--er); }
  .btn.foto { min-height: 34px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .tabs .btn { min-height: 34px; padding: 6px 12px; }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; z-index: 5; }
  .resultado { min-width: 220px; }
  .escala { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .escala select.c { max-width: 640px; width: 100%; }
  .ctl select.c { min-width: 260px; } @media (max-width: 640px) { .ctl select.c { min-width: 0; width: 100%; } }
  @media (max-width: 640px) { .punto { grid-template-columns: minmax(0, 1fr); } .resultado { min-width: 0; width: 100%; } }
  .cuad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } @media (max-width: 900px) { .cuad { grid-template-columns: minmax(0, 1fr); } }
  .q { border-radius: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--ln); border-top: 6px solid; display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
  .q.Q1 { border-top-color: #B42318; } .q.Q2 { border-top-color: #C98A00; } .q.Q3 { border-top-color: #5894A7; } .q.Q4 { border-top-color: #9AA8AF; }
  .q h3 { margin: 0; font-size: 15px; color: var(--az); display: flex; justify-content: space-between; gap: 8px; } .q h3 small { color: var(--mu); font-weight: 500; font-size: 12px; }
  .q .h { border-top: 1px solid #EEF2F4; padding-top: 7px; font-size: 13px; } .q .h b { font-weight: 600; } .q .cods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .q .cods button { border: 1px solid var(--ln); background: var(--bg); border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .ejes { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--mu); font-weight: 700; }
</style>
</head>
<body>
<div id="raiz"></div>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
// ==================================================================
// PORTAL DE GESTIÓN HyS · uso personal con la clave de Higiene y Seguridad.
// Lee y escribe en las planillas del Sistema HyS a través de Apps Script.
// ==================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwEf6wxSyzMPh0vu2qoeMJnBwZHNu6IRJgCnAG1sykyuu5N4N4JEFUd_Ve_0Zlu5nME/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fechaTxt = f => f ? String(f).slice(0, 10).split('-').reverse().join('/') : '—';
const LS = { get: (k, d) => { try { const v = localStorage.getItem('portal_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem('portal_' + k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem('portal_' + k); } catch (e) {} } };
let FICHAS = {};
const DIAG_URL = 'https://hyslhmh-sudo.github.io/manifiestos/diagnostico.html';
const diagMensaje = nombre => 'Hola' + (nombre ? ', equipo del ' + nombre : '') + '. Les comparto el enlace para completar el diagnóstico de gestión de residuos de su establecimiento: ' + DIAG_URL +
  ' . Se ingresa con la misma clave que usan para cargar los manifiestos. Se puede completar de a partes (Guardar y seguir después) y agregar fotos desde el celular. Al terminar, tocar «Enviar a Higiene y Seguridad». Ante cualquier duda, consultame. Belén Pellegrini · Higiene y Seguridad';
function compartirDiag(nombre) {
  return '<section class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><h2>Enlace para los referentes</h2><div class="peq" style="margin-top:4px"><a href="' + DIAG_URL + '" target="_blank" rel="noopener">' + DIAG_URL + '</a></div><div class="mu peq">Cada referente entra con la clave de su establecimiento (la misma de los manifiestos).</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-copiar="enlace">Copiar enlace</button><button class="btn sec" data-copiar="mensaje">Copiar mensaje</button><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(diagMensaje(nombre)) + '">Enviar por WhatsApp</a></div></section>';
}
function activarCompartir(nombre) {
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = async () => {
    const t = b.dataset.copiar === 'enlace' ? DIAG_URL : diagMensaje(nombre);
    try { await navigator.clipboard.writeText(t); toast(b.dataset.copiar === 'enlace' ? 'Enlace copiado.' : 'Mensaje copiado: pegalo en el correo o el chat.'); }
    catch (e) { prompt('Copiá el texto:', t); }
  });
}
let CLAVE = LS.get('clave', ''), RES = null, FICHA = null, TRAB = { cod: '', q: '', datos: null };
const TIPOS_CON = ['Dirección', 'Servicio', 'Jefatura', 'Comité', 'Área administrativa', 'Guardia / urgencias', 'Otro'];
const CODS_EXTRA = [['NC', 'Nivel central (Secretaría de Salud y organismos)'], ['SIN_ASIGNAR', 'Sin establecimiento reconocido']];
const TRAB_COLS = ['CUIL', 'DNI', 'APELLIDOS', 'NOMBRES', 'SITIO', 'FUNCION', 'FUNCION_DETALLE', 'SERVICIO', 'VINCULO', 'EMPRESA', 'CARGO_CONDUCCION', 'EMAIL', 'EMAIL_FECHA', 'TELEFONO', 'EN_NTEAR', 'FUENTES', 'ULTIMA_CONFIRMACION', 'REVISAR', 'MOTIVO_REVISION', 'ESTADO', 'FECHA_ALTA', 'ESTABLECIMIENTO'];

async function api(accion, datos) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: accion, clave: CLAVE, est: '', datos: datos || {} }), signal: ctl.signal });
    const j = JSON.parse(await r.text());
    if (j.error === 'clave') { salir('La clave no es correcta.'); throw new Error('clave'); }
    return j;
  } catch (e) { if (e.message !== 'clave') toast(e.name === 'AbortError' ? 'El sistema tardó demasiado. Probá de nuevo.' : 'No se pudo conectar con el sistema.'); throw e; }
  finally { clearTimeout(t); }
}
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }

// ------------------------------------------------------------------ Ingreso
function ingreso(msg) {
  $('raiz').innerHTML = '<div class="login card"><h1>Portal HyS</h1><p class="mu" style="margin:0">Gestión de la red provincial de Higiene y Seguridad. Ingresá con la clave de Higiene y Seguridad.</p>' +
    (msg ? '<div class="aviso error">' + esc(msg) + '</div>' : '') +
    '<label class="f">Clave<input class="c" id="clave" type="password" autocomplete="current-password"></label>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="recordar" checked> Recordar en este equipo (solo equipos personales)</label>' +
    '<button class="btn pri" id="entrar">Ingresar</button></div>';
  const ir = async () => {
    const c = $('clave').value.trim(); if (!c) return;
    $('entrar').disabled = true; $('entrar').textContent = 'Verificando…'; CLAVE = c;
    try { const r = await api('p_resumen', {}); if (!r.ok) throw new Error(); RES = r; LS.set('res', r); if ($('recordar').checked) LS.set('clave', c); if (!location.hash || location.hash === '#') location.hash = '#inicio'; else router(); }
    catch (e) { if (e.message !== 'clave') ingreso('No se pudo ingresar. Revisá la clave y la conexión.'); }
  };
  $('entrar').onclick = ir; $('clave').onkeydown = e => { if (e.key === 'Enter') ir(); }; $('clave').focus();
}
function salir(msg) { CLAVE = ''; LS.del('clave'); LS.del('res'); RES = null; FICHAS = {}; ingreso(msg); }

// ------------------------------------------------------------------ Estructura
function marco(activo, contenido) {
  const it = (h, t) => '<a href="' + h + '" class="' + (activo === h ? 'on' : '') + '">' + t + '</a>';
  const pr = t => '<div class="pr">' + t + ' · próximamente</div>';
  const en = RES && RES.enlaces || {};
  $('raiz').innerHTML = '<div class="app"><nav class="lat" aria-label="Menú principal"><div class="marca"><b>Portal HyS</b><span>Red provincial · Chubut</span></div>' +
    it('#inicio', 'Inicio · matriz provincial') + it('#ficha', 'Establecimientos') + it('#trab', 'Trabajadores') + it('#importar', 'Importar base de Personal') +
    '<div class="sec">RESIDUOS</div>' + '<a href="' + esc(en.general || '#') + '" target="_blank" rel="noopener">Libro general de residuos ↗</a>' + '<a href="https://hyslhmh-sudo.github.io/manifiestos/" target="_blank" rel="noopener">Aplicación de manifiestos ↗</a>' + it('#diag', 'Diagnóstico de residuos') + it('#tablero', 'Tablero de problemáticas') + '<a href="' + DIAG_URL + '" target="_blank" rel="noopener">Página para referentes ↗</a>' + pr('Auditorías') +
    '<div class="sec">RIESGOS</div>' + pr('RGRL · RAR · Laboratorios · Radiaciones · Agua · Plagas · Incendio · EPP · Siniestralidad') +
    '<div class="sec">DOCUMENTAL</div>' + pr('Libro de actuaciones · Programa · Cumplimiento · Contratistas · Agendas · Capacitación') +
    '<div class="sec">PLANILLAS</div>' + '<a href="' + esc(en.baseComun || '#') + '" target="_blank" rel="noopener">Base común ↗</a>' + '<a href="' + esc(en.baseTrabajadores || '#') + '" target="_blank" rel="noopener">Base de trabajadores ↗</a>' +
    '<div class="pie">Coordinación HyS · <button class="link" style="color:#fff" id="btnSalir">Salir</button></div></nav><main id="main">' + contenido + '</main></div>';
  $('btnSalir').onclick = () => salir();
}
const cargando = (activo, t) => marco(activo, '<div class="cargando">' + esc(t || 'Cargando…') + '</div>');

// ------------------------------------------------------------------ Inicio · matriz provincial
let FILTRO = { area: '', q: '', soloApp: false };
const chipEstado = e => /^activ/i.test(e || '') ? '<span class="chip ok">Habilitado</span>' : /maestra/i.test(e || '') ? '' : '<span class="chip gr">Pendiente</span>';
// Trae la matriz más nueva sin hacer esperar: si cambió y se está mirando el inicio, la vuelve a dibujar
let refrescando = false;
async function refrescarRes() {
  if (refrescando) return; refrescando = true;
  try { const r = await api('p_resumen', {}); if (r && r.ok) { const cambio = !RES || r.actualizado !== RES.actualizado; RES = r; LS.set('res', r); if (cambio && /^#?(inicio)?$/.test(location.hash) && $('ov').hidden) inicio(); } } catch (e) {} finally { refrescando = false; }
}
function chipDiag(d) {
  if (!d || d.pct === '' || d.pct == null) return '<span class="chip gr">Sin diagnóstico</span>';
  const p = Number(d.pct); return '<span class="chip ' + (p >= 80 ? 'ok' : p >= 50 ? 'wa' : 'er') + '" title="' + esc(fechaTxt(d.fecha) + ' · ' + d.estado) + '">' + p + ' %' + (Number(d.criticos) ? ' · ' + d.criticos + ' crítico(s)' : '') + (d.estado === 'Borrador' ? ' · borrador' : d.estado === 'Enviado' ? ' · enviado, revisar' : '') + '</span>';
}
function chipCap(c, a) { if (!a) return '<span class="chip gr">—</span>'; const p = Math.round(100 * (c || 0) / a); return '<span class="chip ' + (p >= 70 ? 'ok' : p >= 30 ? 'wa' : 'er') + '">' + (c || 0) + ' · ' + p + ' %</span>'; }
function chipDias(d) { if (d == null) return '<span class="chip gr">Sin datos</span>'; return '<span class="chip ' + (d <= 10 ? 'ok' : d <= 30 ? 'wa' : 'er') + '">' + d + ' días</span>'; }
async function inicio(fresco) {
  if (!RES && !fresco) { const g = LS.get('res', null); if (g) { RES = g; refrescarRes(); } }
  if (!RES || fresco) { cargando('#inicio', fresco ? 'Recalculando la matriz provincial…' : 'Armando la matriz provincial…'); try { RES = await api('p_resumen', { fresco: !!fresco }); LS.set('res', RES); } catch (e) { return; } }
  const F = RES.filas, areas = Array.from(new Set(F.map(f => f.area))).sort();
  const q = FILTRO.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const vis = F.filter(f => (!FILTRO.area || f.area === FILTRO.area) && (!FILTRO.soloApp || /^activ/i.test(f.estado)) && (!q || (f.nombre + ' ' + f.cod).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').indexOf(q) >= 0))
    .sort((a, b) => (a.area + (a.cabecera ? '0' : '1') + a.nombre).localeCompare(b.area + (b.cabecera ? '0' : '1') + b.nombre));
  const hab = F.filter(f => /^activ/i.test(f.estado)), atras = hab.filter(f => f.diasSinRetiro != null && f.diasSinRetiro > 10);
  const totTrab = F.reduce((a, f) => a + f.trabajadores, 0) + (RES.nc.total || 0) + (RES.sinAsignar || 0);
  const kpi = (n, t, s) => '<div class="card kpi"><span>' + t + '</span><b>' + n + '</b><small>' + s + '</small></div>';
  marco('#inicio', '<div class="cab"><div><span class="mu peq">Inicio · matriz provincial</span><h1>Estado de los establecimientos</h1></div>' +
    '<div class="filtros"><label class="f">Área programática<select class="c" id="fArea"><option value="">Todas</option>' + areas.map(a => '<option' + (a === FILTRO.area ? ' selected' : '') + '>' + esc(a) + '</option>').join('') + '</select></label>' +
    '<label class="f">Buscar<input class="c" id="fQ" value="' + esc(FILTRO.q) + '" placeholder="Nombre o código"></label>' +
    '<label style="display:flex;gap:6px;align-items:center;font-size:13px;min-height:42px"><input type="checkbox" id="fApp"' + (FILTRO.soloApp ? ' checked' : '') + '> Solo habilitados en la aplicación</label>' +
    '<button class="btn sec" id="btnAct">Actualizar</button></div></div>' +
    '<div class="grid g4">' + kpi(F.length, 'Establecimientos', hab.length + ' habilitados en la aplicación') + kpi(F.filter(f => /propio/i.test(f.servicio)).length, 'Con profesional de HyS', 'Según la base común') +

function modal(titulo, campos, valores, guardar, extra) {
  const v = valores || {};
  const campo = c => { const [k, l, op, an] = c, val = v[k] == null ? '' : v[k];
    const ctl = Array.isArray(op) ? '<select class="c" data-k="' + k + '"><option value=""></option>' + op.map(o => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
      : op === 'date' ? '<input class="c" type="date" data-k="' + k + '" value="' + esc(String(val).slice(0, 10)) + '">'
      : an ? '<textarea class="c" data-k="' + k + '">' + esc(val) + '</textarea>' : '<input class="c" data-k="' + k + '" value="' + esc(val) + '">';
    return '<label class="f' + (an ? ' ancho' : '') + '">' + esc(l) + ctl + '</label>'; };
  $('ov').innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><h2>' + esc(titulo) + '</h2><div class="aviso error" id="mErr" hidden></div><div class="campos">' + campos.map(campo).join('') + '</div>' + (extra || '') +
    '<div class="acciones"><div style="display:flex;gap:8px;flex-wrap:wrap" id="mExtra"></div><div style="display:flex;gap:8px"><button class="btn sec" id="mCan">Cancelar</button><button class="btn pri" id="mOk">Guardar</button></div></div></div>';
  $('ov').hidden = false;
  const cerrar = () => { $('ov').hidden = true; $('ov').innerHTML = ''; };
  $('mCan').onclick = cerrar;
  $('mOk').onclick = async () => {
    const out = {}; document.querySelectorAll('#ov [data-k]').forEach(el => out[el.dataset.k] = el.value);
    $('mOk').disabled = true; $('mOk').textContent = 'Guardando…';
    try { const err = await guardar(out); if (err) { $('mErr').textContent = err; $('mErr').hidden = false; $('mOk').disabled = false; $('mOk').textContent = 'Guardar'; } else cerrar(); }
    catch (e) { $('mOk').disabled = false; $('mOk').textContent = 'Guardar'; }

  return { cerrar: cerrar, extra: $('mExtra') };
}

      if (res && res.ok) { r.fotos.push(res.url); DG.sucio = true; } else toast((res && res.mensaje) || 'No se pudo subir la foto.'); }
    catch (e) { toast(e.message || 'No se pudo subir la foto.'); }
    DG.subiendo--; diagPintar();
  }
  await diagGuardar(DG.estado === 'Nuevo' ? 'Borrador' : DG.estado, true); diagPintar();
}
window.addEventListener('beforeunload', e => { if (DG && (DG.sucio || DG.subiendo)) { e.preventDefault(); e.returnValue = ''; } });


// ------------------------------------------------------------------ Tablero de problemáticas (matriz de 4 cuadrantes)
const QDEF = { Q1: ['Actuar ya', 'Urgente e importante'], Q2: ['Planificar', 'Importante, no urgente'], Q3: ['Resolver rápido', 'Urgente, no importante'], Q4: ['Monitorear', 'Ni urgente ni importante'] };
let TAB = null;
async function tablero(cod, fresco) {
  if (!TAB || fresco) { cargando('#tablero', 'Armando el tablero…'); try { TAB = await api('p_diag_tablero', { fresco: !!fresco }); } catch (e) { return; } }
  if (!TAB.ok) return marco('#tablero', '<div class="aviso error">' + esc(TAB.mensaje || 'No se pudo armar el tablero.') + '</div>');
  const E = TAB.establecimientos.slice(), H = cod ? TAB.hallazgos.filter(h => h.cod === cod) : TAB.hallazgos, est = cod ? E.find(e => e.cod === cod) : null;
  const sel = '<label class="f">Ver<select class="c" id="tbSel"><option value="">Toda la red (general)</option>' + E.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre))).map(e => '<option value="' + esc(e.cod) + '"' + (e.cod === cod ? ' selected' : '') + '>' + esc(e.nombre) + '</option>').join('') + '</select></label>';
  const kpi = (n, t, s) => '<div class="card kpi"><span>' + t + '</span><b>' + n + '</b><small>' + s + '</small></div>';
  const prom = (f) => { const v = E.map(f).filter(x => x !== '' && x != null).map(Number); return v.length ? Math.round(10 * v.reduce((a, b) => a + b, 0) / v.length) / 10 : '—'; };
  const cuenta = q => H.filter(h => h.q === q).length;
  let k = cod ? kpi(est.pct === '' ? '—' : est.pct + ' %', 'Resultado', fechaTxt(est.fecha) + ' · ' + esc(est.estado)) + kpi(est.msn === '' ? '—' : est.msn + ' / 6', 'Matriz nacional', 'Rojo hasta 2: gestión deficiente') + kpi(cuenta('Q1'), 'Actuar ya', 'Problemas urgentes e importantes') + kpi(H.length, 'Problemas', 'En total')
    : kpi(E.length + ' de ' + TAB.totalEstablecimientos, 'Establecimientos evaluados', 'Último diagnóstico de cada uno') + kpi(prom(e => e.pct) + (prom(e => e.pct) === '—' ? '' : ' %'), 'Cumplimiento promedio', 'Matriz nacional promedio: ' + prom(e => e.msn) + ' / 6') + kpi(cuenta('Q1'), 'Para actuar ya', 'En ' + E.filter(e => e.q.Q1).length + ' establecimiento(s)') + kpi(H.filter(h => h.critico).length, 'Puntos críticos', 'No cumplidos en la red');
  // Cuadrantes
  const caja = q => {
    const L = H.filter(h => h.q === q);
    let cuerpo;
    if (cod) cuerpo = L.sort((a, b) => b.grav - a.grav).map(h => '<div class="h"><b>' + esc(h.item) + '</b>' + (h.critico ? ' <span class="chip er mini">Crítico</span>' : '') + '<div class="mu">' + esc((h.sitio ? h.sitio + ' · ' : '') + h.resp) + (h.obs ? ' · ' + esc(h.obs) : '') + '</div>' + (h.fotos.length ? '<div>' + h.fotos.map((u, i) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">Foto ' + (i + 1) + '</a>').join(' · ') + '</div>' : '') + '</div>').join('');
    else { const g = {}; L.forEach(h => { const x = g[h.id] = g[h.id] || { item: h.item, critico: h.critico, cods: new Set() }; x.cods.add(h.cod); });
      cuerpo = Object.keys(g).sort((a, b) => g[b].cods.size - g[a].cods.size).slice(0, 12).map(id => '<div class="h"><b>' + esc(g[id].item) + '</b>' + (g[id].critico ? ' <span class="chip er mini">Crítico</span>' : '') + ' <span class="mu">· ' + g[id].cods.size + ' establecimiento(s)</span><div class="cods">' + [...g[id].cods].map(c => '<button data-tb="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div></div>').join('') + (Object.keys(g).length > 12 ? '<div class="mu peq">… y ' + (Object.keys(g).length - 12) + ' problema(s) más.</div>' : ''); }
    return '<div class="q ' + q + '"><h3>' + QDEF[q][0] + ' <small>' + QDEF[q][1] + ' · ' + L.length + '</small></h3>' + (cuerpo || '<div class="mu peq">Sin problemas en este cuadrante.</div>') + '</div>';
  };
  const ejes = '<div class="ejes"><span></span><span style="display:flex;justify-content:space-between"><span>← más urgente</span><span>menos urgente →</span></span></div>';
  const l8 = TAB.l8, fr = (a, b) => b ? a + ' de ' + b + ' (' + Math.round(100 * a / b) + ' %)' : '—';
  const linea8 = cod ? '' : '<section class="card"><h2>Línea 8 · indicadores de base</h2><div class="grid g4" style="margin-top:10px">' +
    kpi(fr(l8.poeTodos, l8.poeResp), 'POE marco de bioseguridad', 'Con todos los POE adoptados (meta 4)') + kpi(fr(l8.vacunaCompleta, l8.vacunaResp), 'Vacunación del personal', 'Cobertura completa en servicios de riesgo (meta 5)') +
    kpi(l8.registro && l8.registro.limpieza ? fr(l8.registro.limpiezaCap, l8.registro.limpieza) : fr(l8.capacitados, l8.capacResp), 'Personal de residuos capacitado', 'Limpieza, maestranza y servicios generales, último año, según el registro (meta 6)' + (l8.registro ? ' · Todo el personal: ' + fr(l8.registro.capacitados, l8.registro.activos) : '')) + kpi(Object.keys(l8.formacion).length, 'Necesidades de formación', Object.keys(l8.formacion).sort((a, b) => l8.formacion[b] - l8.formacion[a]).slice(0, 3).map(x => x + ' (' + l8.formacion[x] + ')').join(' · ') || 'Sin datos (meta 7)') + '</div></section>';
  const top = (id, tit) => { const m = (TAB.cierre || {})[id] || {}, L = Object.keys(m).sort((a, b) => m[b] - m[a]).slice(0, 6);
    return '<div><h3 style="margin:0 0 6px;font-size:14px;color:var(--az)">' + tit + '</h3>' + (L.length ? L.map(x => '<div class="peq" style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid #EEF2F4;padding:5px 0"><span>' + esc(x) + '</span><b>' + m[x] + '</b></div>').join('') : '<div class="mu peq">Sin datos.</div>') + '</div>'; };
  const cierre = cod ? '' : '<section class="card"><h2>Lo que más se señala en el cierre</h2><div class="grid g3" style="margin-top:10px">' + top('CIE01', 'Problemas') + top('CIE02', 'Propuestas de mejora') + top('CIE03', 'Necesidades') + '</div></section>';
  const ranking = cod ? '' : '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Establecimientos por prioridad</h2></div><table><thead><tr><th>Establecimiento</th><th>Área</th><th>Fecha</th><th>Resultado</th><th>Matriz</th><th>Capacitación residuos</th><th>Actuar ya</th><th>Planificar</th><th>Resolver rápido</th><th>Monitorear</th></tr></thead><tbody>' +
    TAB.establecimientos.slice().sort((a, b) => b.q.Q1 - a.q.Q1 || (a.pct || 0) - (b.pct || 0)).map(e => '<tr class="cl" data-tb="' + esc(e.cod) + '"><td><b>' + esc(e.nombre) + '</b><div class="mu peq">' + esc(e.estado) + '</div></td><td class="peq">' + esc(String(e.area).replace('Área Programática ', '')) + '</td><td>' + fechaTxt(e.fecha) + '</td><td>' + chipDiag({ pct: e.pct, fecha: e.fecha, estado: e.estado, criticos: e.criticos }) + '</td><td>' + (e.msn === '' ? '—' : e.msn) + '</td><td class="peq">' + (e.cap && e.cap.activos ? e.cap.pct + ' %' + (e.cap.limpieza ? ' · limpieza ' + e.cap.pctLimpieza + ' %' : '') : '—') + '</td><td><b style="color:#B42318">' + e.q.Q1 + '</b></td><td>' + e.q.Q2 + '</td><td>' + e.q.Q3 + '</td><td>' + e.q.Q4 + '</td></tr>').join('') + '</tbody></table>' + (TAB.establecimientos.length ? '' : '<div class="vacio">Todavía no hay diagnósticos.</div>') + '</section>';
  marco('#tablero', '<div class="cab"><div><span class="mu peq">Residuos · Línea 8</span><h1>' + (cod ? esc(est ? est.nombre : cod) : 'Tablero de problemáticas') + '</h1><span class="mu">Matriz de 4 cuadrantes según urgencia e importancia de cada problema detectado en el diagnóstico.</span></div><div class="filtros">' + sel + '<button class="btn sec" id="tbAct">Actualizar</button>' + (cod ? '<a class="btn pri" href="#diag/' + encodeURIComponent(cod) + '">Abrir el diagnóstico</a>' : '') + '</div></div>' +
    '<div class="grid g4">' + k + '</div>' + ejes + '<div class="cuad">' + caja('Q1') + caja('Q2') + caja('Q3') + caja('Q4') + '</div>' + linea8 + cierre + ranking +
    '<p class="mu peq">Datos al ' + new Date(TAB.actualizado).toLocaleString('es-AR') + '. Urgencia e importancia de cada punto: columnas URGENCIA e IMPORTANCIA de la hoja ITEMS (editables).</p>');
  $('tbSel').onchange = e => location.hash = '#tablero' + (e.target.value ? '/' + encodeURIComponent(e.target.value) : '');
  $('tbAct').onclick = () => tablero(cod, true);
  document.querySelectorAll('[data-tb]').forEach(b => b.onclick = () => location.hash = '#tablero/' + encodeURIComponent(b.dataset.tb));
}

// ------------------------------------------------------------------ Navegación
function router() {
  if (!CLAVE) return ingreso();
  const [ruta, arg] = location.hash.replace(/^#/, '').split('/');
  const a = arg ? decodeURIComponent(arg) : '';
  if (ruta === 'ficha') return ficha(a);
  if (ruta === 'trab') return trabajadores(a || TRAB.cod || '');
  if (ruta === 'importar') return importar();
  if (ruta === 'diag') return a ? diagForm(a) : diagLista();
  if (ruta === 'tablero') return tablero(a);
  return inicio();
}
window.addEventListener('hashchange', router);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) { $('ov').hidden = true; $('ov').innerHTML = ''; } });
router();
</script>
</body>
</html>
