<style>

/* ---- Fase 1: menú por tareas, tablero, ayuda y celular ---- */
nav.lat .ms { font-size: 19px; vertical-align: -4px; margin-right: 8px; }
nav.lat a.sub { padding: 6px 10px 6px 38px; font-size: 13.5px; color: #DCE8EC; }
nav.lat .herr { margin-top: 18px; }
nav.lat .titu { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #A9C6D1; padding: 14px 8px 4px; }
.ms { width: 1em; height: 1em; overflow: hidden; font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; display: inline-block; white-space: nowrap; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga'; }
.ayudaBtn { position: fixed; bottom: 18px; right: 18px; z-index: 30; display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid var(--ln); color: var(--az); border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; min-height: 40px; box-shadow: 0 2px 8px rgba(13,49,63,.08); }
.tb2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.tb3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.tb5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

.kpi2 b { font-size: 28px; line-height: 1.15; color: var(--az); }
.kpi2 small { font-size: 12.5px; color: var(--mu); }
.at { display: flex; gap: 10px; align-items: flex-start; text-decoration: none; padding: 9px 0; border-top: 1px solid #EEF2F4; color: inherit; }
.at:first-of-type { border-top: 0; }
.at b { font-size: 14px; display: block; } .at small { font-size: 12.5px; color: var(--mu); }
.tag { font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.tag.er { background: #FBE6E1; color: #B4361F; } .tag.ok { background: #E2F2E8; color: #1E6B42; } .tag.gr { background: #EEF2F4; color: #5B6B73; } .tag.wa { background: #FFF1D6; color: #8A5200; } .tag.av { background: #E7F0F3; color: #2E5E70; }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--mu); } .leyenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; z-index: 60; box-shadow: -8px 0 30px rgba(13,49,63,.18); padding: 22px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; } .panel p, .panel li { font-size: 14.5px; line-height: 1.5; }
.fchip { font: inherit; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--ln); background: #fff; color: var(--tx); cursor: pointer; min-height: 36px; }
.fchip.on { background: var(--az); border-color: var(--az); color: #fff; }
.tarjetas { display: none; flex-direction: column; gap: 10px; }
.tarj { background: #fff; border: 1px solid var(--ln); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
.inf { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--ln); display: none; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.inf a, .inf button { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; font: inherit; font-size: 11px; font-weight: 700; color: var(--mu); background: none; border: 0; min-height: 46px; justify-content: center; cursor: pointer; }
.inf a.on { color: var(--az); } .inf .ms { font-size: 23px; }
@media (max-width: 1000px) { .tb2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  nav.lat { display: none; }
  nav.lat.abierto { display: flex; position: fixed; inset: 0 0 0 0; max-width: none; z-index: 50; overflow-y: auto; padding-bottom: 90px; }
  main { padding: 16px 12px 96px; gap: 14px; }
  .inf { display: grid; }
  .ayudaBtn { bottom: 74px; right: 12px; border-radius: 999px; padding: 10px 12px; }
  .ayudaBtn .txt { display: none; }
  .tb5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  h1 { font-size: 22px; }
}

nav.lat .grp { color: #fff; padding: 10px 10px 4px; font-size: 14px; font-weight: 700; }
nav.lat a.sub.on { color: var(--az); font-weight: 700; }
nav.lat .busca input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 9px 10px; border-radius: 8px; border: 0; font: inherit; font-size: 13.5px; }
nav.lat .titu.mod { color: #A9C6D1; font-size: 11.5px; letter-spacing: .8px; padding: 14px 10px 2px; }
.sinTab td, .sinTab th { padding: 8px 10px; text-align: left; vertical-align: top; border-top: 1px solid #EEF2F4; font-size: 13px; }
.sinTab tr.cl { cursor: pointer; } .sinTab tr.cl:hover { background: #F4F8FA; }
.dl { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 6px 16px; font-size: 14px; } .dl dt { color: var(--mu); } .dl dd { margin: 0; }
.busca2 { display: flex; gap: 8px; flex-wrap: wrap; } .busca2 input { flex: 1 1 240px; }
/* ---- Fase 5: selector de íconos del certificado ---- */
.icoGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; max-height: 270px; overflow-y: auto; padding: 2px; }
.icoT { border: 1px solid var(--ln); background: #fff; border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 10.5px; color: var(--mu); cursor: pointer; overflow-wrap: anywhere; text-align: center; }
.icoT .ms { font-size: 30px; color: var(--az); } .icoT.on { border-color: var(--az); background: #E7F0F3; box-shadow: inset 0 0 0 1px var(--az); color: var(--az); font-weight: 700; }
.icoT:focus-visible { outline: 3px solid var(--pa); outline-offset: 2px; }

.agSem { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .agDia { background: #F7FAFB; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .agDia.hoy { outline: 2px solid var(--pa); }
  .agCab { font-weight: 800; font-size: 12px; color: var(--mu); padding: 2px; }
  .agT { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--ln); border-left: 4px solid var(--ln); background: #fff; border-radius: 8px; padding: 7px 8px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--tx); min-width: 0; overflow-wrap: anywhere; }
  .agT:hover { background: #F4F8FA; } .agT:focus-visible { outline: 3px solid var(--pa); outline-offset: 2px; }
  .agT b { color: var(--az); } .agT small { color: var(--mu); font-size: 11.5px; } .agT .chip { align-self: flex-start; font-size: 10.5px; padding: 2px 6px; }
  @media (max-width: 900px) { .agSem { grid-template-columns: minmax(0, 1fr); } }
  .frF { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.6fr auto; gap: 8px; align-items: center; } @media (max-width: 640px) { .frF { grid-template-columns: 1fr 1fr; } }
/* ---- Diseño (oct 2026): misma paleta institucional (Azul Humphreys y Azul Patagonia), más jerarquía y menos ruido ---- */
:root { --tx: #22343C; --mu: #5A6D76; --ln: #DDE6E9; --bg: #F3F6F7; --pa1: #EEF4F6; --pa2: #D6E6EC; --sombra: 0 1px 2px rgba(13,49,63,.05); }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:focus-visible { outline: 3px solid var(--pa); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
/* Barra lateral: queda fija mientras se recorre el contenido */
nav.lat { position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; padding: 22px 12px 18px; scrollbar-width: thin; scrollbar-color: #2A5466 transparent; }
nav.lat .marca b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
nav.lat a, nav.lat button.it { transition: background .15s, color .15s; }
nav.lat a.on, nav.lat a.sub.on { background: rgba(255,255,255,.10); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--pa); }
nav.lat a.sub { color: #C9DCE3; } nav.lat a.sub:hover { color: #fff; }
nav.lat .grp { padding: 16px 10px 4px; }
nav.lat .busca input { background: rgba(255,255,255,.95); }
/* Encabezado de cada pantalla */
main { padding: 30px 40px 72px; gap: 22px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
h2 { font-size: 16.5px; font-weight: 700; letter-spacing: -.005em; }
.cab { padding-bottom: 18px; border-bottom: 1px solid var(--ln); }
/* Tarjetas: un solo nivel de borde, sin sombras decorativas */
.card { border-color: var(--ln); border-radius: 14px; padding: 20px 22px; box-shadow: var(--sombra); }
/* Indicadores: una sola franja dividida con líneas finas, en lugar de cajas sueltas */
.tb5 { gap: 1px !important; background: var(--ln); border: 1px solid var(--ln); border-radius: 14px; overflow: hidden; box-shadow: var(--sombra); }
.tb5 > .kpi2 { border: 0; border-radius: 0; padding: 16px 18px; }
a.kpi2 { transition: background .15s; } a.kpi2:hover { background: var(--pa1); }
.kpi2 span { font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--mu); }
.kpi2 b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.kpi b { font-weight: 800; letter-spacing: -.02em; }
/* Tablas */
th { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--mu); border-bottom: 1px solid var(--ln); }
td { border-bottom-color: #EDF2F4; }
tr.cl:hover td, .sinTab tr.cl:hover { background: var(--pa1); }
/* Estados: píldoras redondeadas, mismo alto */
.chip { border-radius: 999px; padding: 3px 10px; } .chip.mini { padding: 2px 8px; }
.tag { border-radius: 999px; padding: 3px 10px; font-weight: 700; }
/* Botones y campos */
.btn { border-radius: 10px; transition: background .15s, border-color .15s, color .15s; }
.pri:hover:not(:disabled) { background: #16465A; }
.sec { border-color: #B9CFD7; } .sec:hover:not(:disabled) { background: var(--pa1); border-color: var(--pa); }
.peligro:hover:not(:disabled) { background: var(--erbg); }
.link { text-underline-offset: 3px; text-decoration-thickness: 1px; } .link:hover { color: var(--pa); }
input.c, select.c, textarea.c { border-radius: 10px; border-color: #CFDBDF; transition: border-color .15s, box-shadow .15s; }
input.c:focus, select.c:focus, textarea.c:focus { outline: none; border-color: var(--pa); box-shadow: 0 0 0 3px rgba(88,148,167,.22); }
label.f { font-size: 12.5px; }
.fchip { transition: background .15s; } .fchip:hover:not(.on) { background: var(--pa1); }
/* Avisos: barra de color a la izquierda en lugar de recuadro completo */
.aviso { border: 0; border-left: 4px solid var(--pa); background: var(--pa1); border-radius: 10px; }
.aviso.error, .error.aviso { border-left-color: var(--er); background: var(--erbg); color: var(--er); }
/* Diagnóstico y auditorías: preguntas más legibles y barra de acciones flotante */
.seccion { overflow: hidden; }
.sec-tit { background: var(--pa1); padding: 14px 20px; border-bottom-color: var(--ln); }
.punto { padding: 14px 20px; border-top-color: #EDF2F4; transition: background .15s; }
.punto:hover { background: #FAFCFC; }
.punto b { color: var(--tx); }
.multi label { padding: 4px 0; }
.tabs { background: #fff; border: 1px solid var(--ln); border-radius: 12px; padding: 6px 8px; box-shadow: var(--sombra); }
.tabs .btn { border-radius: 8px; }
.barra { background: rgba(243,246,247,.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-top: 1px solid var(--ln); }
main:not(.ref) .barra { margin: 0 -40px; padding: 12px 40px; }
/* Ventanas y avisos emergentes */
.modal { border-radius: 16px; box-shadow: 0 18px 50px rgba(13,49,63,.22); }

.panel { box-shadow: -10px 0 34px rgba(13,49,63,.18); }
@media (max-width: 760px) {
  main { padding: 16px 12px 96px; }
  main:not(.ref) .barra { margin: 0 -12px; padding: 10px 12px; bottom: 62px; }
  body:has(main .barra) .ayudaBtn { bottom: 132px; }
  h1 { font-size: 23px; }
  .cab { padding-bottom: 12px; }
  .kpi2 b { font-size: 24px; }
}
@media (max-width: 1000px) { .tb2 { grid-template-columns: minmax(0, 1fr) !important; } }
/* Menú lateral con módulos desplegables */
nav.lat .titu.mod { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: #A9C6D1; padding: 18px 10px 4px; }
nav.lat details.mod > summary { list-style: none; display: flex; align-items: center; padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; user-select: none; transition: background .15s; }
nav.lat details.mod > summary::-webkit-details-marker { display: none; }
nav.lat details.mod > summary:hover { background: #1E4A5C; }
nav.lat details.mod > summary .t { flex: 1; }
nav.lat details.mod > summary .flecha { margin: 0; font-size: 20px; color: #A9C6D1; transition: transform .15s; }
nav.lat details.mod[open] > summary .flecha { transform: rotate(180deg); }
nav.lat details.mod[open] { padding-bottom: 6px; }
nav.lat details.mod .pr { padding-left: 38px; }
nav.lat button.it { font-weight: 400; }
/* Indicadores: celdas vacías de la última fila en blanco */
.tb5 { gap: 0 !important; background: #fff; }
.tb5 > .kpi2 { box-shadow: 1px 0 0 var(--ln), 0 1px 0 var(--ln); }
/* Buscador de ayuda */
.ayLista { display: flex; flex-direction: column; gap: 6px; }
.ayLista:empty { display: none; }
a.ayRes { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--ln); border-radius: 10px; text-decoration: none; color: var(--tx); font-size: 14px; transition: background .15s, border-color .15s; }
a.ayRes:hover { background: var(--pa1); border-color: var(--pa); }
a.ayRes b { font-size: 12.5px; color: var(--mu); font-weight: 600; }
.ayLista mark { background: var(--pa2); color: inherit; border-radius: 3px; padding: 0 1px; }
</style>

<body>
<div id="raiz"></div>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
// ==================================================================
// PORTAL DE GESTIÓN HyS · uso personal con la clave de Higiene y Seguridad.
// Lee y escribe en las planillas del Sistema HyS a través de Apps Script.
// ==================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwEf6wxSyzMPh0vu2qoeMJnBwZHNu6IRJgCnAG1sykyuu5N4N4JEFUd_Ve_0Zlu5nME/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fechaTxt = f => f ? String(f).slice(0, 10).split('-').reverse().join('/') : '—';
const LS = { get: (k, d) => { try { const v = localStorage.getItem('portal_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem('portal_' + k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem('portal_' + k); } catch (e) {} } };
let FICHAS = {};
const RESPALDO = /googleusercontent\.com$/.test(location.hostname);   // portal servido por Google (sin GitHub)
const DIAG_URL = RESPALDO ? API_URL + '?p=diagnostico' : 'https://hyslhmh-sudo.github.io/manifiestos/diagnostico.html';
const APP_URL = RESPALDO ? API_URL + '?p=app' : 'https://hyslhmh-sudo.github.io/manifiestos/';
const CAP_URL = 'https://docs.google.com/spreadsheets/d/1rrYVwT83jGfPTYvgIxH9eSaVl1apqmwcoExCvyEDHSw/edit';   // módulo 7 · Capacitaciones (su planilla; tiene su propio panel)
let BUS = { q: '', r: null };
const diagMensaje = nombre => 'Hola' + (nombre ? ', equipo del ' + nombre : '') + '. Les comparto el enlace para completar el diagnóstico de gestión de residuos de su establecimiento: ' + DIAG_URL +
  ' . Se ingresa con la misma clave que usan para cargar los manifiestos. Se puede completar de a partes (Guardar y seguir después) y agregar fotos desde el celular. Al terminar, tocar «Enviar a Higiene y Seguridad». Ante cualquier duda, consultame. Belén Pellegrini · Higiene y Seguridad';
// Informes del diagnóstico (Google Doc editable + PDF)
function informesDiag() {
  const L = DG.D.informes || [], cerrado = DG.estado === 'Cerrado';
  return '<section class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><div><h2>Informe a la Dirección</h2><div class="mu peq">' +
    (cerrado ? 'Genera el informe (Google Doc editable y PDF) con su número HYSL, en la carpeta del establecimiento › Informes.' : 'El informe se genera cuando el ' + (DCFG.pal || 'diagnóstico') + ' está cerrado.') + '</div></div>' +
    '<button class="btn pri" id="dgInforme"' + (cerrado ? '' : ' disabled') + '>' + (L.length ? 'Generar nueva revisión' : 'Generar informe') + '</button></div>' +
    (L.length ? '<div class="peq">' + L.map(i => '<div style="border-top:1px solid #EEF2F4;padding:8px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><span><b>' + esc(i.codigo) + '</b>' + (i.obs ? ' · ' + esc(i.obs) : '') + '</span><span><a href="' + esc(i.doc) + '" target="_blank" rel="noopener">Documento</a> · <a href="' + esc(i.pdf) + '" target="_blank" rel="noopener">PDF</a> · <button class="link" id="dgCorreo">Copiar correo de envío</button></span></div>').join('') + '</div>' : '') + '</section>';
}
async function copiarCorreo(c) {
  const t = 'Asunto: ' + c.asunto + '\n' + (c.copia ? c.copia + '\n' : '') + '\n' + c.cuerpo;
  try { await navigator.clipboard.writeText(t); toast('Correo copiado: pegalo en tu correo y adjuntá el PDF.'); } catch (e) { prompt('Copiá el texto del correo:', t); }
}
function activarInformes() {
  const c = $('dgCorreo'); if (c) c.onclick = async () => { try { const r = await api(DCFG.accCorreo || 'p_informe_correo', { cod: DG.cod, id: DG.id }); if (!r.ok) return toast(r.mensaje); copiarCorreo(r.correo); } catch (e) {} };
  const b = $('dgInforme'); if (!b) return;
  b.onclick = async () => {
    if (DG.sucio) return toast('Guardá los cambios antes de generar el informe.');
    b.disabled = true; b.textContent = 'Generando… (puede tardar uno o dos minutos)';
    let r; try { r = await api(DCFG.accInforme || 'p_informe_diag', { cod: DG.cod, id: DG.id }, 330000); } catch (e) { b.disabled = false; b.textContent = 'Generar informe'; return; }
    if (!r.ok) { toast(r.mensaje || 'No se pudo generar el informe.'); b.disabled = false; b.textContent = 'Generar informe'; return; }
    DG.D.informes = [{ codigo: r.codigo, doc: r.doc, pdf: r.pdf, obs: r.revision ? 'Revisión ' + r.revision : '' }];
    toast('Informe ' + r.codigo + ' listo' + (r.notasAlPie ? '' : ' (referencias al final: falta activar el servicio Google Docs API)') + '.');
    const y = window.scrollY; diagPintar(); window.scrollTo(0, y);
    window.open(r.doc, '_blank');
  };
}
function compartirDiag(nombre) {
  return '<section class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><h2>Enlace para los referentes</h2><div class="peq" style="margin-top:4px"><a href="' + DIAG_URL + '" target="_blank" rel="noopener">' + DIAG_URL + '</a></div><div class="mu peq">Cada referente entra con la clave de su establecimiento (la misma de los manifiestos).</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-copiar="enlace">Copiar enlace</button><button class="btn sec" data-copiar="mensaje">Copiar mensaje</button><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(diagMensaje(nombre)) + '">Enviar por WhatsApp</a></div></section>';
}
function activarCompartir(nombre) {
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = async () => {
    const t = b.dataset.copiar === 'enlace' ? DIAG_URL : diagMensaje(nombre);
    try { await navigator.clipboard.writeText(t); toast(b.dataset.copiar === 'enlace' ? 'Enlace copiado.' : 'Mensaje copiado: pegalo en el correo o el chat.'); }
    catch (e) { prompt('Copiá el texto:', t); }
  });
}
let CLAVE = LS.get('clave', ''), RES = null, FICHA = null, TRAB = { cod: '', q: '', datos: null };
const TIPOS_CON = ['Dirección', 'Servicio', 'Jefatura', 'Comité', 'Área administrativa', 'Guardia / urgencias', 'Otro'];
const CODS_EXTRA = [['NC', 'Nivel central (Secretaría de Salud y organismos)'], ['SIN_ASIGNAR', 'Sin establecimiento reconocido']];
const TRAB_COLS = ['CUIL', 'DNI', 'APELLIDOS', 'NOMBRES', 'SITIO', 'FUNCION', 'FUNCION_DETALLE', 'SERVICIO', 'VINCULO', 'EMPRESA', 'CARGO_CONDUCCION', 'EMAIL', 'EMAIL_FECHA', 'TELEFONO', 'EN_NTEAR', 'FUENTES', 'ULTIMA_CONFIRMACION', 'REVISAR', 'MOTIVO_REVISION', 'ESTADO', 'FECHA_ALTA', 'ESTABLECIMIENTO'];

async function api(accion, datos, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 90000);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: accion, clave: CLAVE, est: '', datos: datos || {} }), signal: ctl.signal });
    const j = JSON.parse(await r.text());
    if (j.error === 'clave') { salir('La clave no es correcta.'); throw new Error('clave'); }
    return j;
  } catch (e) { if (e.message !== 'clave') toast(e.name === 'AbortError' ? 'El sistema tardó demasiado. Probá de nuevo.' : 'No se pudo conectar con el sistema.'); throw e; }
  finally { clearTimeout(t); }
}
function toast(m) { if (m === NAV_VIEJA.message) return; const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }

// ------------------------------------------------------------------ Ingreso
function ingreso(msg) {
  $('raiz').innerHTML = '<div class="login card"><h1>Portal HyS</h1><p class="mu" style="margin:0">Gestión de la red provincial de Higiene y Seguridad. Ingresá con la clave de Higiene y Seguridad.</p>' +
    (msg ? '<div class="aviso error">' + esc(msg) + '</div>' : '') +
    '<label class="f">Clave<input class="c" id="clave" type="password" autocomplete="current-password"></label>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="recordar" checked> Recordar en este equipo (solo equipos personales)</label>' +
    '<button class="btn pri" id="entrar">Ingresar</button></div>';
  const ir = async () => {
    const c = $('clave').value.trim(); if (!c) return;
    $('entrar').disabled = true; $('entrar').textContent = 'Verificando…'; CLAVE = c;
    try { const r = await api('p_ping', {}, 30000); if (!r.ok) throw new Error(); LS.set('verSrv', r.version || 'anterior a la 9'); if ($('recordar').checked) LS.set('clave', c); const g = LS.get('res', null); if (g) { RES = g; refrescarRes(); } if (!location.hash || location.hash === '#') location.hash = '#inicio'; else router(); }
    catch (e) { if (e.message !== 'clave') ingreso('No se pudo ingresar. Revisá la clave y la conexión.'); }
  };
  $('entrar').onclick = ir; $('clave').onkeydown = e => { if (e.key === 'Enter') ir(); }; $('clave').focus();
}
function salir(msg) { CLAVE = ''; LS.del('clave'); LS.del('res'); LS.del('tab'); RES = null; FICHAS = {}; ingreso(msg); }

// ------------------------------------------------------------------ Estructura
// Pantallas que se dejaron atrás: si terminan de cargar tarde (respuesta lenta del servidor), no se dibujan encima de la actual
const NAV = { act: null, ruta: null, sync: false, dejadas: new Set() };
const NAV_VIEJA = new Error('pantalla-anterior');
window.addEventListener('unhandledrejection', e => { if (e.reason === NAV_VIEJA) e.preventDefault(); });
window.addEventListener('error', e => { if (e.error === NAV_VIEJA) e.preventDefault(); });
function marco(activo, contenido) {
  const base = String(activo).split('/')[0];
  if (NAV.sync) { NAV.act = base; NAV.dejadas.delete(base); }
  else if (!NAV.act) { NAV.act = base; NAV.dejadas.delete(base); }
  else if (base !== NAV.act && NAV.dejadas.has(base)) throw NAV_VIEJA;
  // Pantallas que no están en el menú se marcan en el ítem del que dependen
  const ALIAS = { '#ficha': '#est', '#inv': '#sin', '#buscar': '#trab', '#audr': '#aud', '#capficha': '#capcat', '#capalta': '#capcat', '#capdicnuevo': '#capdic', '#capins': '#capdic', '#capserv': '#capcump', '#capjef': '#capcump' };
  const ruta0 = activo.split('/')[0], ruta = ALIAS[ruta0] || ruta0;
  const it = (h, ico, t, sub) => '<a href="' + h + '" class="' + (ruta === h ? 'on' : '') + (sub ? ' sub' : '') + '"' + (ruta === h ? ' aria-current="page"' : '') + '>' + (ico ? '<span class="ms" aria-hidden="true">' + ico + '</span>' : '') + t + '</a>';
  // Módulos desplegables: se abre solo el de la pantalla actual y los que se abran a mano en esta sesión
  let navAb = []; try { navAb = JSON.parse(sessionStorage.getItem('navAb') || '[]'); } catch (e) {}
  const grp = (id, ico, t, items) => '<details class="mod" data-m="' + id + '"' + (items.indexOf('class="on') >= 0 || navAb.indexOf(id) >= 0 ? ' open' : '') + '><summary><span class="ms" aria-hidden="true">' + ico + '</span><span class="t">' + t + '</span><span class="ms flecha" aria-hidden="true">expand_more</span></summary>' + items + '</details>';
  const ext = (h, t) => '<a href="' + esc(h || '#') + '" target="_blank" rel="noopener" class="sub">' + t + ' ↗</a>';
  const en = RES && RES.enlaces || {};
  const inf = (h, ico, t) => '<a href="' + h + '" class="' + (ruta === h ? 'on' : '') + '"><span class="ms" aria-hidden="true">' + ico + '</span>' + t + '</a>';
  $('raiz').innerHTML = '<div class="app"><nav class="lat" id="lat" aria-label="Menú principal"><div class="marca"><b>Portal HyS</b><span>Red provincial · Chubut</span></div>' +
    '<form class="busca" id="fBusca" role="search"><input id="qBusca" type="search" placeholder="Buscar DNI, apellido o N.º CH" aria-label="Buscar personas y siniestros" value="' + esc(BUS.q || '') + '"></form>' +
    it('#inicio', 'dashboard', 'Tablero') + it('#est', 'apartment', 'Establecimientos') + it('#acciones', 'task_alt', 'Acciones (todos los módulos)') +
    '<div class="titu mod">Módulos</div>' +
    grp('res', 'recycling', '1 · Residuos', it('#diag', '', 'Diagnóstico', 1) + it('#aud', '', 'Auditorías', 1) + it('#plan', '', 'Plan de acción', 1) + it('#tablero', '', 'Problemáticas', 1)) +
    grp('doc', 'folder_open', '2 · Documentos', ext(NOTA_URL, 'Nueva nota') + ext(SEG_URL, 'Envío y respuesta') + ext(REC_URL, 'Nota recibida') + ext(ANTE_URL, 'Antecedentes') + it('#bib', '', 'Biblioteca HyS', 1) + it('#docest', '', 'Documentos de los establecimientos', 1) + it('#docs', '', 'Registro de documentos HYSL', 1) + it('#modelos', '', 'Modelos para completar', 1) + it('#bandeja', '', 'Bandeja de entrada', 1)) +
    grp('agu', 'water_drop', '3 · Agua', it('#agua', '', 'Tablero', 1) + it('#aguadiag', '', 'Diagnóstico', 1)) +
    grp('per', 'badge', '4 · Personal y RAR', it('#trab', '', 'Personas', 1) + it('#importar', '', 'Importar base de Personal', 1) + it('#sin', '', 'Siniestros', 1) + it('#sinest', '', 'Estadísticas de siniestros', 1) + it('#nte', '', 'NTE · nómina de expuestos', 1)) +
    grp('plg', 'pest_control', '5 · Plagas', it('#plagas', '', 'Tablero', 1) + it('#plgdiag', '', 'Diagnóstico', 1)) +
    grp('coc', 'soup_kitchen', '6 · Cocinas', it('#coc', '', 'Tablero', 1) + it('#cocper', '', 'Personas de cocina', 1) + it('#cocdiag', '', 'Relevamiento BPM / HACCP', 1)) +
    grp('cap', 'school', '7 · Capacitaciones', it('#cap', '', 'Tablero', 1) + it('#capcat', '', 'Catálogo', 1) + it('#capdic', '', 'Dictados e inscriptos', 1) + it('#capag', '', 'Agenda', 1) + it('#capcump', '', 'Cumplimiento', 1) + it('#capmat', '', 'Matriz', 1) + it('#capfir', '', 'Firmantes', 1) + ext(CAP_LIBRO, 'Libro CAPACITACIONES') + ext(CAP_PANEL, 'Panel de carga (sistema actual)')) +
    grp('m8', 'domain', '8 · Servicios e infraestructura', it('#m8', '', 'Tablero', 1) + it('#m8rel', '', 'Nuevo relevamiento', 1) + it('#m8plan', '', 'Plan de acción', 1) + it('#m8serv', '', 'Edificios y servicios', 1) + it('#m8libros', '', 'Libros para la red', 1) + ext(M8_LINKS.planilla, 'Planilla del módulo 8') + ext(M8_LINKS.campo, 'Listas de campo')) +
    '<div class="titu mod">Más</div>' +
    it('#accesos', 'key', 'Accesos (DNI y claves)') +
    '<button class="it" id="btnAyudaNav" type="button"><span class="ms" aria-hidden="true">help</span>Ayuda y buscador de ayuda</button>' +
    grp('herr', 'build', 'Herramientas', ext(en.general, 'Libro general de residuos') + ext(en.baseComun, 'Base común') + ext(en.baseTrabajadores, 'Base de trabajadores') + ext(APP_URL, 'Mi establecimiento') + ext(DIAG_URL, 'Página para referentes') +
    (RESPALDO ? '<div class="pr" style="color:#fff">Estás en el portal de respaldo (servido por Google)</div>' : ext(API_URL + '?p=portal', 'Portal de respaldo (sin GitHub)'))) +
    '<div class="pie">Coordinación HyS · <button class="link" style="color:#fff" id="btnSalir">Salir</button><div style="font-size:11px;margin-top:6px;color:#A9C6D1">Portal ' + esc(VERSION_PORTAL) + (LS.get('verSrv', '') && LS.get('verSrv', '') !== VERSION_PORTAL ? '<br><b style="color:#FFD27A">Apps Script en versión ' + esc(LS.get('verSrv', '')) + ': falta instalar o publicar algo</b>' : '') + '</div></div></nav><main id="main">' + contenido + '</main></div>' +
    '<nav class="inf" aria-label="Menú">' + inf('#inicio', 'dashboard', 'Tablero') + inf('#est', 'apartment', 'Establec.') + inf('#acciones', 'task_alt', 'Acciones') + inf('#bib', 'folder_open', 'Documentos') + '<button id="btnMas"><span class="ms" aria-hidden="true">menu</span>Más</button></nav>' +
    '<button class="ayudaBtn" id="btnAyuda" aria-label="Ayuda de esta pantalla"><span class="ms" aria-hidden="true">help</span><span class="txt">Ayuda</span></button>';
  $('btnSalir').onclick = () => salir();
  $('fBusca').onsubmit = e => { e.preventDefault(); const q = $('qBusca').value.trim(); if (q.length >= 3) location.hash = '#buscar/' + encodeURIComponent(q); else toast('Escribí al menos 3 letras o números.'); };
  $('btnMas').onclick = () => $('lat').classList.toggle('abierto');
  const rAy = AYUDA[ruta0] ? ruta0 : ruta;
  $('btnAyuda').onclick = () => abrirAyuda(rAy);
  $('btnAyudaNav').onclick = () => { $('lat').classList.remove('abierto'); abrirAyuda(rAy, true); };
  // Solo se recuerdan los módulos que se abren o cierran a mano (no el que se abre solo por estar en esa pantalla)
  document.querySelectorAll('#lat details.mod > summary').forEach(sm => sm.addEventListener('click', () => setTimeout(() => { try { const d = sm.parentElement, id = d.dataset.m; let ab = JSON.parse(sessionStorage.getItem('navAb') || '[]').filter(x => x !== id); if (d.open) ab.push(id); sessionStorage.setItem('navAb', JSON.stringify(ab)); } catch (e) {} }, 0)));
}
const cargando = (activo, t) => marco(activo, '<div class="cargando">' + esc(t || 'Cargando…') + '</div>');

// ------------------------------------------------------------------ Inicio · matriz provincial
let FILTRO = { area: '', q: '', soloApp: false };
const chipEstado = e => /^activ/i.test(e || '') ? '<span class="chip ok">Habilitado</span>' : /maestra/i.test(e || '') ? '' : '<span class="chip gr">Pendiente</span>';
// Trae la matriz más nueva sin hacer esperar: si cambió y se está mirando el inicio, la vuelve a dibujar
let refrescando = false;
async function refrescarRes() {
  if (refrescando) return; refrescando = true;
  try { const r = await api('p_resumen', {}, 240000); if (r && r.ok) { const cambio = !RES || r.actualizado !== RES.actualizado; RES = r; LS.set('res', r); if ((cambio || CAMBIO_RES) && $('ov').hidden) { CAMBIO_RES = false; if (/^#?(inicio)?$/.test(location.hash)) inicio(); else if (location.hash === '#est') matriz(); } } } catch (e) {} finally { refrescando = false; }
}
function chipDiag(d) {
  if (!d || d.pct === '' || d.pct == null) return '<span class="chip gr">Sin diagnóstico</span>';
  const p = Number(d.pct); return '<span class="chip ' + (p >= 80 ? 'ok' : p >= 50 ? 'wa' : 'er') + '" title="' + esc(fechaTxt(d.fecha) + ' · ' + d.estado) + '">' + p + ' %' + (Number(d.criticos) ? ' · ' + d.criticos + ' crítico(s)' : '') + (d.estado === 'Borrador' ? ' · borrador' : d.estado === 'Enviado' ? ' · enviado, revisar' : '') + '</span>';
}
function chipCap(c, a) { if (!a) return '<span class="chip gr">—</span>'; const p = Math.round(100 * (c || 0) / a); return '<span class="chip ' + (p >= 70 ? 'ok' : p >= 30 ? 'wa' : 'er') + '">' + (c || 0) + ' · ' + p + ' %</span>'; }
function chipDias(d) { if (d == null) return '<span class="chip gr">Sin datos</span>'; return '<span class="chip ' + (d <= 10 ? 'ok' : d <= 30 ? 'wa' : 'er') + '">' + d + ' días</span>'; }
async function matriz(fresco) {

  if (!RES || fresco) { cargando('#est', fresco ? 'Recalculando la matriz provincial…' : 'Armando la matriz provincial…'); try { RES = await api('p_resumen', { fresco: !!fresco }, 240000); LS.set('res', RES); } catch (e) { return; } }
  const F = RES.filas, areas = Array.from(new Set(F.map(f => f.area))).sort();
  const q = FILTRO.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const vis = F.filter(f => (!FILTRO.area || f.area === FILTRO.area) && (!FILTRO.soloApp || /^activ/i.test(f.estado)) && (!q || (f.nombre + ' ' + f.cod).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').indexOf(q) >= 0))
    .sort((a, b) => (a.area + (a.cabecera ? '0' : '1') + a.nombre).localeCompare(b.area + (b.cabecera ? '0' : '1') + b.nombre));
  const hab = F.filter(f => /^activ/i.test(f.estado)), atras = hab.filter(f => f.diasSinRetiro != null && f.diasSinRetiro > 10);
  const totTrab = F.reduce((a, f) => a + f.trabajadores, 0) + (RES.nc.total || 0) + (RES.sinAsignar || 0);
  const kpi = (n, t, s) => '<div class="kpi2"><span>' + t + '</span><b>' + n + '</b><small>' + s + '</small></div>';
  marco('#est', '<div class="cab"><div><span class="mu peq">Establecimientos · matriz provincial</span><h1>Estado de los establecimientos</h1></div>' +
    '<div class="filtros"><label class="f">Área programática<select class="c" id="fArea"><option value="">Todas</option>' + areas.map(a => '<option' + (a === FILTRO.area ? ' selected' : '') + '>' + esc(a) + '</option>').join('') + '</select></label>' +
    '<label class="f">Buscar<input class="c" id="fQ" value="' + esc(FILTRO.q) + '" placeholder="Nombre o código"></label>' +
    '<label style="display:flex;gap:6px;align-items:center;font-size:13px;min-height:42px"><input type="checkbox" id="fApp"' + (FILTRO.soloApp ? ' checked' : '') + '> Solo habilitados en la aplicación</label>' +
    '<button class="btn sec" id="btnAct">Actualizar</button></div></div>' +
    '<div class="tb5">' + kpi(F.length, 'Establecimientos', hab.length + ' habilitados en la aplicación') + kpi(F.filter(f => /propio/i.test(f.servicio)).length, 'Con profesional de HyS', 'Según la base común') +
    kpi(totTrab.toLocaleString('es-AR'), 'Trabajadores en la base', F.reduce((a, f) => a + (f.capacitados || 0), 0).toLocaleString('es-AR') + ' con al menos una capacitación' + (RES.sinAsignar ? ' · ' + RES.sinAsignar + ' sin asignar' : '')) + kpi(atras.length, 'Retiros atrasados', 'Habilitados con más de 10 días sin retiro') + '</div>' +
    '<section class="card tabla soloEsc"><table><thead><tr><th>Establecimiento</th><th>Área</th><th>Servicio HyS</th><th>Aplicación</th><th>Trabajadores</th><th>Capacitados</th><th>Diagnóstico residuos</th><th>Último retiro</th><th>Sin retiro</th><th>Retiros Y1 del mes</th></tr></thead><tbody>' +
    vis.map(f => '<tr class="cl" data-cod="' + esc(f.cod) + '"><td><b>' + esc(f.nombre) + '</b>' + (f.cabecera ? ' <span class="chip pa">Cabecera</span>' : '') + '<div class="mu peq">' + esc(f.cod) + '</div></td><td class="peq">' + esc(String(f.area).replace('Área Programática ', '')) + '</td><td class="peq">' + esc(f.servicio) + '</td><td>' + chipEstado(f.estado) + '</td><td>' + f.trabajadores + '</td><td>' + chipCap(f.capacitados, f.activos) + '</td><td>' + chipDiag(f.diag) + '</td><td>' + fechaTxt(f.ultimoRetiro) + '</td><td>' + chipDias(f.diasSinRetiro) + '</td><td>' + f.retirosMes + '</td></tr>').join('') +

    '<div class="tarjetas">' + vis.map(f => '<a class="tarj" href="#ficha/' + encodeURIComponent(f.cod) + '"><b>' + esc(f.nombre) + '</b><span class="mu peq">' + esc(f.cod) + ' · ' + esc(String(f.area).replace('Área Programática ', 'Área ')) + '</span><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' + chipEstado(f.estado) + chipDias(f.diasSinRetiro) + '<span class="mu peq">Último retiro ' + fechaTxt(f.ultimoRetiro) + '</span></div></a>').join('') + '</div>' +

  $('fArea').onchange = e => { FILTRO.area = e.target.value; matriz(); };
  $('fQ').oninput = e => { FILTRO.q = e.target.value; clearTimeout(inicio.t); inicio.t = setTimeout(() => { matriz(); const i = $('fQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 300); };

async function fichaReg(cod) {
  const box = $('fReg'); if (!box) return;
  box.innerHTML = '<h2>Registros cargados</h2><div class="mu">Leyendo…</div>';
  let R; try { R = await api('p_registros', { cod: cod }, 120000); } catch (e) { box.innerHTML = '<h2>Registros cargados</h2><div class="mu">No se pudo leer. <button class="link" id="fRegBtn">Reintentar</button></div>'; $('fRegBtn').onclick = () => fichaReg(cod); return; }
  if (!R.ok) { box.innerHTML = '<h2>Registros cargados</h2><div class="aviso error">' + esc(R.mensaje || 'Error') + '</div>'; return; }
  const L = R.registros, temas = ['Residuos', 'Agua', 'Plagas', 'Documentos'];
  box.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2>Registros cargados</h2><span><a class="btn sec" href="' + esc(APP_URL) + '" target="_blank" rel="noopener">Corregir en «Mi establecimiento» ↗</a> <button class="link" id="fRegBtn">Actualizar</button></span></div>' +
    '<div class="mu peq">Últimos 24 meses. Anular no borra: el registro queda guardado como anulado, con el motivo, y deja de contar. Para corregir datos, entrá a «Mi establecimiento» con la clave de Higiene y Seguridad › Mis registros (sin límite de días).</div>' +
    temas.map(t => { const l = L.filter(r => r.tema === t); return l.length ? '<h3 style="margin:14px 0 6px">' + t + ' (' + l.length + ')</h3><div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Registro</th><th>Detalle</th><th>Cargó</th><th></th></tr></thead><tbody>' +
      l.map(r => '<tr' + (r.anulado ? ' style="opacity:.55"' : '') + '><td>' + fechaTxt(r.fecha) + '</td><td><b>' + esc(r.titulo) + '</b>' + (r.anulado ? '<div class="peq" style="color:#B4361F">' + esc(r.motivo) + '</div>' : '') + '</td><td class="peq">' + esc(r.detalle) + '</td><td class="peq">' + esc(r.cargo) + '</td><td style="white-space:nowrap">' +
        (r.url ? '<a class="link" href="' + esc(r.url) + '" target="_blank" rel="noopener">Ver</a>' : '') + (r.anulado ? '' : ' · <button class="link" data-ran="' + L.indexOf(r) + '">Anular</button>') + '</td></tr>').join('') + '</tbody></table></div>' : ''; }).join('') +
    ((R.anuladosResiduos || []).length ? '<h3 style="margin:14px 0 6px">Manifiestos y certificados anulados</h3>' + R.anuladosResiduos.map(a => '<div class="peq">' + esc(fechaTxt(a.fecha) + ' · ' + a.texto + ' · ' + a.quien + ' · ' + a.motivo) + '</div>').join('') : '') +
    (L.length ? '' : '<div class="mu">Todavía no hay registros cargados.</div>');
  $('fRegBtn').onclick = () => fichaReg(cod);
  box.querySelectorAll('[data-ran]').forEach(b => b.onclick = () => { const r = L[Number(b.dataset.ran)];
    modal('Anular: ' + r.titulo, [['MOTIVO', 'Motivo', ['Cargado dos veces', 'Era de otro establecimiento o sitio', 'Datos equivocados (se vuelve a cargar)', 'Otro']], ['DETALLE', 'Detalle (opcional)', null, 1]], { MOTIVO: 'Cargado dos veces' },
      async v => { const x = await api('p_anular', { cod: cod, tipo: r.tipo, id: r.id, motivo: v.MOTIVO + (v.DETALLE ? ': ' + v.DETALLE : ''), quien: 'Higiene y Seguridad' }); if (!x.ok) return x.mensaje || 'No se pudo anular.'; toast('Registro anulado.'); fichaReg(cod); return ''; }); });
}

// Buscador de ayuda: busca en todas las pantallas, sin importar tildes ni mayúsculas
const ayNorm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function ayBuscar(q) {
  const pal = ayNorm(q).split(/\s+/).filter(p => p.length > 1); if (!pal.length) return [];
  const res = [];
  Object.keys(AYUDA).forEach(k => {
    const tit = AYUDA[k][0], tt = ayNorm(tit);
    AYUDA[k][1].forEach(t => { const n = tt + ' ' + ayNorm(t); if (pal.every(p => n.indexOf(p) >= 0)) res.push({ k: k, tit: tit, t: t, peso: pal.filter(p => tt.indexOf(p) >= 0).length }); });
  });
  return res.sort((x, y) => y.peso - x.peso);
}
function ayMarcar(t, q) {
  let h = esc(t); const pal = ayNorm(q).split(/\s+/).filter(p => p.length > 1);
  if (!pal.length) return h;
  // Resalta coincidencias respetando tildes del texto original
  const n = ayNorm(t), marcas = [];
  pal.forEach(p => { let i = n.indexOf(p); while (i >= 0) { marcas.push([i, i + p.length]); i = n.indexOf(p, i + p.length); } });
  if (!marcas.length) return h;
  marcas.sort((x, y) => x[0] - y[0]); let out = '', u = 0;
  marcas.forEach(m => { if (m[0] < u) return; out += esc(t.slice(u, m[0])) + '<mark>' + esc(t.slice(m[0], m[1])) + '</mark>'; u = m[1]; });
  return out + esc(t.slice(u));
}
function ayResultados(q, cont) {
  const r = ayBuscar(q);
  cont.innerHTML = !q.trim() ? '' : !r.length ? '<p class="mu peq" style="margin:0">No encontré «' + esc(q) + '» en la ayuda. Probá con otra palabra o abrí el manual del sistema.</p>' :
    '<p class="mu peq" style="margin:0">' + r.length + (r.length === 1 ? ' resultado' : ' resultados') + '</p>' +
    r.slice(0, 30).map(x => '<a class="ayRes" href="' + x.k + '"><b>' + esc(x.tit) + '</b><span>' + ayMarcar(x.t, q) + '</span></a>').join('');
}
function abrirAyuda(ruta, enfocarBusqueda) {
  const a = AYUDA[ruta] || ['Ayuda', ['Esta pantalla todavía no tiene ayuda propia. Usá el buscador o el manual del sistema.']];
  const cerrar = () => { $('ov').hidden = true; $('ov').innerHTML = ''; };
  $('ov').innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-label="Ayuda"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Ayuda</h2><button class="btn sec" id="ayCer">Cerrar</button></div>' +
    '<form role="search" id="ayF" style="margin:0"><input class="c" id="ayQ" type="search" placeholder="¿Qué necesitás hacer? Ej.: firma, NTE, retiro" aria-label="Buscar en la ayuda" style="width:100%;box-sizing:border-box"></form>' +
    '<div id="ayRes" class="ayLista" aria-live="polite"></div>' +
    '<div id="ayEsta"><h3 style="margin:4px 0 8px;font-size:15px">En esta pantalla: ' + esc(a[0]) + '</h3><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px">' + a[1].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px"><a class="btn sec" href="#ayuda">Ver toda la ayuda</a><a class="btn pri" href="' + MANUAL_URL + '" target="_blank" rel="noopener">Manual del sistema ↗</a></div></div>';
  $('ov').hidden = false; $('ayCer').onclick = cerrar;
  $('ayF').onsubmit = e => e.preventDefault();
  $('ayQ').oninput = () => { const q = $('ayQ').value; ayResultados(q, $('ayRes')); $('ayEsta').hidden = !!q.trim(); };
  $('ov').addEventListener('click', e => { if (e.target.closest('a')) cerrar(); });
  if (enfocarBusqueda) $('ayQ').focus();
}

// ------------------------------------------------------------------ Gráficos (SVG simples, sin bibliotecas)
function grBarrasMes(meses, serie) {
  const W = 640, H = 220, x0 = 36, b = 188, max = Math.max(4, ...meses.map(m => (serie[m] || {}).Y1 + (serie[m] || {}).Y3 || 0)), k = 160 / max, bw = Math.min(34, (W - x0 - 20) / meses.length - 14);
  let s = ''; [0, .5, 1].forEach(f => { const v = Math.round(max * f), y = b - v * k; s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#D6DEE2"/><text x="' + (x0 - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#5B6B73" text-anchor="end">' + v + '</text>'; });
  const nom = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  meses.forEach((m, i) => { const d = serie[m] || { Y1: 0, Y3: 0 }, x = x0 + 12 + i * ((W - x0 - 12) / meses.length);
    s += '<g><title>' + nom[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4) + ': Y1 ' + d.Y1 + ' · Y3 ' + d.Y3 + '</title><rect x="' + x + '" y="' + (b - d.Y1 * k) + '" width="' + bw + '" height="' + d.Y1 * k + '" rx="3" fill="#0D313F"/><rect x="' + x + '" y="' + (b - (d.Y1 + d.Y3) * k) + '" width="' + bw + '" height="' + d.Y3 * k + '" rx="2" fill="#5894A7"/></g><text x="' + (x + bw / 2) + '" y="' + (b + 16) + '" font-size="11" fill="#5B6B73" text-anchor="middle">' + nom[Number(m.slice(5, 7)) - 1] + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Retiros por mes, Y1 e Y3">' + s + '</svg>';
}
function grHoriz(items, max, apilado) {   // items: [texto, valor, color] o [texto, [[v,color],[v,color]]]
  const W = 420; let s = '', y = 4; max = Math.max(max, 1);
  items.forEach(it => { const partes = Array.isArray(it[1]) ? it[1] : [[it[1], it[2]]], tot = partes.reduce((a, p) => a + p[0], 0); let x = 160;
    s += '<text x="0" y="' + (y + 14) + '" font-size="12.5" fill="#33424A">' + esc(it[0]) + '</text>';
    partes.forEach(p => { const w = (W - 200) * p[0] / max; if (w > 0) s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="20" rx="3" fill="' + p[1] + '"/>'; x += w; });
    s += '<text x="' + (x + 6) + '" y="' + (y + 15) + '" font-size="12.5" font-weight="700" fill="#33424A">' + (it[3] != null ? it[3] : tot) + '</text>'; y += 30; });
  return '<svg viewBox="0 0 ' + W + ' ' + y + '" width="100%" role="img">' + s + '</svg>';
}
const leyenda = items => '<div class="leyenda">' + items.map(([t, c]) => '<span><i style="background:' + c + '"></i>' + esc(t) + '</span>').join('') + '</div>';

async function inicio(fresco) {
  if (!inicio.ver) { inicio.ver = true; api('p_ping', {}, 30000).then(r => { if (r && r.ok) { const v = r.version || 'anterior a la 9'; if (v !== LS.get('verSrv', '')) { LS.set('verSrv', v); if (/^#?(inicio)?$/.test(location.hash) && $('ov').hidden) inicio(); } } }).catch(() => {}); }
  if (!RES) { const g = LS.get('res', null); if (g) { RES = g; refrescarRes(); } }
  if (!TB) TB = LS.get('tab', null);
  if (!RES) { cargando('#inicio', 'Armando el tablero…'); try { RES = await api('p_resumen', {}, 240000); LS.set('res', RES); } catch (e) { return; } }
  if (fresco) { toast('Actualizando el tablero…'); api('p_tablero', { fresco: true }, 240000).then(r => { if (r && r.ok) { TB = r; LS.set('tab', r); if (/^#?(inicio)?$/.test(location.hash) && $('ov').hidden) inicio(); } }).catch(() => {}); }
  if (!TB) {   // sin datos guardados: se muestra el tablero con lo que hay y se completa cuando llegan

async function guardarFicha(tipo, fila, datos) {

// ------------------------------------------------------------------ Modal genérico
// campos: [clave, etiqueta, opciones|'date'|null, ancho]
function modal(titulo, campos, valores, guardar, extra) {
  const v = valores || {};
  const campo = c => { const [k, l, op, an] = c, val = v[k] == null ? '' : v[k];
    const ctl = Array.isArray(op) ? '<select class="c" data-k="' + k + '"><option value=""></option>' + op.map(o => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
      : op === 'date' ? '<input class="c" type="date" data-k="' + k + '" value="' + esc(String(val).slice(0, 10)) + '">'
      : an ? '<textarea class="c" data-k="' + k + '">' + esc(val) + '</textarea>' : '<input class="c" data-k="' + k + '" value="' + esc(val) + '">';
    return '<label class="f' + (an ? ' ancho' : '') + '">' + esc(l) + ctl + '</label>'; };
  $('ov').innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><h2>' + esc(titulo) + '</h2><div class="aviso error" id="mErr" hidden></div><div class="campos">' + campos.map(campo).join('') + '</div>' + (extra || '') +
    '<div class="acciones"><div style="display:flex;gap:8px;flex-wrap:wrap" id="mExtra"></div><div style="display:flex;gap:8px"><button class="btn sec" id="mCan">Cancelar</button><button class="btn pri" id="mOk">Guardar</button></div></div></div>';
  $('ov').hidden = false;
  const cerrar = () => { $('ov').hidden = true; $('ov').innerHTML = ''; };
  $('mCan').onclick = cerrar;
  $('mOk').onclick = async () => {
    const out = {}; document.querySelectorAll('#ov [data-k]').forEach(el => out[el.dataset.k] = el.value);
    $('mOk').disabled = true; $('mOk').textContent = 'Guardando…';
    try { const err = await guardar(out); if (err) { $('mErr').textContent = err; $('mErr').hidden = false; $('mOk').disabled = false; $('mOk').textContent = 'Guardar'; } else cerrar(); }
    catch (e) { $('mOk').disabled = false; $('mOk').textContent = 'Guardar'; }
  };
  return { cerrar: cerrar, extra: $('mExtra') };
}

// ------------------------------------------------------------------ Tablero de problemáticas (matriz de 4 cuadrantes)
const QDEF = { Q1: ['Actuar ya', 'Urgente e importante'], Q2: ['Planificar', 'Importante, no urgente'], Q3: ['Resolver rápido', 'Urgente, no importante'], Q4: ['Monitorear', 'Ni urgente ni importante'] };
let TAB = null;
async function tablero(cod, fresco) {
  if (!TAB || fresco) { cargando('#tablero', 'Armando el tablero…'); try { TAB = await api('p_diag_tablero', { fresco: !!fresco }); } catch (e) { return; } }
  if (!TAB.ok) return marco('#tablero', '<div class="aviso error">' + esc(TAB.mensaje || 'No se pudo armar el tablero.') + '</div>');
  const E = TAB.establecimientos.slice(), H = cod ? TAB.hallazgos.filter(h => h.cod === cod) : TAB.hallazgos, est = cod ? E.find(e => e.cod === cod) : null;

  const cuenta = q => H.filter(h => h.q === q).length;

    : kpi(E.length + ' de ' + TAB.totalEstablecimientos, 'Establecimientos evaluados', 'Último diagnóstico de cada uno') + kpi(prom(e => e.pct) + (prom(e => e.pct) === '—' ? '' : ' %'), 'Cumplimiento promedio', 'Matriz nacional promedio: ' + prom(e => e.msn) + ' / 6') + kpi(cuenta('Q1'), 'Para actuar ya', 'En ' + E.filter(e => e.q.Q1).length + ' establecimiento(s)') + kpi(H.filter(h => h.critico).length, 'Puntos críticos', 'No cumplidos en la red');
  // Cuadrantes
  const caja = q => {
    const L = H.filter(h => h.q === q);

    if (cod) cuerpo = L.sort((a, b) => b.grav - a.grav).map(h => '<div class="h"><b>' + esc(h.item) + '</b>' + (h.critico ? ' <span class="chip er mini">Crítico</span>' : '') + '<div class="mu">' + esc((h.sitio ? h.sitio + ' · ' : '') + h.resp) + (h.obs ? ' · ' + esc(h.obs) : '') + '</div>' + (h.fotos.length ? '<div>' + h.fotos.map((u, i) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">Foto ' + (i + 1) + '</a>').join(' · ') + '</div>' : '') + '</div>').join('');
    else { const g = {}; L.forEach(h => { const x = g[h.id] = g[h.id] || { item: h.item, critico: h.critico, cods: new Set() }; x.cods.add(h.cod); });
      cuerpo = Object.keys(g).sort((a, b) => g[b].cods.size - g[a].cods.size).slice(0, 12).map(id => '<div class="h"><b>' + esc(g[id].item) + '</b>' + (g[id].critico ? ' <span class="chip er mini">Crítico</span>' : '') + ' <span class="mu">· ' + g[id].cods.size + ' establecimiento(s)</span><div class="cods">' + [...g[id].cods].map(c => '<button data-tb="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div></div>').join('') + (Object.keys(g).length > 12 ? '<div class="mu peq">… y ' + (Object.keys(g).length - 12) + ' problema(s) más.</div>' : ''); }
    return '<div class="q ' + q + '"><h3>' + QDEF[q][0] + ' <small>' + QDEF[q][1] + ' · ' + L.length + '</small></h3>' + (cuerpo || '<div class="mu peq">Sin problemas en este cuadrante.</div>') + '</div>';
  };
  const ejes = '<div class="ejes"><span></span><span style="display:flex;justify-content:space-between"><span>← más urgente</span><span>menos urgente →</span></span></div>';
  const l8 = TAB.l8, fr = (a, b) => b ? a + ' de ' + b + ' (' + Math.round(100 * a / b) + ' %)' : '—';
  const linea8 = cod ? '' : '<section class="card"><h2>Línea 8 · indicadores de base</h2><div class="tb5" style="margin-top:10px">' +
    kpi(fr(l8.poeTodos, l8.poeResp), 'POE marco de bioseguridad', 'Con todos los POE adoptados (meta 4)') + kpi(fr(l8.vacunaCompleta, l8.vacunaResp), 'Vacunación del personal', 'Cobertura completa en servicios de riesgo (meta 5)') +
    kpi(l8.registro && l8.registro.limpieza ? fr(l8.registro.limpiezaCap, l8.registro.limpieza) : fr(l8.capacitados, l8.capacResp), 'Personal de residuos capacitado', 'Limpieza, maestranza y servicios generales, último año, según el registro (meta 6)' + (l8.registro ? ' · Todo el personal: ' + fr(l8.registro.capacitados, l8.registro.activos) : '')) + kpi(Object.keys(l8.formacion).length, 'Necesidades de formación', Object.keys(l8.formacion).sort((a, b) => l8.formacion[b] - l8.formacion[a]).slice(0, 3).map(x => x + ' (' + l8.formacion[x] + ')').join(' · ') || 'Sin datos (meta 7)') + '</div></section>';
  const top = (id, tit) => { const m = (TAB.cierre || {})[id] || {}, L = Object.keys(m).sort((a, b) => m[b] - m[a]).slice(0, 6);
    return '<div><h3 style="margin:0 0 6px;font-size:14px;color:var(--az)">' + tit + '</h3>' + (L.length ? L.map(x => '<div class="peq" style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid #EEF2F4;padding:5px 0"><span>' + esc(x) + '</span><b>' + m[x] + '</b></div>').join('') : '<div class="mu peq">Sin datos.</div>') + '</div>'; };
  const cierre = cod ? '' : '<section class="card"><h2>Lo que más se señala en el cierre</h2><div class="grid g3" style="margin-top:10px">' + top('CIE01', 'Problemas') + top('CIE02', 'Propuestas de mejora') + top('CIE03', 'Necesidades') + '</div></section>';
  const ranking = cod ? '' : '<section class="card tabla"><div style="padding:14px 18px;border-bottom:1px solid var(--ln)"><h2>Establecimientos por prioridad</h2></div><table><thead><tr><th>Establecimiento</th><th>Área</th><th>Fecha</th><th>Resultado</th><th>Matriz</th><th>Capacitación residuos</th><th>Actuar ya</th><th>Planificar</th><th>Resolver rápido</th><th>Monitorear</th></tr></thead><tbody>' +
    TAB.establecimientos.slice().sort((a, b) => b.q.Q1 - a.q.Q1 || (a.pct || 0) - (b.pct || 0)).map(e => '<tr class="cl" data-tb="' + esc(e.cod) + '"><td><b>' + esc(e.nombre) + '</b><div class="mu peq">' + esc(e.estado) + '</div></td><td class="peq">' + esc(String(e.area).replace('Área Programática ', '')) + '</td><td>' + fechaTxt(e.fecha) + '</td><td>' + chipDiag({ pct: e.pct, fecha: e.fecha, estado: e.estado, criticos: e.criticos }) + '</td><td>' + (e.msn === '' ? '—' : e.msn) + '</td><td class="peq">' + (e.cap && e.cap.activos ? e.cap.pct + ' %' + (e.cap.limpieza ? ' · limpieza ' + e.cap.pctLimpieza + ' %' : '') : '—') + '</td><td><b style="color:#B42318">' + e.q.Q1 + '</b></td><td>' + e.q.Q2 + '</td><td>' + e.q.Q3 + '</td><td>' + e.q.Q4 + '</td></tr>').join('') + '</tbody></table>' + (TAB.establecimientos.length ? '' : '<div class="vacio">Todavía no hay diagnósticos.</div>') + '</section>';
  marco('#tablero', '<div class="cab"><div><span class="mu peq">1 · Residuos</span><h1>' + (cod ? esc(est ? est.nombre : cod) : 'Tablero de problemáticas') + '</h1><span class="mu">Matriz de 4 cuadrantes según urgencia e importancia de cada problema detectado en el diagnóstico.</span></div><div class="filtros">' + sel + '<button class="btn sec" id="tbAct">Actualizar</button>' + (cod ? '<a class="btn pri" href="#diag/' + encodeURIComponent(cod) + '">Abrir el diagnóstico</a>' : '') + '</div></div>' +
    '<div class="tb5">' + k + '</div>' + ejes + '<div class="cuad">' + caja('Q1') + caja('Q2') + caja('Q3') + caja('Q4') + '</div>' + linea8 + cierre + ranking +
    '<p class="mu peq">Datos al ' + new Date(TAB.actualizado).toLocaleString('es-AR') + '. Urgencia e importancia de cada punto: columnas URGENCIA e IMPORTANCIA de la hoja ITEMS (editables).</p>');
  $('tbSel').onchange = e => location.hash = '#tablero' + (e.target.value ? '/' + encodeURIComponent(e.target.value) : '');
  $('tbAct').onclick = () => tablero(cod, true);

    '<div class="mu peq">' + esc(R.grupo.length > 1 ? 'Incluye ' + R.grupo.join(' y ') + ' (mismo hospital). ' : '') + 'Limpieza de tanques: ' + esc(R.poe.limpieza) + ' · Toma de muestras: ' + esc(R.poe.muestra) + '</div>' +

    '<h3 style="margin:16px 0 6px">Canillas (puntos de muestreo)</h3>' + tabla(['Código', 'Ubicación', 'Bacteriológico', 'Vence', 'Físico-químico', 'Último resultado', 'Estado'], R.puntos.map(p => '<tr><td><b>' + esc(p.codigo) + '</b></td><td>' + esc(p.ubicacion) + '</td><td>' + fechaTxt(p.bact) + '</td><td>' + fechaTxt(p.venceBact) + '</td><td>' + fechaTxt(p.fq) + '</td><td>' + esc(p.ultimo) + '</td><td>' + (p.noApta ? '<span class="chip er">No apta</span>' : chip(p.estado)) + '</td></tr>')) +

}
window.addEventListener('hashchange', router);
// Siempre abre en el Tablero, con los módulos del menú cerrados (aunque la dirección guardada o el marcador apunte a otra pantalla)
try { sessionStorage.removeItem('navAb'); sessionStorage.removeItem('portalAbierto'); if (location.hash !== '#inicio') history.replaceState(null, '', '#inicio'); } catch (e) {}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) { $('ov').hidden = true; $('ov').innerHTML = ''; } });
router();
</script>
</body>
